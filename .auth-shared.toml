# Zed CLI Shared Auth consumer policy.
#
# `.shared-auth.toml` is the canonical Shared Auth filename; this repository
# intentionally uses the supported `.auth-shared.toml` compatibility alias.
# The two names must never coexist. This file is secret-free policy only:
# credentials remain owned by environment/session/secret-store boundaries.
schema_version = 1

[compatibility]
repository = "https://github.com/shared-auth/shared-auth-interfaces"
commit = "52b7ac7fbf0c7c169684f613eda923f3aa6c82e9"

[factors.two_factor]
required = true
methods = ["totp", "passkey", "security-key"]

[factors.three_factor]
enabled = false
methods = ["totp", "passkey", "security-key"]

[pages]
show = ["sign-in", "sign-up", "challenge", "recovery", "consent", "error", "signed-out"]

[styling]
theme = "system"
brand_name = "Zed Package Manager"
accent_color = "#4F46E5"
