# flags-2-env contract for zed. clap remains the typed command parser; this
# file is the portable flag/env and nested-command description shared with
# github.com/ORESoftware/flags-2-env.

[parse]
command_env = "ZED_PKG_COMMAND"
unknown_options_env = "ZED_PKG_UNKNOWN_OPTIONS"
errors_env = "ZED_PKG_PARSE_ERRORS"
allow_unknown = false

[help]
url = "https://github.com/zed-pkg/zed-cli"

[flags.registry]
env = "ZED_PKG_REGISTRY"
aliases = ["registry"]
type = "string"
default = "https://registry.zpkg.tech"
help = "Registry base URL."

[flags.home]
env = "ZED_PKG_HOME"
aliases = ["home"]
type = "string"
help = "Zed home directory; defaults to ~/.zed-pkg."

[flags.token]
env = "ZED_PKG_TOKEN"
aliases = ["token"]
type = "string"
help = "Explicit registry bearer token."

[flags.auth_url]
env = "ZED_PKG_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "shared-auth base URL."

[flags.supabase_url]
env = "ZED_PKG_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Supabase project URL."

[flags.supabase_key]
env = "ZED_PKG_SUPABASE_KEY"
aliases = ["supabase-key"]
type = "string"
help = "Supabase publishable/anon key."

[flags.org]
env = "ZED_PKG_ORG"
aliases = ["org"]
type = "string"
help = "Organization slug."

[flags.name]
env = "ZED_PKG_NAME"
aliases = ["name"]
type = "string"
help = "Package or display name, depending on command."

[flags.interactive]
env = "ZED_PKG_INTERACTIVE"
aliases = ["interactive"]
type = "bool"
default = "false"
help = "Confirm each mutating lifecycle step in a real terminal."

[flags.frozen]
env = "ZED_PKG_FROZEN"
aliases = ["frozen"]
type = "bool"
default = "false"
help = "Install exactly what the lockfile pins."

[flags.install_mode]
env = "ZED_PKG_INSTALL_MODE"
aliases = ["install-mode"]
type = "string"
default = "symlink"
help = "Install using symlinks or copies."

[flags.adapter]
env = "ZED_PKG_ADAPTER"
aliases = ["adapter"]
type = "string"
default = "auto"
help = "Ecosystem adapter."

[flags.allow_build]
env = "ZED_PKG_ALLOW_BUILD"
aliases = ["allow-build"]
type = "bool"
default = "false"
help = "Allow dependency build hooks."

[flags.allow_native_deps]
env = "ZED_PKG_ALLOW_NATIVE_DEPS"
aliases = ["allow-native-deps"]
type = "bool"
default = "false"
help = "Allow zed to install host-native prerequisites declared by packages."

[flags.allow_install_hooks]
env = "ZED_PKG_ALLOW_INSTALL_HOOKS"
aliases = ["allow-install-hooks"]
type = "bool"
default = "false"
help = "Allow package-authored pre-install and post-install hooks."

[flags.native_manager]
env = "ZED_PKG_NATIVE_MANAGER"
aliases = ["native-manager"]
type = "string"
help = "Pin the graph-wide native package manager."

[flags.target]
env = "ZED_PKG_TARGET"
aliases = ["target"]
type = "string"
help = "Polyglot package target."

# flags2env treats aliases as public option spellings, so the canonical CLI
# spelling is listed explicitly. The old environment key and aliases remain
# during the compatibility window so existing scripts keep working while
# receiving a deprecation warning at runtime.
[flags.do_not_write_new_manifest]
env = "ZED_PKG_ALLOW_NO_MANIFEST"
aliases = ["do-not-write-new-manifest", "allow-no-manifest", "skip-manifest"]
type = "bool"
default = "false"
help = "Do not create a new .zpkg.toml when installing into a project without one."

[flags.git_submodules]
env = "ZED_PKG_GIT_SUBMODULES"
aliases = ["git-submodules"]
type = "bool"
default = "false"
help = "Enable global Git submodule compatibility for install and overtake; accepts explicit true/false."

[flags.allow_ecosystem_mismatch]
env = "ZED_PKG_ALLOW_ECOSYSTEM_MISMATCH"
aliases = ["allow-ecosystem-mismatch"]
type = "bool"
default = "false"
help = "Install packages whose ecosystem this project does not have."
[flags.force]
env = "ZED_PKG_FORCE"
aliases = ["force"]
type = "bool"
default = "false"
help = "Force the command's operation."

[flags.older_than]
env = "ZED_PKG_GC_OLDER_THAN"
aliases = ["older-than"]
type = "string"
default = "90d"
help = "Garbage collection age cutoff."

[flags.dry_run]
env = "ZED_PKG_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Report changes without applying them."

[flags.out]
env = "ZED_PKG_PACK_OUT"
aliases = ["out"]
type = "string"
help = "Packed artifact output path."

[flags.allow_dirty]
env = "ZED_PKG_ALLOW_DIRTY"
aliases = ["allow-dirty"]
type = "bool"
default = "false"
help = "Allow publishing from a dirty worktree."

[flags.skip_vcs_checks]
env = "ZED_PKG_SKIP_VCS_CHECKS"
aliases = ["skip-vcs-checks"]
type = "bool"
default = "false"
help = "Skip publish provenance checks."

[flags.undo]
env = "ZED_PKG_YANK_UNDO"
aliases = ["undo"]
type = "bool"
default = "false"
help = "Undo a yank."

[flags.r2g_registry_mode]
env = "ZED_PKG_R2G_REGISTRY_MODE"
aliases = ["registry-mode"]
type = "string"
default = "isolated"
help = "r2g registry boundary: isolated or server."

[flags.docker]
env = "ZED_PKG_R2G_DOCKER"
aliases = ["docker"]
type = "bool"
default = "false"
help = "Run r2g in a container."

[flags.image]
env = "ZED_PKG_R2G_IMAGE"
aliases = ["image"]
type = "string"
default = "debian:stable-slim"
help = "r2g container image."

[flags.runtime]
env = "ZED_PKG_R2G_RUNTIME"
aliases = ["runtime"]
type = "string"
help = "r2g container runtime."

[flags.r2g_root]
env = "ZED_PKG_R2G_ROOT"
aliases = ["r2g-root"]
type = "string"
help = "r2g workspace root."

[flags.clean]
env = "ZED_PKG_R2G_CLEAN"
aliases = ["clean"]
type = "bool"
default = "false"
help = "Clean a successful r2g workspace."

[flags.check]
env = "ZED_PKG_UPDATE_CHECK"
aliases = ["check"]
type = "bool"
default = "false"
help = "Check for an update without installing."

[flags.skip_checksum]
env = "ZED_PKG_UPDATE_SKIP_CHECKSUM"
aliases = ["skip-checksum"]
type = "bool"
default = "false"
help = "Skip release checksum verification."

[flags.limit]
env = "ZED_PKG_AUDIT_LIMIT"
aliases = ["limit"]
type = "int"
help = "Maximum audit entries."

[flags.email]
env = "ZED_PKG_AUTH_EMAIL"
aliases = ["email"]
type = "string"
help = "Account email."

[flags.provider]
env = "ZED_PKG_AUTH_PROVIDER"
aliases = ["provider"]
type = "string"
default = "auto"
help = "Authentication provider: auto, shared-auth, or supabase."

[flags.display_name]
env = "ZED_PKG_AUTH_DISPLAY_NAME"
aliases = ["display-name"]
type = "string"
help = "Account display name."

[flags.password_stdin]
env = "ZED_PKG_AUTH_PASSWORD_STDIN"
aliases = ["password-stdin"]
type = "bool"
default = "false"
help = "Read one password line from stdin."

[flags.env_config]
env = "ZED_PKG_ENV_CONFIG"
aliases = ["config"]
type = "string"
help = "Project-local environment-manager config path."

[flags.env_lock]
env = "ZED_PKG_ENV_LOCK"
aliases = ["lock"]
type = "string"
help = "Project-local environment-manager lockfile path."

[flags.env_json]
env = "ZED_PKG_ENV_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit environment interoperability output as JSON."

[commands.init]
help = "Create a package manifest."

[commands.add]
help = "Add a dependency."

[commands.remove]
help = "Remove a dependency."

[commands.install]
aliases = ["i"]
help = "Install dependencies."

[commands.overtake]
help = "Adopt Git submodule packages into .zpkg.toml and .zpkg.lock."

[commands.uninstall]
aliases = ["un"]
help = "Remove materialized dependencies while retaining the lockfile."

[commands.env]
help = "Import, verify, and export project-local developer environments."

[commands.env.commands.import]
help = "Import manager-native state as a normalized EnvironmentPlan."

[commands.env.commands.verify]
help = "Verify config/lock coverage and normalized environment identity."


[commands.env.commands.export]
help = "Project a schema-v2 EnvironmentPlan into deterministic manager configuration."


[commands.env.commands.export.flags.env_plan]
env = "ZED_PKG_ENV_PLAN"
aliases = ["plan"]
type = "string"
help = "Project-local schema-v2 environment plan path."

[commands.env.commands.export.flags.env_output]
env = "ZED_PKG_ENV_OUTPUT"
aliases = ["output"]
type = "string"
default = ".mise.toml"
help = "Project-local manager export path."

[commands.env.commands.export.flags.env_check]
env = "ZED_PKG_ENV_CHECK"
aliases = ["check"]
type = "bool"
default = "false"
help = "Verify the deterministic manager projection without writing."

[commands.env.commands.export.flags.env_write]
env = "ZED_PKG_ENV_WRITE"
aliases = ["write"]
type = "bool"
default = "false"
help = "Transactionally write a Zed-owned manager projection."

[commands.completions]
help = "Generate Bash or Zsh completion from the typed CLI model."

[commands.build]
help = "Run dependency build hooks."

[commands.run]
help = "Run a dependency executable."
allow_unknown = true

[commands.gc]
help = "Garbage-collect caches and stores."

[commands.gc.flags.dry_run]
env = "ZED_PKG_GC_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Report garbage collection without deleting."

[commands.find]
help = "Search the registry."

[commands.pack]
help = "Pack an artifact."

[commands.release]
help = "Coordinate Zed and native-registry releases."

[commands.release.commands.plan]
help = "Print a credential-free deterministic release plan."

[commands.release.commands.plan.flags.release_json]
env = "ZED_PKG_RELEASE_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit the release plan as JSON."

[commands.release.commands.preflight]
help = "Run fixed credential-free native package preflight adapters."

[commands.oci]
help = "Plan, materialize, and distribute immutable Zed packages through OCI registries."

[commands.oci.commands.plan]
help = "Build the exact credential-free OCI publication plan."

[commands.oci.commands.plan.flags.oci_json]
env = "ZED_PKG_OCI_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit the OCI publication plan as JSON."

[commands.oci.commands.push]
help = "Verify a local OCI image layout and copy it to a registry through ORAS."

[commands.oci.commands.push.flags.oci_oras]
env = "ZED_PKG_OCI_ORAS"
aliases = ["oras"]
type = "string"
default = "oras"
help = "ORAS executable path."

[commands.oci.commands.push.flags.oci_username]
env = "ZED_PKG_OCI_USERNAME"
aliases = ["username"]
type = "string"
help = "OCI registry username; pair with --password-stdin."

[commands.oci.commands.push.flags.oci_password_stdin]
env = "ZED_PKG_OCI_PASSWORD_STDIN"
aliases = ["password-stdin"]
type = "bool"
default = "false"
help = "Read one OCI registry password or token from stdin."

[commands.oci.commands.push.flags.oci_registry_config]
env = "ZED_PKG_OCI_REGISTRY_CONFIG"
aliases = ["registry-config"]
type = "string"
help = "Explicit Docker/ORAS registry config path."

[commands.oci.commands.push.flags.oci_anonymous]
env = "ZED_PKG_OCI_ANONYMOUS"
aliases = ["anonymous"]
type = "bool"
default = "false"
help = "Push without registry credentials."

[commands.oci.commands.push.flags.oci_plain_http]
env = "ZED_PKG_OCI_PLAIN_HTTP"
aliases = ["plain-http"]
type = "bool"
default = "false"
help = "Use plain HTTP for a loopback registry only."

[commands.oci.commands.push.flags.oci_insecure_tls]
env = "ZED_PKG_OCI_INSECURE_TLS"
aliases = ["insecure-tls"]
type = "bool"
default = "false"
help = "Disable destination TLS certificate verification."

[commands.oci.commands.push.flags.oci_ca_file]
env = "ZED_PKG_OCI_CA_FILE"
aliases = ["ca-file"]
type = "string"
help = "Custom destination registry CA certificate."

[commands.oci.commands.push.flags.oci_allow_tag_replacement]
env = "ZED_PKG_OCI_ALLOW_TAG_REPLACEMENT"
aliases = ["allow-tag-replacement"]
type = "bool"
default = "false"
help = "Explicitly replace a destination tag whose digest differs."

[commands.oci.commands.push.flags.oci_json]
env = "ZED_PKG_OCI_PUSH_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit the OCI push result as JSON."

[commands.publish]
help = "Publish an artifact."

[commands.yank]
help = "Yank or restore a version."

[commands.r2g]
aliases = ["test-local"]
help = "Roundtrip-test a package."

[commands.self-update]
aliases = ["update"]
help = "Update the zed binary."

[commands.self-update.flags.force]
env = "ZED_PKG_UPDATE_FORCE"
aliases = ["force"]
type = "bool"
default = "false"
help = "Reinstall even when already current."

[commands.login]
aliases = ["signin"]
help = "Sign in."

[commands.logout]
aliases = ["signout"]
help = "Sign out."

[commands.signup]
aliases = ["register"]
