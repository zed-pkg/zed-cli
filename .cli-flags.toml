# flags-2-env contract for zed. clap remains the typed command parser; this
# file is the portable flag/env and nested-command description shared with
# github.com/ORESoftware/flags-2-env.

[parse]
command_env = "ZED_PKG_COMMAND"
allow_unknown = true

[help]
url = "https://github.com/zed-pkg/zed-cli"

[flags.registry]
env = "ZED_PKG_REGISTRY"
aliases = ["registry"]
type = "string"
default = "https://registry.zpkg.tech"
help = "Registry base URL."

[flags.home]
env = "ZED_PKG_HOME"
aliases = ["home"]
type = "string"
help = "Zed home directory; defaults to ~/.zed-pkg."

[flags.token]
env = "ZED_PKG_TOKEN"
aliases = ["token"]
type = "string"
help = "Explicit registry bearer token."

[flags.auth_url]
env = "ZED_PKG_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "shared-auth base URL."

[flags.supabase_url]
env = "ZED_PKG_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Supabase project URL."

[flags.supabase_key]
env = "ZED_PKG_SUPABASE_KEY"
aliases = ["supabase-key"]
type = "string"
help = "Supabase publishable/anon key."

[flags.org]
env = "ZED_PKG_ORG"
aliases = ["org"]
type = "string"
help = "Organization slug."

[flags.name]
env = "ZED_PKG_NAME"
aliases = ["name"]
type = "string"
help = "Package or display name, depending on command."

[flags.frozen]
env = "ZED_PKG_FROZEN"
aliases = ["frozen"]
type = "bool"
default = "false"
help = "Install exactly what the lockfile pins."

[flags.install_mode]
env = "ZED_PKG_INSTALL_MODE"
aliases = ["install-mode"]
type = "string"
default = "symlink"
help = "Install using symlinks or copies."

[flags.adapter]
env = "ZED_PKG_ADAPTER"
aliases = ["adapter"]
type = "string"
default = "auto"
help = "Ecosystem adapter."

[flags.allow_build]
env = "ZED_PKG_ALLOW_BUILD"
aliases = ["allow-build"]
type = "bool"
default = "false"
help = "Allow dependency build hooks."

[flags.target]
env = "ZED_PKG_TARGET"
aliases = ["target"]
type = "string"
help = "Polyglot package target."

[flags.force]
env = "ZED_PKG_FORCE"
aliases = ["force"]
type = "bool"
default = "false"
help = "Force the command's operation."

[flags.older_than]
env = "ZED_PKG_GC_OLDER_THAN"
aliases = ["older-than"]
type = "string"
default = "90d"
help = "Garbage collection age cutoff."

[flags.dry_run]
env = "ZED_PKG_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Report changes without applying them."

[flags.out]
env = "ZED_PKG_PACK_OUT"
aliases = ["out"]
type = "string"
help = "Packed artifact output path."

[flags.allow_dirty]
env = "ZED_PKG_ALLOW_DIRTY"
aliases = ["allow-dirty"]
type = "bool"
default = "false"
help = "Allow publishing from a dirty worktree."

[flags.skip_vcs_checks]
env = "ZED_PKG_SKIP_VCS_CHECKS"
aliases = ["skip-vcs-checks"]
type = "bool"
default = "false"
help = "Skip publish provenance checks."

[flags.undo]
env = "ZED_PKG_YANK_UNDO"
aliases = ["undo"]
type = "bool"
default = "false"
help = "Undo a yank."

[flags.docker]
env = "ZED_PKG_R2G_DOCKER"
aliases = ["docker"]
type = "bool"
default = "false"
help = "Run r2g in a container."

[flags.image]
env = "ZED_PKG_R2G_IMAGE"
aliases = ["image"]
type = "string"
default = "debian:stable-slim"
help = "r2g container image."

[flags.runtime]
env = "ZED_PKG_R2G_RUNTIME"
aliases = ["runtime"]
type = "string"
help = "r2g container runtime."

[flags.r2g_root]
env = "ZED_PKG_R2G_ROOT"
aliases = ["r2g-root"]
type = "string"
help = "r2g workspace root."

[flags.clean]
env = "ZED_PKG_R2G_CLEAN"
aliases = ["clean"]
type = "bool"
default = "false"
help = "Clean a successful r2g workspace."

[flags.check]
env = "ZED_PKG_UPDATE_CHECK"
aliases = ["check"]
type = "bool"
default = "false"
help = "Check for an update without installing it."

[flags.skip_checksum]
env = "ZED_PKG_UPDATE_SKIP_CHECKSUM"
aliases = ["skip-checksum"]
type = "bool"
default = "false"
help = "Skip release checksum verification."

[flags.limit]
env = "ZED_PKG_AUDIT_LIMIT"
aliases = ["limit"]
type = "int"
help = "Maximum audit entries."

[flags.email]
env = "ZED_PKG_AUTH_EMAIL"
aliases = ["email"]
type = "string"
help = "Account email."

[flags.provider]
env = "ZED_PKG_AUTH_PROVIDER"
aliases = ["provider"]
type = "string"
default = "auto"
help = "Authentication provider: auto, shared-auth, or supabase."

[flags.display_name]
env = "ZED_PKG_AUTH_DISPLAY_NAME"
aliases = ["display-name"]
type = "string"
help = "Account display name."

[flags.password_stdin]
env = "ZED_PKG_AUTH_PASSWORD_STDIN"
aliases = ["password-stdin"]
type = "bool"
default = "false"
help = "Read one password line from stdin."

[commands.init]
help = "Create a package manifest."

[commands.add]
help = "Add a dependency."

[commands.remove]
help = "Remove a dependency."

[commands.install]
aliases = ["i"]
help = "Install dependencies."

[commands.build]
help = "Run dependency build hooks."

[commands.run]
help = "Run a dependency executable."
allow_unknown = true

[commands.gc]
help = "Garbage-collect caches and stores."

[commands.gc.flags.dry_run]
env = "ZED_PKG_GC_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Report garbage collection without deleting."

[commands.find]
help = "Search the registry."

[commands.pack]
help = "Pack an artifact."

[commands.publish]
help = "Publish an artifact."

[commands.yank]
help = "Yank or restore a version."

[commands.r2g]
aliases = ["test-local"]
help = "Roundtrip-test a package."

[commands.self-update]
aliases = ["update"]
help = "Update the zed binary."

[commands.self-update.flags.force]
env = "ZED_PKG_UPDATE_FORCE"
aliases = ["force"]
type = "bool"
default = "false"
help = "Reinstall even when already current."

[commands.login]
aliases = ["signin"]
help = "Sign in."

[commands.logout]
aliases = ["signout"]
help = "Sign out."

[commands.signup]
aliases = ["register"]
help = "Create an account."

[commands.auth]
help = "Account authentication."

[commands.auth.commands.login]
aliases = ["signin"]
help = "Sign in."

[commands.auth.commands.signup]
aliases = ["register"]
help = "Create an account."

[commands.auth.commands.signout]
aliases = ["logout"]
help = "Sign out."

[commands.auth.commands.status]
help = "Show authentication status."

[commands.auth.commands.refresh]
help = "Rotate authentication tokens."

[commands.auth.commands.token]
help = "Print the current access token."

[commands.auth.commands.import-token]
help = "Save a legacy opaque registry token."

[commands.org]
help = "Organization operations."

[commands.org.commands.claim]
help = "Claim an organization."

[commands.org.commands.audit]
help = "Read an organization audit log."

[commands.store]
help = "Global store operations."

[commands.store.commands.status]
help = "Show store status."

[commands.store.commands.path]
help = "Print the store path."

[commands.store.commands.prune]
help = "Prune unreferenced store entries."

[commands.cache]
help = "Download cache operations."

[commands.cache.commands.clean]
help = "Clean the download cache."
