name: temporary private-source R2 bootstrap hardening

on:
  push:
    branches:
      - fix/private-source-r2-bootstrap-20260915
    paths:
      - .github/workflows/_temporary-private-source-r2-bootstrap.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/private-source-r2-bootstrap-20260915
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Patch source-independent R2 download lane
        run: |
          set -euo pipefail
          python3 scripts/_temporary_private_source_r2_patch.py
          cargo fmt

      - name: Certify source-independent fallback
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test source_independent_r2 -- --nocapture
          cargo test source_fallback -- --nocapture
          cargo clippy --all-targets -- -D warnings
          git diff --check

      - name: Publish certified source change
        run: |
          set -euo pipefail
          git add src/source_fallback.rs
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: download public R2 artifacts before private source discovery"
          git push origin HEAD:fix/private-source-r2-bootstrap-20260915
