name: agent canonicalize interface pin once

on:
  push:
    branches:
      - agent/dependency-graph-package-downloads

permissions:
  contents: write

concurrency:
  group: agent-interface-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace the pre-squash contract revision
        shell: bash
        run: |
          set -euo pipefail
          old='4d40ae96f5ce6240356ad4fa5e455d0310b1c97d'
          new='15577e17a820c3b2b1a39ee178d4645185309a05'
          helper='.github/workflows/agent-canonicalize-interface-pin.yml'
          mapfile -t files < <(git grep -l "$old" -- . ":(exclude)$helper")
          printf 'canonicalizing interface pin in: %s\n' "${files[*]}"
          test "${#files[@]}" -gt 0
          sed -i "s/$old/$new/g" "${files[@]}"
          ! git grep -q "$old" -- . ":(exclude)$helper"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "fix(graph): pin the merged interface contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
