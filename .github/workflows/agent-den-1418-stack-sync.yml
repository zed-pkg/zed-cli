name: agent-den-1418-stack-sync

on:
  pull_request:
    branches:
      - agent/den-1477-nix-fetch-bundle
    paths:
      - ".github/workflows/agent-den-1418-stack-sync.yml"

permissions:
  contents: write

concurrency:
  group: den-1418-stack-sync
  cancel-in-progress: true

jobs:
  sync-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1418-nix-export-plan
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Merge the resolver-only parent, validate, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/den-1477-nix-fetch-bundle
          git merge --no-edit origin/agent/den-1477-nix-fetch-bundle
          cargo update -p zed-interfaces --precise 625ba7bdf4339df7d0880f791a0715ca894558fe
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked fetch::tests:: -- --test-threads=1
          cargo test --locked nix_export_plan::tests:: -- --test-threads=1
          cargo test --locked --test frozen_fetch_cli -- --test-threads=1
          cargo test --locked --test frozen_fetch_boundaries -- --test-threads=1
          cargo test --locked --test nix_export_plan -- --test-threads=1
          git rm .github/workflows/agent-den-1418-stack-sync.yml
          git add Cargo.lock src tests docs .github/workflows/nix-export-plan.yml
          git diff --cached --check
          git commit -m "test(DEN-1418): synchronize planner with resolver-only parent"
          git push origin HEAD:agent/den-1418-nix-export-plan
