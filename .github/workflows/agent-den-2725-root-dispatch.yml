name: DEN-2725 root external dispatch

on:
  push:
    branches:
      - agent/den-2725-root-gitops-dispatch

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2725-root-gitops-dispatch
          fetch-depth: 0

      - name: Install Rust formatting and lint components
        run: rustup component add rustfmt clippy

      - name: Apply the reviewed dispatch implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/agent/den2725_root_dispatch_patch.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nPath("src/external_subcommands.rs").write_text('
          helper = '''


def replace_one_of_many(path: str, old: str, new: str) -> None:
    target = Path(path)
    text = target.read_text(encoding="utf-8")
    count = text.count(old)
    if count < 1:
        raise SystemExit(f"{path}: expected at least one replacement target")
    target.write_text(text.replace(old, new, 1), encoding="utf-8")
'''
          if text.count(marker) != 1:
              raise SystemExit('patch helper insertion marker changed')
          text = text.replace(marker, helper + marker, 1)
          old = 'for occurrence in range(2):\n    replace_once('
          new = 'for occurrence in range(2):\n    replace_one_of_many('
          if text.count(old) != 2:
              raise SystemExit(f'expected two repeated completion loops, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/agent/den2725_root_dispatch_patch.py

      - name: Format and verify the focused contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --lib external_subcommands
          cargo test --locked --test external_gitops_dispatch
          cargo clippy --locked --all-targets -- -D warnings
          git diff --check

      - name: Commit implementation and remove one-shot mechanics
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2725-root-dispatch.yml
          rm .github/agent/den2725_root_dispatch_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(DEN-2725): dispatch zed gitops through external commands'
          git push origin HEAD:agent/den-2725-root-gitops-dispatch
