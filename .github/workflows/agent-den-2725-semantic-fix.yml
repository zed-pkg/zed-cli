name: DEN-2725 semantic validator hardening

on:
  push:
    branches:
      - agent/den-2725-zed-gitops-validator

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2725-zed-gitops-validator
          fetch-depth: 0

      - name: Apply the reviewed semantic fixes
        run: python3 .github/agent/den2725_semantic_fix.py

      - name: Format and run focused validation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --bin zed-gitops
          cargo clippy --locked --bin zed-gitops --all-targets -- -D warnings
          git diff --check

      - name: Commit the semantic fixes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2725-semantic-fix.yml
          rm .github/agent/den2725_semantic_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(DEN-2725): harden offline and path validation'
          git push origin HEAD:agent/den-2725-zed-gitops-validator
