name: DEN-2725 trailing-global hardening

on:
  push:
    branches:
      - agent/den-2725-root-gitops-dispatch

permissions:
  contents: write

concurrency:
  group: den-2725-trailing-globals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out the exact hardening commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Rust formatting and lint components
        run: rustup component add rustfmt clippy

      - name: Apply trailing-global hardening
        run: python .github/agent/den2725_trailing_globals_fix.py

      - name: Verify dispatch, packaging, and release smoke behavior
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          bash scripts/validate-zed-package-graph.sh
          cargo test --locked --lib external_subcommands
          cargo test --locked --test external_gitops_dispatch
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked --bin zed --bin zed-gitops
          test -x target/release/zed.exe
          test -x target/release/zed-gitops.exe
          target/release/zed.exe gitops validate --help >/dev/null
          git diff --check

      - name: Commit the hardened product tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-den-2725-trailing-globals.yml
          rm .github/agent/den2725_trailing_globals_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(DEN-2725): keep root globals off external argv'
          git push origin HEAD:agent/den-2725-root-gitops-dispatch
