name: agent-format-artifact

on:
  push:
    branches:
      - agent/den-1436-frozen-fetch
    paths:
      - ".github/workflows/agent-format-artifact.yml"
      - "src/fetch.rs"
      - "tests/frozen_fetch_boundaries.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: dc0e0a0620b9462817950b552d3d334a184b1cb1
          path: ../zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Format exact branch sources
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: den-1436-rustfmt
          path: |
            src/fetch.rs
            tests/frozen_fetch_boundaries.rs
          if-no-files-found: error
          retention-days: 1
