name: agent-format-artifact

on:
  push:
    branches:
      - agent/den-1436-frozen-fetch
    paths:
      - ".github/workflows/agent-format-artifact.yml"

permissions:
  contents: write

concurrency:
  group: den-1436-format-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1436-frozen-fetch
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Apply the already verified formatting result
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git rm .github/workflows/agent-format-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fetch.rs tests/frozen_fetch_boundaries.rs
          git diff --cached --check
          git commit -m "style(DEN-1436): apply verified rustfmt output"
          git push origin HEAD:agent/den-1436-frozen-fetch
