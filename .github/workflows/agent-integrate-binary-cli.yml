# One-shot audit; removed after all interface revision pins are updated.
name: audit binary interface revision pins

on:
  push:
    branches:
      - agent/binary-zip-publish

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/binary-zip-publish
          persist-credentials: false
      - name: Report stale interface revision pins
        shell: bash
        env:
          OLD_REV: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef
        run: |
          set -euo pipefail
          matches="$(grep -RIl "$OLD_REV" .github/workflows \
            --exclude=agent-integrate-binary-cli.yml | sort || true)"
          if [[ -z "$matches" ]]; then
            echo "STALE_INTERFACE_PIN_FILES=none"
          else
            echo "STALE_INTERFACE_PIN_FILES<<EOF"
            printf '%s\n' "$matches"
            echo "EOF"
          fi
