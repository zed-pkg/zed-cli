# One-shot helper; removed after the revised workflow blobs are committed.
name: materialize binary interface workflow pins

on:
  push:
    branches:
      - agent/binary-zip-publish

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/binary-zip-publish
          persist-credentials: false
      - name: Create revised workflow blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_REV: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef
          NEW_REV: 5fa652f6c8aaef5228b34b24bb8c5a4a07b415ca
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          paths = [
              ".github/workflows/ci.yml",
              ".github/workflows/copy-mode-oci.yml",
              ".github/workflows/develop-shell.yml",
              ".github/workflows/frozen-lock-integrity.yml",
              ".github/workflows/hardening.yml",
              ".github/workflows/manifestless-polyglot.yml",
              ".github/workflows/nested-self-install-modes.yml",
              ".github/workflows/nix-bundle-write.yml",
              ".github/workflows/nix-export-bundle.yml",
              ".github/workflows/nix-export-plan.yml",
              ".github/workflows/polyglot.yml",
              ".github/workflows/release-plan-browser.yml",
          ]
          old = os.environ["OLD_REV"]
          new = os.environ["NEW_REV"]
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          result = {}
          for path in paths:
              source = Path(path).read_text()
              count = source.count(old)
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one stale interface pin")
              revised = source.replace(old, new)
              request = Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=json.dumps({"content": revised, "encoding": "utf-8"}).encode(),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "zed-binary-interface-pin-materializer",
                  },
                  method="POST",
              )
              with urlopen(request) as response:
                  blob = json.load(response)
              result[path] = {"sha": blob["sha"], "replacements": count}
          print("BLOB_MAP_JSON=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
