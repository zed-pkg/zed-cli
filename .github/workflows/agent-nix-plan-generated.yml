name: agent-nix-plan-generated

on:
  pull_request:
    branches:
      - agent/den-1477-nix-fetch-bundle
    paths:
      - ".github/workflows/agent-nix-plan-generated.yml"

permissions:
  contents: write

concurrency:
  group: den-1418-plan-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1418-nix-export-plan
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Generate, validate, commit, and remove this helper
        run: |
          set -euo pipefail
          cargo update -p zed-interfaces --precise 625ba7bdf4339df7d0880f791a0715ca894558fe
          python3 - <<'PY'
          from pathlib import Path
          import re

          plan_tests = Path('tests/nix_export_plan.rs')
          text = plan_tests.read_text()
          before = '''[package.repository]
          url = "https://github.com/acme/dataset"

          [publish.nix]
          attribute = "dataset"
          systems = ["x86_64-linux", "aarch64-linux"]
          outputs = ["out"]

          {extra}
          '''
          after = '''[package.repository]
          url = "https://github.com/acme/dataset"

          {extra}
          [publish.nix]
          attribute = "dataset"
          systems = ["x86_64-linux", "aarch64-linux"]
          outputs = ["out"]
          '''
          if before not in text:
              raise SystemExit('data_manifest normalization anchor not found')
          text = text.replace(before, after, 1)

          before = '''    let excluded_manifest = format!(
                  "{}\\n[bin]\\ntool = \\\"bin/tool\\\"\\n\\n[publish]\\nexclude = [\\\"bin/**\\\"]\\n",
                  data_manifest("")
              );'''
          after = '''    let excluded_manifest = format!(
                  "{}\\n[bin]\\ntool = \\\"bin/tool\\\"\\n",
                  data_manifest("[publish]\\nexclude = [\\\"bin/**\\\"]\\n")
              );'''
          if before not in text:
              raise SystemExit('excluded-bin normalization anchor not found')
          text = text.replace(before, after, 1)
          text = text.replace(
              'use std::path::{Path, PathBuf};',
              'use std::path::Path;',
              1,
          )
          plan_tests.write_text(text)

          pattern = re.compile(
              r'(?P<indent>\s*)let lock = Lockfile \{\n'
              r'(?P=indent)    version: Lockfile::CURRENT_VERSION,\n'
              r'(?P=indent)    packages,\n'
              r'(?P=indent)\};'
          )
          replaced = []
          for root in (Path('src'), Path('tests')):
              for path in sorted(root.rglob('*.rs')):
                  source = path.read_text()
                  def replacement(match: re.Match[str]) -> str:
                      indent = match.group('indent')
                      return (
                          f'{indent}let lock = Lockfile {{\n'
                          f'{indent}    version: Lockfile::CURRENT_VERSION,\n'
                          f'{indent}    packages,\n'
                          f'{indent}    nix_adapters: Vec::new(),\n'
                          f'{indent}}};'
                      )
                  updated, count = pattern.subn(replacement, source)
                  if count:
                      path.write_text(updated)
                      replaced.append((str(path), count))
          if not replaced:
              raise SystemExit('no legacy Lockfile initializer anchors were found')
          print('updated legacy Lockfile initializers:', replaced)
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked nix_export_plan::tests:: -- --test-threads=1
          cargo test --locked --test nix_export_plan -- --test-threads=1
          cargo test --locked fetch::tests:: -- --test-threads=1
          cargo test --locked --test frozen_fetch_cli -- --test-threads=1
          cargo test --locked --test frozen_fetch_boundaries -- --test-threads=1
          git rm .github/workflows/agent-nix-plan-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src tests
          git diff --cached --check
          git commit -m "test(DEN-1418): apply generated planner compatibility fixes"
          git push origin HEAD:agent/den-1418-nix-export-plan
