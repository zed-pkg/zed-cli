name: agent-nix-plan-generated

on:
  push:
    branches:
      - agent/den-1418-nix-export-plan
    paths:
      - ".github/workflows/agent-nix-plan-generated.yml"

permissions:
  contents: write

concurrency:
  group: den-1418-plan-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1418-nix-export-plan
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Generate, validate, commit, and remove this helper
        run: |
          set -euo pipefail
          cargo update -p zed-interfaces --precise 625ba7bdf4339df7d0880f791a0715ca894558fe
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/nix_export_plan.rs')
          text = path.read_text()
          before = '''[package.repository]
          url = "https://github.com/acme/dataset"

          [publish.nix]
          attribute = "dataset"
          systems = ["x86_64-linux", "aarch64-linux"]
          outputs = ["out"]

          {extra}
          '''
          after = '''[package.repository]
          url = "https://github.com/acme/dataset"

          {extra}
          [publish.nix]
          attribute = "dataset"
          systems = ["x86_64-linux", "aarch64-linux"]
          outputs = ["out"]
          '''
          if before not in text:
              raise SystemExit('data_manifest normalization anchor not found')
          text = text.replace(before, after, 1)

          before = '''    let excluded_manifest = format!(
                  "{}\\n[bin]\\ntool = \\\"bin/tool\\\"\\n\\n[publish]\\nexclude = [\\\"bin/**\\\"]\\n",
                  data_manifest("")
              );'''
          after = '''    let excluded_manifest = format!(
                  "{}\\n[bin]\\ntool = \\\"bin/tool\\\"\\n",
                  data_manifest("[publish]\\nexclude = [\\\"bin/**\\\"]\\n")
              );'''
          if before not in text:
              raise SystemExit('excluded-bin normalization anchor not found')
          path.write_text(text.replace(before, after, 1))
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked --all-targets
          cargo test --locked nix_export_plan::tests:: -- --test-threads=1
          cargo test --locked --test nix_export_plan -- --test-threads=1
          git rm .github/workflows/agent-nix-plan-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/nix_export_plan.rs src/main.rs src/lib.rs src/completion.rs tests/nix_export_plan.rs
          git diff --cached --check
          git commit -m "test(DEN-1418): apply generated planner lock and formatting"
          git push origin HEAD:agent/den-1418-nix-export-plan
