name: Agent apply R2G server mode from PR

on:
  pull_request:
    branches:
      - alexanderdmills/den-1439-mise-import-verify
    paths:
      - '.github/workflows/agent-r2g-server-mode-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/r2g-server-registry-roundtrip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Extract and run the branch-local semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-r2g-server-mode.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ) + '\n'
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          PY
          cargo fmt
          cargo test --locked r2g
          cargo test --locked cli::tests
          cargo test --locked flags
          cargo clippy --all-targets -- -D warnings
      - name: Commit product code and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli.rs src/main.rs src/r2g.rs .cli-flags.toml README.md
          git rm .github/workflows/agent-r2g-server-mode.yml \
            .github/workflows/agent-r2g-server-mode-pr.yml
          git diff --cached --check
          git commit -m 'feat(r2g): certify configured Rust registry servers'
          git push origin HEAD:${{ github.head_ref }}
