name: temporary fast graph source check

on:
  push:
    branches: ["ai/fast-manifest-dependency-graph"]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Refresh lock only inside the ephemeral runner
        run: cargo generate-lockfile
      - name: Compile all targets
        run: cargo check --all-targets
      - name: Run focused local graph tests
        run: cargo test graph_local
