name: Apply GitHub sidecar patch

on:
  push:
    branches:
      - agent/github-release-sidecar-20260901
    paths:
      - .agent/github-release-sidecar.patch
      - .github/workflows/apply-agent-sidecar-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/github-release-sidecar-20260901

      - name: Apply and commit focused patch
        run: |
          set -euo pipefail
          git apply --check .agent/github-release-sidecar.patch
          git apply --whitespace=fix .agent/github-release-sidecar.patch
          rm .agent/github-release-sidecar.patch
          rm .github/workflows/apply-agent-sidecar-patch.yml
          rmdir .agent 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(publish): point release sidecars at GitHub [agent-patch-applied]'
          git push origin HEAD:agent/github-release-sidecar-20260901
