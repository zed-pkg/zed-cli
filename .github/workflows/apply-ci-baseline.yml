name: Apply CI baseline repair

on:
  push:
    branches:
      - agent/ci-baseline-20260901
    paths:
      - .github/workflows/apply-ci-baseline.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ci-baseline-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ci-baseline-20260901
          path: zed-cli
          fetch-depth: 0

      - name: Check out pinned interface dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 3524038600e2a864617f82be8f104e688d80d23e
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Repair checked-in CI baseline and commit the generated diff
        working-directory: zed-cli
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '--env ZED_PKG_DO_NOT_WRITE_NEW_MANIFEST=1'
          new = '--env ZED_PKG_DO_NOT_WRITE_NEW_MANIFEST=true'
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed boolean contract, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/apply-ci-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci: repair formatting and boolean baseline [ci-baseline-applied]'
          git push origin HEAD:agent/ci-baseline-20260901
