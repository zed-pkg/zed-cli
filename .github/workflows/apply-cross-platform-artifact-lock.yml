name: apply cross-platform artifact lock test

on:
  push:
    branches:
      - agent/recursive-lock-cross-platform
  pull_request:
    branches:
      - agent/recursive-install-queue

permissions:
  contents: read

concurrency:
  group: apply-cross-platform-artifact-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out lock-hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-lock-cross-platform
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply exact cross-platform process-lock patch
        run: |
          set -euo pipefail
          python3 .github/cross_platform_artifact_lock.py
          cargo fmt --all
          git diff --check

      - name: Validate the subprocess lock contract and installer suite
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo test --locked --lib \
            install_graph::tests::artifact_waiters_block_until_the_owner_releases_the_kernel_lock \
            -- --exact --nocapture
          cargo test --locked --lib install_graph::tests
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit validated code and remove bootstrap files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/cross_platform_artifact_lock.py \
            .github/workflows/apply-cross-platform-artifact-lock.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: exercise artifact lock across processes'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/recursive-lock-cross-platform
