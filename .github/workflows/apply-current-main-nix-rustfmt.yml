name: apply verified current-main Nix rustfmt repair

on:
  push:
    branches:
      - fix/format-current-main-nix-bundle
    paths:
      - .github/workflows/apply-current-main-nix-rustfmt.yml

permissions:
  contents: write

concurrency:
  group: apply-current-main-nix-rustfmt
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/format-current-main-nix-bundle
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply and constrain the formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          python3 - <<'PY'
          import subprocess

          allowed = {
              'src/nix_bundle_write.rs',
              'tests/nix_bundle_write_boundaries.rs',
              'tests/nix_bundle_write_cli.rs',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(
                  'expected exactly the three independently verified formatting files; got: '
                  + ', '.join(sorted(changed))
              )
          PY

          cargo fmt --all --check
          cargo test --locked --test nix_bundle_write_cli --no-run
          cargo test --locked --test nix_bundle_write_boundaries --no-run
          git diff --check

      - name: Remove temporary formatting workflows and commit ordinary source
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-current-main-nix-rustfmt.yml \
            .github/workflows/format-current-main-nix-bundle-evidence.yml \
            .github/workflows/format-current-main-nix-bundle-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style(DEN-1592): format merged Nix bundle writer'
          git push origin HEAD:fix/format-current-main-nix-bundle
