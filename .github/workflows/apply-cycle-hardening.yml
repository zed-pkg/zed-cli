name: apply circular dependency hardening patch

on:
  push:
    branches:
      - codex/circular-dependency-hardening-20260903

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[cycle-hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - name: Apply exact source patch
        run: python3 .github/scripts/apply-cycle-hardening.py
      - name: Resolve the pinned ores-otel SDK and update Cargo.lock
        run: cargo check
      - name: Format
        run: cargo fmt --all
      - name: Focused cycle diagnostics tests
        run: cargo test --locked install_graph::cycle_diagnostics
      - name: Focused cycle regression tests
        run: cargo test --locked install_graph::cycle_regression_tests
      - name: Existing solver cycle tests
        run: cargo test --locked install_graph::solver::tests::dependency_cycles
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit the tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden circular dependency diagnostics [cycle-hardening-applied]"
          git push origin HEAD:codex/circular-dependency-hardening-20260903
