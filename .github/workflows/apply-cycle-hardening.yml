name: apply circular dependency hardening patch

on:
  push:
    branches:
      - codex/circular-dependency-hardening-20260903

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    permissions:
      contents: read
    if: ${{ !contains(github.event.head_commit.message, '[cycle-hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - name: Apply exact source patch
        run: python3 .github/scripts/apply-cycle-hardening.py
      - name: Resolve the pinned ores-otel SDK and update Cargo.lock
        run: cargo check
      - name: Format
        run: cargo fmt --all
      - name: Focused cycle diagnostics tests
        run: cargo test --locked install_graph::cycle_diagnostics
      - name: Focused cycle regression tests
        run: cargo test --locked install_graph::cycle_regression_tests
      - name: Existing solver cycle tests
        run: cargo test --locked install_graph::solver::tests::dependency_cycles
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Export tested changes for review
        run: |
          git add -A
          git diff --cached --binary > "${RUNNER_TEMP}/zed-maintenance.patch"

      - name: Upload tested maintenance patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maintenance-${{ github.job }}
          path: ${{ runner.temp }}/zed-maintenance.patch
          if-no-files-found: ignore
          retention-days: 7
