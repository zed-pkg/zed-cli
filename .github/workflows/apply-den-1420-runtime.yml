name: apply DEN-1420 mise runtime

on:
  push:
    branches:
      - agent/den-1420-mise-dev-runtime

permissions:
  contents: write

concurrency:
  group: den-1420-mise-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Recover and apply the reviewed runtime patch
        shell: bash
        run: |
          set -euo pipefail

          git show 6e73411d5e07f0b285de6554cdfc191915c6a831:.github/workflows/apply-den-1420-mise.yml > "$RUNNER_TEMP/original-workflow.yml"

          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          source = Path(__import__('os').environ['RUNNER_TEMP']).joinpath('original-workflow.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if "base64 -d <<'PATCH_GZ'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PATCH_GZ')
          payload = ''.join(line.strip() for line in lines[start:end])
          patch = gzip.decompress(base64.b64decode(payload))
          Path(__import__('os').environ['RUNNER_TEMP']).joinpath('den-1420.patch').write_bytes(patch)
          PY

          printf '%s  %s\n' \
            'd0d0a867d249556a41322169483f27f9107a58d4131a2a92270e16d4967623bc' \
            "$RUNNER_TEMP/den-1420.patch" | sha256sum -c -

          if git apply --check "$RUNNER_TEMP/den-1420.patch"; then
            git apply "$RUNNER_TEMP/den-1420.patch"
          else
            patch --batch --forward --fuzz=3 -p1 < "$RUNNER_TEMP/den-1420.patch"
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dev.rs')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          def assertion_bounds(index: int) -> tuple[int, int]:
              start = index
              while start >= 0 and lines[start].strip() != 'assert!(':
                  start -= 1
              if start < 0:
                  raise SystemExit('could not locate assertion start')
              end = index
              while end < len(lines) and lines[end].strip() != ');':
                  end += 1
              if end == len(lines):
                  raise SystemExit('could not locate assertion end')
              return start, end + 1

          help_index = next(
              i for i, line in enumerate(lines)
              if 'fn augmented_root_help_contains_the_command_and_alias()' in line
          )

          misplaced = [
              i for i, line in enumerate(lines[:help_index])
              if 'Some("mise")' in line
          ]
          for index in reversed(misplaced):
              start, end = assertion_bounds(index)
              del lines[start:end]

          help_index = next(
              i for i, line in enumerate(lines)
              if 'fn augmented_root_help_contains_the_command_and_alias()' in line
          )
          next_test = next(
              (i for i in range(help_index + 1, len(lines)) if lines[i].strip() == '#[test]'),
              len(lines),
          )
          if not any('Some("mise")' in line for line in lines[help_index:next_test]):
              nix_index = next(
                  i for i in range(help_index, next_test)
                  if 'Some("nix")' in lines[i]
              )
              _, insert_at = assertion_bounds(nix_index)
              lines[insert_at:insert_at] = [
                  '        assert!(\n',
                  '            develop\n',
                  '                .get_arguments()\n',
                  '                .any(|arg| arg.get_long() == Some("mise"))\n',
                  '        );\n',
              ]

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo 'patch left reject files:' >&2
            find . -name '*.rej' -print -exec cat {} \; >&2
            exit 1
          fi

          test "$(git hash-object src/dev.rs)" = 'ad55ef52dc4703afa7025bcba3c60de5d444cca1'
          test "$(git hash-object .dev-cli-flags.toml)" = 'd4b6a979f3274a87370ef518d58a49705fcdc3af'
          test "$(git hash-object docs/develop.md)" = 'a53eb8e6f35aaf84465149d1146d65166e6d12ff'
          test "$(git hash-object .github/workflows/develop-shell.yml)" = '14c23135d931e20423084be1a698d67ac155e15e'

          rm .github/workflows/apply-den-1420-runtime.yml

          cargo fmt --all
          git diff --check
          cargo test --locked --test develop_edge_cases --test develop_help_contract
          cargo test --locked dev::tests
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dev.rs .dev-cli-flags.toml docs/develop.md .github/workflows/develop-shell.yml .github/workflows/apply-den-1420-runtime.yml
          git commit -m 'feat(DEN-1420): compose zed dev with mise'
          git push origin HEAD:agent/den-1420-mise-dev-runtime
