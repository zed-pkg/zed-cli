name: apply DEN-1439 current interfaces

on:
  push:
    branches:
      - alexanderdmills/den-1439-mise-import-verify
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: den-1439-current-interfaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'alexanderdmills/den-1439-mise-import-verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-1439-mise-import-verify
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Regenerate the exact interface lock and validate the static adapter
        shell: bash
        env:
          ZED_INTERFACES_SHA: c2e049006453c26ca8ca291783f681fce75cb01f
        run: |
          set -euo pipefail
          grep -F "rev = \"$ZED_INTERFACES_SHA\"" Cargo.toml
          cargo update -p zed-interfaces --precise "$ZED_INTERFACES_SHA"
          grep -F "$ZED_INTERFACES_SHA" Cargo.lock
          cargo fmt --all --check
          git diff --check
          cargo test --locked environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already matches the current interface pin'
            exit 0
          fi
          git commit -m 'chore(DEN-1439): lock current interface contract'
          git push origin HEAD:alexanderdmills/den-1439-mise-import-verify
