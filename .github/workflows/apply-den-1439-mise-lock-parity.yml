name: apply DEN-1439 mise lock parity

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: den-1439-mise-lock-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'alexanderdmills/den-1439-mise-import-verify' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-1439-mise-import-verify
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Match mise lock naming and add implicit-dot-config coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/environment.rs')
          text = source.read_text(encoding='utf-8')
          old = '''    let candidate = config_path.with_extension("lock");
              if candidate.is_file() {
          '''
          new = '''    let candidate = implicit_mise_lock_path(config_path);
              if candidate.is_file() {
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one implicit lock candidate, found {text.count(old)}')
          text = text.replace(old, new, 1)

          helper_anchor = '''fn resolve_project_file(root: &Path, requested: &Path, kind: &str) -> Result<PathBuf> {
          '''
          helper = '''fn implicit_mise_lock_path(config_path: &Path) -> PathBuf {
              let file_name = config_path
                  .file_name()
                  .and_then(|name| name.to_str())
                  .unwrap_or_default();
              let visible_name = file_name.strip_prefix('.').unwrap_or(file_name);
              let stem = visible_name.strip_suffix(".toml").unwrap_or(visible_name);
              config_path.with_file_name(format!("{stem}.lock"))
          }

          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit('could not locate resolve_project_file')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          unit_anchor = '''    #[test]
              fn imports_locked_scalar_and_table_tools() {
          '''
          unit = '''    #[test]
              fn implicit_lock_paths_match_current_mise_naming() {
                  assert_eq!(
                      implicit_mise_lock_path(Path::new("mise.toml")),
                      PathBuf::from("mise.lock")
                  );
                  assert_eq!(
                      implicit_mise_lock_path(Path::new(".mise.toml")),
                      PathBuf::from("mise.lock")
                  );
                  assert_eq!(
                      implicit_mise_lock_path(Path::new("mise.test.toml")),
                      PathBuf::from("mise.test.lock")
                  );
              }

          '''
          if text.count(unit_anchor) != 1:
              raise SystemExit('could not locate first environment unit test')
          source.write_text(text.replace(unit_anchor, unit + unit_anchor, 1), encoding='utf-8')

          tests = Path('tests/mise_environment_cli.rs')
          cli = tests.read_text(encoding='utf-8')
          cli_anchor = '''#[test]
          fn frozen_verify_fails_closed_on_ambiguous_or_incomplete_project_state() {
          '''
          cli_test = '''#[test]
          fn dot_mise_toml_discovers_the_shared_mise_lock_name() {
              let temp = tempfile::tempdir().unwrap();
              let home = temp.path().join("home");
              let project = temp.path().join("project");
              fs::create_dir_all(&home).unwrap();
              fs::create_dir_all(&project).unwrap();
              fs::write(
                  project.join(".mise.toml"),
                  "[tools]\\nnode = \\"22\\"\\n",
              )
              .unwrap();
              fs::write(
                  project.join("mise.lock"),
                  format!(
                      "[[tools.node]]\\nversion = \\"22.4.0\\"\\nbackend = \\"core:node\\"\\n[tools.node.platforms.linux-x64]\\nchecksum = \\"{}\\"\\n",
                      sha256('c')
                  ),
              )
              .unwrap();

              let output = run_zed(
                  &project,
                  &home,
                  &["env", "verify", "mise", "--frozen", "--json"],
              );
              assert!(
                  output.status.success(),
                  "stderr: {}",
                  String::from_utf8_lossy(&output.stderr)
              );
              let result: Value = serde_json::from_slice(&output.stdout).unwrap();
              assert_eq!(result["config"], ".mise.toml");
              assert_eq!(result["lock"], "mise.lock");
              assert!(!project.join(".mise.lock").exists());
          }

          '''
          if cli.count(cli_anchor) != 1:
              raise SystemExit('could not locate CLI failure test')
          tests.write_text(cli.replace(cli_anchor, cli_test + cli_anchor, 1), encoding='utf-8')

          docs = Path('docs/mise-interop.md')
          documentation = docs.read_text(encoding='utf-8')
          old_docs = '''When no `--lock` is supplied, the adapter follows mise's adjacent-file convention by replacing the config file's `.toml` extension with `.lock`:

          ```text
          mise.toml        → mise.lock
          .mise.toml       → .mise.lock
          mise.test.toml   → mise.test.lock
          ```
          '''
          new_docs = '''When no `--lock` is supplied, the adapter follows mise's current normalized adjacent-file convention. The leading dot in `.mise.toml` does not carry into the lock name:

          ```text
          mise.toml        → mise.lock
          .mise.toml       → mise.lock
          mise.test.toml   → mise.test.lock
          ```
          '''
          if documentation.count(old_docs) != 1:
              raise SystemExit('could not locate lockfile naming documentation')
          docs.write_text(documentation.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/environment.rs tests/mise_environment_cli.rs docs/mise-interop.md
          git commit -m 'fix(DEN-1439): match mise lockfile naming'
          git push origin HEAD:alexanderdmills/den-1439-mise-import-verify
