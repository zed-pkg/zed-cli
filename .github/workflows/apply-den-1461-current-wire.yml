name: superseded DEN-1461 current wire materializer

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: den-1461-current-wire-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    if: github.head_ref == 'feat/den-1461-mise-lock-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Defer to unified materializer
        run: echo 'Current-wire support is now applied by materialize DEN-1461 lock contract.'
