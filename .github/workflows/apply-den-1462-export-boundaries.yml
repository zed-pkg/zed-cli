name: apply DEN-1462 export boundaries

on:
  push:
    branches:
      - fix/den-1462-mise-export-boundaries
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: den-1462-export-boundaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out stacked hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-1462-mise-export-boundaries
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply and validate ownership/security boundaries
        run: |
          set -euo pipefail
          python3 scripts/harden_den1462_export_boundaries.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked mise_export
          cargo test --locked --test mise_export_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mise_export.rs tests/mise_export_cli.rs docs/mise-export.md
          git commit -m 'fix(DEN-1462): harden mise export ownership boundaries'
          git push origin HEAD:fix/den-1462-mise-export-boundaries
