name: apply DEN-1462 reserved export-state source

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main

permissions:
  contents: write

concurrency:
  group: den-1462-reserved-source-windows
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Reject reserved export state as an input plan
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mise_export.rs')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          function_index = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == 'fn validate_export_path_relationships('
          )
          output_index = next(
              index
              for index in range(function_index, len(lines))
              if lines[index].strip()
              == 'let output_folded = output_relative.to_ascii_lowercase();'
          )
          if not any(
              line.strip() == 'let state_folded = EXPORT_STATE_PATH.to_ascii_lowercase();'
              for line in lines[output_index : output_index + 8]
          ):
              indent = lines[output_index][: len(lines[output_index]) - len(lines[output_index].lstrip())]
              lines.insert(
                  output_index + 1,
                  f'{indent}let state_folded = EXPORT_STATE_PATH.to_ascii_lowercase();\n',
              )

          expression_index = next(
              index
              for index in range(function_index, len(lines))
              if 'output_folded != EXPORT_STATE_PATH.to_ascii_lowercase()' in lines[index]
              or lines[index].strip() == 'output_folded != state_folded,'
          )
          expression_indent = lines[expression_index][
              : len(lines[expression_index]) - len(lines[expression_index].lstrip())
          ]
          lines[expression_index] = f'{expression_indent}output_folded != state_folded,\n'

          if not any(
              line.strip() == 'plan_folded != state_folded,'
              for line in lines[output_index : expression_index + 4]
          ):
              ensure_start = expression_index - 1
              while ensure_start >= function_index and lines[ensure_start].strip() != 'ensure!(':
                  ensure_start -= 1
              if ensure_start < function_index:
                  raise SystemExit('could not locate reserved-output ensure block')
              indent = lines[ensure_start][: len(lines[ensure_start]) - len(lines[ensure_start].lstrip())]
              nested = indent + '    '
              block = [
                  f'{indent}ensure!(\n',
                  f'{nested}plan_folded != state_folded,\n',
                  f'{nested}"environment plan cannot target reserved export state `{{EXPORT_STATE_PATH}}`"\n',
                  f'{indent});\n',
              ]
              lines[ensure_start:ensure_start] = block

          if not any(
              'fn reserved_export_state_cannot_be_used_as_plan_input()' in line
              for line in lines
          ):
              target_index = next(
                  index
                  for index, line in enumerate(lines)
                  if line.strip()
                  == 'fn export_paths_reject_parent_drive_unc_and_symlink_escape() {'
              )
              insertion_index = target_index - 1
              while insertion_index > 0 and lines[insertion_index].strip() != '#[test]':
                  insertion_index -= 1
              if lines[insertion_index].strip() != '#[test]':
                  raise SystemExit('could not locate reserved path test insertion point')
              indent = lines[target_index][
                  : len(lines[target_index]) - len(lines[target_index].lstrip())
              ]
              nested = indent + '    '
              block = [
                  f'{indent}#[test]\n',
                  f'{indent}fn reserved_export_state_cannot_be_used_as_plan_input() {{\n',
                  f'{nested}let temp = tempfile::tempdir().unwrap();\n',
                  f'{nested}let reserved = temp.path().join(EXPORT_STATE_PATH);\n',
                  f'{nested}fs::create_dir_all(reserved.parent().unwrap()).unwrap();\n',
                  f'{nested}fs::write(&reserved, serde_json::to_vec_pretty(&simple_plan()).unwrap()).unwrap();\n',
                  '\n',
                  f'{nested}let error = export_mise(\n',
                  f'{nested}    temp.path(),\n',
                  f'{nested}    Path::new(EXPORT_STATE_PATH),\n',
                  f'{nested}    Path::new("mise.toml"),\n',
                  f'{nested}    MiseExportMode::Print,\n',
                  f'{nested})\n',
                  f'{nested}.unwrap_err();\n',
                  f'{nested}assert!(\n',
                  f'{nested}    error\n',
                  f'{nested}        .to_string()\n',
                  f'{nested}        .contains("environment plan cannot target reserved export state")\n',
                  f'{nested});\n',
                  f'{nested}assert!(!temp.path().join("mise.toml").exists());\n',
                  f'{indent}}}\n',
                  '\n',
              ]
              lines[insertion_index:insertion_index] = block

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked mise_export::tests::ownership_cannot_transfer_or_repair_state_silently
          cargo test --locked mise_export::tests::reserved_export_state_cannot_be_used_as_plan_input
          cargo test --locked mise_export
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mise_export.rs
          if git diff --cached --quiet; then
            echo 'reserved source hardening already present'
            exit 0
          fi
          git commit -m 'fix(DEN-1462): reserve exporter state input path'
          git push origin HEAD:agent/den-1462-mise-export-current-main
