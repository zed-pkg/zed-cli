name: apply DEN-1462 ownership-state integrity

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: den-1462-ownership-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Reject silent ownership transfer, state repair, and reserved state input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/mise_export.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let current = read_regular_file(output_path, "mise output")?;
              let unchanged = current
                  .as_deref()
                  .is_some_and(|bytes| bytes == candidate.as_bytes());

              if let Some(current) = current.as_deref()
                  && !unchanged
              {
                  let current_sha256 = digest_bytes(current);
                  let record = state.outputs.get(output_relative).with_context(|| {
                      format!(
                          "refusing to overwrite hand-authored `{output_relative}`: no Zed export state exists; move it aside, choose another --output, or make its contents match the deterministic projection before adopting it"
                      )
                  })?;
                  ensure!(
                      record.plan == plan_relative,
                      "refusing to overwrite `{output_relative}` from `{plan_relative}` because it is owned by plan `{}`",
                      record.plan
                  );
                  ensure!(
                      record.output_sha256 == current_sha256,
                      "refusing to overwrite edited `{output_relative}`: export state records sha256 {}, current file is {current_sha256}",
                      record.output_sha256
                  );
              }
          '''
          new = '''    let current = read_regular_file(output_path, "mise output")?;
              let unchanged = current
                  .as_deref()
                  .is_some_and(|bytes| bytes == candidate.as_bytes());

              if let Some(record) = state.outputs.get(output_relative) {
                  ensure!(
                      record.plan == plan_relative,
                      "refusing to change ownership of `{output_relative}` from plan `{}` to `{plan_relative}`",
                      record.plan
                  );
                  if let Some(current) = current.as_deref() {
                      let current_sha256 = digest_bytes(current);
                      ensure!(
                          record.output_sha256 == current_sha256,
                          "refusing to overwrite edited `{output_relative}`: export state records sha256 {}, current file is {current_sha256}",
                          record.output_sha256
                      );
                  }
              }

              if current.is_some() && !unchanged && !state.outputs.contains_key(output_relative) {
                  bail!(
                      "refusing to overwrite hand-authored `{output_relative}`: no Zed export state exists; move it aside, choose another --output, or make its contents match the deterministic projection before adopting it"
                  );
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ownership block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_paths = '''    let plan_folded = plan_relative.to_ascii_lowercase();
              let output_folded = output_relative.to_ascii_lowercase();
              ensure!(
                  output_folded != plan_folded,
                  "mise output `{output_relative}` cannot overwrite its source environment plan"
              );
              ensure!(
                  output_folded != EXPORT_STATE_PATH.to_ascii_lowercase(),
                  "mise output cannot target reserved export state `{EXPORT_STATE_PATH}`"
              );
          '''
          new_paths = '''    let plan_folded = plan_relative.to_ascii_lowercase();
              let output_folded = output_relative.to_ascii_lowercase();
              let state_folded = EXPORT_STATE_PATH.to_ascii_lowercase();
              ensure!(
                  output_folded != plan_folded,
                  "mise output `{output_relative}` cannot overwrite its source environment plan"
              );
              ensure!(
                  plan_folded != state_folded,
                  "environment plan cannot target reserved export state `{EXPORT_STATE_PATH}`"
              );
              ensure!(
                  output_folded != state_folded,
                  "mise output cannot target reserved export state `{EXPORT_STATE_PATH}`"
              );
          '''
          if text.count(old_paths) != 1:
              raise SystemExit(f'expected one path relationship block, found {text.count(old_paths)}')
          text = text.replace(old_paths, new_paths, 1)

          anchor = '''    #[test]
              fn hand_edits_and_unowned_outputs_are_never_overwritten() {
          '''
          regression = '''    #[test]
              fn ownership_cannot_transfer_or_repair_state_silently() {
                  let temp = tempfile::tempdir().unwrap();
                  let plan = simple_plan();
                  let plan_path = write_plan(temp.path(), &plan);
                  let output = Path::new(".mise.toml");
                  export_mise(temp.path(), &plan_path, output, MiseExportMode::Write).unwrap();

                  let alternate_plan = temp.path().join("alternate-env.toml");
                  fs::write(&alternate_plan, plan.to_toml_string().unwrap()).unwrap();
                  let output_before = fs::read(temp.path().join(output)).unwrap();
                  let state_path = temp.path().join(EXPORT_STATE_PATH);
                  let state_before = fs::read(&state_path).unwrap();
                  let transfer = export_mise(
                      temp.path(),
                      Path::new("alternate-env.toml"),
                      output,
                      MiseExportMode::Write,
                  )
                  .unwrap_err();
                  assert!(transfer.to_string().contains("change ownership"));
                  assert_eq!(fs::read(temp.path().join(output)).unwrap(), output_before);
                  assert_eq!(fs::read(&state_path).unwrap(), state_before);

                  let mut state: MiseExportState = serde_json::from_slice(&state_before).unwrap();
                  state
                      .outputs
                      .get_mut(".mise.toml")
                      .unwrap()
                      .output_sha256 = "0".repeat(64);
                  let mut corrupted = serde_json::to_vec_pretty(&state).unwrap();
                  corrupted.push(10);
                  fs::write(&state_path, &corrupted).unwrap();

                  let repair =
                      export_mise(temp.path(), &plan_path, output, MiseExportMode::Write).unwrap_err();
                  assert!(repair.to_string().contains("export state records sha256"));
                  assert_eq!(fs::read(temp.path().join(output)).unwrap(), output_before);
                  assert_eq!(fs::read(&state_path).unwrap(), corrupted);
              }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('could not locate ownership regression insertion point')
          text = text.replace(anchor, regression + anchor, 1)

          path_anchor = '''    #[test]
              fn export_paths_reject_parent_drive_unc_and_symlink_escape() {
          '''
          path_regression = '''    #[test]
              fn reserved_export_state_cannot_be_used_as_plan_input() {
                  let temp = tempfile::tempdir().unwrap();
                  let reserved = temp.path().join(EXPORT_STATE_PATH);
                  fs::create_dir_all(reserved.parent().unwrap()).unwrap();
                  fs::write(&reserved, serde_json::to_vec_pretty(&simple_plan()).unwrap()).unwrap();

                  let error = export_mise(
                      temp.path(),
                      Path::new(EXPORT_STATE_PATH),
                      Path::new("mise.toml"),
                      MiseExportMode::Print,
                  )
                  .unwrap_err();
                  assert!(
                      error
                          .to_string()
                          .contains("environment plan cannot target reserved export state")
                  );
                  assert!(!temp.path().join("mise.toml").exists());
              }

          '''
          if text.count(path_anchor) != 1:
              raise SystemExit('could not locate reserved path regression insertion point')
          text = text.replace(path_anchor, path_regression + path_anchor, 1)
          path.write_text(text, encoding='utf-8')

          cli_path = Path('tests/mise_export_reserved_paths_cli.rs')
          cli = cli_path.read_text(encoding='utf-8')
          test_anchor = '''#[test]
          fn real_cli_refuses_source_state_and_transaction_staging_destinations() {
          '''
          helper = '''fn run_zed_with_plan(project: &Path, home: &Path, plan: &str, output: &str) -> Output {
              let empty_path = home.join("empty-path");
              fs::create_dir_all(&empty_path).unwrap();
              let mut command = Command::new(zed_bin());
              for (key, _) in std::env::vars_os() {
                  if key.to_string_lossy().starts_with("ZED_PKG_") {
                      command.env_remove(key);
                  }
              }
              command
                  .args([
                      "env",
                      "export",
                      "mise",
                      "--plan",
                      plan,
                      "--output",
                      output,
                      "--write",
                  ])
                  .current_dir(project)
                  .env("HOME", home)
                  .env("USERPROFILE", home)
                  .env("XDG_CONFIG_HOME", home.join(".config"))
                  .env("ZED_PKG_HOME", home.join(".zed-pkg"))
                  .env("PATH", empty_path)
                  .output()
                  .unwrap()
          }

          '''
          if cli.count(test_anchor) != 1:
              raise SystemExit('could not locate real CLI reserved path test')
          cli = cli.replace(test_anchor, helper + test_anchor, 1)

          final_anchor = '''    assert_eq!(
                  fs::read(project.join("zed-env.json")).unwrap(),
                  original_plan
              );
          '''
          source_case = '''    fs::create_dir_all(project.join(".zed")).unwrap();
              fs::write(
                  project.join(".zed/mise-export-state.json"),
                  &original_plan,
              )
              .unwrap();
              let reserved_source = run_zed_with_plan(
                  &project,
                  &home,
                  ".zed/mise-export-state.json",
                  "mise.toml",
              );
              assert!(!reserved_source.status.success());
              let stderr = String::from_utf8_lossy(&reserved_source.stderr);
              assert!(
                  stderr.contains("environment plan cannot target reserved export state"),
                  "unexpected reserved-source error: {stderr}"
              );
              assert!(!project.join("mise.toml").exists());
              fs::remove_file(project.join(".zed/mise-export-state.json")).unwrap();
              fs::remove_dir(project.join(".zed")).unwrap();

          '''
          if cli.count(final_anchor) != 1:
              raise SystemExit('could not locate final reserved path assertions')
          cli_path.write_text(cli.replace(final_anchor, source_case + final_anchor, 1), encoding='utf-8')
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked mise_export::tests::ownership_cannot_transfer_or_repair_state_silently
          cargo test --locked mise_export::tests::reserved_export_state_cannot_be_used_as_plan_input
          cargo test --locked mise_export
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mise_export.rs tests/mise_export_reserved_paths_cli.rs
          git commit -m 'fix(DEN-1462): preserve exporter ownership and state boundaries'
          git push origin HEAD:agent/den-1462-mise-export-current-main
