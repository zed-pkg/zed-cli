name: apply DEN-1462 startup recovery lock v2

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main

permissions:
  contents: write

concurrency:
  group: den-1462-startup-recovery-lock
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Patch, validate, and publish startup recovery serialization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          if not any(line == 'use zed_cli::project_lock;\n' for line in lines):
              anchors = [i for i, line in enumerate(lines) if line == 'use zed_cli::preflight;\n']
              if len(anchors) != 1:
                  raise SystemExit(f'expected one preflight import, found {len(anchors)}')
              lines.insert(anchors[0] + 1, 'use zed_cli::project_lock;\n')

          marker = 'project_lock::with_lock(&cwd, "recover pending project transactions", || {'
          if not any(marker in line for line in lines):
              starts = [
                  i for i, line in enumerate(lines)
                  if line.strip() == 'if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {'
              ]
              if len(starts) != 1:
                  raise SystemExit(f'expected one recovery block, found {len(starts)}')
              start = starts[0]
              depth = 0
              end = None
              for i in range(start, len(lines)):
                  depth += lines[i].count('{')
                  depth -= lines[i].count('}')
                  if depth == 0:
                      end = i + 1
                      break
              if end is None:
                  raise SystemExit('unterminated recovery block')

              indent = lines[start][:-len(lines[start].lstrip())]
              nested = indent + '    '
              closure = nested + '    '
              lines[start:end] = [
                  f'{indent}if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {{\n',
                  f'{nested}// Recovery writes into the project and must be serialized against\n',
                  f'{nested}// every operation sharing the checkout. Preserve project-lock ->\n',
                  f'{nested}// store-lock ordering to avoid lock inversion with installers.\n',
                  f'{nested}project_lock::with_lock(&cwd, "recover pending project transactions", || {{\n',
                  f'{closure}let store = Store::new(&cfg.home);\n',
                  f'{closure}let _recovery_lock = store.install_lock()?;\n',
                  f'{closure}zed_cli::transaction::recover_pending(&cwd)?;\n',
                  f'{closure}Ok(())\n',
                  f'{nested}}})?;\n',
                  f'{indent}}}\n',
              ]

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked --test mise_export_api_boundaries
          cargo test --locked mise_export
          cargo test --locked project_lock
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          if git diff --cached --quiet; then
            echo 'startup recovery serialization already present'
            exit 0
          fi
          git commit -m 'fix(DEN-1462): serialize exporter recovery'
          git push origin HEAD:agent/den-1462-mise-export-current-main
