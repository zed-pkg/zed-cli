name: apply DEN-1462 startup recovery lock

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main

permissions:
  contents: write

concurrency:
  group: den-1462-startup-recovery-lock
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Serialize startup recovery under the checkout operation lock
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          if not any(line == 'use zed_cli::project_lock;\n' for line in lines):
              import_index = next(
                  index for index, line in enumerate(lines)
                  if line == 'use zed_cli::preflight;\n'
              )
              lines.insert(import_index + 1, 'use zed_cli::project_lock;\n')

          hardened_marker = 'project_lock::with_lock(&cwd, "recover pending project transactions", || {'
          if not any(hardened_marker in line for line in lines):
              start = next(
                  index for index, line in enumerate(lines)
                  if line.strip() == 'if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {'
              )

              depth = 0
              end = None
              for index in range(start, len(lines)):
                  depth += lines[index].count('{')
                  depth -= lines[index].count('}')
                  if depth == 0:
                      end = index + 1
                      break
              if end is None:
                  raise SystemExit('could not locate end of startup recovery block')

              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              nested = indent + '    '
              closure = nested + '    '
              replacement = [
                  f'{indent}if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {{\n',
                  f'{nested}// Recovery writes into the project and must be serialized against\n',
                  f'{nested}// every operation sharing the checkout. Preserve project-lock ->\n',
                  f'{nested}// store-lock ordering to avoid lock inversion with installers.\n',
                  f'{nested}project_lock::with_lock(&cwd, "recover pending project transactions", || {{\n',
                  f'{closure}let store = Store::new(&cfg.home);\n',
                  f'{closure}let _recovery_lock = store.install_lock()?;\n',
                  f'{closure}zed_cli::transaction::recover_pending(&cwd)?;\n',
                  f'{closure}Ok(())\n',
                  f'{nested}}})?;\n',
                  f'{indent}}}\n',
              ]
              lines[start:end] = replacement

          path.write_text(''.join(lines), encoding='utf-8')
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked --test mise_export_api_boundaries
          cargo test --locked mise_export
          cargo test --locked project_lock
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          if git diff --cached --quiet; then
            echo 'startup recovery locking already present'
            exit 0
          fi
          git commit -m 'fix(DEN-1462): serialize exporter recovery'
          git push origin HEAD:agent/den-1462-mise-export-current-main
