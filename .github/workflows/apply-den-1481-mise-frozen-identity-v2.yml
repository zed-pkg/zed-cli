name: apply DEN-1481 mise frozen identity v2

on:
  push:
    branches:
      - feat/den-1481-mise-frozen-identity
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: den-1481-mise-frozen-identity-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-1481-mise-frozen-identity
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply and validate reviewed product change
        run: |
          set -euo pipefail
          python3 scripts/apply_den1481_mise_identity.py
          cargo fmt --all
          git diff --check
          cargo test --locked environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/environment.rs tests/mise_environment_cli.rs docs/mise-interop.md
          git commit -m 'feat(DEN-1481): verify frozen mise identity parity'
          git push origin HEAD:feat/den-1481-mise-frozen-identity
