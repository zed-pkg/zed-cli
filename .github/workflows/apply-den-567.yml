name: Apply DEN-567 CLI hardening (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-567-manifestless-flags-completion' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 61f654d5e4ca718abc4a280a641472466689c278
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Apply deterministic patch
        working-directory: zed-cli
        run: python3 scripts/apply_den_567.py
      - name: Generate lockfile and format
        working-directory: zed-cli
        run: |
          cargo check
          cargo fmt --all
      - name: Validate candidate
        working-directory: zed-cli
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=short -- -D warnings > .den-567-validation.txt 2>&1
          clippy_status=$?
          cargo test --locked --all-targets >> .den-567-validation.txt 2>&1
          test_status=$?
          cargo build --locked --release >> .den-567-validation.txt 2>&1
          build_status=$?
          target/release/zed completions bash > "$RUNNER_TEMP/zed.bash" 2>> .den-567-validation.txt
          completion_status=$?
          bash -n "$RUNNER_TEMP/zed.bash" >> .den-567-validation.txt 2>&1
          syntax_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\nbuild_status=%s\ncompletion_status=%s\nsyntax_status=%s\n' \
            "$clippy_status" "$test_status" "$build_status" "$completion_status" "$syntax_status" \
            >> .den-567-validation.txt
          exit 0
      - name: Commit candidate and diagnostic
        working-directory: zed-cli
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock README.md .cli-flags.toml .github/workflows/ci.yml \
            src scripts/apply_den_567.py .den-567-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m 'DEN-567: harden manifestless install and completion'
            git push origin HEAD:feat/den-567-manifestless-flags-completion
          fi
