name: apply hoisted bin fix

on:
  push:
    branches:
      - fix/hoisted-bin-relative-imports-20260924
    paths:
      - .github/workflows/apply-hoisted-bin-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/hoisted-bin-relative-imports-20260924
          fetch-depth: 0
          persist-credentials: true

      - name: Patch the reviewed hoist seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops.rs')
          text = path.read_text()
          start_marker = '/// Hoist package-declared executables into `zed_modules/.bin/<name>` so\n'
          end_marker = '/// Relative path from `from_dir` to `target` without touching the\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          required = [
              'fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()>',
              'fs::copy(target, &destination)?;',
              'permissions.set_mode(permissions.mode() | 0o111);',
          ]
          missing = [needle for needle in required if needle not in old]
          if missing:
              raise SystemExit(f'unexpected hoist_bins seam; missing {missing!r}')

          replacement = r'''/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
          /// `zed run` and PATH-prepending wrappers find them without polluting the OS
          /// PATH.
          ///
          /// Native/no-shebang bins remain project-owned copies. Unix scripts instead get
          /// a regular project-owned launch shim that invokes the installed package bin in
          /// place. That preserves package-relative imports/resources without chmod'ing a
          /// symlink target that may resolve into the immutable global store.
          #[cfg(unix)]
          fn shell_single_quote(value: &str) -> String {
              format!("'{}'", value.replace('\'', "'\"'\"'"))
          }

          #[cfg(unix)]
          fn unix_shebang(path: &Path) -> Result<Option<(String, Option<String>)>> {
              let file = fs::File::open(path)?;
              let mut reader = std::io::BufReader::new(file);
              let prefix = reader.fill_buf()?;
              if !prefix.starts_with(b"#!") {
                  return Ok(None);
              }
              let end = prefix
                  .iter()
                  .position(|byte| *byte == b'\n')
                  .unwrap_or(prefix.len());
              let line = std::str::from_utf8(&prefix[2..end])
                  .context("package bin shebang must be UTF-8")?
                  .trim_end_matches('\r')
                  .trim();
              if line.is_empty() {
                  bail!("package bin {} has an empty shebang", path.display());
              }
              let mut fields = line.splitn(2, char::is_whitespace);
              let interpreter = fields.next().expect("non-empty shebang").to_string();
              let argument = fields
                  .next()
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .map(str::to_string);
              Ok(Some((interpreter, argument)))
          }

          #[cfg(unix)]
          fn write_unix_bin_shim(
              bin_dir: &Path,
              target: &Path,
              destination: &Path,
              interpreter: &str,
              argument: Option<&str>,
          ) -> Result<()> {
              let relative = pathdiff_relative(bin_dir, target);
              let relative = relative
                  .to_str()
                  .context("package bin path must be UTF-8")?
                  .replace('\\', "/");
              let mut command = format!("exec {}", shell_single_quote(interpreter));
              if let Some(argument) = argument {
                  command.push(' ');
                  command.push_str(&shell_single_quote(argument));
              }
              command.push_str(" \"$bin_dir\"/");
              command.push_str(&shell_single_quote(&relative));
              command.push_str(" \"$@\"\n");
              let shim = format!(
                  "#!/bin/sh\nset -eu\nbin_dir=$(CDPATH= cd -P \"$(dirname \"$0\")\" && pwd)\n{command}"
              );
              fs::write(destination, shim)?;
              Ok(())
          }

          fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()> {
              if bins.is_empty() {
                  return Ok(());
              }
              let bin_dir = modules.join(BIN_DIR);
              fs::create_dir_all(&bin_dir)?;
              for (name, target) in bins {
                  if !target.exists() {
                      eprintln!(
                          "warning: bin `{name}` points at missing {}; skipping",
                          target.display()
                      );
                      continue;
                  }
                  let destination = bin_dir.join(name);
                  replace_dest(&destination)?;
                  #[cfg(unix)]
                  {
                      if let Some((interpreter, argument)) = unix_shebang(target)? {
                          write_unix_bin_shim(
                              &bin_dir,
                              target,
                              &destination,
                              &interpreter,
                              argument.as_deref(),
                          )?;
                      } else {
                          fs::copy(target, &destination)?;
                      }
                      use std::os::unix::fs::PermissionsExt;
                      let mut permissions = fs::metadata(&destination)?.permissions();
                      permissions.set_mode(permissions.mode() | 0o111);
                      fs::set_permissions(&destination, permissions)?;
                  }
                  #[cfg(not(unix))]
                  {
                      fs::copy(target, &destination)?;
                  }
              }
              Ok(())
          }

          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Format and compile the implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --all
          cargo +1.90.0 check --locked --bin zed
          git diff --check

      - name: Commit implementation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git rm .github/workflows/apply-hoisted-bin-fix.yml
          git add src/ops.rs
          git diff --cached --check
          git commit -m 'fix: preserve package-relative hoisted script paths'
          git push origin HEAD:fix/hoisted-bin-relative-imports-20260924
