name: apply hoisted-bin relative-path fix

on:
  push:
    branches: [fix/hoisted-bin-relative-imports-20260924]
    paths:
      - '.github/workflows/apply-hoisted-bin-relative-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact regression-first parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8843a188d75a42c00343b155ff200625a3ffafa5"

      - name: Replace script byte-copy with project-local launcher shim
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops.rs')
          text = path.read_text()
          old = r'''/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
/// `zed run` and PATH-prepending wrappers find them without polluting the OS
/// PATH.
///
/// Hoisted bins are deliberately project-owned copies in both install modes.
/// In symlink mode the package target may resolve into the immutable global
/// store; chmod'ing that target would mutate the shared store inode for every
/// consumer. Copying the usually-small executable and setting permissions on
/// the destination preserves the store while retaining runnable bins.
fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()> {
    if bins.is_empty() {
        return Ok(());
    }
    let bin_dir = modules.join(BIN_DIR);
    fs::create_dir_all(&bin_dir)?;
    for (name, target) in bins {
        if !target.exists() {
            eprintln!(
                "warning: bin `{name}` points at missing {}; skipping",
                target.display()
            );
            continue;
        }
        let destination = bin_dir.join(name);
        replace_dest(&destination)?;
        fs::copy(target, &destination)?;
        #[cfg(unix)]
        {
            use std::os::unix::fs::PermissionsExt;
            let mut permissions = fs::metadata(&destination)?.permissions();
            permissions.set_mode(permissions.mode() | 0o111);
            fs::set_permissions(&destination, permissions)?;
        }
    }
    Ok(())
}
'''
          new = r'''/// Quote one value for a POSIX shell without allowing interpolation.
#[cfg(unix)]
fn shell_single_quote(value: &str) -> String {
    format!("'{}'", value.replace('\'', "'\"'\"'"))
}

/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
/// `zed run` and PATH-prepending wrappers find them without polluting the OS
/// PATH.
///
/// Native executables stay project-owned byte copies. Unix shebang scripts use
/// a project-owned launcher shim instead: copying a script into `.bin` changes
/// `$0` and therefore breaks package-relative imports/resources. The shim
/// invokes the script's declared interpreter against the installed package path
/// while remaining a regular `.bin` file. In symlink mode this also avoids
/// chmod'ing the immutable global-store inode.
fn hoist_bins(modules: &Path, bins: &BTreeMap<String, PathBuf>, _mode: InstallMode) -> Result<()> {
    if bins.is_empty() {
        return Ok(());
    }
    let bin_dir = modules.join(BIN_DIR);
    fs::create_dir_all(&bin_dir)?;
    for (name, target) in bins {
        if !target.exists() {
            eprintln!(
                "warning: bin `{name}` points at missing {}; skipping",
                target.display()
            );
            continue;
        }
        let destination = bin_dir.join(name);
        replace_dest(&destination)?;

        #[cfg(unix)]
        let wrote_script_shim = {
            use std::os::unix::fs::PermissionsExt;

            let mut first_line = Vec::new();
            std::io::BufReader::new(fs::File::open(target)?)
                .read_until(b'\n', &mut first_line)?;
            let shebang = first_line
                .strip_prefix(b"#!")
                .and_then(|line| std::str::from_utf8(line).ok())
                .map(|line| line.trim_end_matches(['\r', '\n']).trim())
                .filter(|line| !line.is_empty());

            if let Some(shebang) = shebang {
                let interpreter_end = shebang
                    .find(char::is_whitespace)
                    .unwrap_or(shebang.len());
                let interpreter = &shebang[..interpreter_end];
                let interpreter_arg = shebang[interpreter_end..].trim();
                let relative_target = pathdiff_relative(&bin_dir, target)
                    .to_string_lossy()
                    .replace('\\', "/");
                let mut launcher = format!(
                    "#!/bin/sh\nset -eu\nscript_dir=${{0%/*}}\nexec {}",
                    shell_single_quote(interpreter)
                );
                if !interpreter_arg.is_empty() {
                    launcher.push(' ');
                    launcher.push_str(&shell_single_quote(interpreter_arg));
                }
                launcher.push_str(" \"$script_dir\"/");
                launcher.push_str(&shell_single_quote(&relative_target));
                launcher.push_str(" \"$@\"\n");
                fs::write(&destination, launcher)?;
                let mut permissions = fs::metadata(&destination)?.permissions();
                permissions.set_mode(permissions.mode() | 0o111);
                fs::set_permissions(&destination, permissions)?;
                true
            } else {
                false
            }
        };

        #[cfg(not(unix))]
        let wrote_script_shim = false;

        if !wrote_script_shim {
            fs::copy(target, &destination)?;
            #[cfg(unix)]
            {
                use std::os::unix::fs::PermissionsExt;
                let mut permissions = fs::metadata(&destination)?.permissions();
                permissions.set_mode(permissions.mode() | 0o111);
                fs::set_permissions(&destination, permissions)?;
            }
        }
    }
    Ok(())
}
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one hoist_bins block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format parse-check
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          cargo +1.90.0 fmt --all -- --check

      - name: Commit only the product fix and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-hoisted-bin-relative-fix.yml
          git diff --check
          git diff --exit-code -- tests/fixtures/docker-install/node-lib/bin/docker-node-tool
          git config user.name 'ORESoftware CI'
          git config user.email 'ci@oresoftware.com'
          git add src/ops.rs
          git commit -m 'fix: preserve package-relative paths in hoisted scripts'
          git push origin HEAD:fix/hoisted-bin-relative-imports-20260924
