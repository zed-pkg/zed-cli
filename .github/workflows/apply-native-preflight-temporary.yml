name: Apply native preflight adapters (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-100-native-preflight-adapters' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          ref: main
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Wire command, docs, flags, and portable tests
        working-directory: zed-cli
        run: python3 scripts/apply_native_preflight_cli.py
      - name: Format and test
        working-directory: zed-cli
        run: |
          cargo fmt --all
          cargo test --locked
      - name: Commit production changes to the feature branch
        working-directory: zed-cli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.rs src/main.rs src/preflight.rs .cli-flags.toml README.md
          if git diff --cached --quiet; then
            echo "Native preflight wiring is already current."
            exit 0
          fi
          git commit -m "feat: expose native release preflight"
          git push origin HEAD:feat/den-100-native-preflight-adapters
