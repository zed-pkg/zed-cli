name: apply offline frozen prefetch repair

on:
  push:
    branches:
      - agent/global-zed-packages-final
    paths:
      - .github/fix_offline_frozen_prefetch.py
      - .github/workflows/apply-offline-frozen-prefetch.yml

permissions:
  contents: read

concurrency:
  group: apply-offline-frozen-prefetch-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out exact global-package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/global-zed-packages-final
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply lock-authoritative frozen prefetch repair
        run: |
          set -euo pipefail
          python3 .github/fix_offline_frozen_prefetch.py
          cargo fmt --all
          git diff --check

      - name: Validate offline replay and recursive installer
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib \
            install_graph::tests::frozen_prefetch_replays_every_locked_artifact_without_registry_metadata \
            -- --exact --nocapture
          cargo test --locked --lib install_graph::tests
          cargo test --locked --lib global::tests
          cargo test --locked --test global_cli
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit validated ordinary source and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src/install_graph/resolver.rs src/install_graph/tests.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore frozen installs without registry metadata'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/global-zed-packages-final
