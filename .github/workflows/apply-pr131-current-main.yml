name: apply PR 131 current-main repair

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main

permissions:
  contents: write

concurrency:
  group: pr131-current-main-repair
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Restore current-main ownership and compose exporter dispatch
        run: |
          set -euo pipefail
          git fetch origin main
          cp src/main.rs "$RUNNER_TEMP/exporter-main.rs"

          git checkout origin/main -- \
            src/project_lock.rs \
            src/git_submodules/cli.rs \
            src/main.rs

          python3 - <<'PY'
          import os
          from pathlib import Path

          exporter = Path(os.environ['RUNNER_TEMP'], 'exporter-main.rs').read_text(encoding='utf-8')
          target_path = Path('src/main.rs')
          target = target_path.read_text(encoding='utf-8')

          import_line = 'use zed_cli::mise_export::{self, MiseExportMode};\n'
          if import_line not in target:
              anchor = 'use zed_cli::managed_install;\n'
              if target.count(anchor) != 1:
                  raise SystemExit(f'expected one managed_install import, found {target.count(anchor)}')
              target = target.replace(anchor, anchor + import_line, 1)

          start_marker = '            EnvCmd::Export {\n'
          end_marker = '            EnvCmd::Verify {\n'
          start = exporter.find(start_marker)
          if start < 0:
              raise SystemExit('exporter branch has no EnvCmd::Export arm')
          end = exporter.find(end_marker, start)
          if end < 0:
              raise SystemExit('could not find EnvCmd::Verify after exporter arm')
          export_block = exporter[start:end]

          if start_marker not in target:
              insert = target.find(end_marker)
              if insert < 0:
                  raise SystemExit('current main has no EnvCmd::Verify insertion anchor')
              target = target[:insert] + export_block + target[insert:]

          target_path.write_text(target, encoding='utf-8')
          PY

          rm .github/workflows/apply-pr131-current-main.yml

          cargo fmt --all
          git diff --check
          cargo test --locked mise_export
          cargo test --locked --test mise_export_api_boundaries
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo test --locked project_lock
          cargo test --locked git_submodules
          cargo test --locked cli::tests::environment_export_is_typed_and_rejects_ambiguous_write_modes
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo test --locked cli::tests::readme_documents_every_command
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Merge current main into deterministic mise exporter'
          git push origin HEAD:agent/den-1462-mise-export-current-main
