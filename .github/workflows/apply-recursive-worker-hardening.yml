name: apply recursive worker hardening

on:
  push:
    branches:
      - agent/recursive-worker-hardening

permissions:
  contents: read

concurrency:
  group: apply-recursive-worker-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out worker-hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-worker-hardening
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply exact worker-hardening patch
        run: |
          set -euo pipefail
          python3 .github/harden_recursive_workers.py
          cargo fmt --all
          git diff --check

      - name: Validate panic conversion and failed-download cleanup
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo test --locked --lib \
            install_graph::tests::worker_panics_are_reported_without_losing_the_task_sequence \
            -- --nocapture
          cargo test --locked --lib \
            install_graph::tests::failed_downloads_remove_staging_files_and_never_publish_cache_entries \
            -- --nocapture
          cargo test --locked --lib install_graph::tests
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit validated code and remove bootstrap files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/harden_recursive_workers.py \
            .github/workflows/apply-recursive-worker-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: surface recursive worker panics'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/recursive-worker-hardening
