name: Apply GitHub Release API metadata patch

on:
  push:
    branches:
      - agent/github-release-sidecar-20260901
    paths:
      - .agent/release-api-metadata.patch
      - .github/workflows/apply-release-api-metadata-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[release-api-metadata-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/github-release-sidecar-20260901
          fetch-depth: 0

      - name: Apply, format, and commit focused source patch
        run: |
          set -euo pipefail
          git apply --check .agent/release-api-metadata.patch
          git apply --whitespace=fix .agent/release-api-metadata.patch
          cargo fmt -- src/source_fallback.rs src/github_mirror.rs
          rm .agent/release-api-metadata.patch
          rm .github/workflows/apply-release-api-metadata-patch.yml
          rmdir .agent 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(resolve): recover metadata from GitHub Release assets [release-api-metadata-applied]'
          git push origin HEAD:agent/github-release-sidecar-20260901
