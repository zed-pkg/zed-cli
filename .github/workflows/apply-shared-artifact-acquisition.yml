name: apply shared artifact acquisition

on:
  push:
    branches:
      - agent/recursive-install-queue

permissions:
  contents: read

concurrency:
  group: apply-shared-artifact-acquisition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out recursive installer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/recursive-install-queue
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply exact shared-acquisition patch
        run: |
          set -euo pipefail
          python3 .github/unify_artifact_acquisition.py
          cargo fmt --all
          git diff --check

      - name: Validate mixed and recursive acquisition paths
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo test --locked --lib \
            install_graph::tests::legacy_and_recursive_acquisition_paths_share_one_download_lock \
            -- --nocapture
          cargo test --locked --lib install_graph::tests
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit validated code and remove bootstrap files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/unify_artifact_acquisition.py \
            .github/workflows/apply-shared-artifact-acquisition.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify artifact acquisition locks'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:agent/recursive-install-queue
