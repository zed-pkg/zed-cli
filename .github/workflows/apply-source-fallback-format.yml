name: Apply source fallback formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-source-fallback-format.yml"
      - "src/source_fallback.rs"

permissions:
  contents: write

concurrency:
  group: apply-source-fallback-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge current main, format, verify, and push source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          cargo fmt --all
          cargo fmt --all -- --check
          git add -A
          git diff --cached --check
          git commit -m 'style(resolve): format fallback metadata recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
