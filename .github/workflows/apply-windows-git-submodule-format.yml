name: apply Windows git-submodule test formatting

on:
  push:
    branches:
      - fix/windows-git-submodule-test-cfg
    paths:
      - .github/workflows/apply-windows-git-submodule-format.yml

permissions:
  contents: write

concurrency:
  group: windows-git-submodule-test-format-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/windows-git-submodule-test-cfg
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply canonical import order and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/git_submodules/tests.rs')
          text = path.read_text(encoding='utf-8')
          old = '''use super::git::{WorkspaceMember, generated_consumer_manifest, validate_relative_path};
          use super::lock::{
              GitSubmoduleLock, active_workspace_packages, read_lock_extensions, write_lock_extensions,
          };
          #[cfg(unix)]
          use super::lock::prepare_install;
          '''
          new = '''use super::git::{WorkspaceMember, generated_consumer_manifest, validate_relative_path};
          #[cfg(unix)]
          use super::lock::prepare_install;
          use super::lock::{
              GitSubmoduleLock, active_workspace_packages, read_lock_extensions, write_lock_extensions,
          };
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked --lib git_submodules::tests
          cargo clippy --locked --all-targets -- -D warnings

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/git_submodules/tests.rs
          git commit -m 'fix: format Windows git-submodule test guards'
          git push origin HEAD:fix/windows-git-submodule-test-cfg
