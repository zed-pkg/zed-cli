name: Apply Windows portability product once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-windows-portability-product-once.yml'

permissions:
  contents: write

concurrency:
  group: apply-windows-portability-product-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-3020-cli-portability'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3020-cli-portability
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply the reviewed product-only repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          @'
          from pathlib import Path

          carrier = Path('.github/workflows/fix-windows-copy-mode-once.yml')
          lines = carrier.read_text(encoding='utf-8').splitlines()
          step = lines.index('      - name: Apply the bounded Windows portability repair')
          run_line = lines.index('        run: |', step + 1)
          next_step = lines.index('      - name: Install the pinned Rust toolchain', run_line + 1)
          block = lines[run_line + 1:next_step]
          opener = next(index for index, line in enumerate(block) if line.strip() == "@'")
          terminator = next(
              index for index, line in enumerate(block)
              if index > opener and line.strip() == "'@ | python -"
          )
          prefix = '          '
          script_lines = block[opener + 1:terminator]
          if any(line and not line.startswith(prefix) for line in script_lines):
              raise SystemExit('reviewed Windows repair indentation drifted')
          script = '\n'.join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in script_lines
          ) + '\n'
          unlink = "Path('.github/workflows/fix-windows-copy-mode-once.yml').unlink()\n"
          if script.count(unlink) != 1:
              raise SystemExit('reviewed writer cleanup boundary drifted')
          script = script.replace(unlink, '', 1)
          exec(compile(script, str(carrier), 'exec'), {'__name__': '__main__'})

          fetch = Path('src/fetch.rs')
          source = fetch.read_text(encoding='utf-8')
          anchor = (
              '        let path = url.to_file_path().map_err(|_| {\n'
              '            anyhow::anyhow!("frozen file registry source is not a local absolute path")\n'
              '        })?;\n'
          )
          replacement = (
              '        if url.host_str().is_some() {\n'
              '            bail!("frozen file registry source is not a local absolute path");\n'
              '        }\n'
              + anchor
          )
          if source.count(anchor) != 1:
              raise SystemExit('file registry URL conversion boundary drifted')
          fetch.write_text(source.replace(anchor, replacement, 1), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Windows portability product transform failed with exit code $LASTEXITCODE"
          }
          git diff --check

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate focused and complete Windows behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --test e2e bins_are_hoisted_and_runnable -- --nocapture
          cargo test --locked --test e2e publish_install_roundtrip_with_transitive_deps -- --nocapture
          cargo test --locked --test e2e workspace_members_link_from_source -- --nocapture
          cargo test --locked --test e2e workspace_installs_members_against_one_lock -- --nocapture
          cargo test --locked --test frozen_fetch_boundaries -- --nocapture
          cargo test --locked --all-targets -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit only the three permanent product files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          git diff --check
          $allowed = @('src/fetch.rs', 'src/ops.rs', 'tests/e2e.rs') | Sort-Object
          $changed = @(git diff --name-only | Sort-Object)
          if (Compare-Object $changed $allowed) {
            throw "unexpected worktree paths: $($changed -join ', ')"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $allowed
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (Compare-Object $staged $allowed) {
            throw "unexpected staged paths: $($staged -join ', ')"
          }
          git commit -m 'fix(DEN-3020): support Windows copy mode and hoisted scripts'
          git push origin HEAD:agent/den-3020-cli-portability
