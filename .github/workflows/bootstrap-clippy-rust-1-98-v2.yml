name: bootstrap Rust 1.98 Clippy baseline repair v2

on:
  push:
    branches:
      - fix/clippy-rust-1-98
    paths:
      - .github/workflows/bootstrap-clippy-rust-1-98-v2.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-clippy-rust-1-98-v2
  cancel-in-progress: false

jobs:
  repair-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/clippy-rust-1-98
          fetch-depth: 0

      - name: Install Rust 1.98 with formatter and linter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy

      - name: Apply semantic Clippy repairs with test-scoped imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for:\n{old}')
              file.write_text(source.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'src/binary_archive.rs',
              'use crate::registry::registry_for;\n',
              '#[cfg(test)]\nuse crate::registry::registry_for;\n',
          )
          replace_once(
              'src/install_graph.rs',
              'use crate::registry::{Registry, registry_for};\n',
              'use crate::registry::Registry;\n#[cfg(test)]\nuse crate::registry::registry_for;\n',
          )
          replace_once(
              'src/publisher_keys.rs',
              '''    fn a_pin_refuses_a_different_key_from_the_same_org() {
                  let (stored, public) = key_pair("acme-2026");
          ''',
              '''    fn a_pin_refuses_a_different_key_from_the_same_org() {
                  let (_stored, public) = key_pair("acme-2026");
          ''',
          )
          replace_once(
              'src/binary_archive/registry_io.rs',
              '''enum ResolvedBinaryMetadata {
              Legacy(VersionMetadata),
              Qualified(Box<BinaryArtifactMetadataV1>),
          }
          ''',
              '''enum ResolvedBinaryMetadata {
              Legacy(Box<VersionMetadata>),
              Qualified(Box<BinaryArtifactMetadataV1>),
          }
          ''',
          )
          replace_once(
              'src/binary_archive/registry_io.rs',
              '''        BinaryRegistryRoute::Legacy => registry
                      .get_version(org, name, version)
                      .map(ResolvedBinaryMetadata::Legacy),
          ''',
              '''        BinaryRegistryRoute::Legacy => registry
                      .get_version(org, name, version)
                      .map(Box::new)
                      .map(ResolvedBinaryMetadata::Legacy),
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '''struct ReleaseAsset {
              id: u64,
              name: String,
              #[serde(default)]
              size: u64,
          }
          ''',
              '''struct ReleaseAsset {
              id: u64,
              name: String,
              #[serde(default)]
              size: u64,
          }

          #[derive(Debug, Clone, Copy)]
          struct AssetUploadOptions<'a> {
              content_type: &'a str,
              replace: Replace,
          }
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '''            &fs::read(artifact).with_context(|| format!("reading {}", artifact.display()))?,
                      "application/octet-stream",
                      // Digest-named: identical name plus identical size means identical
                      // bytes, so an existing asset is already correct.
                      Replace::OnlyIfDifferentSize,
          ''',
              '''            &fs::read(artifact).with_context(|| format!("reading {}", artifact.display()))?,
                      // Digest-named: identical name plus identical size means identical
                      // bytes, so an existing asset is already correct.
                      AssetUploadOptions {
                          content_type: "application/octet-stream",
                          replace: Replace::OnlyIfDifferentSize,
                      },
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '''            &metadata_asset,
                      &metadata_bytes,
                      "application/json",
                      // Not digest-named, and a re-publish may add mirrors or a second
                      // signature. Always take the newer document.
                      Replace::Always,
          ''',
              '''            &metadata_asset,
                      &metadata_bytes,
                      // Not digest-named, and a re-publish may add mirrors or a second
                      // signature. Always take the newer document.
                      AssetUploadOptions {
                          content_type: "application/json",
                          replace: Replace::Always,
                      },
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '''                &serde_json::to_vec_pretty(index)?,
                          "application/json",
                          Replace::Always,
          ''',
              '''                &serde_json::to_vec_pretty(index)?,
                          AssetUploadOptions {
                              content_type: "application/json",
                              replace: Replace::Always,
                          },
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '''        bytes: &[u8],
                  content_type: &str,
                  replace: Replace,
              ) -> Result<ForgeUpload> {
          ''',
              '''        bytes: &[u8],
                  options: AssetUploadOptions<'_>,
              ) -> Result<ForgeUpload> {
          ''',
          )
          replace_once(
              'src/forge_publish.rs',
              '            match replace {\n',
              '            match options.replace {\n',
          )
          replace_once(
              'src/forge_publish.rs',
              '            .header("Content-Type", content_type)\n',
              '            .header("Content-Type", options.content_type)\n',
          )
          replace_once(
              'src/mirror_cmd.rs',
              '''use crate::registry::max_artifact_bytes;

          pub fn run_mirror(cwd: &Path, cfg: &Config, cmd: MirrorCmd) -> Result<()> {
          ''',
              '''use crate::registry::max_artifact_bytes;

          type PackageMirrors = BTreeMap<String, Vec<MirrorDescriptorV1>>;
          type ProjectMirrors = (Vec<MirrorDescriptorV1>, PackageMirrors);

          pub fn run_mirror(cwd: &Path, cfg: &Config, cmd: MirrorCmd) -> Result<()> {
          ''',
          )
          replace_once(
              'src/mirror_cmd.rs',
              '''fn project_mirrors(
              cwd: &Path,
              cfg: &Config,
          ) -> Result<(
              Vec<MirrorDescriptorV1>,
              BTreeMap<String, Vec<MirrorDescriptorV1>>,
          )> {
          ''',
              '''fn project_mirrors(cwd: &Path, cfg: &Config) -> Result<ProjectMirrors> {
          ''',
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/binary_archive.rs \
            src/binary_archive/registry_io.rs \
            src/forge_publish.rs \
            src/install_graph.rs \
            src/mirror_cmd.rs \
            src/publisher_keys.rs | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected Clippy-repair boundary:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Prove all stable-toolchain targets are clean
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --nocapture

      - name: Commit only the semantic source repairs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-clippy-rust-1-98.yml
          rm .github/workflows/bootstrap-clippy-rust-1-98-v2.yml
          git add \
            src/binary_archive.rs \
            src/binary_archive/registry_io.rs \
            src/forge_publish.rs \
            src/install_graph.rs \
            src/mirror_cmd.rs \
            src/publisher_keys.rs \
            .github/workflows/bootstrap-clippy-rust-1-98.yml \
            .github/workflows/bootstrap-clippy-rust-1-98-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(clippy): clean the Rust 1.98 baseline'
          git push origin HEAD:fix/clippy-rust-1-98
