name: bootstrap current-main rustfmt repair v2

on:
  push:
    branches:
      - fix/rustfmt-current-main
    paths:
      - .github/workflows/bootstrap-rustfmt-current-main-v2.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-rustfmt-current-main-v2
  cancel-in-progress: false

jobs:
  format-check-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/rustfmt-current-main
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt and prove the exact boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/github_packages.rs \
            src/lib.rs \
            src/ops.rs | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected rustfmt boundary:\n%s\n' "$actual" >&2
            exit 1
          fi

      - name: Compile every formatted target
        run: cargo check --locked --all-targets

      - name: Commit only the formatting repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-rustfmt-current-main.yml
          rm .github/workflows/bootstrap-rustfmt-current-main-v2.yml
          git add src/github_packages.rs src/lib.rs src/ops.rs \
            .github/workflows/bootstrap-rustfmt-current-main.yml \
            .github/workflows/bootstrap-rustfmt-current-main-v2.yml
          git diff --cached --check
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/bootstrap-rustfmt-current-main-v2.yml \
            .github/workflows/bootstrap-rustfmt-current-main.yml \
            src/github_packages.rs \
            src/lib.rs \
            src/ops.rs | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected staged boundary:\n%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(rust): format current main'
          git push origin HEAD:fix/rustfmt-current-main
