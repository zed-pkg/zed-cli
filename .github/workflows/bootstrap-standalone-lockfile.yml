name: bootstrap standalone dependency lock

on:
  push:
    branches:
      - agent/standalone-install-r2g

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Regenerate only Cargo.lock and commit it to this branch
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = "Cargo.lock"
          git commit -m "chore: lock standalone zed-interfaces source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
