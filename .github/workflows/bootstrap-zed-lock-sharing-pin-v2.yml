name: bootstrap exact zed-lock sharing-violation pin v2

on:
  push:
    branches:
      - fix/pin-zed-lock-sharing-violation
    paths:
      - .github/workflows/bootstrap-zed-lock-sharing-pin-v2.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-zed-lock-sharing-pin-v2
  cancel-in-progress: false

jobs:
  stack-update-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pin-zed-lock-sharing-violation
          fetch-depth: 0

      - name: Install Rust validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Stack the formatting baseline without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/rustfmt-current-main
          git merge --no-edit origin/fix/rustfmt-current-main

      - name: Pin the exact zed-lock candidate and refresh Cargo.lock
        shell: bash
        env:
          OLD_ZED_LOCK: 1db0da00d30fcf2e0762f50eedb1f88458020b52
          NEW_ZED_LOCK: 1a95bb87272ac7b08895cea1f61743cf40321213
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('Cargo.toml')
          source = path.read_text(encoding='utf-8')
          old = os.environ['OLD_ZED_LOCK']
          new = os.environ['NEW_ZED_LOCK']
          old_comment = '# Includes the Windows ERROR_LOCK_VIOLATION contention normalization certified by DEN-3167.\n'
          new_comment = '# Includes Windows ERROR_SHARING_VIOLATION and ERROR_LOCK_VIOLATION contention normalization.\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one zed-lock pin at {old}')
          if source.count(old_comment) != 1:
              raise SystemExit('expected exactly one current zed-lock provenance comment')
          source = source.replace(old_comment, new_comment).replace(old, new)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY
          cargo update -p zed-lock --precise "$NEW_ZED_LOCK"
          grep -Fq "rev = \"$NEW_ZED_LOCK\"" Cargo.toml
          grep -Fq "#$NEW_ZED_LOCK" Cargo.lock
          ! grep -Fq "$OLD_ZED_LOCK" Cargo.toml
          ! grep -Fq "#$OLD_ZED_LOCK" Cargo.lock
          cargo fmt --all -- --check
          git diff --check

      - name: Exercise lock consumers and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib project_lock -- --nocapture
          cargo test --locked --lib store::tests::install_process_lock_blocks_without_polling_until_owner_release -- --exact --nocapture
          cargo test --locked --lib store::tests::install_process_lock_is_released_when_owner_process_is_terminated -- --exact --nocapture
          cargo check --locked --all-targets

      - name: Commit only the dependency pin above the formatting baseline
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-zed-lock-sharing-pin.yml
          rm .github/workflows/bootstrap-zed-lock-sharing-pin-v2.yml
          git add Cargo.toml Cargo.lock \
            .github/workflows/bootstrap-zed-lock-sharing-pin.yml \
            .github/workflows/bootstrap-zed-lock-sharing-pin-v2.yml
          git diff --cached --check
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/bootstrap-zed-lock-sharing-pin-v2.yml \
            .github/workflows/bootstrap-zed-lock-sharing-pin.yml \
            Cargo.lock \
            Cargo.toml | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'unexpected staged boundary:\n%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m 'fix(lock): pin sharing-violation contention normalization'
          git push origin HEAD:fix/pin-zed-lock-sharing-violation
