name: temporary branch fixup

on:
  push:
    branches: ["den-3282-source-composition-current-main-20260918"]
    paths: [".github/workflows/branch-fixup.yml"]

permissions:
  contents: write

jobs:
  regenerate-interface-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: den-3282-source-composition-current-main-20260918
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Regenerate exact merged interface lock
        run: |
          set -euo pipefail
          grep -F 'rev = "aa0f87be13cdf003600b42a6088202898fcbae8d"' Cargo.toml
          cargo update -p zed-interfaces --precise aa0f87be13cdf003600b42a6088202898fcbae8d
          cargo fmt --all -- --check
          cargo check --locked --lib
          grep -F 'aa0f87be13cdf003600b42a6088202898fcbae8d' Cargo.lock
      - name: Commit generated lock and restore workflow state
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/branch-fixup.yml > .github/workflows/branch-fixup.yml
          rm -f .github/workflows/den-3282-interface-pin-fixup.yml
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add Cargo.lock .github/workflows/branch-fixup.yml .github/workflows/den-3282-interface-pin-fixup.yml
          git commit -m "DEN-3282: regenerate lock for merged interface contract"
          git push origin HEAD:den-3282-source-composition-current-main-20260918
