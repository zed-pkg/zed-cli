name: canonical-zpkg-edge-fixup

on:
  push:
    branches:
      - fix/github-source-archive-fallback
    paths:
      - .github/workflows/canonical-zpkg-edge-fixup.yml

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/github-source-archive-fallback
      - name: Canonicalize legacy registry default at the transport boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/registry.rs")
          text = path.read_text()
          old = '''pub fn registry_for(url: &str) -> Result<Box<dyn Registry>> {
              if url.starts_with("file://") {
                  Ok(Box::new(FileRegistry::new(file_registry_path(url)?)))
              } else if url.starts_with("http://") || url.starts_with("https://") {
                  let http = HttpRegistry::new(url.to_string())?;
                  Ok(crate::source_fallback::FallbackRegistry::wrap(http, url))
              } else {
                  bail!("unsupported registry url `{url}` (expected http(s):// or file://)");
              }
          }
          '''
          new = '''const LEGACY_PUBLIC_REGISTRY_URL: &str = "https://registry.zpkg.net";
          const CANONICAL_PUBLIC_REGISTRY_URL: &str = "https://zpkg.net";

          fn canonical_registry_url(url: &str) -> &str {
              if url.trim_end_matches('/') == LEGACY_PUBLIC_REGISTRY_URL {
                  CANONICAL_PUBLIC_REGISTRY_URL
              } else {
                  url
              }
          }

          pub fn registry_for(url: &str) -> Result<Box<dyn Registry>> {
              let url = canonical_registry_url(url);
              if url.starts_with("file://") {
                  Ok(Box::new(FileRegistry::new(file_registry_path(url)?)))
              } else if url.starts_with("http://") || url.starts_with("https://") {
                  let http = HttpRegistry::new(url.to_string())?;
                  Ok(crate::source_fallback::FallbackRegistry::wrap(http, url))
              } else {
                  bail!("unsupported registry url `{url}` (expected http(s):// or file://)");
              }
          }

          #[cfg(test)]
          #[test]
          fn legacy_public_registry_alias_uses_the_canonical_zpkg_edge() {
              assert_eq!(
                  canonical_registry_url("https://registry.zpkg.net"),
                  "https://zpkg.net"
              );
              assert_eq!(
                  canonical_registry_url("https://registry.zpkg.net/"),
                  "https://zpkg.net"
              );
              assert_eq!(
                  canonical_registry_url("https://registry.example.test"),
                  "https://registry.example.test"
              );
          }
          '''
          if old not in text:
              raise SystemExit("registry_for block did not match expected authority")
          path.write_text(text.replace(old, new, 1))
      - name: Verify scoped change
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test "$(git diff --name-only)" = "src/registry.rs"
          git diff -- src/registry.rs
      - name: Commit transport routing
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/registry.rs
          git commit -m "fix(registry): route legacy public default through zpkg.net"
          git push origin HEAD:fix/github-source-archive-fallback
