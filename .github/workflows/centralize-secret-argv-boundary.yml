name: Centralize secret argv boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  centralize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/DEN-390-centralize-secret-argv-boundary'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Remove duplicate startup policy in Rust
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dedup-secret-argv.rs <<'RS'
          use std::{fs, path::Path};

          fn replace_once(mut source: String, needle: &str, replacement: &str) -> String {
              let count = source.match_indices(needle).count();
              assert_eq!(count, 1, "expected exactly one source fragment, found {count}");
              source = source.replacen(needle, replacement, 1);
              source
          }

          fn main() {
              let path = Path::new("src/main.rs");
              let source = fs::read_to_string(path).expect("read src/main.rs");
              let call = r#"    if let Some((option, env)) = rejected_secret_argv_option(&args) {
                  eprintln!(
                      "error: {option} is not accepted because secret-bearing values must not be passed through argv; set {env} in the environment or use an authenticated session instead"
                  );
                  std::process::exit(2);
              }
          "#;
              let function = r#"fn rejected_secret_argv_option(args: &[OsString]) -> Option<(&'static str, &'static str)> {
              const SECRET_OPTIONS: &[(&str, &str)] = &[
                  ("--token", "ZED_PKG_TOKEN"),
                  ("--zed-pkg-auth-password", "ZED_PKG_AUTH_PASSWORD"),
              ];

              args.iter().skip(1).find_map(|argument| {
                  let token = argument.to_string_lossy();
                  SECRET_OPTIONS.iter().find_map(|(option, env)| {
                      (token == *option
                          || token
                              .strip_prefix(option)
                              .is_some_and(|remainder| remainder.starts_with('=')))
                      .then_some((*option, *env))
                  })
              })
          }

          "#;
              let source = replace_once(source, call, "");
              let source = replace_once(source, function, "");
              fs::write(path, source).expect("write src/main.rs");
          }
          RS
          rustc /tmp/dedup-secret-argv.rs -o /tmp/dedup-secret-argv
          /tmp/dedup-secret-argv
          cargo fmt --all
          ! grep -Fq 'fn rejected_secret_argv_option' src/main.rs
          ! grep -Fq 'rejected_secret_argv_option(&args)' src/main.rs
          test "$(grep -F -c 'fn rejected_secret_argv_option' src/cli_model.rs)" -eq 1
          test "$(grep -F -c '("--token", "ZED_PKG_TOKEN")' src/cli_model.rs)" -eq 1
          test "$(grep -F -c '("--zed-pkg-auth-password", "ZED_PKG_AUTH_PASSWORD")' src/cli_model.rs)" -eq 1

      - name: Prove the single admission boundary
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test secret_argv_boundary
          cargo test --locked cli_model::tests::secret_argv_is_rejected_before_early_dispatch
          cargo test --locked inspect_cli::secret_argv_cannot_bypass_rejection_via_inspect_early_dispatch || true
          cargo clippy --locked --all-targets -- -D warnings

      - name: Admit only main.rs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/main.rs'

      - name: Commit centralized boundary
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'refactor: centralize secret argv admission boundary'
          git push origin "HEAD:${BRANCH}"
