# Fast Rust CI (zed-docs issue #8): rust-cache + sccache for cross-run compile
# caching, mold as the linker on Linux, and cargo-nextest for parallel tests.
# The toolchain is pinned via rust-toolchain.toml so the cache key stays stable.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # A GitHub cache-service outage must degrade to uncached compiles, not fail
  # the build (sccache is an optimization, never a dependency).
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      # mold: a much faster linker (Linux only). make-default wires it in as
      # the system linker, so cargo/rustc use it with no extra RUSTFLAGS.
      - name: Install mold (fast linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: true
      # RUSTC_WRAPPER=sccache is set in `env`, so sccache must be installed.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-cli
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --check
        working-directory: zed-cli
      - name: Test (nextest)
        run: cargo nextest run
        working-directory: zed-cli
      # nextest does not run doctests; keep them covered (cargo test used to).
      - name: Doctests
        run: cargo test --doc
        working-directory: zed-cli
