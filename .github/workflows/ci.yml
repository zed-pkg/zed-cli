# Fast Rust CI (zed-docs issue #8): rust-cache for cross-run compile caching,
# mold as the linker on Linux, and cargo-nextest for parallel tests.
# The toolchain is pinned via rust-toolchain.toml so the cache key stays stable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: cda6849b6a95b582554fcadc7a882e99c5018989
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install mold (fast linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-cli
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Format
        run: cargo fmt --check
        working-directory: zed-cli
      - name: Test (nextest)
        run: cargo nextest run
        working-directory: zed-cli
      - name: Doctests
        run: cargo test --doc
        working-directory: zed-cli
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
        working-directory: zed-cli

  docker-install:
    name: Docker install boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: cda6849b6a95b582554fcadc7a882e99c5018989
          path: zed-interfaces
      - name: Build a container with the zed CLI
        run: |
          docker build \
            --file zed-cli/.github/docker/install-test.Dockerfile \
            --tag zed-pkg/install-test \
            .
      - name: Prepare hermetic fixtures
        run: |
          cp -R zed-cli/tests/fixtures/docker-install "$RUNNER_TEMP/fixtures"
          mkdir -p "$RUNNER_TEMP/registry" "$RUNNER_TEMP/zed-home"
      - name: Publish the zed-pkg fixture inside Docker
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-lib:/package" \
            --volume "$RUNNER_TEMP/registry:/registry" \
            --workdir /package \
            zed-pkg/install-test \
            zed publish --registry file:///registry --skip-vcs-checks
      - name: Symlink install works when the store is mounted
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            sh -euc '
              zed install \
                --registry file:///registry \
                --home /zed-home \
                --install-mode symlink
              test -L .vendor/.zed/zed-pkg/docker-node-lib
              test -L node_modules/@zed-pkg/docker-node-lib
              node src/main.js
            '
      - name: Store-backed links do not cross an unmounted boundary
        run: |
          if docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work:ro" \
            --workdir /work \
            node:22-bookworm-slim \
            node src/main.js
          then
            echo "expected the unmounted store-backed symlinks to fail"
            exit 1
          fi
      - name: Frozen copy install is self-contained
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            sh -euc '
              zed install \
                --frozen \
                --registry file:///registry \
                --home /zed-home \
                --install-mode copy
              test ! -L .vendor/.zed/zed-pkg/docker-node-lib
              test ! -L node_modules/@zed-pkg/docker-node-lib
              test -z "$(find .vendor/.zed node_modules/@zed-pkg -type l -print -quit)"
              node src/main.js
            '
      - name: Copy install runs in a fresh runtime container
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work:ro" \
            --workdir /work \
            node:22-bookworm-slim \
            node src/main.js

      - name: Uninstall removes materialized files but retains the lock
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed uninstall --home /zed-home
          test -f "$RUNNER_TEMP/fixtures/node-app/.zpkg.lock"
          test ! -e "$RUNNER_TEMP/fixtures/node-app/.vendor/.zed"
          test ! -e "$RUNNER_TEMP/fixtures/node-app/node_modules/@zed-pkg/docker-node-lib"
          test ! -e "$RUNNER_TEMP/fixtures/node-app/.zpkg-staging"

      - name: Frozen reinstall is the exact inverse of uninstall
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-app:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            sh -euc '
              zed install \
                --frozen \
                --registry file:///registry \
                --home /zed-home \
                --install-mode copy
              node src/main.js
            '
          test ! -e "$RUNNER_TEMP/fixtures/node-app/.zpkg-staging"

      - name: Interactive checkpoints fail closed and hard exits recover
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker create zed-pkg/install-test)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/bin/zed" "$RUNNER_TEMP/zed"
          chmod +x "$RUNNER_TEMP/zed"
          app="$RUNNER_TEMP/fixtures/node-app"

          if printf 'yes\n' | (
            cd "$app"
            "$RUNNER_TEMP/zed" --interactive --home "$RUNNER_TEMP/zed-home" uninstall
          ); then
            echo "redirected stdin unexpectedly satisfied --interactive" >&2
            exit 1
          fi
          test -d "$app/.vendor/.zed/zed-pkg/docker-node-lib"
          test ! -e "$app/.zpkg-staging"

          (
            cd "$app"
            python3 "$GITHUB_WORKSPACE/zed-cli/tests/interactive_pty.py" kill-after=2 -- \
              "$RUNNER_TEMP/zed" --interactive \
                --registry "file://$RUNNER_TEMP/registry" \
                --home "$RUNNER_TEMP/zed-home" \
                install --frozen --install-mode copy
          )
          test -d "$app/.zpkg-staging"

          (
            cd "$app"
            "$RUNNER_TEMP/zed" \
              --registry "file://$RUNNER_TEMP/registry" \
              --home "$RUNNER_TEMP/zed-home" \
              install --frozen --install-mode copy
            python3 "$GITHUB_WORKSPACE/zed-cli/tests/interactive_pty.py" yes -- \
              "$RUNNER_TEMP/zed" --interactive \
                --registry "file://$RUNNER_TEMP/registry" \
                --home "$RUNNER_TEMP/zed-home" \
                install --frozen --install-mode copy
            node src/main.js
          )
          test ! -e "$app/.zpkg-staging"

      - name: r2g proves the packed library on the host and in OCI
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker create zed-pkg/install-test)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/local/bin/zed" "$RUNNER_TEMP/zed"
          chmod +x "$RUNNER_TEMP/zed"

          (
            cd "$RUNNER_TEMP/fixtures/node-lib"
            "$RUNNER_TEMP/zed" \
              --home "$RUNNER_TEMP/r2g-home" \
              r2g --r2g-root "$RUNNER_TEMP/r2g-host"
            "$RUNNER_TEMP/zed" \
              --home "$RUNNER_TEMP/r2g-home" \
              r2g --docker --image node:22-bookworm-slim \
              --r2g-root "$RUNNER_TEMP/r2g-oci"
          )
          test "$(find "$RUNNER_TEMP/r2g-host" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/r2g-oci" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          find "$RUNNER_TEMP/r2g-host" "$RUNNER_TEMP/r2g-oci" \
            -mindepth 1 -maxdepth 1 -type d -print \
            | grep -Eq '[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  cross-org-lifecycle:
    name: zed-pkg-test ${{ matrix.ecosystem }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [node, rust]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ECOSYSTEM: ${{ matrix.ecosystem }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: cda6849b6a95b582554fcadc7a882e99c5018989
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg-test/${{ matrix.ecosystem }}-lib
          path: fixture-lib
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg-test/${{ matrix.ecosystem }}-app
          path: fixture-app
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-cli

      - name: Build the current zed CLI
        working-directory: zed-cli
        run: cargo build --release --locked --bin zed

      - name: Verify, publish, and r2g the real library on the host
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          registry="$RUNNER_TEMP/registry"
          home="$RUNNER_TEMP/zed-home"
          mkdir -p "$registry" "$home"
          case "$ECOSYSTEM" in
            node) (cd fixture-lib && npm test) ;;
            rust)
              cp -R fixture-lib "$RUNNER_TEMP/rust-lib-test"
              (cd "$RUNNER_TEMP/rust-lib-test" && cargo test --all-targets)
              ;;
          esac
          (
            cd fixture-lib
            "$zed" --registry "file://$registry" publish --skip-vcs-checks
            "$zed" --home "$home" r2g --r2g-root "$RUNNER_TEMP/r2g-host"
          )

      - name: Host install, uninstall, and frozen reinstall
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          registry="$RUNNER_TEMP/registry"
          home="$RUNNER_TEMP/zed-home"
          package="zed-pkg-test/$ECOSYSTEM-lib"
          (
            cd fixture-app
            "$zed" --registry "file://$registry" --home "$home" \
              install --install-mode symlink
            case "$ECOSYSTEM" in
              node) npm start ;;
              rust) CARGO_TARGET_DIR="$RUNNER_TEMP/host-target" cargo run --quiet ;;
            esac
            "$zed" --home "$home" uninstall
            test -f .zpkg.lock
            test ! -e ".vendor/.zed/$package"
            test ! -e .zpkg-staging
            "$zed" --registry "file://$registry" --home "$home" \
              install --frozen --install-mode copy
            test ! -L ".vendor/.zed/$package"
            case "$ECOSYSTEM" in
              node)
                test ! -L "node_modules/@zed-pkg-test/$ECOSYSTEM-lib"
                npm start
                ;;
              rust) CARGO_TARGET_DIR="$RUNNER_TEMP/host-target" cargo run --quiet ;;
            esac
          )

      - name: r2g the real library in a fresh OCI runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          image="node:22-bookworm-slim"
          if [[ "$ECOSYSTEM" == rust ]]; then image="rust:bookworm"; fi
          (
            cd fixture-lib
            "$zed" --home "$RUNNER_TEMP/zed-home" \
              r2g --docker --image "$image" --r2g-root "$RUNNER_TEMP/r2g-oci"
          )

      - name: Build the current CLI into the ecosystem OCI image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_image="node:22-bookworm-slim"
          if [[ "$ECOSYSTEM" == rust ]]; then runtime_image="rust:bookworm"; fi
          docker build \
            --build-arg "RUNTIME_IMAGE=$runtime_image" \
            --tag "zed-pkg-test/$ECOSYSTEM-current" \
            --file - \
            . <<'DOCKERFILE'
          ARG RUNTIME_IMAGE=node:22-bookworm-slim
          FROM rust:bookworm AS zed-builder
          WORKDIR /src
          COPY zed-interfaces ./zed-interfaces
          COPY zed-cli ./zed-cli
          WORKDIR /src/zed-cli
          RUN cargo build --release --locked --bin zed
          FROM ${RUNTIME_IMAGE}
          COPY --from=zed-builder /src/zed-cli/target/release/zed /usr/local/bin/zed
          WORKDIR /work
          DOCKERFILE

      - name: OCI publish, install, uninstall, frozen reinstall, and fresh runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          registry="$RUNNER_TEMP/oci-registry"
          home="$RUNNER_TEMP/oci-home"
          package="zed-pkg-test/$ECOSYSTEM-lib"
          image="zed-pkg-test/$ECOSYSTEM-current"
          runtime_image="node:22-bookworm-slim"
          if [[ "$ECOSYSTEM" == rust ]]; then runtime_image="rust:bookworm"; fi
          mkdir -p "$registry" "$home"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/fixture-lib:/source:ro" \
            --volume "$registry:/registry" \
            --workdir /tmp \
            "$image" \
            sh -euc '
              cp -a /source /tmp/package
              cd /tmp/package
              zed publish --registry file:///registry --skip-vcs-checks
            '

          docker run --rm \
            --volume "$GITHUB_WORKSPACE/fixture-app:/work" \
            --volume "$registry:/registry:ro" \
            --volume "$home:/zed-home" \
            --workdir /work \
            "$image" \
            sh -euc "
              zed uninstall --home /zed-home
              test -f .zpkg.lock
              test ! -e '.vendor/.zed/$package'
              zed install --frozen \
                --registry file:///registry \
                --home /zed-home \
                --install-mode copy
              test ! -L '.vendor/.zed/$package'
            "

          if [[ "$ECOSYSTEM" == node ]]; then
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/fixture-app:/work:ro" \
              --workdir /work \
              "$runtime_image" \
              npm start
          else
            docker run --rm \
              --volume "$GITHUB_WORKSPACE/fixture-app:/work:ro" \
              --workdir /work \
              "$runtime_image" \
              sh -euc 'CARGO_TARGET_DIR=/tmp/target cargo run --quiet'
          fi
          test ! -e "$GITHUB_WORKSPACE/fixture-app/.zpkg-staging"

  manifestless-install:
    name: Manifestless install consent and placement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: cda6849b6a95b582554fcadc7a882e99c5018989
          path: zed-interfaces
      - name: Build the real CLI container
        run: |
          docker build \
            --file zed-cli/.github/docker/install-test.Dockerfile \
            --tag zed-pkg/install-test \
            .
      - name: Prepare the local registry and manifestless consumers
        shell: bash
        run: |
          set -euo pipefail
          cp -R zed-cli/tests/fixtures/docker-install "$RUNNER_TEMP/fixtures"
          mkdir -p "$RUNNER_TEMP/registry" "$RUNNER_TEMP/zed-home"
          docker run --rm \
            --volume "$RUNNER_TEMP/fixtures/node-lib:/package" \
            --volume "$RUNNER_TEMP/registry:/registry" \
            --workdir /package \
            zed-pkg/install-test \
            zed publish --registry file:///registry --skip-vcs-checks

          for name in redirected interactive negative eof no-network allow alias env frozen frozen-restore; do
            root="$RUNNER_TEMP/manifestless-$name"
            mkdir -p "$root/src"
            cp "$RUNNER_TEMP/fixtures/node-app/package.json" "$root/package.json"
            cp "$RUNNER_TEMP/fixtures/node-app/src/main.js" "$root/src/main.js"
          done

          nested="$RUNNER_TEMP/manifestless-nested/apps/web"
          mkdir -p "$nested/src"
          cp "$RUNNER_TEMP/fixtures/node-app/package.json" "$nested/package.json"
          cp "$RUNNER_TEMP/fixtures/node-app/src/main.js" "$nested/src/main.js"

      - name: Redirected yes fails closed before dependency outputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/manifestless-redirected"
          if printf 'yes\n' | docker run --rm -i \
            --volume "$root:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed install zed-pkg/docker-node-lib@^1 \
              --registry file:///registry \
              --home /zed-home/redirected \
              --install-mode copy
          then
            echo "redirected stdin unexpectedly bypassed the TTY boundary" >&2
            exit 1
          fi
          test ! -e "$root/.zpkg.toml"
          test ! -e "$root/.zpkg.lock"
          test ! -e "$root/zed_modules"
          test ! -e "$root/node_modules"

      - name: Interactive yes, no, and EOF use a real pseudo-terminal
        shell: bash
        run: |
          set -euo pipefail
          yes_root="$RUNNER_TEMP/manifestless-interactive"
          python3 zed-cli/tests/manifestless_pty.py yes -- \
            docker run --rm -it \
              --volume "$yes_root:/work" \
              --volume "$RUNNER_TEMP/registry:/registry:ro" \
              --volume "$RUNNER_TEMP/zed-home:/zed-home" \
              --workdir /work \
              zed-pkg/install-test \
              zed install zed-pkg/docker-node-lib@^1 \
                --registry file:///registry \
                --home /zed-home/interactive \
                --install-mode copy
          test ! -e "$yes_root/.zpkg.toml"
          test -f "$yes_root/.zpkg.lock"
          test -d "$yes_root/zed_modules/zed-pkg/docker-node-lib"
          test -d "$yes_root/node_modules/@zed-pkg/docker-node-lib"
          test -z "$(find "$yes_root/zed_modules" "$yes_root/node_modules" -type l -print -quit)"
          docker run --rm \
            --volume "$yes_root:/work:ro" \
            --workdir /work \
            node:22-bookworm-slim \
            node src/main.js

          for mode in no eof; do
            case "$mode" in
              no) root="$RUNNER_TEMP/manifestless-negative" ;;
              eof) root="$RUNNER_TEMP/manifestless-eof" ;;
            esac
            if python3 zed-cli/tests/manifestless_pty.py "$mode" -- \
              docker run --rm -it \
                --volume "$root:/work" \
                --volume "$RUNNER_TEMP/registry:/registry:ro" \
                --volume "$RUNNER_TEMP/zed-home:/zed-home" \
                --workdir /work \
                zed-pkg/install-test \
                zed install zed-pkg/docker-node-lib@^1 \
                  --registry file:///registry \
                  --home "/zed-home/$mode" \
                  --install-mode copy
            then
              echo "$mode unexpectedly accepted manifestless installation" >&2
              exit 1
            fi
            test ! -e "$root/.zpkg.toml"
            test ! -e "$root/.zpkg.lock"
            test ! -e "$root/zed_modules"
            test ! -e "$root/node_modules"
          done

      - name: Consent is requested before unversioned registry resolution
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/manifestless-no-network"
          if python3 zed-cli/tests/manifestless_pty.py no -- \
            docker run --rm -it \
              --volume "$root:/work" \
              --workdir /work \
              zed-pkg/install-test \
              zed install zed-pkg/docker-node-lib \
                --registry http://127.0.0.1:9 \
                --home /tmp/zed-home \
                --install-mode copy
          then
            echo "negative confirmation unexpectedly installed" >&2
            exit 1
          fi
          test ! -e "$root/.zpkg.toml"
          test ! -e "$root/.zpkg.lock"
          test ! -e "$root/zed_modules"

      - name: Both bypass spellings and the environment variable install non-interactively
        shell: bash
        run: |
          set -euo pipefail
          for tuple in \
            "allow|--allow-no-manifest|" \
            "alias|--skip-manifest|" \
            "env||ZED_PKG_ALLOW_NO_MANIFEST=1"
          do
            IFS='|' read -r name flag environment <<<"$tuple"
            root="$RUNNER_TEMP/manifestless-$name"
            args=(
              docker run --rm
              --volume "$root:/work"
              --volume "$RUNNER_TEMP/registry:/registry:ro"
              --volume "$RUNNER_TEMP/zed-home:/zed-home"
              --workdir /work
            )
            if [[ -n "$environment" ]]; then
              args+=(--env "$environment")
            fi
            args+=(
              zed-pkg/install-test
              zed install zed-pkg/docker-node-lib@^1
            )
            if [[ -n "$flag" ]]; then
              args+=("$flag")
            fi
            args+=(
              --registry file:///registry
              --home "/zed-home/$name"
              --install-mode copy
            )
            "${args[@]}"
            test ! -e "$root/.zpkg.toml"
            test -f "$root/.zpkg.lock"
            test -d "$root/zed_modules/zed-pkg/docker-node-lib"
            test -d "$root/node_modules/@zed-pkg/docker-node-lib"
            test -z "$(find "$root/zed_modules" "$root/node_modules" -type l -print -quit)"
            docker run --rm \
              --volume "$root:/work:ro" \
              --workdir /work \
              node:22-bookworm-slim \
              node src/main.js
          done

      - name: Frozen lock-only reinstall is explicit and reproducible
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/manifestless-frozen"
          docker run --rm \
            --volume "$root:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed install zed-pkg/docker-node-lib@^1 \
              --skip-manifest \
              --registry file:///registry \
              --home /zed-home/frozen \
              --install-mode copy

          if docker run --rm \
            --volume "$root:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed install --skip-manifest \
              --registry file:///registry \
              --home /zed-home/frozen \
              --install-mode copy
          then
            echo "lock-only reinstall without --frozen unexpectedly succeeded" >&2
            exit 1
          fi

          restore_root="$RUNNER_TEMP/manifestless-frozen-restore"
          cp "$root/.zpkg.lock" "$restore_root/.zpkg.lock"
          test ! -e "$restore_root/zed_modules"
          test ! -e "$restore_root/node_modules"
          test ! -e "$restore_root/.zed"
          docker run --rm \
            --volume "$restore_root:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed install --frozen --skip-manifest \
              --registry file:///registry \
              --home /zed-home/frozen \
              --install-mode copy
          test ! -e "$restore_root/.zpkg.toml"
          test -f "$restore_root/.zpkg.lock"
          cmp -s "$root/.zpkg.lock" "$restore_root/.zpkg.lock"
          test -z "$(find "$restore_root/zed_modules" "$restore_root/node_modules" -type l -print -quit)"
          docker run --rm \
            --volume "$restore_root:/work:ro" \
            --workdir /work \
            node:22-bookworm-slim \
            node src/main.js

      - name: One clear nested native project becomes the install root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/manifestless-nested"
          docker run --rm \
            --volume "$root:/work" \
            --volume "$RUNNER_TEMP/registry:/registry:ro" \
            --volume "$RUNNER_TEMP/zed-home:/zed-home" \
            --workdir /work \
            zed-pkg/install-test \
            zed install zed-pkg/docker-node-lib@^1 \
              --skip-manifest \
              --registry file:///registry \
              --home /zed-home/nested \
              --install-mode copy
          test ! -e "$root/.zpkg.toml"
          test ! -e "$root/.zpkg.lock"
          test -f "$root/apps/web/.zpkg.lock"
          test -d "$root/apps/web/zed_modules/zed-pkg/docker-node-lib"
          test -d "$root/apps/web/node_modules/@zed-pkg/docker-node-lib"
          docker run --rm \
            --volume "$root:/work:ro" \
            --workdir /work/apps/web \
            node:22-bookworm-slim \
            node src/main.js

  shell-contract:
    name: Bash, Zsh, and terminal help contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: cda6849b6a95b582554fcadc7a882e99c5018989
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - name: Verify the immutable parser lock and build the real executable
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'rev = "2f62e40932a0fcb8b9bf1b4c84473e34fa3c51c7"' Cargo.toml
          grep -F '2f62e40932a0fcb8b9bf1b4c84473e34fa3c51c7' Cargo.lock
          cargo build --locked --bin zed
      - name: Terminal help exposes the synchronized install contract
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/zed-cli/target/debug/zed"
          script -qec "$bin --help" "$RUNNER_TEMP/zed-help.txt" >/dev/null
          script -qec "$bin install --help" "$RUNNER_TEMP/install-help.txt" >/dev/null
          grep -F -- "completions" "$RUNNER_TEMP/zed-help.txt"
          grep -F -- "uninstall" "$RUNNER_TEMP/zed-help.txt"
          grep -F -- "--interactive" "$RUNNER_TEMP/zed-help.txt"
          grep -F -- "--allow-no-manifest" "$RUNNER_TEMP/install-help.txt"
          grep -F -- "--skip-manifest" "$RUNNER_TEMP/install-help.txt"
          grep -F -- "Proceed without prompting" "$RUNNER_TEMP/install-help.txt"
          ZED_PKG_ALLOW_NO_MANIFEST=invalid \
            "$bin" install --allow-no-manifest --help >/dev/null
          if ZED_PKG_ALLOW_NO_MANIFEST=invalid "$bin" install --help >/dev/null 2>&1
          then
            echo "invalid boolean environment value unexpectedly passed startup validation" >&2
            exit 1
          fi
          if ZED_PKG_INTERACTIVE=invalid "$bin" --help >/dev/null 2>&1
          then
            echo "invalid interactive boolean unexpectedly passed startup validation" >&2
            exit 1
          fi
      - name: Bash completion parses, registers, and offers real candidates
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/zed-cli/target/debug/zed"
          completion="$RUNNER_TEMP/zed.bash"
          "$bin" completions bash > "$completion"
          bash -n "$completion"
          grep -F -- "--allow-no-manifest" "$completion"
          grep -F -- "--skip-manifest" "$completion"
          bash --noprofile --norc -c '
            set -euo pipefail
            source "$1"
            complete -p zed | grep -F _zed
            COMP_WORDS=(zed "")
            COMP_CWORD=1
            COMP_LINE="zed "
            COMP_POINT=${#COMP_LINE}
            _zed zed "" zed
            printf "%s\n" "${COMPREPLY[@]}" | grep -Fx install
          ' bash "$completion"
      - name: Zsh completion parses, registers, and autoloads
        shell: bash
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/zed-cli/target/debug/zed"
          dir="$RUNNER_TEMP/zfunc"
          mkdir -p "$dir"
          "$bin" completions zsh > "$dir/_zed"
          zsh -n "$dir/_zed"
          grep -F -- "--allow-no-manifest" "$dir/_zed"
          grep -F -- "--skip-manifest" "$dir/_zed"
          zsh -f -c '
            set -eu
            fpath=("$1" $fpath)
            autoload -Uz compinit
            compinit -i -D
            [[ ${_comps[zed]-} == _zed ]]
            autoload +X _zed
            whence -w _zed | grep -F function
          ' zsh "$dir"
