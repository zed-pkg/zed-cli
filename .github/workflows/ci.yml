name: certify Windows develop-shell test portability

on:
  push:
    branches:
      - agent/windows-develop-shell-edge-cfg
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - tests/develop_shell_edge_cases.rs

permissions:
  contents: write

concurrency:
  group: windows-develop-shell-edge-cfg
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/windows-develop-shell-edge-cfg
          persist-credentials: false
          show-progress: false

      - name: Apply target-specific test boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/develop_shell_edge_cases.rs')
          text = path.read_text()
          replacements = [
              (
                  'use std::collections::BTreeMap;\nuse std::env;\nuse std::ffi::{OsStr, OsString};',
                  '#[cfg(unix)]\nuse std::collections::BTreeMap;\nuse std::env;\n#[cfg(unix)]\nuse std::ffi::{OsStr, OsString};',
              ),
              (
                  'fn assert_success(output: &Output) {',
                  '#[cfg(unix)]\nfn assert_success(output: &Output) {',
              ),
              (
                  'fn stdout(output: &Output) -> String {',
                  '#[cfg(unix)]\nfn stdout(output: &Output) -> String {',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing source anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Validate native Windows targets without weakening lint
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --test develop_shell_edge_cases
          cargo test --locked --lib environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

  unix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/windows-develop-shell-edge-cfg
          persist-credentials: false
          show-progress: false

      - name: Apply target-specific test boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/develop_shell_edge_cases.rs')
          text = path.read_text()
          replacements = [
              (
                  'use std::collections::BTreeMap;\nuse std::env;\nuse std::ffi::{OsStr, OsString};',
                  '#[cfg(unix)]\nuse std::collections::BTreeMap;\nuse std::env;\n#[cfg(unix)]\nuse std::ffi::{OsStr, OsString};',
              ),
              (
                  'fn assert_success(output: &Output) {',
                  '#[cfg(unix)]\nfn assert_success(output: &Output) {',
              ),
              (
                  'fn stdout(output: &Output) -> String {',
                  '#[cfg(unix)]\nfn stdout(output: &Output) -> String {',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing source anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Validate Unix behavior remains exercised
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --test develop_shell_edge_cases
          cargo clippy --locked --all-targets -- -D warnings

  commit:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/windows-develop-shell-edge-cfg')
    needs: [windows, unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/windows-develop-shell-edge-cfg
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply the validated source repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/develop_shell_edge_cases.rs')
          text = path.read_text()
          replacements = [
              (
                  'use std::collections::BTreeMap;\nuse std::env;\nuse std::ffi::{OsStr, OsString};',
                  '#[cfg(unix)]\nuse std::collections::BTreeMap;\nuse std::env;\n#[cfg(unix)]\nuse std::ffi::{OsStr, OsString};',
              ),
              (
                  'fn assert_success(output: &Output) {',
                  '#[cfg(unix)]\nfn assert_success(output: &Output) {',
              ),
              (
                  'fn stdout(output: &Output) -> String {',
                  '#[cfg(unix)]\nfn stdout(output: &Output) -> String {',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing source anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Restore canonical CI and commit ordinary test source
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/develop_shell_edge_cases.rs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'test: gate Unix-only develop-shell helpers'
          git push origin HEAD:agent/windows-develop-shell-edge-cfg
