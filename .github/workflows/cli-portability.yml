name: CLI portability

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cli-flags.toml
      - '.*-cli-flags.toml'
      - .zpkg.toml
      - '**/*.toml'
      - '**/*.toml.example'
      - rust-toolchain.toml
      - '.cli-flags.toml'
      - '.*-cli-flags.toml'
      - build.rs
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/cli-portability.yml'
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cli-flags.toml
      - '.*-cli-flags.toml'
      - .zpkg.toml
      - '**/*.toml'
      - '**/*.toml.example'
      - rust-toolchain.toml
      - '.cli-flags.toml'
      - '.*-cli-flags.toml'
      - build.rs
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/cli-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-portability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    uses: zed-pkg/.github/.github/workflows/reusable-cli-portability.yml@8771248b035486c5787e8b7eb8e1222f650ce141
    with:
      language: rust
      working-directory: .
      # Keep this exact version synchronized with rust-toolchain.toml. Passing
      # `stable` here would bypass the repository pin inside this reusable job.
      rust-toolchain: '1.98.1'
      cargo-locked: true
      run-smoke: true
