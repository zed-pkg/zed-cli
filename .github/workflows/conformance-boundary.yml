name: conformance-boundary

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/project_boundary.rs'
      - 'src/ops_lifecycle_entry.rs'
      - '.githooks/**'
      - '.github/workflows/conformance-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'contracts/**'
      - 'conformance/**'
      - 'src/project_boundary.rs'
      - 'src/ops_lifecycle_entry.rs'
      - '.githooks/**'
      - '.github/workflows/conformance-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check consumed authority boundary
        run: |
          node --check conformance/check.mjs
          node --check conformance/boundary.mjs
          node conformance/check.mjs
          bash -n .githooks/pre-commit
          bash -n .githooks/pre-push
