name: DEN-1194 finalize startup and CI isolation fix

on:
  push:
    branches:
      - fix/den-1194-startup-and-ci-isolation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(DEN-1194):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/den-1194-startup-and-ci-isolation
          path: zed-cli
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: dc0e0a0620b9462817950b552d3d334a184b1cb1
          path: zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-cli

      - name: Apply the reviewed transformations
        working-directory: zed-cli
        run: python3 scripts/den-1194-apply.py

      - name: Validate startup semantics and the complete Rust surface
        shell: bash
        working-directory: zed-cli
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test --locked --test startup_environment_contract \
            --test develop_alias_contract --test develop_help_contract
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Stage the tested CI workflow for connector publication
        shell: bash
        working-directory: zed-cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/den-1194-ci"
          cp .github/workflows/ci.yml "$RUNNER_TEMP/den-1194-ci/ci.yml"

      - name: Upload the exact tested CI workflow
        uses: actions/upload-artifact@v4
        with:
          name: den-1194-tested-ci-workflow
          path: ${{ runner.temp }}/den-1194-ci/ci.yml
          if-no-files-found: error
          retention-days: 3

      - name: Publish the tested source without workflow-scope escalation
        shell: bash
        working-directory: zed-cli
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs src/flags.rs tests/startup_environment_contract.rs
          git commit -m 'fix(DEN-1194): validate root-help env before routing'
          git push origin HEAD:fix/den-1194-startup-and-ci-isolation
