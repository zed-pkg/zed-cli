name: harden DEN-1439 normalized mise state

on:
  pull_request:
    paths:
      - .github/scripts/den1439_normalize.py
      - .github/scripts/den1439_require_checksums.py
      - .github/scripts/den1439_fix_shadow.py
      - .github/workflows/den-1439-normalize.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply normalized-state hardening and validate
        run: |
          set -euo pipefail
          python3 .github/scripts/den1439_normalize.py
          python3 .github/scripts/den1439_require_checksums.py
          python3 .github/scripts/den1439_fix_shadow.py
          cargo fmt --check || cargo fmt
          cargo test --lib environment::tests
          cargo test --test mise_environment_cli
          cargo clippy --all-targets -- -D warnings

      - name: Commit hardened implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environment.rs
          git commit -m "fix(DEN-1439): normalize mise provenance and frozen identity"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
