name: wire DEN-1439 mise adapter on pull request

on:
  pull_request:
    paths:
      - .github/scripts/den1439_wire.py
      - .github/workflows/den-1439-wire-pr.yml
      - src/environment.rs

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply and validate the typed wiring
        run: |
          set -euo pipefail
          python3 .github/scripts/den1439_wire.py
          cargo fmt
          cargo test --lib
          cargo clippy --all-targets -- -D warnings

      - name: Commit generated wiring
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/cli.rs src/main.rs src/environment.rs .cli-flags.toml README.md
          git commit -m "feat(DEN-1439): wire mise import and frozen verification"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
