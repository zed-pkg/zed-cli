name: DEN-1505 current-main merge diagnostic

on:
  push:
    branches:
      - agent/den-1505-current-main-integration
    paths:
      - '.github/workflows/den-1505-current-main-merge-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_MAIN_SHA: b82da352472e301425c175b78d9d2c1c0cd0f1db
  INTEGRATION_BRANCH: agent/den-1505-current-main-integration

jobs:
  conflict-map:
    name: Commit the bounded semantic conflict report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the cumulative installer stack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Map conflicts in a disposable local clone
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CURRENT_MAIN_SHA"
          git clone --quiet --no-hardlinks . "$RUNNER_TEMP/merge-work"
          git -C "$RUNNER_TEMP/merge-work" checkout --quiet --detach "$GITHUB_SHA"

          set +e
          git -C "$RUNNER_TEMP/merge-work" \
            -c merge.conflictStyle=diff3 \
            merge --no-commit --no-ff "$CURRENT_MAIN_SHA"
          merge_status=$?
          set -e
          test "$merge_status" -ne 0

          git -C "$RUNNER_TEMP/merge-work" \
            diff --name-only --diff-filter=U | sort \
            > "$RUNNER_TEMP/conflicts.txt"
          printf '%s\n' src/lib.rs src/ops.rs > "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/conflicts.txt"

          mkdir -p merge-diagnostics
          python3 - "$RUNNER_TEMP/merge-work" "$CURRENT_MAIN_SHA" <<'PY'
          from pathlib import Path
          import json
          import sys

          root = Path(sys.argv[1])
          main_sha = sys.argv[2]
          paths = ('src/lib.rs', 'src/ops.rs')
          markdown = [
              '# DEN-1505 current-main semantic conflict map',
              '',
              f'- installer-stack head: `{Path.cwd()}`',
              f'- exact current main: `{main_sha}`',
              '- expected conflicted paths: `src/lib.rs`, `src/ops.rs`',
              '- generated from a disposable local clone; source files were not resolved or committed',
              '',
          ]
          machine = {'currentMain': main_sha, 'conflicts': []}

          for name in paths:
              lines = (root / name).read_text(encoding='utf-8').splitlines()
              index = 0
              block_number = 0
              blocks = []
              markdown.extend([f'## `{name}`', ''])
              while index < len(lines):
                  if not lines[index].startswith('<<<<<<< '):
                      index += 1
                      continue
                  start = index
                  depth = 0
                  while index < len(lines):
                      line = lines[index]
                      if line.startswith('<<<<<<< '):
                          depth += 1
                      elif line.startswith('>>>>>>> '):
                          depth -= 1
                          if depth == 0:
                              break
                      index += 1
                  if index >= len(lines):
                      raise SystemExit(f'unterminated conflict in {name}')
                  block_number += 1
                  block_lines = lines[start:index + 1]
                  if len(block_lines) > 400:
                      raise SystemExit(f'conflict block too large in {name}: {len(block_lines)} lines')
                  blocks.append({
                      'number': block_number,
                      'startLine': start + 1,
                      'endLine': index + 1,
                      'lines': block_lines,
                  })
                  markdown.extend([
                      f'### Block {block_number} — lines {start + 1}–{index + 1}',
                      '',
                      '```diff',
                      *block_lines,
                      '```',
                      '',
                  ])
                  index += 1
              if not blocks:
                  raise SystemExit(f'expected at least one conflict block in {name}')
              machine['conflicts'].append({'path': name, 'blocks': blocks})

          Path('merge-diagnostics/den-1505-current-main-conflicts.md').write_text(
              '\n'.join(markdown) + '\n', encoding='utf-8'
          )
          Path('merge-diagnostics/den-1505-current-main-conflicts.json').write_text(
              json.dumps(machine, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit only the bounded diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            merge-diagnostics/den-1505-current-main-conflicts.md \
            merge-diagnostics/den-1505-current-main-conflicts.json
          git diff --cached --check
          git commit -m 'docs(DEN-1505): record exact current-main conflict blocks'
          git push origin "HEAD:$INTEGRATION_BRANCH"
