name: DEN-1505 semantic current-main integration

on:
  push:
    branches:
      - agent/den-1505-merge-lab
    paths:
      - '.github/workflows/den-1505-merge-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-apply
  cancel-in-progress: false

env:
  INTEGRATION_BRANCH: agent/den-1505-current-main-integration
  INTEGRATION_HEAD_SHA: bed188e0915a22124d627f85af1453ca8c85dbf1
  CURRENT_MAIN_SHA: b82da352472e301425c175b78d9d2c1c0cd0f1db

jobs:
  compose:
    name: Compose, validate, and fast-forward the integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the merge laboratory with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable branch inputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH" \
            "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/$INTEGRATION_BRANCH")" = "$INTEGRATION_HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CURRENT_MAIN_SHA"

      - name: Perform the exact two-parent merge and resolve the sole conflict
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$INTEGRATION_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git -c merge.conflictStyle=diff3 merge --no-commit --no-ff "$CURRENT_MAIN_SHA"
          merge_status=$?
          set -e
          test "$merge_status" -ne 0

          git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/conflicts.txt"
          printf '%s\n' src/lib.rs > "$RUNNER_TEMP/expected-conflicts.txt"
          cmp "$RUNNER_TEMP/expected-conflicts.txt" "$RUNNER_TEMP/conflicts.txt"

          cat > src/lib.rs <<'RS'
          //! Library core of the `zed` CLI. The binary in `main.rs` is a thin
          //! dispatcher over these modules; integration tests drive them directly.

          pub mod auth;
          pub mod cli;
          pub mod completion;
          pub mod config;
          pub mod dev;
          pub mod fetch;
          pub mod flags;
          pub mod install_graph;
          pub mod interactive;
          pub mod manifestless;
          pub mod nix_export_bundle;
          pub mod nix_export_plan;
          #[path = "ops_entry.rs"]
          pub mod ops;
          pub mod pack;
          pub mod preflight;
          pub mod r2g;
          pub mod registry;
          pub mod release;
          pub mod store;
          pub mod transaction;
          pub mod update;
          pub mod vcs;

          pub mod tool_versions;
          RS

          git add src/lib.rs
          test -z "$(git diff --name-only --diff-filter=U)"

          # Remove only the temporary diagnostic workflow introduced on the
          # integration branch; it is not product or permanent CI surface.
          rm -f .github/workflows/den-1505-current-main-merge-diagnostic.yml
          git add -A

      - name: Prove both conceptual sides survived
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'pub mod fetch;' src/lib.rs
          grep -F 'pub mod install_graph;' src/lib.rs
          grep -F 'pub mod nix_export_bundle;' src/lib.rs
          grep -F 'pub mod nix_export_plan;' src/lib.rs
          grep -F '#[path = "ops_entry.rs"]' src/lib.rs
          grep -F 'pub mod tool_versions;' src/lib.rs

          grep -F 'fn write_resolved_lockfile' src/ops.rs
          grep -F 'frozen_lock_write_preserves_exact_bytes' src/ops.rs
          grep -F 'collect_workspace_links_for_frozen' src/ops.rs
          grep -F 'crate::install_graph::ensure_artifact' src/ops.rs
          test ! -e .github/workflows/den-1505-current-main-merge-diagnostic.yml
          git diff --check

      - name: Format and compile the resolved library contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --lib

      - name: Create the semantic merge commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge(DEN-1505/DEN-1585): compose recursive installer stack with current Nix main" \
            -m "Preserve the complete recursive, blocking-lock, resolver-hardening, workspace, frozen-repair, and uninstall history as the first parent while incorporating current strict-lock, frozen-fetch, Nix bundle/export, and pure-flake main as the second parent. Resolve only src/lib.rs by retaining all module surfaces; src/ops.rs merges cleanly. Remove the temporary diagnostic workflow."
          test "$(git rev-parse HEAD^1)" = "$INTEGRATION_HEAD_SHA"
          test "$(git rev-parse HEAD^2)" = "$CURRENT_MAIN_SHA"
          git push origin "HEAD:refs/heads/$INTEGRATION_BRANCH"
