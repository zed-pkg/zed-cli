name: DEN-1553 apply formatter

on:
  push:
    branches:
      - agent/den-1553-complete-constraint-solver

permissions:
  contents: write

concurrency:
  group: den-1553-apply-format
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.ref == 'refs/heads/agent/den-1553-complete-constraint-solver'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact triggering head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Install the repository formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
      - name: Produce and verify canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
      - name: Create one fast-forward product commit and remove helper workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/den-1553-complete-constraint-solver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          product_paths = [
              'src/config.rs',
              'src/install_graph.rs',
              'src/install_graph/resolver.rs',
              'src/install_graph/solver.rs',
              'src/ops_entry.rs',
          ]
          helper_paths = [
              '.github/workflows/den-1553-format-artifact.yml',
              '.github/workflows/den-1553-apply-format.yml',
          ]

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'zed-den-1553-one-shot-formatter',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub API {method} {path} failed with HTTP {error.code}')
              return json.loads(body) if body else None

          ref = request('GET', f'/git/ref/heads/{branch}')
          live_head = ref['object']['sha']
          if live_head != expected_head:
              raise SystemExit(
                  f'branch advanced before formatting commit: expected {expected_head}, found {live_head}'
              )

          commit = request('GET', f'/git/commits/{live_head}')
          entries = []
          for path in product_paths:
              content = Path(path).read_bytes()
              blob = request(
                  'POST',
                  '/git/blobs',
                  {'content': base64.b64encode(content).decode('ascii'), 'encoding': 'base64'},
              )
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in helper_paths:
              entries.append({'path': path, 'sha': None})

          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': commit['tree']['sha'], 'tree': entries},
          )
          new_commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'style(DEN-1553): apply canonical rustfmt output',
                  'tree': tree['sha'],
                  'parents': [live_head],
              },
          )
          request(
              'PATCH',
              f'/git/refs/heads/{branch}',
              {'sha': new_commit['sha'], 'force': False},
          )
          print(f"created formatter commit {new_commit['sha']}")
          PY
