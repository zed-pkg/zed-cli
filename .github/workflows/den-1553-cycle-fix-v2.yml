name: DEN-1553 cycle correction v2

on:
  pull_request:
    paths:
      - '.github/workflows/den-1553-cycle-fix-v2.yml'
      - 'src/install_graph/artifact.rs'
      - 'src/install_graph/solver.rs'

permissions:
  contents: write

concurrency:
  group: den-1553-cycle-fix-v2
  cancel-in-progress: false

jobs:
  correct:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1553-complete-constraint-solver'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Apply compiler and cycle-provenance corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          solver_path = Path('src/install_graph/solver.rs')
          solver = solver_path.read_text()

          private_path = 'zed_interfaces::registry::ArtifactFormat::TarGz'
          if solver.count(private_path) != 1:
              raise SystemExit(f'expected one private artifact path, found {solver.count(private_path)}')
          solver = solver.replace(private_path, 'zed_interfaces::ArtifactFormat::TarGz')

          solver, count = re.subn(
              r'(struct Constraint \{\n\s*requirement: String,\n\s*path: Vec<String>,)(\n\s*\})',
              r'\1\n    propagate: bool,\2',
              solver,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one Constraint definition, found {count}')

          loop_pattern = re.compile(
              r'(?m)^(?P<outer>\s*)for parent in parents \{\n(?P<inner>\s*)for \(dependency, requirement\) in &'
          )
          def add_cycle_guard(match: re.Match[str]) -> str:
              outer = match.group('outer')
              inner = match.group('inner')
              if len(inner) <= len(outer):
                  raise SystemExit('unexpected propagation-loop indentation')
              return (
                  f'{outer}for parent in parents {{\n'
                  f'{inner}if !parent.propagate {{\n'
                  f'{inner}    continue;\n'
                  f'{inner}}}\n'
                  f'{inner}for (dependency, requirement) in &'
              )
          solver, count = loop_pattern.subn(add_cycle_guard, solver)
          if count != 2:
              raise SystemExit(f'expected two propagation loops, found {count}')

          marker = '    let mut path = parent.path.clone();\n'
          if solver.count(marker) != 1:
              raise SystemExit(f'expected one child path builder, found {solver.count(marker)}')
          cycle_prefix = '''    let cycle_back_edge = parent.path.iter().any(|segment| {
              segment
                  .split_once('@')
                  .map_or(segment.as_str(), |(coordinate, _)| coordinate)
                  == dependency
          });
          '''
          solver = solver.replace(marker, cycle_prefix + marker)

          child_tail = '''        requirement: requirement.to_string(),
                  path,
              }'''
          if solver.count(child_tail) != 1:
              raise SystemExit(f'expected one child Constraint tail, found {solver.count(child_tail)}')
          solver = solver.replace(
              child_tail,
              '''        requirement: requirement.to_string(),
                  path,
                  propagate: !cycle_back_edge,
              }''',
          )

          root_patterns = [
              r'(?m)^(?P<indent>\s*)path: vec!\[root\.clone\(\), key\.clone\(\)\],\n(?P=indent)\},',
              r'(?m)^(?P<indent>\s*)path: vec!\[root\.clone\(\), \(\*key\)\.to_string\(\)\],\n(?P=indent)\},',
          ]
          for pattern in root_patterns:
              solver, count = re.subn(
                  pattern,
                  lambda match: (
                      f"{match.group('indent')}{match.group(0).lstrip().splitlines()[0]}\n"
                      f"{match.group('indent')}propagate: true,\n"
                      f"{match.group('indent')}}},"
                  ),
                  solver,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'expected one root Constraint for {pattern}, found {count}')

          solver_path.write_text(solver)

          artifact_path = Path('src/install_graph/artifact.rs')
          artifact = artifact_path.read_text()
          marker = '\npub(super) fn resolve_version('
          if artifact.count(marker) != 1:
              raise SystemExit(f'expected one obsolete greedy resolver, found {artifact.count(marker)}')
          artifact_path.write_text(artifact[:artifact.index(marker)].rstrip() + '\n')
          PY
      - name: Format and compile every target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked --all-targets
      - name: Prove the complete solver terminates and backtracks
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 cargo test --locked --lib install_graph::solver::tests
      - name: Commit validated product bytes and remove all correction workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/den-1553-complete-constraint-solver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected_head = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          product_paths = ['src/install_graph/artifact.rs', 'src/install_graph/solver.rs']
          helper_paths = [
              '.github/workflows/den-1553-compile-fix.yml',
              '.github/workflows/den-1553-cycle-fix.yml',
              '.github/workflows/den-1553-cycle-fix-v2.yml',
          ]

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'zed-den-1553-cycle-correction-v2',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub API {method} {path} failed with HTTP {error.code}')
              return json.loads(body) if body else None

          ref = request('GET', f'/git/ref/heads/{branch}')
          live_head = ref['object']['sha']
          if live_head != expected_head:
              raise SystemExit(
                  f'branch advanced before cycle correction: expected {expected_head}, found {live_head}'
              )
          parent = request('GET', f'/git/commits/{live_head}')
          entries = []
          for path in product_paths:
              blob = request(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode(Path(path).read_bytes()).decode(),
                      'encoding': 'base64',
                  },
              )
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          for path in helper_paths:
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = request('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'fix(DEN-1553): terminate cycle provenance without dropping back-edge constraints',
                  'tree': tree['sha'],
                  'parents': [live_head],
              },
          )
          request('PATCH', f'/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': False})
          print(f"created cycle-safe commit {commit['sha']}")
          PY
