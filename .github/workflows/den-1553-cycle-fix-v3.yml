name: DEN-1553 cycle correction v3

on:
  pull_request:
    paths:
      - '.github/workflows/den-1553-cycle-fix-v3.yml'
      - 'src/install_graph/artifact.rs'
      - 'src/install_graph/solver.rs'

permissions:
  contents: write

concurrency:
  group: den-1553-cycle-fix-v3
  cancel-in-progress: false

jobs:
  correct:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1553-complete-constraint-solver'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Apply syntax-oriented corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          solver_path = Path('src/install_graph/solver.rs')
          text = solver_path.read_text().replace(
              'zed_interfaces::registry::ArtifactFormat::TarGz',
              'zed_interfaces::ArtifactFormat::TarGz',
          )
          lines = text.splitlines()

          # Add the propagation bit to the one private Constraint type.
          definitions = [i for i, line in enumerate(lines) if line.strip() == 'struct Constraint {']
          if len(definitions) != 1:
              raise SystemExit(f'expected one Constraint definition, found {len(definitions)}')
          definition = definitions[0]
          if lines[definition + 1].strip() != 'requirement: String,' or lines[definition + 2].strip() != 'path: Vec<String>,':
              raise SystemExit('Constraint definition changed unexpectedly')
          lines.insert(definition + 3, lines[definition + 2][: len(lines[definition + 2]) - len(lines[definition + 2].lstrip())] + 'propagate: bool,')

          # Stop expanding only a provenance path that has closed a cycle. The
          # constraint itself remains in the state and is still version-checked.
          guarded = 0
          output = []
          index = 0
          while index < len(lines):
              line = lines[index]
              output.append(line)
              if (
                  line.strip() == 'for parent in parents {'
                  and index + 1 < len(lines)
                  and lines[index + 1].strip().startswith('for (dependency, requirement) in &')
              ):
                  inner_indent = lines[index + 1][: len(lines[index + 1]) - len(lines[index + 1].lstrip())]
                  output.extend([
                      inner_indent + 'if !parent.propagate {',
                      inner_indent + '    continue;',
                      inner_indent + '}',
                  ])
                  guarded += 1
              index += 1
          if guarded != 2:
              raise SystemExit(f'expected two propagation loops, guarded {guarded}')
          lines = output

          child_start = next(i for i, line in enumerate(lines) if line.startswith('fn child_constraint('))
          child_end = next(i for i in range(child_start + 1, len(lines)) if lines[i].startswith('pub(super) fn solve_install('))
          path_builders = [i for i in range(child_start, child_end) if lines[i].strip() == 'let mut path = parent.path.clone();']
          if len(path_builders) != 1:
              raise SystemExit(f'expected one child path builder, found {len(path_builders)}')
          path_builder = path_builders[0]
          indent = lines[path_builder][: len(lines[path_builder]) - len(lines[path_builder].lstrip())]
          cycle_lines = [
              indent + 'let cycle_back_edge = parent.path.iter().any(|segment| {',
              indent + '    segment',
              indent + "        .split_once('@')",
              indent + '        .map_or(segment.as_str(), |(coordinate, _)| coordinate)',
              indent + '        == dependency',
              indent + '});',
          ]
          lines[path_builder:path_builder] = cycle_lines
          child_end += len(cycle_lines)

          child_paths = [
              i for i in range(child_start, child_end)
              if lines[i].strip() == 'path,'
              and i + 1 < child_end
              and lines[i + 1].strip() == '}'
          ]
          if len(child_paths) != 1:
              raise SystemExit(f'expected one child Constraint path field, found {len(child_paths)}')
          child_path = child_paths[0]
          field_indent = lines[child_path][: len(lines[child_path]) - len(lines[child_path].lstrip())]
          lines.insert(child_path + 1, field_indent + 'propagate: !cycle_back_edge,')

          production_roots = 0
          test_roots = 0
          index = 0
          while index < len(lines):
              stripped = lines[index].strip()
              if stripped == 'path: vec![root.clone(), key.clone()],':
                  field_indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                  lines.insert(index + 1, field_indent + 'propagate: true,')
                  production_roots += 1
                  index += 1
              elif stripped == 'path: vec![root.clone(), (*key).to_string()],':
                  field_indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
                  lines.insert(index + 1, field_indent + 'propagate: true,')
                  test_roots += 1
                  index += 1
              index += 1
          if (production_roots, test_roots) != (1, 1):
              raise SystemExit(
                  f'expected one production and one test root, found {(production_roots, test_roots)}'
              )
          solver_path.write_text('\n'.join(lines) + '\n')

          artifact_path = Path('src/install_graph/artifact.rs')
          artifact = artifact_path.read_text()
          marker = '\npub(super) fn resolve_version('
          if artifact.count(marker) != 1:
              raise SystemExit(f'expected one obsolete greedy resolver, found {artifact.count(marker)}')
          artifact_path.write_text(artifact[:artifact.index(marker)].rstrip() + '\n')
          PY
      - name: Format and compile all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --locked --all-targets
      - name: Run bounded solver corpus
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 cargo test --locked --lib install_graph::solver::tests
      - name: Commit validated bytes and remove correction workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/den-1553-complete-constraint-solver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          products = ['src/install_graph/artifact.rs', 'src/install_graph/solver.rs']
          helpers = [
              '.github/workflows/den-1553-compile-fix.yml',
              '.github/workflows/den-1553-cycle-fix.yml',
              '.github/workflows/den-1553-cycle-fix-v2.yml',
              '.github/workflows/den-1553-cycle-fix-v3.yml',
          ]

          def request(method, path, payload=None):
              req = urllib.request.Request(
                  api + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'zed-den-1553-cycle-v3',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub API {method} {path} failed with HTTP {error.code}')
              return json.loads(body) if body else None

          live = request('GET', f'/git/ref/heads/{branch}')['object']['sha']
          if live != expected:
              raise SystemExit(f'branch advanced: expected {expected}, found {live}')
          parent = request('GET', f'/git/commits/{live}')
          entries = []
          for path in products:
              blob = request('POST', '/git/blobs', {
                  'content': base64.b64encode(Path(path).read_bytes()).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          entries.extend(
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': None}
              for path in helpers
          )
          tree = request('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = request('POST', '/git/commits', {
              'message': 'fix(DEN-1553): terminate cycle provenance without dropping back-edge constraints',
              'tree': tree['sha'],
              'parents': [live],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': False})
          print(commit['sha'])
          PY
