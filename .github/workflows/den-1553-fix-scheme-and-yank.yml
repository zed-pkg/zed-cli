name: DEN-1553 fix scheme and yank semantics

on:
  pull_request:
    paths:
      - '.github/workflows/den-1553-fix-scheme-and-yank.yml'
      - 'src/install_graph/solver.rs'
      - 'tests/e2e.rs'

permissions:
  contents: write

concurrency:
  group: den-1553-fix-scheme-and-yank
  cancel-in-progress: false

jobs:
  fix-and-prove:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1553-complete-constraint-solver'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Apply scheme-aware matching and pre-acquisition yank rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/install_graph/solver.rs')
          text = path.read_text()

          def replace_once(label: str, old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'candidate scheme field',
              '''struct Candidate {
              version: VersionMetadata,
              dependencies: BTreeMap<String, String>,
              exact_requirement: String,
          }''',
              '''struct Candidate {
              version: VersionMetadata,
              scheme: VersionScheme,
              dependencies: BTreeMap<String, String>,
              exact_requirement: String,
          }''',
          )
          replace_once(
              'workspace scheme field',
              '''struct WorkspaceMember {
              version: String,
              dependencies: BTreeMap<String, String>,
          }''',
              '''struct WorkspaceMember {
              version: String,
              scheme: VersionScheme,
              dependencies: BTreeMap<String, String>,
          }''',
          )
          replace_once(
              'workspace scheme collection',
              '''                        WorkspaceMember {
                                      version: member.package.version,
                                      dependencies: member.dependencies,
                                  },''',
              '''                        WorkspaceMember {
                                      version: member.package.version,
                                      scheme: member.package.version_scheme,
                                      dependencies: member.dependencies,
                                  },''',
          )
          replace_once(
              'diagnostic compatibility and yank guidance',
              '''        match &self.selected {
                      Some(version) => lines.push(format!(
                          "{indent}version conflict for {}: selected {version}, but it does not satisfy every active requirement",
                          self.key
                      )),
                      None => lines.push(format!(
                          "{indent}version conflict for {}: no single published version satisfies every active requirement",
                          self.key
                      )),
                  }''',
              '''        match self.selected.as_deref() {
                      Some("all matching versions are yanked") => lines.push(format!(
                          "{indent}version conflict for {}: all matching versions are yanked; use an existing lock with `zed install --frozen` to replay a previously selected version",
                          self.key
                      )),
                      Some(version) => lines.push(format!(
                          "{indent}version conflict for {}: selected {version}, but it does not satisfy every active requirement",
                          self.key
                      )),
                      None => lines.push(format!(
                          "{indent}version conflict for {}: no version satisfies every active requirement",
                          self.key
                      )),
                  }''',
          )
          replace_once(
              'registry candidate acquisition ordering',
              '''        let metadata = self.registry.get_version(org, name, version)?;
                  validate_version_identity(&metadata, org, name, version)?;
                  let sequence = self.next_sequence;
                  self.next_sequence += 1;
                  self.pool.submit(FetchTask {
                      sequence,
                      key: key.to_string(),
                      version: metadata.clone(),
                  })?;
                  let fetched = super::resolver::receive_in_order(self.pool, &mut self.buffered, sequence)?;
                  self.downloaded += usize::from(fetched.downloaded);
                  let candidate = Candidate {
                      exact_requirement: exact_requirement(scheme, version),
                      version: metadata,
                      dependencies: fetched.dependencies,
                  };''',
              '''        let metadata = self.registry.get_version(org, name, version)?;
                  validate_version_identity(&metadata, org, name, version)?;
                  let exact_requirement = exact_requirement(scheme, version);
                  if metadata.yanked {
                      let candidate = Candidate {
                          exact_requirement,
                          version: metadata,
                          scheme,
                          dependencies: BTreeMap::new(),
                      };
                      self.candidates.insert(cache_key, candidate.clone());
                      return Ok(candidate);
                  }

                  let sequence = self.next_sequence;
                  self.next_sequence += 1;
                  self.pool.submit(FetchTask {
                      sequence,
                      key: key.to_string(),
                      version: metadata.clone(),
                  })?;
                  let fetched = super::resolver::receive_in_order(self.pool, &mut self.buffered, sequence)?;
                  self.downloaded += usize::from(fetched.downloaded);
                  let candidate = Candidate {
                      exact_requirement,
                      version: metadata,
                      scheme,
                      dependencies: fetched.dependencies,
                  };''',
          )
          replace_once(
              'scheme-aware matcher helper',
              '''fn exact_requirement(scheme: VersionScheme, raw: &str) -> String {
              match scheme {
                  VersionScheme::Semver => format!("={raw}"),
                  VersionScheme::Calver => version::normalize_calver(raw)
                      .map(|normalized| format!("={normalized}"))
                      .unwrap_or_else(|| raw.to_string()),
                  VersionScheme::Opaque => raw.to_string(),
              }
          }

          struct GraphSolver<'a, S> {''',
              '''fn exact_requirement(scheme: VersionScheme, raw: &str) -> String {
              match scheme {
                  VersionScheme::Semver => format!("={raw}"),
                  VersionScheme::Calver => version::normalize_calver(raw)
                      .map(|normalized| format!("={normalized}"))
                      .unwrap_or_else(|| raw.to_string()),
                  VersionScheme::Opaque => raw.to_string(),
              }
          }

          fn requirement_matches(scheme: VersionScheme, requirement: &str, published: &str) -> bool {
              match scheme {
                  VersionScheme::Opaque => requirement == published,
                  VersionScheme::Semver | VersionScheme::Calver => {
                      Requirement::parse(requirement).matches(published)
                  }
              }
          }

          struct GraphSolver<'a, S> {''',
          )
          replace_once(
              'workspace initial selection',
              '''            if constraints.iter().any(|constraint| {
                          !Requirement::parse(&constraint.requirement).matches(&member.version)
                      }) {''',
              '''            if constraints.iter().any(|constraint| {
                          !requirement_matches(
                              member.scheme,
                              &constraint.requirement,
                              &member.version,
                          )
                      }) {''',
          )
          replace_once(
              'registry candidate filtering',
              '''            if constraints
                          .iter()
                          .any(|constraint| !Requirement::parse(&constraint.requirement).matches(published))
                      {''',
              '''            if constraints.iter().any(|constraint| {
                          !requirement_matches(
                              package.version_scheme,
                              &constraint.requirement,
                              published,
                          )
                      }) {''',
          )
          replace_once(
              'selected registry propagation',
              '''                if constraints.iter().any(|constraint| {
                              !Requirement::parse(&constraint.requirement).matches(&candidate.version.version)
                          }) {''',
              '''                if constraints.iter().any(|constraint| {
                              !requirement_matches(
                                  candidate.scheme,
                                  &constraint.requirement,
                                  &candidate.version.version,
                              )
                          }) {''',
          )
          replace_once(
              'selected workspace propagation',
              '''                if constraints.iter().any(|constraint| {
                              !Requirement::parse(&constraint.requirement).matches(&member.version)
                          }) {''',
              '''                if constraints.iter().any(|constraint| {
                              !requirement_matches(
                                  member.scheme,
                                  &constraint.requirement,
                                  &member.version,
                              )
                          }) {''',
          )

          method_start = text.index(
              '        fn publish(&mut self, key: &str, version_text: &str, dependencies: &[(&str, &str)]) {'
          )
          method_end_marker = '\n    }\n\n    impl SolveSource for MemorySource'
          method_end = text.index(method_end_marker, method_start) + len('\n    }')
          replacement_method = '''        fn publish(&mut self, key: &str, version_text: &str, dependencies: &[(&str, &str)]) {
                  self.publish_with_scheme(
                      key,
                      version_text,
                      VersionScheme::Semver,
                      false,
                      dependencies,
                  );
              }

              fn publish_with_scheme(
                  &mut self,
                  key: &str,
                  version_text: &str,
                  scheme: VersionScheme,
                  yanked: bool,
                  dependencies: &[(&str, &str)],
              ) {
                  let (org, name) = key.split_once('/').unwrap();
                  let metadata = VersionMetadata {
                      org: org.to_string(),
                      name: name.to_string(),
                      version: version_text.to_string(),
                      sha256: format!("{:064x}", self.candidates.len() + 1),
                      size: 1,
                      format: zed_interfaces::ArtifactFormat::TarGz,
                      vcs_tag: format!("v{version_text}"),
                      vcs_commit: Some("0123456789abcdef0123456789abcdef01234567".to_string()),
                      download_url: "https://example.invalid/artifact".to_string(),
                      published_at: "1970-01-01T00:00:00Z".to_string(),
                      yanked,
                  };
                  self.candidates.insert(
                      (key.to_string(), version_text.to_string()),
                      Candidate {
                          exact_requirement: exact_requirement(scheme, version_text),
                          version: metadata,
                          scheme,
                          dependencies: dependencies
                              .iter()
                              .map(|(key, requirement)| ((*key).to_string(), (*requirement).to_string()))
                              .collect(),
                      },
                  );
                  let package = self
                      .packages
                      .entry(key.to_string())
                      .or_insert_with(|| PackageMetadata {
                          org: org.to_string(),
                          name: name.to_string(),
                          description: None,
                          vcs: Vcs::Git,
                          repo_url: format!("https://example.invalid/{key}"),
                          version_scheme: scheme,
                          latest: None,
                          tags: Vec::new(),
                          versions: Vec::new(),
                      });
                  assert_eq!(
                      package.version_scheme, scheme,
                      "a package cannot mix version schemes"
                  );
                  package.versions.push(version_text.to_string());
                  version::sort_desc(&mut package.versions);
                  package.latest = package.versions.first().cloned();
              }'''
          text = text[:method_start] + replacement_method + text[method_end:]

          test_marker = '''    #[test]
              fn dependency_cycles_terminate_with_one_selected_version_per_key() {'''
          if text.count(test_marker) != 1:
              raise SystemExit('cycle test marker changed')
          extra_tests = '''    #[test]
              fn opaque_versions_accept_only_exact_requirements() {
                  let mut source = MemorySource::default();
                  source.publish_with_scheme(
                      "test/opaque",
                      "legacy-api",
                      VersionScheme::Opaque,
                      false,
                      &[],
                  );
                  source.publish_with_scheme(
                      "test/opaque",
                      "release-candidate-1",
                      VersionScheme::Opaque,
                      false,
                      &[],
                  );

                  let solved = solve_memory(&mut source, &[("test/opaque", "legacy-api")]).unwrap();
                  assert_eq!(solved.selected_version("test/opaque"), Some("legacy-api"));

                  let error = solve_memory(&mut source, &[("test/opaque", "^1")])
                      .unwrap_err()
                      .to_string();
                  assert!(error.contains("no version"), "{error}");
              }

              #[test]
              fn yanked_only_matches_are_rejected_with_frozen_guidance() {
                  let mut source = MemorySource::default();
                  source.publish_with_scheme(
                      "test/yanked",
                      "1.0.0",
                      VersionScheme::Semver,
                      true,
                      &[],
                  );

                  let error = solve_memory(&mut source, &[("test/yanked", "^1")])
                      .unwrap_err()
                      .to_string();
                  assert!(error.contains("all matching versions are yanked"), "{error}");
                  assert!(error.contains("--frozen"), "{error}");
              }

          '''
          text = text.replace(test_marker, extra_tests + test_marker, 1)
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Prove focused compatibility and solver contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib install_graph::solver::tests
          cargo test --locked --test e2e opaque_versions_require_exact_match -- --exact
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit the permanent solver fix and remove this helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/den-1553-complete-constraint-solver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          product = 'src/install_graph/solver.rs'
          helper = '.github/workflows/den-1553-fix-scheme-and-yank.yml'

          def request(method, endpoint, payload=None):
              req = urllib.request.Request(
                  api + endpoint,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'zed-den-1553-scheme-yank-fix',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f'GitHub API {method} {endpoint} failed with HTTP {error.code}'
                  )
              return json.loads(body) if body else None

          live = request('GET', f'/git/ref/heads/{branch}')['object']['sha']
          if live != expected:
              raise SystemExit(f'branch advanced: expected {expected}, found {live}')
          parent = request('GET', f'/git/commits/{live}')
          blob = request('POST', '/git/blobs', {
              'content': base64.b64encode(Path(product).read_bytes()).decode(),
              'encoding': 'base64',
          })
          tree = request('POST', '/git/trees', {
              'base_tree': parent['tree']['sha'],
              'tree': [
                  {'path': product, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']},
                  {'path': helper, 'mode': '100644', 'type': 'blob', 'sha': None},
              ],
          })
          commit = request('POST', '/git/commits', {
              'message': (
                  'fix(DEN-1553): preserve opaque semantics and skip yanked acquisition\n\n'
                  'Match constraints using each package version scheme so opaque tags remain '
                  'exact-only. Read immutable version metadata before artifact submission, cache '
                  'yanked candidates without downloading or extracting them, and guide fresh '
                  'resolution failures toward lock-authoritative --frozen replay. Preserve '
                  'deterministic conflict provenance and the existing no-version compatibility '
                  'diagnostic.'
              ),
              'tree': tree['sha'],
              'parents': [live],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {
              'sha': commit['sha'],
              'force': False,
          })
          print(commit['sha'])
          PY
