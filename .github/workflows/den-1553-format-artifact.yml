name: DEN-1553 formatter artifact

on:
  pull_request:
    paths:
      - '.github/workflows/den-1553-format-artifact.yml'
      - 'src/config.rs'
      - 'src/install_graph.rs'
      - 'src/install_graph/**'
      - 'src/ops_entry.rs'

permissions:
  contents: read

concurrency:
  group: den-1553-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1553-complete-constraint-solver' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Install the repository toolchain formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
      - name: Produce canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
      - name: Upload only the formatted product files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: den-1553-formatted-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            src/config.rs
            src/install_graph.rs
            src/install_graph/resolver.rs
            src/install_graph/solver.rs
            src/ops_entry.rs
