name: DEN-1553 publish proven solver

on:
  pull_request:
    paths:
      - '.github/scripts/den-1553-scheme-yank.py'
      - '.github/scripts/den-1553-frontier-prefetch.py'
      - '.github/workflows/den-1553-prove-scheme-yank.yml'
      - 'src/install_graph/solver.rs'
      - 'tests/e2e.rs'
      - 'tests/recursive_install_concurrency.rs'

permissions:
  contents: write

concurrency:
  group: den-1553-publish-proven-solver
  cancel-in-progress: false

jobs:
  prove-and-publish:
    if: >-
      github.repository == 'zed-pkg/zed-cli' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/den-1553-complete-constraint-solver'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Regenerate the exact reviewed solver
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/den-1553-scheme-yank.py \
            .github/scripts/den-1553-frontier-prefetch.py
          python3 .github/scripts/den-1553-scheme-yank.py
          python3 .github/scripts/den-1553-frontier-prefetch.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          printf '%s  %s\n' \
            'a583718ecc9675186f40fd5b27f509e97a3b339a7650ebf89dc33c7b3a882ef3' \
            'src/install_graph/solver.rs' | sha256sum --check --strict

      - name: Prove focused compatibility, policy, and concurrency
        run: |
          set -euo pipefail
          cargo test --locked --lib install_graph::solver::tests
          cargo test --locked --test e2e opaque_versions_require_exact_match -- --exact
          cargo test --locked --test recursive_install_concurrency \
            recursive_http_prefetch_saturates_at_five_and_warm_runs_do_not_redownload -- --exact

      - name: Prove the complete Rust repository target set
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Publish permanent bytes and remove review scaffolding
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/den-1553-complete-constraint-solver
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          solver = Path('src/install_graph/solver.rs')
          expected_digest = 'a583718ecc9675186f40fd5b27f509e97a3b339a7650ebf89dc33c7b3a882ef3'
          delete_paths = [
              '.github/scripts/den-1553-scheme-yank.py',
              '.github/scripts/den-1553-frontier-prefetch.py',
              '.github/workflows/den-1553-prove-scheme-yank.yml',
          ]

          import hashlib
          actual_digest = hashlib.sha256(solver.read_bytes()).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit(
                  f'solver digest changed: expected {expected_digest}, found {actual_digest}'
              )

          def request(method, endpoint, payload=None):
              req = urllib.request.Request(
                  api + endpoint,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'zed-den-1553-publish-proven-solver',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(2_000_000)
              except urllib.error.HTTPError as error:
                  detail = error.read(16_384).decode(errors='replace')
                  raise SystemExit(
                      f'GitHub API {method} {endpoint} failed with HTTP {error.code}: {detail}'
                  )
              return json.loads(body) if body else None

          live = request('GET', f'/git/ref/heads/{branch}')['object']['sha']
          if live != expected:
              raise SystemExit(f'branch advanced: expected {expected}, found {live}')
          parent = request('GET', f'/git/commits/{live}')
          blob = request('POST', '/git/blobs', {
              'content': base64.b64encode(solver.read_bytes()).decode(),
              'encoding': 'base64',
          })
          entries = [
              {
                  'path': 'src/install_graph/solver.rs',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              }
          ]
          entries.extend(
              {'path': path, 'mode': '100644', 'type': 'blob', 'sha': None}
              for path in delete_paths
          )
          tree = request('POST', '/git/trees', {
              'base_tree': parent['tree']['sha'],
              'tree': entries,
          })
          commit = request('POST', '/git/commits', {
              'message': (
                  'fix(DEN-1553): preserve schemes, yank policy, and five-worker prefetch\n\n'
                  'Match requirements according to each package version scheme so opaque tags '
                  'remain exact-only. Reject yanked candidates from immutable metadata before '
                  'artifact acquisition while preserving lock-authoritative frozen replay. '
                  'Batch one highest viable candidate per active unresolved coordinate through '
                  'the bounded FetchPool so cold wide frontiers reach five workers without '
                  'eagerly downloading alternate versions. Remove all temporary review '
                  'generators after exact-hash, all-target, and Clippy validation.'
              ),
              'tree': tree['sha'],
              'parents': [live],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {
              'sha': commit['sha'],
              'force': False,
          })
          print(commit['sha'])
          PY

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-1553-publish-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/install_graph/solver.rs
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
