name: DEN-1616 final shell-matrix synchronization

on:
  push:
    branches:
      - agent/den-1616-powershell-no-profile

permissions:
  contents: write

concurrency:
  group: den-1616-final-shell-matrix-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Synchronize the remaining PowerShell matrix expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/develop_shell_edge_cases.rs')
          text = path.read_text(encoding='utf-8')
          old = '("PwSh.ExE", vec!["-NoLogo", "-Command", script]),'
          new = '''(
              "PwSh.ExE",
              vec![
                  "-NoLogo",
                  "-NoProfile",
                  "-NonInteractive",
                  "-Command",
                  script,
              ],
          ),'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale PowerShell shell-matrix vector')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cargo fmt --all
          cargo test --locked --test develop_shell_edge_cases \
            shell_dispatch_covers_posix_fish_powershell_cmd_and_generic_shells
          git diff --check

      - name: Publish the validated regression synchronization
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-1616-final-matrix-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/develop_shell_edge_cases.rs
          git commit -m 'test(DEN-1616): synchronize the full PowerShell shell matrix'
          git push origin "HEAD:${GITHUB_REF_NAME}"
