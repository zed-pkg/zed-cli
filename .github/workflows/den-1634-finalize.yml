name: DEN-1634 Windows child cwd finalizer

on:
  push:
    branches:
      - agent/den-1616-powershell-no-profile
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-1634-finalize.yml'
      - 'scripts/den-1634-finalize.py'

permissions:
  contents: write

concurrency:
  group: den-1634-windows-child-cwd-finalizer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'agent/den-1616-powershell-no-profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply and validate the child-current-directory correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/den-1634-finalize.py
          cargo fmt --all
          cargo test --locked --lib windows_child_cwd_
          cargo test --locked --lib powershell_command_mode_disables_profiles_and_interaction
          cargo test --locked --test develop_edge_cases shell_name_controls_the_command_argument_protocol
          cargo test --locked --test develop_shell_edge_cases \
            shell_dispatch_covers_posix_fish_powershell_cmd_and_generic_shells
          cargo clippy --locked --lib -- -D warnings
          git diff --check

      - name: Publish the validated source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1634): normalize Windows child process cwd paths'
          git push origin "HEAD:${TARGET_BRANCH}"
