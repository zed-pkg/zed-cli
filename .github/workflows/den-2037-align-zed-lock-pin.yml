name: DEN-2037 align secure zed-lock evidence pins

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths:
      - '.github/workflows/den-2037-align-zed-lock-pin.yml'

permissions:
  contents: write

concurrency:
  group: den-2037-align-zed-lock-pin
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 1
      - name: Replace the superseded exact revision everywhere it is evidence
        env:
          OLD_ZED_LOCK_REV: 1db0da00d30fcf2e0762f50eedb1f88458020b52
          NEW_ZED_LOCK_REV: dec9801c7fdfa809576612dc503c6423906f3e71
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_ZED_LOCK_REV']
          new = os.environ['NEW_ZED_LOCK_REV']
          paths = [
              Path('docs/locking.md'),
              Path('.github/workflows/blocking-store-process-locks.yml'),
              Path('.github/workflows/den-2037-local-lock-consumer.yml'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: missing superseded pin {old}')
              path.write_text(text.replace(old, new))
              total += count
              print(f'{path}: replaced {count} occurrence(s)')
          if total < 4:
              raise SystemExit(f'expected at least four evidence pins, replaced {total}')
          PY
          grep -F "$NEW_ZED_LOCK_REV" Cargo.toml Cargo.lock docs/locking.md .github/workflows/blocking-store-process-locks.yml .github/workflows/den-2037-local-lock-consumer.yml
          if grep -F "$OLD_ZED_LOCK_REV" docs/locking.md .github/workflows/blocking-store-process-locks.yml .github/workflows/den-2037-local-lock-consumer.yml; then
            echo 'superseded zed-lock revision remains in exact-evidence files' >&2
            exit 1
          fi
      - name: Commit aligned evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/den-2037-align-zed-lock-pin.yml
          git config user.name 'ORESoftware CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/locking.md .github/workflows/blocking-store-process-locks.yml .github/workflows/den-2037-local-lock-consumer.yml
          git commit -m 'fix(DEN-2037): align secure zed-lock evidence pins'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
