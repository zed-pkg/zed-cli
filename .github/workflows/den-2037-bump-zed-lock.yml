name: DEN-2037 certified zed-lock pin bump

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths: ['.github/workflows/den-2037-bump-zed-lock.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Replace every production/evidence pin atomically
        env:
          OLD_REV: dec9801c7fdfa809576612dc503c6423906f3e71
          NEW_REV: b595b7c7192e9d298ced77fa3758440052300348
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          old=os.environ['OLD_REV']; new=os.environ['NEW_REV']
          paths=[Path('Cargo.toml'),Path('docs/locking.md'),Path('.github/workflows/blocking-store-process-locks.yml')]
          for path in paths:
              text=path.read_text()
              count=text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: old zed-lock revision not found')
              path.write_text(text.replace(old,new))
          docs=Path('docs/locking.md')
          text=docs.read_text().replace(
              'revision includes the DEN-3091 private lock-path and symlink-resistant-open\nhardening plus the Windows contention normalization certified by DEN-3167.',
              'revision includes the DEN-3091 private lock-path and symlink-resistant-open\nhardening, the Windows DACL-protection correction, DEN-3167 contention normalization,\nand the merged DEN-2037 sixth-order API-state/event conformance suite.',
          )
          docs.write_text(text)
          PY
      - name: Regenerate the exact Cargo lock graph
        env:
          NEW_REV: b595b7c7192e9d298ced77fa3758440052300348
        run: |
          set -euo pipefail
          cargo update -p zed-lock
          cargo metadata --locked --format-version 1 | python3 -c 'import json,os,sys; d=json.load(sys.stdin); p=[x for x in d["packages"] if x["name"]=="zed-lock"]; assert len(p)==1,p; s=p[0]["source"] or ""; assert os.environ["NEW_REV"] in s,s; print(s)'
      - name: Run static DEN-2037 evidence admission
        run: python3 scripts/check-den-2037-local-lock-consumer.py
      - name: Commit only the certified pin set
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock docs/locking.md .github/workflows/blocking-store-process-locks.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'fix(DEN-2037): pin zed-cli to certified zed-lock merge'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
