name: DEN-2037 certified zed-lock pin bump

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths: ['.github/workflows/den-2037-bump-zed-lock.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Replace every production/evidence pin atomically
        env:
          OLD_REV: 1db0da00d30fcf2e0762f50eedb1f88458020b52
          NEW_REV: da3962afc72e66e252be8da403a6cec70d520115
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          old=os.environ['OLD_REV']; new=os.environ['NEW_REV']
          paths=[Path('Cargo.toml'),Path('docs/locking.md'),Path('.github/workflows/blocking-store-process-locks.yml')]
          for path in paths:
              text=path.read_text()
              count=text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: old zed-lock revision not found')
              path.write_text(text.replace(old,new))
          cargo=Path('Cargo.toml')
          text=cargo.read_text()
          text=text.replace(
              '# Includes the Windows ERROR_LOCK_VIOLATION contention normalization certified by DEN-3167.\nzed-lock =',
              '# Includes DEN-3091 private/symlink-resistant paths and DEN-3167 Windows contention normalization.\nzed-lock =',
          )
          cargo.write_text(text)
          docs=Path('docs/locking.md')
          text=docs.read_text().replace(
              'revision identifies `zed-lock` version `0.1.1`.',
              'revision identifies `zed-lock` version `0.1.1` and includes the DEN-3091 fail-closed private-path authority (Unix 0700/0600 plus symlink-resistant open and Windows private-DACL/reparse handling).',
          )
          docs.write_text(text)
          PY
      - name: Regenerate the exact Cargo lock graph
        run: |
          set -euo pipefail
          cargo update -p zed-lock
          cargo metadata --locked --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); p=[x for x in d["packages"] if x["name"]=="zed-lock"]; assert len(p)==1,p; s=p[0]["source"] or ""; assert "da3962afc72e66e252be8da403a6cec70d520115" in s,s; print(s)'
      - name: Run static DEN-2037 evidence admission
        run: python3 scripts/check-den-2037-local-lock-consumer.py
      - name: Commit only the certified pin set
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock docs/locking.md .github/workflows/blocking-store-process-locks.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'fix(DEN-2037): pin zed-cli to hardened zed-lock authority'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
