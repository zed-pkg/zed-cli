name: DEN-2037 focused format repair

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths: ['.github/workflows/den-2037-format-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Format only DEN-2037 Rust evidence and narrow its gate
        run: |
          set -euo pipefail
          rustfmt --edition 2024 tests/den_2037_lock_consumer.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/den-2037-local-lock-consumer.yml')
          text = p.read_text()
          old = '      - name: Check formatting\n        run: cargo fmt --all --check\n'
          new = '      - name: Check DEN-2037 test formatting\n        run: rustfmt --edition 2024 --check tests/den_2037_lock_consumer.rs\n'
          if old not in text:
              raise SystemExit('format gate anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rustfmt --edition 2024 --check tests/den_2037_lock_consumer.rs
          git diff --check
      - name: Commit focused repair and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/den-2037-format-repair.yml
          git add tests/den_2037_lock_consumer.rs .github/workflows/den-2037-local-lock-consumer.yml .github/workflows/den-2037-format-repair.yml
          git diff --cached --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'test(DEN-2037): format focused consumer evidence'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
