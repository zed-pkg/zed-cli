name: DEN-2037 pin repair

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths: ['.github/workflows/den-2037-pin-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile exact production zed-lock evidence pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/locking.md')
          text = p.read_text()
          text = text.replace(
              '`0fc100afc3cd60b5ce091b4207f910bf08f2cfb7`, which is also the source of the\n[`v0.1.0` release](https://github.com/zed-pkg/zed-lock/releases/tag/v0.1.0).\n\nThe release contains the packaged `zed-lock-0.1.0.crate` archive and a\nSHA-256 sidecar. The crate archive digest is\n`2850b39d1906433ea584fb649934936137dae873eaecf127666f5d88740b3f20`.',
              '`1db0da00d30fcf2e0762f50eedb1f88458020b52`, the exact revision enforced by\n`Cargo.toml`, `Cargo.lock`, and the blocking-store process-lock workflow. That\nrevision identifies `zed-lock` version `0.1.1`. Release artifact digests are\nverified at the `zed-lock` publication boundary rather than duplicated here.'
          )
          p.write_text(text)
          PY
          grep -q '1db0da00d30fcf2e0762f50eedb1f88458020b52' docs/locking.md
          ! grep -q '0fc100afc3cd60b5ce091b4207f910bf08f2cfb7' docs/locking.md
      - name: Commit documentation repair
        run: |
          set -euo pipefail
          git add docs/locking.md
          if git diff --cached --quiet; then
            echo 'documentation already reconciled'
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git commit -m 'docs(DEN-2037): align zed-lock evidence pin'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
