name: DEN-2037 refresh zed-lock lockfile

on:
  push:
    branches: [den-2037-consumer-local-lock-e2e-v1]
    paths:
      - '.github/workflows/den-2037-refresh-zed-lock-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: den-2037-refresh-zed-lock-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Refresh only the exact zed-lock source
        run: |
          set -euo pipefail
          cargo update -p zed-lock --precise dec9801c7fdfa809576612dc503c6423906f3e71
          git diff -- Cargo.lock
          grep -F 'dec9801c7fdfa809576612dc503c6423906f3e71' Cargo.lock
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'ORESoftware CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore(DEN-2037): refresh zed-lock lockfile'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
