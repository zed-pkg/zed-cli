name: DEN-2037 tree_depth type repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/den-2037-tree-depth-repair.yml'

permissions:
  contents: write

concurrency:
  group: den-2037-tree-depth-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2037-tree-depth-type-contract
          fetch-depth: 1
          persist-credentials: true

      - name: Replace the unsupported int token and remove this helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.cli-flags.toml')
          text = path.read_text()
          anchor = '[commands.tree.flags.tree_depth]\nenv = "ZED_PKG_TREE_DEPTH"\naliases = ["depth"]\ntype = "int"\n'
          replacement = anchor.replace('type = "int"', 'type = "integer"')
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one tree_depth int contract')
          path.write_text(text.replace(anchor, replacement))
          PY
          grep -A4 '^\[commands.tree.flags.tree_depth\]$' .cli-flags.toml | grep -F 'type = "integer"'
          ! grep -A4 '^\[commands.tree.flags.tree_depth\]$' .cli-flags.toml | grep -F 'type = "int"'
          git rm .github/workflows/den-2037-tree-depth-repair.yml
          git config user.name 'ORESoftware CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cli-flags.toml
          git diff --cached --check
          git commit -m 'fix(flags): use integer type for tree depth'
          git push origin HEAD:den-2037-tree-depth-type-contract
