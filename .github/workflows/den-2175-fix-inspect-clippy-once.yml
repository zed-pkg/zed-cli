name: DEN-2175 apply inspect Clippy fix once

on:
  push:
    branches:
      - agent/den-2175-inspect-json-v1
    paths:
      - .github/workflows/den-2175-fix-inspect-clippy-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: den-2175-inspect-clippy-fix-once
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact triggering branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply only Clippy's collapsible-if rewrite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/inspect.rs')
          text = path.read_text()
          pattern = re.compile(
              r'    if let Some\(lockfile\) = &lockfile \{\n'
              r'        if !lockfile\.packages\.is_empty\(\) && !materialization_path\.is_dir\(\) \{\n'
              r'(?P<body>.*?)'
              r'        \}\n'
              r'    \}\n',
              re.S,
          )

          def replacement(match):
              return (
                  '    if let Some(lockfile) = &lockfile\n'
                  '        && !lockfile.packages.is_empty()\n'
                  '        && !materialization_path.is_dir()\n'
                  '    {\n'
                  + match.group('body')
                  + '    }\n'
              )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one collapsible-if target, found {count}')
          path.write_text(updated)
          PY

      - name: Install Rust quality toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Format exact patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check

      - name: Run library tests
        shell: bash
        run: cargo test --locked --lib

      - name: Run inspect CLI integration test
        shell: bash
        run: cargo test --locked --test inspect_cli

      - name: Run Clippy with warnings denied
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Commit verified fix and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/den-2175-fix-inspect-clippy-once.yml
          git add src/inspect.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-2175): satisfy strict inspect Clippy gate'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/den-2175-inspect-json-v1
          gh pr comment 235 --repo zed-pkg/zed-cli --body "One-shot strict quality repair passed rustfmt, library tests, inspect integration, and Clippy -D warnings before push. Final repaired head: \`${final_sha}\`. The one-shot workflow removed itself in the same commit." >/dev/null || true
