name: DEN-3282 interface pin fixup

on:
  push:
    branches: ["den-3282-source-composition-current-main-20260918"]
    paths:
      - "Cargo.toml"
      - ".github/workflows/den-3282-interface-pin-fixup.yml"

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: den-3282-source-composition-current-main-20260918
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Regenerate the exact interface lock
        run: |
          set -euo pipefail
          grep -F 'rev = "aa0f87be13cdf003600b42a6088202898fcbae8d"' Cargo.toml
          cargo update -p zed-interfaces --precise aa0f87be13cdf003600b42a6088202898fcbae8d
          cargo fmt --all -- --check
          cargo check --locked --lib
          grep -F 'source = "git+https://github.com/zed-pkg/zed-interfaces.git?rev=aa0f87be13cdf003600b42a6088202898fcbae8d#aa0f87be13cdf003600b42a6088202898fcbae8d"' Cargo.lock
      - name: Commit generated lock and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/den-3282-interface-pin-fixup.yml
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add Cargo.lock .github/workflows/den-3282-interface-pin-fixup.yml
          if git diff --cached --quiet; then
            echo "expected generated lock or workflow removal delta" >&2
            exit 1
          fi
          git commit -m "DEN-3282: regenerate lock for merged interface contract"
          git push origin HEAD:den-3282-source-composition-current-main-20260918
