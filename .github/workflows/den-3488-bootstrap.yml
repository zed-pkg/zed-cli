name: DEN-3488 bootstrap exact graph

on:
  push:
    branches: [feat/den-3488-versioned-circular-graph]
    paths: [.bootstrap/READY]

permissions:
  contents: write

concurrency:
  group: den-3488-bootstrap
  cancel-in-progress: true

jobs:
  assemble-format-lock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Verify complete staged source set
        shell: bash
        run: |
          test -f .bootstrap/READY
          test -f .bootstrap/Cargo.toml
          test -f .bootstrap/lib.rs
          test -f .bootstrap/graph_export.rs
          test -f .bootstrap/versioned_dependency_cycles.rs
          test -f .bootstrap/versioned-circular-dependencies.md
          test -f .bootstrap/versioned-circular-dependencies.yml
          test "$(find .bootstrap -maxdepth 1 -name 'versioned_graph.part-*' | wc -l)" -eq 7
      - name: Assemble product changes
        shell: bash
        run: |
          cat .bootstrap/versioned_graph.part-* > src/versioned_graph.rs
          cp .bootstrap/Cargo.toml Cargo.toml
          cp .bootstrap/lib.rs src/lib.rs
          cp .bootstrap/graph_export.rs src/graph_export.rs
          cp .bootstrap/versioned_dependency_cycles.rs tests/versioned_dependency_cycles.rs
          cp .bootstrap/versioned-circular-dependencies.md docs/versioned-circular-dependencies.md
          cp .bootstrap/versioned-circular-dependencies.yml .github/workflows/versioned-circular-dependencies.yml
          rm -rf .bootstrap
          cargo fmt --all
          cargo generate-lockfile
          git diff --check
      - name: Persist assembled source and lock
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m $'feat(DEN-3488): materialize exact circular dependency graphs\n\nLinear: DEN-3488'
          git push origin HEAD
      - name: Exact-node unit tests
        run: cargo test --locked --lib versioned_graph -- --nocapture
      - name: Public graph command tests
        run: cargo test --locked --lib graph_export::tests -- --nocapture
      - name: Executable finite-symlink tests
        run: cargo test --locked --test versioned_dependency_cycles -- --nocapture
      - name: Full all-target test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
