name: DEN-3488 feature validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rust-feature-validation:
    if: github.head_ref == 'DEN-3488-local-dev-repo-race' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-3488-local-dev-repo-race
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Wire local discovery to speculative resolution gate
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/local_dev.rs')
          text = path.read_text()

          old_docs = '''/// When the complete reachable graph exists locally, the cancellation token
/// drops the active Hyper metadata request future and the remote resolver is
/// joined for deterministic cleanup rather than detached. Artifact body fetches
/// still have a legacy blocking compatibility path and are migrated separately.
///
/// For mixed graphs, the already-running remote solve is joined and reused;'''
          new_docs = '''/// While local discovery runs, only cancellable Hyper metadata is allowed to
/// advance. A resolution gate prevents selected version metadata from reaching
/// the artifact queue until local discovery explicitly chooses remote work.
/// A complete local graph cancels the Hyper request and closes the gate, so no
/// legacy artifact download can start before the local result wins.
///
/// For mixed graphs, the gate opens and the already-running remote solve is reused;'''
          if old_docs in text:
              text = text.replace(old_docs, new_docs)

          old_spawn = '''    let cancel = CancellationToken::new();
    let remote_cancel = cancel.clone();
    let remote = thread::Builder::new()
        .name("zed-local-dev-remote-resolution".to_string())
        .spawn(move || {
            install_graph::prepare_cancellable(&remote_project, &remote_cfg, remote_cancel)
        })'''
          new_spawn = '''    let cancel = CancellationToken::new();
    let remote_cancel = cancel.clone();
    let gate = install_graph::ResolutionGate::new();
    let remote_gate = gate.clone();
    let remote = thread::Builder::new()
        .name("zed-local-dev-remote-resolution".to_string())
        .spawn(move || {
            install_graph::prepare_cancellable(
                &remote_project,
                &remote_cfg,
                remote_cancel,
                remote_gate,
            )
        })'''
          if old_spawn in text:
              text = text.replace(old_spawn, new_spawn)
          elif 'let remote_gate = gate.clone();' not in text:
              raise SystemExit('remote gate insertion point not found')

          old_error = '''        Err(error) => {
            let prepared = join_remote(remote)?;'''
          new_error = '''        Err(error) => {
            gate.continue_resolution();
            let prepared = join_remote(remote)?;'''
          if old_error in text:
              text = text.replace(old_error, new_error, 1)
          elif 'Err(error) => {\n            gate.continue_resolution();' not in text:
              raise SystemExit('discovery error gate insertion point not found')

          old_local = '''    let prepared = if discovery.has_ambient_matches() && discovery.all_local {
        cancel.cancel();
        if let Err(error) = join_remote(remote) {'''
          new_local = '''    let prepared = if discovery.has_ambient_matches() && discovery.all_local {
        cancel.cancel();
        gate.cancel_resolution();
        if let Err(error) = join_remote(remote) {'''
          if old_local in text:
              text = text.replace(old_local, new_local, 1)
          elif 'gate.cancel_resolution();' not in text:
              raise SystemExit('local-win gate insertion point not found')

          old_remote = '''    } else {
        let prepared = join_remote(remote)?;
        let exact = prepared.exact_requirements();'''
          new_remote = '''    } else {
        gate.continue_resolution();
        let prepared = join_remote(remote)?;
        let exact = prepared.exact_requirements();'''
          if old_remote in text:
              text = text.replace(old_remote, new_remote, 1)
          elif 'gate.continue_resolution();\n        let prepared = join_remote(remote)?;' not in text:
              raise SystemExit('remote-continue gate insertion point not found')

          path.write_text(text)

      - name: Refresh stale generated lockfile in runner only
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p zed-lock

      - name: Format migrated Rust
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Compile library without test-only baseline defects
        run: cargo check --lib

      - name: Remove duplicate main-branch test import in runner only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/install_graph/hardening_tests.rs')
          lines = path.read_text().splitlines(keepends=True)
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'use crate::registry::registry_for;'
          ]
          if len(matches) == 2:
              del lines[matches[1]]
              path.write_text(''.join(lines))
          elif len(matches) != 1:
              raise SystemExit(
                  f'expected one or two registry_for imports, found {len(matches)}'
              )
          PY

      - name: Test local checkout resolver
        run: cargo test --lib local_dev

      - name: Test cancellable registry gate
        run: cargo test --lib cancellable

      - name: Check CLI binary
        run: cargo check --bins

      - name: Clippy feature library
        run: cargo clippy --lib -- -A unsafe-code -D warnings

      - name: Commit validated gate wiring
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- Cargo.lock src/install_graph/hardening_tests.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/local_dev.rs src/install_graph.rs src/install_graph/cancellable.rs
          if git diff --cached --quiet; then
            echo 'Gate wiring already committed.'
            exit 0
          fi
          git commit -m 'DEN-3488 gate artifact work behind local resolution decision'
          git push origin HEAD:DEN-3488-local-dev-repo-race
