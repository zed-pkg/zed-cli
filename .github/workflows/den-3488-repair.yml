name: repair and validate DEN-3488 exact graph

on:
  push:
    branches:
      - feat/den-3488-versioned-circular-graph

permissions:
  contents: write

concurrency:
  group: den-3488-repair
  cancel-in-progress: true

jobs:
  repair-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[den-3488-repaired]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Apply exact compile and lint repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} occurrence(s), found {count}: {old!r}"
                  )
              file.write_text(text.replace(old, new))

          replace_exact(
              "Cargo.toml",
              'oresoftware-next-loggers = { git = "https://github.com/ores-otel/ores.otel.log.git", rev = "39b897243b92839a80a9fa67a39745710ca93fd4", package = "oresoftware-next-loggers" }',
              'next_loggers = { git = "https://github.com/ores-otel/ores.otel.log.git", rev = "9e28eca35b4c3f283cde933ae645216972d2f3e3", package = "oresoftware-next-loggers" }',
          )
          replace_exact(
              "src/versioned_graph.rs",
              "            cycles[0].path,\n            vec![id(\"a\", \"2\"), id(\"b\", \"0\"), id(\"a\", \"2\")]",
              "            cycles[0],\n            vec![id(\"a\", \"2\"), id(\"b\", \"0\"), id(\"a\", \"2\")]",
          )
          replace_exact(
              "src/versioned_graph.rs",
              "        assert_eq!(cycles[0].path, vec![only.clone(), only]);",
              "        assert_eq!(cycles[0], vec![only.clone(), only]);",
          )
          replace_exact(
              "src/binary_archive.rs",
              "use crate::registry::registry_for;\n",
              "",
          )
          replace_exact(
              "src/install_graph.rs",
              "use crate::registry::{Registry, registry_for};\n",
              "use crate::registry::Registry;\n#[cfg(test)]\nuse crate::registry::registry_for;\n",
          )
          replace_exact(
              "src/publisher_keys.rs",
              '        let (stored, public) = key_pair("acme-2026");\n        let other_signing = SigningKey::from_bytes(&[9_u8; 32]);',
              '        let (_stored, public) = key_pair("acme-2026");\n        let other_signing = SigningKey::from_bytes(&[9_u8; 32]);',
          )
          PY
      - name: Refresh lockfile and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
      - name: Exact-node unit tests
        run: cargo test --locked --lib versioned_graph -- --nocapture
      - name: Public graph command tests
        run: cargo test --locked --lib graph_export::tests -- --nocapture
      - name: Executable finite-symlink tests
        run: cargo test --locked --test versioned_dependency_cycles -- --nocapture
      - name: Adjacent resolver and materializer tests
        run: |
          cargo test --locked --lib install_graph::hardening_tests
          cargo test --locked --lib materialize::tests
      - name: Compile every target and test executable
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets --no-run
      - name: Prepare current-main baseline worktree
        run: git worktree add --detach /tmp/zed-cli-main origin/main
      - name: Confirm the three unrelated Clippy failures already exist on main
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zed-cli-main
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-main-clippy-baseline"
          export CARGO_TERM_COLOR=never
          set +e
          cargo clippy --locked --all-targets -- -D warnings > /tmp/main-clippy.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq 'large size difference between variants' /tmp/main-clippy.log
          grep -Fq 'this function has too many arguments' /tmp/main-clippy.log
          grep -Fq 'very complex type used' /tmp/main-clippy.log
      - name: Deny every warning except the three verified main-baseline lints
        run: |
          cargo clippy --locked --all-targets -- \
            -D warnings \
            -A clippy::large-enum-variant \
            -A clippy::too-many-arguments \
            -A clippy::type-complexity
      - name: Confirm broad-suite failures already exist on main
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/zed-cli-main
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-main-test-baseline"
          expected_failures=(
            'cli::tests::cli_flags_toml_is_in_sync_with_clap'
            'cli::tests::readme_documents_every_command'
            'dev::tests::develop_contract_and_typed_parser_expose_the_same_environment_keys'
            'mirror::tests::alternate_urls_are_tried_before_the_next_mirror'
            'mirror::tests::object_store_key_matches_the_server_layout'
            'validation::tests::checked_in_schemas_are_pinned_to_the_dependency_revision'
          )
          for test_name in "${expected_failures[@]}"; do
            echo "verifying main baseline failure: $test_name"
            if cargo test --locked --lib "$test_name"; then
              echo "expected main to reproduce $test_name, but it passed" >&2
              exit 1
            fi
          done
      - name: Commit the validated repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/versioned_graph.rs src/binary_archive.rs src/install_graph.rs src/publisher_keys.rs
          git commit -m "fix(DEN-3488): compile and validate exact cycle graph [den-3488-repaired]"
          git push origin HEAD:feat/den-3488-versioned-circular-graph
