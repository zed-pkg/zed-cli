name: DEN-3495 refresh merged contract graph

on:
  push:
    branches:
      - feat/DEN-3495-cargo-git-cli-install
    paths:
      - ".github/workflows/den-3495-refresh-contract-graph.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/DEN-3495-cargo-git-cli-install
          fetch-depth: 1
          persist-credentials: true
      - name: Refresh only reviewed dependency identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              "eac0878750332b031bc12f6040b6a795a17e7417": "c8af76191f50ad7a177eb68740e69bdfaa652ff6",
              "b32e089caea772f166204fb1c7bcaad6f56942fe": "bc72c632c92b21032728f2c48a67cb4d73ee98ba",
          }
          lock = Path("Cargo.lock")
          text = lock.read_text()
          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"Cargo.lock: expected exactly 2 occurrences of {old}, found {count}")
              text = text.replace(old, new)
          lock.write_text(text)

          file_replacements = {
              ".github/workflows/ci.yml": {
                  "0c51d732cb01a377b2bc00e8d945b355e41961c1": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              },
              ".github/workflows/frozen-lock-integrity.yml": {
                  "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              },
              ".github/workflows/nix-bundle-write.yml": {
                  "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              },
              ".github/workflows/nix-export-bundle.yml": {
                  "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              },
              ".github/workflows/nix-export-plan.yml": {
                  "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              },
              ".github/workflows/zed-package-graph.yml": {
                  "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
                  "eac0878750332b031bc12f6040b6a795a17e7417": "c8af76191f50ad7a177eb68740e69bdfaa652ff6",
                  "b32e089caea772f166204fb1c7bcaad6f56942fe": "bc72c632c92b21032728f2c48a67cb4d73ee98ba",
              },
          }
          for filename, mapping in file_replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in mapping.items():
                  count = text.count(old)
                  if count < 1:
                      raise SystemExit(f"{filename}: expected at least one occurrence of {old}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check
      - name: Reject stale contract graph pins
        shell: bash
        run: |
          set -euo pipefail
          for stale in \
            3c54298fc7a8c1b2f9c1d74f588c6118b38f197e \
            eac0878750332b031bc12f6040b6a795a17e7417 \
            b32e089caea772f166204fb1c7bcaad6f56942fe \
            0c51d732cb01a377b2bc00e8d945b355e41961c1
          do
            if git grep -n "$stale" -- Cargo.toml Cargo.lock .github/workflows \
              ':(exclude).github/workflows/den-3495-refresh-contract-graph.yml'; then
              echo "stale contract dependency identity remains: $stale" >&2
              exit 1
            fi
          done
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy
      - name: Prove one exact shared contract graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1]))
          expected = {
              "zed-interfaces": "d11322f06ca6930ddcc34a745b4ef01e0b2bddc1",
              "zed-lib": "c8af76191f50ad7a177eb68740e69bdfaa652ff6",
              "zed-client": "bc72c632c92b21032728f2c48a67cb4d73ee98ba",
          }
          for name, revision in expected.items():
              matches = [p for p in metadata["packages"] if p["name"] == name]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {name} package identity, found {len(matches)}")
              source = matches[0].get("source") or ""
              if revision not in source:
                  raise SystemExit(f"{name} resolved from unexpected source: {source}")
          PY
      - name: Verify flags contracts and Rust behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          for path in [".cli-flags.toml", ".git-install-cli-flags.toml", ".zpkg.toml", "Cargo.toml"]:
              with open(path, "rb") as handle:
                  tomllib.load(handle)
          PY
          cargo fmt --all --check
          cargo test --locked --test git_install_cli
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Commit deterministic graph refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware automation"
          git config user.email "automation@oresoftware.com"
          git add \
            Cargo.lock \
            .github/workflows/ci.yml \
            .github/workflows/frozen-lock-integrity.yml \
            .github/workflows/nix-bundle-write.yml \
            .github/workflows/nix-export-bundle.yml \
            .github/workflows/nix-export-plan.yml \
            .github/workflows/zed-package-graph.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(DEN-3495): refresh merged contract graph"
          git push origin HEAD:feat/DEN-3495-cargo-git-cli-install
