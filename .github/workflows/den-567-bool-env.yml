name: Finalize DEN-567 boolean environment normalization

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-567-normalize-bool-env.py
      - .github/workflows/den-567-bool-env.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'feat/den-567-manifestless-flags-completion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the sibling interfaces crate
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the scoped boolean environment fix
        working-directory: zed-cli
        run: python3 scripts/den-567-normalize-bool-env.py

      - name: Format and validate
        working-directory: zed-cli
        run: |
          set -euo pipefail
          cargo fmt
          git diff --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit the validated Rust source
        working-directory: zed-cli
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/flags.rs
          git commit -m 'fix(DEN-567): normalize boolean environment values'
          git push origin "HEAD:$HEAD_BRANCH"
