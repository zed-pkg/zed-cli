name: Finalize DEN-567 Bash contract check

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-567-finalize.py
      - .github/workflows/den-567-finalize.yml

permissions:
  contents: read

jobs:
  finalize:
    if: >-
      github.head_ref == 'feat/den-567-manifestless-flags-completion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the exact CI correction
        working-directory: zed-cli
        run: python3 scripts/den-567-finalize.py

      - name: Validate the workflow diff
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '            _zed zed "" zed' .github/workflows/ci.yml
          test "$(git diff --name-only | sort)" = '.github/workflows/ci.yml'

      - name: Upload the validated CI workflow
        uses: actions/upload-artifact@v4
        with:
          name: den-567-ci-workflow
          path: zed-cli/.github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1
