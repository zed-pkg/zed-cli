name: Finalize DEN-567 Bash contract check

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-567-finalize.py
      - .github/workflows/den-567-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'feat/den-567-manifestless-flags-completion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the exact CI correction
        working-directory: zed-cli
        run: python3 scripts/den-567-finalize.py

      - name: Validate the workflow diff
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '            _zed zed "" zed' .github/workflows/ci.yml
          test "$(git diff --name-only | sort)" = '.github/workflows/ci.yml'

      - name: Commit the validated workflow correction
        working-directory: zed-cli
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m 'ci(DEN-567): invoke Bash completion with shell arguments'
          git push origin "HEAD:$HEAD_BRANCH"
