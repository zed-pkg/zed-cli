name: Diagnose DEN-567 frozen manifestless restore

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/den-567-frozen-debug.yml

permissions:
  contents: read

jobs:
  reproduce:
    if: github.head_ref == 'feat/den-567-manifestless-flags-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false

      - name: Build the real CLI container
        run: |
          docker build \
            --file zed-cli/.github/docker/install-test.Dockerfile \
            --tag zed-pkg/install-test \
            .

      - name: Reproduce and capture the frozen lock-only boundary
        id: reproduce
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/den-567-frozen.log"
          status_file="$RUNNER_TEMP/den-567-frozen.status"
          {
            set -x
            cp -R zed-cli/tests/fixtures/docker-install "$RUNNER_TEMP/fixtures"
            mkdir -p "$RUNNER_TEMP/registry" "$RUNNER_TEMP/zed-home"
            docker run --rm \
              --volume "$RUNNER_TEMP/fixtures/node-lib:/package" \
              --volume "$RUNNER_TEMP/registry:/registry" \
              --workdir /package \
              zed-pkg/install-test \
              zed publish --registry file:///registry --skip-vcs-checks

            root="$RUNNER_TEMP/manifestless-frozen"
            mkdir -p "$root/src"
            cp "$RUNNER_TEMP/fixtures/node-app/package.json" "$root/package.json"
            cp "$RUNNER_TEMP/fixtures/node-app/src/main.js" "$root/src/main.js"
            rm -f "$root/.zpkg.toml" "$root/.zpkg.lock"

            docker run --rm \
              --volume "$root:/work" \
              --volume "$RUNNER_TEMP/registry:/registry:ro" \
              --volume "$RUNNER_TEMP/zed-home:/zed-home" \
              --workdir /work \
              zed-pkg/install-test \
              zed install zed-pkg/docker-node-lib@^1 \
                --skip-manifest \
                --registry file:///registry \
                --home /zed-home/frozen \
                --install-mode copy

            if docker run --rm \
              --volume "$root:/work" \
              --volume "$RUNNER_TEMP/registry:/registry:ro" \
              --volume "$RUNNER_TEMP/zed-home:/zed-home" \
              --workdir /work \
              zed-pkg/install-test \
              zed install --skip-manifest \
                --registry file:///registry \
                --home /zed-home/frozen \
                --install-mode copy
            then
              echo "lock-only reinstall without --frozen unexpectedly succeeded" >&2
              false
            fi

            rm -rf "$root/zed_modules" "$root/node_modules" "$root/.zed"
            docker run --rm \
              --volume "$root:/work" \
              --volume "$RUNNER_TEMP/registry:/registry:ro" \
              --volume "$RUNNER_TEMP/zed-home:/zed-home" \
              --workdir /work \
              zed-pkg/install-test \
              zed install --frozen --skip-manifest \
                --registry file:///registry \
                --home /zed-home/frozen \
                --install-mode copy
            test ! -e "$root/.zpkg.toml"
            test -f "$root/.zpkg.lock"
            find "$root" -maxdepth 5 -type l -print
            test -z "$(find "$root/zed_modules" "$root/node_modules" -type l -print -quit)"
            docker run --rm \
              --volume "$root:/work:ro" \
              --workdir /work \
              node:22-bookworm-slim \
              node src/main.js
          } >"$log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$status_file"
          cat "$log"
          exit 0

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: den-567-frozen-diagnostics
          path: |
            ${{ runner.temp }}/den-567-frozen.log
            ${{ runner.temp }}/den-567-frozen.status
          if-no-files-found: error
          retention-days: 1

      - name: Enforce reproduction result
        run: test "$(cat "$RUNNER_TEMP/den-567-frozen.status")" = 0
