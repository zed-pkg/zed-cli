name: DEN-588 one-shot production patch

on:
  push:
    branches:
      - agent/den-588-copy-mode-oci-contract

permissions:
  contents: write

concurrency:
  group: den-588-production-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: zed-cli
          fetch-depth: 0
          ref: agent/den-588-copy-mode-oci-contract
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zed-pkg/zed-interfaces
          ref: dc0e0a0620b9462817950b552d3d334a184b1cb1
          path: zed-interfaces
          persist-credentials: false
      - name: Apply copy ownership fixes and README link
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ops_path = Path('src/ops.rs')
          source = ops_path.read_text(encoding='utf-8')

          link_marker = '''fn link_or_copy(src: &Path, dest: &Path, mode: InstallMode) -> Result<()> {
              fs::create_dir_all(dest.parent().context("dest has parent")?)?;
              replace_dest(dest)?;
              match mode {
                  InstallMode::Symlink => {
                      #[cfg(unix)]
                      std::os::unix::fs::symlink(src, dest)?;
                      #[cfg(not(unix))]
                      copy_dir(src, dest)?;
                  }
                  InstallMode::Copy => copy_dir(src, dest)?,
              }
              Ok(())
          }
          '''
          link_replacement = '''/// Resolve the requested mode once, before any project output is written.
          /// Windows cannot create Zed's Unix store-backed directory links reliably;
          /// report that platform decision and use the portable ownership model.
          fn effective_install_mode(mode: InstallMode) -> InstallMode {
              #[cfg(unix)]
              {
                  mode
              }
              #[cfg(not(unix))]
              {
                  match mode {
                      InstallMode::Symlink => {
                          eprintln!(
                              "warning: symlink install mode is unavailable on this platform; using copy mode"
                          );
                          InstallMode::Copy
                      }
                      InstallMode::Copy => InstallMode::Copy,
                  }
              }
          }

          fn link_or_copy(src: &Path, dest: &Path, mode: InstallMode) -> Result<()> {
              fs::create_dir_all(dest.parent().context("dest has parent")?)?;
              replace_dest(dest)?;
              match mode {
                  InstallMode::Symlink => {
                      #[cfg(unix)]
                      std::os::unix::fs::symlink(src, dest)?;
                      #[cfg(not(unix))]
                      bail!("symlink install mode was not normalized before materialization");
                  }
                  InstallMode::Copy => copy_dir(src, dest)?,
              }
              Ok(())
          }
          '''
          if source.count(link_marker) != 1:
              raise SystemExit('expected exactly one link_or_copy implementation')
          source = source.replace(link_marker, link_replacement)

          install_marker = ''') -> Result<InstallOutcome> {
              let manifest = read_manifest(project)?;
          '''
          install_replacement = ''') -> Result<InstallOutcome> {
              let mode = effective_install_mode(mode);
              let manifest = read_manifest(project)?;
          '''
          if source.count(install_marker) != 1:
              raise SystemExit('expected exactly one install_locked body marker')
          source = source.replace(install_marker, install_replacement)

          workspace_marker = '''        link_or_copy(member_dir, &dest, InstallMode::Symlink)?;
          '''
          workspace_replacement = '''        // Workspace dependencies obey the same ownership decision as registry
                  // packages. Copy mode must remain self-contained after the member source
                  // directory leaves the Docker/OCI build context.
                  link_or_copy(member_dir, &dest, mode)?;
          '''
          if source.count(workspace_marker) != 1:
              raise SystemExit('expected exactly one workspace materialization call')
          source = source.replace(workspace_marker, workspace_replacement)

          hoist_start = source.index('/// Hoist package-declared executables into `zed_modules/.bin/<name>`')
          hoist_end = source.index('/// Relative path from `from_dir` to `target`', hoist_start)
          hoist_replacement = '''/// Hoist package-declared executables into `zed_modules/.bin/<name>` so
          /// `zed run` and PATH-prepending wrappers find them without polluting the OS
          /// PATH.
          ///
          /// Hoisted bins are deliberately project-owned copies in both install modes.
          /// In symlink mode the package target may resolve into the immutable global
          /// store; chmod'ing that target would mutate the shared store inode for every
          /// consumer. Copying the usually-small executable and setting permissions on
          /// the destination preserves the store while retaining runnable bins.
          fn hoist_bins(
              modules: &Path,
              bins: &BTreeMap<String, PathBuf>,
              _mode: InstallMode,
          ) -> Result<()> {
              if bins.is_empty() {
                  return Ok(());
              }
              let bin_dir = modules.join(BIN_DIR);
              fs::create_dir_all(&bin_dir)?;
              for (name, target) in bins {
                  if !target.exists() {
                      eprintln!(
                          "warning: bin `{name}` points at missing {}; skipping",
                          target.display()
                      );
                      continue;
                  }
                  let destination = bin_dir.join(name);
                  replace_dest(&destination)?;
                  fs::copy(target, &destination)?;
                  #[cfg(unix)]
                  {
                      use std::os::unix::fs::PermissionsExt;
                      let mut permissions = fs::metadata(&destination)?.permissions();
                      permissions.set_mode(permissions.mode() | 0o111);
                      fs::set_permissions(&destination, permissions)?;
                  }
              }
              Ok(())
          }

          '''
          source = source[:hoist_start] + hoist_replacement + source[hoist_end:]
          ops_path.write_text(source, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = '''- **Container-first.** A copy install mode and cache-mount patterns designed
            for OCI images and multi-stage Docker builds.
          '''
          new = '''- **Container-first.** The documented [copy install ownership contract](docs/install-modes.md)
            materializes independent package, adapter, build-output, and hoisted-bin files
            for Docker build contexts, OCI layers, and read-only runtimes.
          '''
          if readme.count(old) != 1:
              raise SystemExit('expected exactly one README container-first bullet')
          readme_path.write_text(readme.replace(old, new), encoding='utf-8')
          PY

          cargo fmt --all
          python3 -m py_compile tests/copy_mode_contract.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ops.rs README.md tests/copy_mode_contract.py
          git commit -m 'fix(DEN-588): preserve copy ownership boundaries'
          git push origin HEAD:agent/den-588-copy-mode-oci-contract
