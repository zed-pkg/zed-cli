name: Apply DEN-772 Rust Cargo configuration fix

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/den-772-fix-rust-cargo-config.py
      - .github/workflows/den-772-rust-cargo-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.head_ref == 'test/manifestless-polyglot-adapters' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the matching interface contract
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 07d01604461d00e237c7d86ad3855464167574ec
          path: zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the exact Rust Cargo configuration edit
        working-directory: zed-cli
        run: python3 scripts/den-772-fix-rust-cargo-config.py

      - name: Format and validate
        working-directory: zed-cli
        run: |
          set -euo pipefail
          cargo fmt
          git diff --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Commit the validated Rust source
        working-directory: zed-cli
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ops.rs
          git commit -m 'fix(DEN-772): generate Cargo patches for installed crates'
          git push origin "HEAD:$HEAD_BRANCH"
