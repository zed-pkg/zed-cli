name: DEN-872 one-shot macOS path fix

on:
  push:
    branches:
      - agent/den-872-zed-develop-shell

permissions:
  contents: write

concurrency:
  group: den-872-macos-path-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
          fetch-depth: 0
          ref: agent/den-872-zed-develop-shell
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: dc0e0a0620b9462817950b552d3d334a184b1cb1
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonicalize the expected nested project path
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/dev.rs')
          source = path.read_text(encoding='utf-8')
          old = '        assert_eq!(project_root(temp.path()), app);\n'
          new = '        assert_eq!(project_root(temp.path()), fs::canonicalize(app).unwrap());\n'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one nested-project assertion to patch')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --locked dev::tests::one_clear_nested_native_project_is_selected_but_ambiguous_roots_are_not
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dev.rs
          git commit -m 'test(dev): compare canonical nested project paths'
          git push origin HEAD:agent/den-872-zed-develop-shell
