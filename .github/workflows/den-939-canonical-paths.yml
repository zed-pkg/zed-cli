name: DEN-939 canonical path patch

on:
  push:
    branches:
      - agent/den-939-develop-test-hardening
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: den-939-canonical-path-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonicalize filesystem-backed expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/develop_edge_cases.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '    let isolated = fixture.root.join(".zed/dev/home");\n',
                  '    let isolated = fs::canonicalize(fixture.root.join(".zed/dev/home"))\n        .expect("canonicalize isolated HOME");\n',
              ),
              (
                  '    let go_work = metadata.join("go.work").to_string_lossy().into_owned();\n',
                  '    let go_work = fs::canonicalize(metadata.join("go.work"))\n        .expect("canonicalize Go workspace adapter")\n        .to_string_lossy()\n        .into_owned();\n',
              ),
              (
                  '    let expected = fixture.root.join(".custom/python");\n',
                  '    let expected = fs::canonicalize(fixture.root.join(".custom/python"))\n        .expect("canonicalize custom Python venv");\n',
              ),
              (
                  '''    assert!(
              !default_paths.contains(&fixture.root.join(".zed/dev/profiles/ai/bin")),
              "AI profile path must not be enabled by default"
          );
          ''',
                  '''    let ai = fs::canonicalize(fixture.root.join(".zed/dev/profiles/ai/bin"))
              .expect("canonicalize AI profile path");
              assert!(
                  !default_paths.contains(&ai),
                  "AI profile path must not be enabled by default"
              );
          ''',
              ),
              (
                  '''    let ai = fixture.root.join(".zed/dev/profiles/ai/bin");
              let generic = fixture.root.join(".zed/dev/bin");
          ''',
                  '''    let generic = fs::canonicalize(fixture.root.join(".zed/dev/bin"))
              .expect("canonicalize generic development bin path");
          ''',
              ),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f"expected path assertion not found: {before!r}")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          git rm .github/workflows/den-939-canonical-paths.yml
      - name: Commit the platform-neutral assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/develop_edge_cases.rs
          git commit -m 'test(DEN-939): canonicalize filesystem path assertions'
          git push origin "HEAD:${TARGET_BRANCH}"
