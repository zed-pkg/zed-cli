name: DEN-939 one-shot Windows smoke patch

on:
  push:
    branches:
      - agent/den-939-develop-edge-tests

permissions:
  contents: write

concurrency:
  group: den-939-windows-smoke-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
          fetch-depth: 0
          ref: agent/den-939-develop-edge-tests
      - name: Make cmd.exe success output conditional on ZED_DEV
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/develop-shell.yml')
          source = path.read_text(encoding='utf-8')
          old = "-c 'if not \"%ZED_DEV%\"==\"1\" exit /b 42 & echo cmd-ok'"
          new = "-c 'if \"%ZED_DEV%\"==\"1\" echo cmd-ok'"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one cmd.exe smoke expression to patch')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/develop-shell.yml
          git commit -m 'test(dev): correct cmd.exe success assertion'
          git push origin HEAD:agent/den-939-develop-edge-tests
