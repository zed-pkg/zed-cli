name: DEN-1565 certify additive interface compatibility

on:
  push:
    branches:
      - agent/den-1565-native-lock-cli-compat
    paths:
      - .github/workflows/den1565-native-lock-compat.yml

permissions:
  contents: write

concurrency:
  group: den-1565-native-lock-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_INTERFACES_REF: a23cdd2ac509a39ca6fd6d21a3774fdd3a0f7660

jobs:
  apply-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-1565-native-lock-cli-compat
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Upgrade the exact interface pin and initialize additive fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          candidate = os.environ["ZED_INTERFACES_REF"]

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches for compatibility patch, found {count}"
                  )
              file.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "Cargo.toml",
              'rev = "c2e049006453c26ca8ca291783f681fce75cb01f"',
              f'rev = "{candidate}"',
          )
          replace_exact(
              ".github/workflows/ci.yml",
              "dc0e0a0620b9462817950b552d3d334a184b1cb1",
              candidate,
              expected=4,
          )
          replace_exact(
              "src/fetch.rs",
              """            packages,
                      nix_adapters: Vec::new(),""",
              """            packages,
                      native_dependencies: Vec::new(),
                      nix_adapters: Vec::new(),""",
              expected=2,
          )

          manifest_pair = (
              """        build_dependencies: BTreeMap::new(),
                  build: None,""",
              """        build_dependencies: BTreeMap::new(),
                  native_dependencies: Default::default(),
                  hooks: Default::default(),
                  build: None,""",
          )
          for file in [
              "src/git_submodules/git.rs",
              "src/managed_install.rs",
              "src/manifestless.rs",
              "src/r2g.rs",
          ]:
              replace_exact(file, *manifest_pair)

          replace_exact(
              "src/ops.rs",
              """            dependencies: build_deps,
                      build_dependencies: BTreeMap::new(),
                      publish: PublishSection::default(),""",
              """            dependencies: build_deps,
                      build_dependencies: BTreeMap::new(),
                      native_dependencies: Default::default(),
                      hooks: Default::default(),
                      publish: PublishSection::default(),""",
          )
          PY
          cargo update -p zed-interfaces

      - name: Certify complete CLI compatibility
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/ci.yml \
            Cargo.lock \
            Cargo.toml \
            src/fetch.rs \
            src/git_submodules/git.rs \
            src/managed_install.rs \
            src/manifestless.rs \
            src/ops.rs \
            src/r2g.rs | sort)"
          test "$changed" = "$expected" || {
            printf 'unexpected compatibility delta:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Remove builder and commit only certified CLI integration
        run: |
          set -euo pipefail
          rm .github/workflows/den1565-native-lock-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ci.yml \
            Cargo.lock \
            Cargo.toml \
            src/fetch.rs \
            src/git_submodules/git.rs \
            src/managed_install.rs \
            src/manifestless.rs \
            src/ops.rs \
            src/r2g.rs \
            .github/workflows/den1565-native-lock-compat.yml
          git diff --cached --check
          git commit -m 'fix: upgrade zed interfaces with additive defaults'
          git push origin HEAD:agent/den-1565-native-lock-cli-compat
