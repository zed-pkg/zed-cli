name: DEN-1565 certify additive interface compatibility

on:
  push:
    branches:
      - agent/den-1565-native-lock-cli-compat
    paths:
      - .github/workflows/den1565-native-lock-compat.yml

permissions:
  contents: write

concurrency:
  group: den-1565-native-lock-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_INTERFACES_REF: a23cdd2ac509a39ca6fd6d21a3774fdd3a0f7660

jobs:
  apply-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/den-1565-native-lock-cli-compat
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Upgrade the exact interface pin and initialize additive fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          candidate = os.environ["ZED_INTERFACES_REF"]

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} matches for compatibility patch, found {count}"
                  )
              file.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "Cargo.toml",
              'rev = "c2e049006453c26ca8ca291783f681fce75cb01f"',
              f'rev = "{candidate}"',
          )
          replace_exact(
              ".github/workflows/ci.yml",
              "dc0e0a0620b9462817950b552d3d334a184b1cb1",
              candidate,
              expected=4,
          )

          manifest_pair = (
              """        build_dependencies: BTreeMap::new(),
                  build: None,""",
              """        build_dependencies: BTreeMap::new(),
                  native_dependencies: Default::default(),
                  hooks: Default::default(),
                  build: None,""",
          )
          for file in [
              "src/git_submodules/git.rs",
              "src/managed_install.rs",
              "src/manifestless.rs",
              "src/r2g.rs",
          ]:
              replace_exact(file, *manifest_pair)

          replace_exact(
              "src/ops.rs",
              """            dependencies: build_deps,
                      build_dependencies: BTreeMap::new(),
                      publish: PublishSection::default(),""",
              """            dependencies: build_deps,
                      build_dependencies: BTreeMap::new(),
                      native_dependencies: Default::default(),
                      hooks: Default::default(),
                      publish: PublishSection::default(),""",
          )

          touched: list[str] = []
          inserted = 0
          for root in [Path("src"), Path("tests")]:
              for file in sorted(root.rglob("*.rs")):
                  lines = file.read_text(encoding="utf-8").splitlines(keepends=True)
                  output: list[str] = []
                  file_insertions = 0
                  for line in lines:
                      if "nix_adapters:" in line:
                          previous = next(
                              (item.strip() for item in reversed(output) if item.strip()),
                              "",
                          )
                          if not previous.startswith("native_dependencies:"):
                              indentation = line[: len(line) - len(line.lstrip())]
                              output.append(
                                  f"{indentation}native_dependencies: Vec::new(),\n"
                              )
                              file_insertions += 1
                      output.append(line)

                  if file_insertions:
                      file.write_text("".join(output), encoding="utf-8")
                      touched.append(file.as_posix())
                      inserted += file_insertions

          required = {
              "src/fetch.rs",
              "tests/frozen_fetch_boundaries.rs",
              "tests/frozen_fetch_cli.rs",
          }
          missing = required.difference(touched)
          if missing:
              raise SystemExit(
                  "expected additive Lockfile literals were not found in: "
                  + ", ".join(sorted(missing))
              )
          Path("/tmp/den1565-lockfile-literals.txt").write_text(
              "\n".join(touched) + "\n",
              encoding="utf-8",
          )
          print(
              f"initialized native_dependencies in {inserted} Lockfile literals "
              f"across {len(touched)} files"
          )
          PY
          cargo update -p zed-interfaces

      - name: Certify complete CLI compatibility
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

          fixed="$(printf '%s\n' \
            .github/workflows/ci.yml \
            Cargo.lock \
            Cargo.toml \
            src/git_submodules/git.rs \
            src/managed_install.rs \
            src/manifestless.rs \
            src/ops.rs \
            src/r2g.rs)"
          expected="$({
            printf '%s\n' "$fixed"
            cat /tmp/den1565-lockfile-literals.txt
          } | sed '/^$/d' | sort -u)"
          changed="$(git diff --name-only | sort -u)"
          test "$changed" = "$expected" || {
            printf 'expected compatibility delta:\n%s\nactual delta:\n%s\n' \
              "$expected" "$changed" >&2
            exit 1
          }

      - name: Commit and push certified source integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Cargo.lock \
            Cargo.toml \
            src/git_submodules/git.rs \
            src/managed_install.rs \
            src/manifestless.rs \
            src/ops.rs \
            src/r2g.rs
          xargs -r git add < /tmp/den1565-lockfile-literals.txt
          git diff --cached --check
          git commit -m 'fix: upgrade zed interfaces with additive defaults'
          git push origin HEAD:agent/den-1565-native-lock-cli-compat
