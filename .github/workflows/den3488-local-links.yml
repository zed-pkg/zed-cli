name: DEN-3488 local-link validation

on:
  push:
    branches:
      - DEN-3488-explicit-local-links
  pull_request:
    paths:
      - 'src/linking.rs'
      - 'src/lib.rs'
      - 'src/cli_model.rs'
      - '.link-cli-flags.toml'
      - 'docs/local-links.md'
      - '.github/workflows/den3488-local-links.yml'

permissions:
  contents: read

jobs:
  local-link-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Compile library and binaries
        run: cargo check --all-targets --locked

      - name: Test local-link lifecycle
        run: cargo test --locked --lib linking

      - name: Test command model
        run: cargo test --locked --lib cli_model

      - name: Test completions
        run: cargo test --locked --lib completion

      - name: Clippy local-link implementation
        run: cargo clippy --locked --all-targets -- -A unsafe-code -D warnings
