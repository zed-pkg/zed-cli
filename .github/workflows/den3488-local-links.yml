name: DEN-3488 local-link validation

on:
  push:
    branches:
      - DEN-3488-explicit-local-links
  pull_request:
    paths:
      - 'src/linking/**'
      - 'src/lib.rs'
      - 'src/cli_model.rs'
      - '.link-cli-flags.toml'
      - 'docs/local-links.md'
      - '.github/workflows/den3488-local-links.yml'

permissions:
  contents: read

jobs:
  local-link-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Compile library and binaries
        run: cargo check --all-targets --locked

      - name: Test local-link lifecycle
        run: cargo test --locked linking::tests -- --nocapture

      - name: Test command model
        run: cargo test --locked --lib cli_model

      - name: Test completions
        run: cargo test --locked --lib completion

      - name: Clippy all targets
        run: cargo clippy --locked --all-targets -- -A unsafe-code -D warnings

      - name: npm-link-equivalent CLI smoke test
        run: |
          set -euxo pipefail
          cargo build --locked --bin zed
          BIN="$PWD/target/debug/zed"
          ROOT="$RUNNER_TEMP/zed-link-e2e"
          HOME_DIR="$ROOT/home"
          SOURCE="$ROOT/source"
          CONSUMER="$ROOT/consumer"
          mkdir -p "$SOURCE" "$CONSUMER"
          cat > "$SOURCE/.zpkg.toml" <<'EOF'
          [package]
          org = "acme"
          name = "widget"
          version = "0.1.0"
          EOF
          cat > "$CONSUMER/.zpkg.toml" <<'EOF'
          [package]
          org = "acme"
          name = "consumer"
          version = "0.1.0"
          EOF
          printf 'one\n' > "$SOURCE/live.txt"
          (cd "$SOURCE" && ZED_PKG_HOME="$HOME_DIR" "$BIN" link .)
          (cd "$CONSUMER" && ZED_PKG_HOME="$HOME_DIR" "$BIN" link acme/widget --adapter none)
          test -L "$CONSUMER/zed_modules/acme/widget"
          test "$(cat "$CONSUMER/zed_modules/acme/widget/live.txt")" = one
          printf 'two\n' > "$SOURCE/live.txt"
          test "$(cat "$CONSUMER/zed_modules/acme/widget/live.txt")" = two
          rm -rf "$SOURCE"
          test -L "$CONSUMER/zed_modules/acme/widget"
          (cd "$CONSUMER" && ZED_PKG_HOME="$HOME_DIR" "$BIN" unlink acme/widget)
          test ! -L "$CONSUMER/zed_modules/acme/widget"
