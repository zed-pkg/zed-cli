name: Canonical Cargo adapter project root (focused)

on:
  pull_request:
    paths:
      - 'tests/develop_edge_cases.rs'
      - '.github/workflows/develop-cargo-root-macos.yml'
  push:
    branches: [main]
    paths:
      - 'tests/develop_edge_cases.rs'
      - '.github/workflows/develop-cargo-root-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-cargo-root-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Cargo adapter root (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust 1.98.1
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test canonical adapter root with immutable graph
        run: cargo test --locked --test develop_edge_cases cargo_adapter_configuration_is_root_anchored_in_the_development_home -- --exact --nocapture
