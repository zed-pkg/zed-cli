name: develop-shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  smoke:
    name: Bash, Zsh, Fish, Python venv, failures, and PTY smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      - name: Install shell and Python fixtures
        run: sudo apt-get update && sudo apt-get install -y zsh fish python3-venv
      - name: Build the real CLI
        working-directory: zed-cli
        run: cargo build --locked
      - name: Run focused regression suite
        working-directory: zed-cli
        run: cargo test --locked --test develop_edge_cases --test develop_help_contract
      - name: Exercise package-aware development shells
        shell: bash
        env:
          ZED_BIN: ${{ github.workspace }}/zed-cli/target/debug/zed
          ZED_PKG_HOME: ${{ runner.temp }}/zed-home
        run: |
          set -euo pipefail

          "$ZED_BIN" develop --help > "$RUNNER_TEMP/develop.help"
          "$ZED_BIN" dev --help > "$RUNNER_TEMP/dev.help"
          "$ZED_BIN" help dev > "$RUNNER_TEMP/help-dev.help"
          for help in "$RUNNER_TEMP/develop.help" "$RUNNER_TEMP/dev.help" "$RUNNER_TEMP/help-dev.help"; do
            grep -q -- '--python-venv' "$help"
            grep -q -- '--isolated-home' "$help"
            grep -q -- '-c, --command' "$help"
          done

          manifest="$RUNNER_TEMP/manifest-project"
          mkdir -p "$manifest"
          cd "$manifest"
          "$ZED_BIN" init --org ci --name manifest-project
          "$ZED_BIN" dev \
            --nix never \
            --python-venv never \
            --shell "$(command -v bash)" \
            -c 'test "$ZED_DEV" = 1; test "$ZED_DEV_PROJECT_ROOT" = "$PWD"; test "$CARGO_HOME" = "$PWD/.zed/dev/cargo/home"; printf bash-ok' \
            | grep -q bash-ok

          manifestless="$RUNNER_TEMP/manifestless-project"
          mkdir -p "$manifestless"
          printf '%s\n' '{}' > "$manifestless/package.json"
          cd "$manifestless"
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v zsh)" \
            -c 'test "$ZED_DEV" = 1; test "$ZED_DEV_PROJECT_ROOT" = "$PWD"; printf zsh-ok' \
            | grep -q zsh-ok

          fish_project="$RUNNER_TEMP/fish-project"
          mkdir -p "$fish_project"
          printf '%s\n' '{}' > "$fish_project/package.json"
          cd "$fish_project"
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v fish)" \
            -c 'test "$ZED_DEV" = 1; and test "$ZED_DEV_PROJECT_ROOT" = "$PWD"; and printf fish-ok' \
            | grep -q fish-ok

          ZED_DEV_COMMAND='test "$ZED_DEV" = 1; printf env-ok' \
          ZED_DEV_SHELL="$(command -v bash)" \
          ZED_DEV_NIX=never \
          ZED_DEV_NO_INSTALL=yes \
          ZED_DEV_PYTHON_VENV=never \
          "$ZED_BIN" dev | grep -q env-ok

          ZED_DEV_NIX=required \
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v bash)" \
            -c 'printf cli-precedence-ok' \
            | grep -q cli-precedence-ok

          mkdir -p .zed/dev/profiles/ai/bin
          cat > .zed/dev/profiles/ai/bin/codex <<'EOF'
          #!/usr/bin/env sh
          printf stub-codex
          EOF
          chmod +x .zed/dev/profiles/ai/bin/codex
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --profile ai \
            --shell "$(command -v bash)" \
            -c 'codex' \
            | grep -q stub-codex

          python_project="$RUNNER_TEMP/python-project"
          mkdir -p "$python_project"
          printf '%s\n' '[project]' 'name = "ci-python"' 'version = "0.0.0"' > "$python_project/pyproject.toml"
          cd "$python_project"
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv required \
            --shell "$(command -v bash)" \
            -c 'test -n "$VIRTUAL_ENV"; test "$VIRTUAL_ENV" = "$PWD/.zed/dev/python/venv"; python -c "import sys; assert sys.prefix == sys.base_prefix or sys.prefix.endswith(\"/.zed/dev/python/venv\")"'

          custom_python_project="$RUNNER_TEMP/custom-python-project"
          mkdir -p "$custom_python_project"
          printf '%s\n' '[project]' 'name = "ci-custom-python"' 'version = "0.0.0"' > "$custom_python_project/pyproject.toml"
          cd "$custom_python_project"
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv required \
            --venv .custom/python \
            --shell "$(command -v bash)" \
            -c 'test "$VIRTUAL_ENV" = "$PWD/.custom/python"; test -x "$VIRTUAL_ENV/bin/python"; python -c "import sys; assert sys.prefix.endswith(\"/.custom/python\")"'

          printed="$RUNNER_TEMP/managed-env.json"
          INHERITED_SECRET=must-not-leak "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --print-env > "$printed"
          python3 - "$printed" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["ZED_DEV"] == "1"
          assert "INHERITED_SECRET" not in data
          assert "must-not-leak" not in data.values()
          PY

          dotenv_project="$RUNNER_TEMP/dotenv-project"
          mkdir -p "$dotenv_project/env"
          printf '%s\n' '{}' > "$dotenv_project/package.json"
          printf '%s\n' 'ZED_TEST_DOTENV_SECRET=from-dotenv' > "$dotenv_project/.env"
          printf '%s\n' 'export ZED_TEST_DOTENV_SECRET=from-envrc' > "$dotenv_project/.envrc"
          printf '%s\n' 'ZED_TEST_DOTENV_SECRET=from-production' > "$dotenv_project/env/.prod.env"
          cd "$dotenv_project"
          env -u ZED_TEST_DOTENV_SECRET "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v bash)" \
            -c 'test -z "${ZED_TEST_DOTENV_SECRET+x}"; printf dotenv-safe' \
            | grep -q dotenv-safe

          nix_project="$RUNNER_TEMP/nix-project"
          mkdir -p "$nix_project/.nix"
          printf '%s\n' '{}' > "$nix_project/.nix/flake.nix"
          printf '%s\n' '{}' > "$nix_project/package.json"
          cd "$nix_project"
          IN_NIX_SHELL=impure "$ZED_BIN" dev \
            --no-install \
            --nix required \
            --python-venv never \
            --shell "$(command -v bash)" \
            -c 'test "$IN_NIX_SHELL" = impure; printf nix-ok' \
            | grep -q nix-ok

          failure_project="$RUNNER_TEMP/failure-project"
          mkdir -p "$failure_project"
          printf '%s\n' '{}' > "$failure_project/package.json"
          cd "$failure_project"

          set +e
          "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v bash)" \
            -c 'exit 37'
          child_status=$?
          set -e
          test "$child_status" -eq 37

          if "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$RUNNER_TEMP/definitely-missing-shell" \
            -c true > "$RUNNER_TEMP/missing-shell.out" 2> "$RUNNER_TEMP/missing-shell.err"
          then
            echo 'missing shell unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'starting development shell' "$RUNNER_TEMP/missing-shell.err"

          if "$ZED_BIN" dev \
            --no-install \
            --nix never \
            --python-venv never \
            --shell "$(command -v bash)" \
            > "$RUNNER_TEMP/no-tty.out" 2> "$RUNNER_TEMP/no-tty.err"
          then
            echo 'interactive shell unexpectedly accepted redirected stdio' >&2
            exit 1
          fi
          grep -q 'needs a real terminal' "$RUNNER_TEMP/no-tty.err"

          inline_secret='INLINE_SECRET_MUST_NOT_LEAK'
          if "$ZED_BIN" dev "--unknown=$inline_secret" \
            > "$RUNNER_TEMP/unknown.out" 2> "$RUNNER_TEMP/unknown.err"
          then
            echo 'unknown option unexpectedly succeeded' >&2
            exit 1
          fi
          ! grep -q "$inline_secret" "$RUNNER_TEMP/unknown.err"
          grep -Fq -- '--unknown=<redacted>' "$RUNNER_TEMP/unknown.err"

          if "$ZED_BIN" dev --nix occasionally \
            > "$RUNNER_TEMP/invalid-enum.out" 2> "$RUNNER_TEMP/invalid-enum.err"
          then
            echo 'invalid enum unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'occasionally' "$RUNNER_TEMP/invalid-enum.err"

          if "$ZED_BIN" dev --print-env -c true \
            > "$RUNNER_TEMP/conflict.out" 2> "$RUNNER_TEMP/conflict.err"
          then
            echo 'conflicting options unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'cannot be used with' "$RUNNER_TEMP/conflict.err"

          if "$ZED_BIN" dev \
            --frozen \
            --nix never \
            --python-venv never \
            --print-env \
            > "$RUNNER_TEMP/frozen.out" 2> "$RUNNER_TEMP/frozen.err"
          then
            echo 'frozen language-only environment unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q -- '--frozen requires' "$RUNNER_TEMP/frozen.err"

          pty_shell="$RUNNER_TEMP/pty-shell"
          cat > "$pty_shell" <<'SH'
          #!/bin/sh
          set -eu
          test -t 0
          test -t 1
          SH
          chmod +x "$pty_shell"

          python3 - "$ZED_BIN" "$RUNNER_TEMP/pty-project" "$pty_shell" <<'PY'
          import os
          import pty
          import sys

          binary, project, shell = sys.argv[1:]
          os.makedirs(project, exist_ok=True)
          with open(os.path.join(project, "package.json"), "w", encoding="utf-8") as handle:
              handle.write("{}\n")

          pid, fd = pty.fork()
          if pid == 0:
              os.chdir(project)
              os.execve(
                  binary,
                  [
                      binary,
                      "dev",
                      "--no-install",
                      "--nix",
                      "never",
                      "--python-venv",
                      "never",
                      "--shell",
                      shell,
                  ],
                  os.environ.copy(),
              )

          _, status = os.waitpid(pid, 0)
          os.close(fd)
          if not os.WIFEXITED(status) or os.WEXITSTATUS(status) != 0:
              raise SystemExit(f"interactive PTY shell failed: {status}")
          PY

  windows-smoke:
    name: PowerShell and cmd.exe smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run portable parser tests
        working-directory: zed-cli
        run: |
          cargo build --locked
          cargo test --locked --test develop_shell_edge_cases
      - name: Exercise PowerShell and cmd.exe
        shell: pwsh
        env:
          ZED_BIN: ${{ github.workspace }}\zed-cli\target\debug\zed.exe
          ZED_PKG_HOME: ${{ runner.temp }}\zed-home
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'windows-shell-project'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Content -Path (Join-Path $project 'package.json') -Value '{}'

          Push-Location $project
          try {
            $pwsh = (Get-Command pwsh).Source
            $pwshOutput = & $env:ZED_BIN dev --no-install --nix never --python-venv never --shell $pwsh -c 'if ($env:ZED_DEV -ne "1") { exit 41 }; Write-Output "pwsh-ok"'
            if ($LASTEXITCODE -ne 0) {
              throw "PowerShell develop shell failed with $LASTEXITCODE"
            }
            if (($pwshOutput -join "`n") -notmatch 'pwsh-ok') {
              throw "PowerShell output did not contain pwsh-ok: $pwshOutput"
            }

            $cmd = (Get-Command cmd.exe).Source
            $cmdOutput = & $env:ZED_BIN dev --no-install --nix never --python-venv never --shell $cmd -c 'if "%ZED_DEV%"=="1" echo cmd-ok'
            if ($LASTEXITCODE -ne 0) {
              throw "cmd.exe develop shell failed with $LASTEXITCODE"
            }
            if (($cmdOutput -join "`n") -notmatch 'cmd-ok') {
              throw "cmd.exe output did not contain cmd-ok: $cmdOutput"
            }

            & $env:ZED_BIN dev --no-install --nix never --python-venv never --shell $cmd -c 'exit /b 37'
            if ($LASTEXITCODE -ne 37) {
              throw "cmd.exe child status was $LASTEXITCODE instead of 37"
            }

            $jsonText = (& $env:ZED_BIN dev --no-install --nix never --python-venv never --isolated-home --print-env) -join "`n"
            if ($LASTEXITCODE -ne 0) {
              throw "Windows print-env failed with $LASTEXITCODE"
            }
            $managed = $jsonText | ConvertFrom-Json
            $root = (Resolve-Path '.').Path
            $expectedHome = Join-Path $root '.zed\dev\home'
            $acceptedHomes = @($expectedHome, "\\?\$expectedHome")
            if ($managed.HOME -notin $acceptedHomes) {
              throw "HOME mismatch: $($managed.HOME) not in $($acceptedHomes -join ', ')"
            }
            if ($managed.USERPROFILE -notin $acceptedHomes) {
              throw "USERPROFILE mismatch: $($managed.USERPROFILE) not in $($acceptedHomes -join ', ')"
            }
          }
          finally {
            Pop-Location
          }
