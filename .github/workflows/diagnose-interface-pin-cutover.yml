# Trigger after the inventory workflow exists on the branch.
name: inventory stale interface pins for zpkg.net cutover

on:
  push:
    branches:
      - fix/den-2760-zpkg-net-clean
    paths:
      - .github/workflows/diagnose-interface-pin-cutover.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2760-zpkg-net-clean
          persist-credentials: false
          show-progress: false

      - name: Print every stale shared-interface pin
        run: |
          set -euo pipefail
          old='a23cdd2ac509a39ca6fd6d21a3774fdd3a0f7660'
          git grep -n -F "$old" -- . ':!.github/workflows/diagnose-interface-pin-cutover.yml' \
            | tee /tmp/stale-interface-pins.txt
          test -s /tmp/stale-interface-pins.txt
          exit 1
