name: merge current main into submodule branch

on:
  push:
    branches:
      - feat/git-submodule-interop

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/git-submodule-interop
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main and preserve both typed CLI surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          unmerged=$(git diff --name-only --diff-filter=U)
          if [[ "$merge_status" -ne 0 && "$unmerged" != "src/cli.rs" ]]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unmerged" >&2
            exit 1
          fi

          if [[ "$unmerged" == "src/cli.rs" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          import subprocess

          feature = subprocess.check_output(
              ["git", "show", "HEAD:src/cli.rs"], text=True
          )
          merged = subprocess.check_output(
              ["git", "show", "origin/main:src/cli.rs"], text=True
          )

          field_start = feature.index(
              "        /// Synchronize and initialize Git submodules recursively before Zed\n"
          )
          field_end = feature.index(
              "        /// Install single-language packages whose ecosystem this project does\n",
              field_start,
          )
          field_block = feature[field_start:field_end]
          field_anchor = (
              "        /// Install single-language packages whose ecosystem this project does\n"
          )
          if "git_submodules: bool" in merged or merged.count(field_anchor) != 1:
              raise SystemExit("unexpected install-field merge shape")
          merged = merged.replace(field_anchor, field_block + field_anchor, 1)

          test_start = feature.index(
              "    #[test]\n"
              "    fn install_git_submodule_switch_is_boolish_and_does_not_consume_specs() {\n"
          )
          test_end = feature.index(
              "    #[test]\n    fn completion_shells_are_typed_positionals() {\n",
              test_start,
          )
          test_block = feature[test_start:test_end]
          test_anchor = (
              "    #[test]\n    fn environment_import_and_verify_are_typed() {\n"
          )
          if "install_git_submodule_switch_is_boolish" in merged or merged.count(test_anchor) != 1:
              raise SystemExit("unexpected CLI-test merge shape")
          merged = merged.replace(test_anchor, test_block + test_anchor, 1)

          Path("src/cli.rs").write_text(merged)
          PY
            git add src/cli.rs
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m 'Merge current main into git-submodule interop'
          git push origin HEAD:feat/git-submodule-interop
