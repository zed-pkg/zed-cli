name: diagnose pack inputs

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-pack-inputs.yml"
      - "src/pack_inputs.rs"
      - "src/pack_inputs/**"
      - "src/ops_entry.rs"

permissions:
  contents: read

concurrency:
  group: diagnose-pack-inputs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-test:
    name: ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - hardening_excludes_the_allowlist_control_file
          - allowlist_patterns_are_bounded_and_project_relative
          - tracked_clean_allowlist_admits_a_narrow_generated_input
          - untracked_allowlist_cannot_relax_the_publication_boundary
          - dirty_allowlist_cannot_relax_the_publication_boundary
          - ignored_input_inside_initialized_submodule_is_rejected
          - ignored_root_legal_file_copied_into_polyglot_target_is_rejected
          - publish_exclusion_cannot_hide_an_always_included_root_legal_file
          - target_owned_legal_file_prevents_copying_the_ignored_root_file
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated regression
        env:
          TEST_NAME: ${{ matrix.test }}
        run: cargo test --locked --lib "pack_inputs::extended_tests::$TEST_NAME" -- --exact --nocapture
