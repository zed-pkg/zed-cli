name: diagnose rustfmt

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-rustfmt.yml"
      - "src/pack_inputs.rs"
      - "src/pack_inputs/**"
      - "src/ops_entry.rs"

permissions:
  contents: read

concurrency:
  group: diagnose-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: rustfmt diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: Surface exact formatter diff
        shell: bash
        run: |
          set +e
          output="$(cargo fmt --all -- --check 2>&1)"
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=rustfmt diff::$escaped"
            exit "$status"
          fi
