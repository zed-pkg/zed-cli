name: diagnose strict clippy

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-strict-clippy.yml"
      - "src/pack_inputs.rs"
      - "src/pack_inputs/**"
      - "src/ops_entry.rs"

permissions:
  contents: read

concurrency:
  group: diagnose-strict-clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: strict clippy library
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo clippy --locked --lib --all-features -- -D warnings

  tests:
    name: strict clippy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo clippy --locked --tests --all-features -- -D warnings

  binaries:
    name: strict clippy binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo clippy --locked --bins --all-features -- -D warnings
