name: document git-submodule interop on feature branch

on:
  push:
    branches:
      - feat/git-submodule-interop

permissions:
  contents: write

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/git-submodule-interop
          persist-credentials: true
      - name: Add canonical commands and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          quick_anchor = """zed install --frozen                   # restore the same artifacts

# first dependency install in a project with no .zpkg.toml
"""
          quick_replacement = """zed install --frozen                   # restore the same artifacts

# coexist with Git submodules, or adopt them into Zed's graph and lock
zed install --git-submodules
zed overtake --git-submodules

# first dependency install in a project with no .zpkg.toml
"""
          if text.count(quick_anchor) != 1:
              raise SystemExit("unexpected README quickstart shape")
          text = text.replace(quick_anchor, quick_replacement, 1)

          table_anchor = """| `zed install --frozen` | Install exactly what the manifest/lock pair pins; a manifestless lock-only restore additionally requires `--do-not-write-new-manifest` |
| `zed uninstall [<org>/<name> ...]` (`zed un`) | Transactionally remove all or selected materialized packages while retaining the manifest and lockfile for a frozen reinstall |
"""
          table_replacement = """| `zed install --frozen` | Install exactly what the manifest/lock pair pins; a manifestless lock-only restore additionally requires `--do-not-write-new-manifest` |
| `zed install --git-submodules[=true|false]` | Before ordinary resolution, recursively synchronize and initialize the superproject's Git submodules; also configurable through `ZED_PKG_GIT_SUBMODULES` |
| `zed overtake --git-submodules` | Adopt Zed-package submodules into `[workspace].members`, exact dependencies, and immutable `[[git-submodule]]` lock provenance while retaining `.gitmodules` as a reversible transport mirror |
| `zed uninstall [<org>/<name> ...]` (`zed un`) | Transactionally remove all or selected materialized packages while retaining the manifest and lockfile for a frozen reinstall |
"""
          if text.count(table_anchor) != 1:
              raise SystemExit("unexpected README command-table shape")
          text = text.replace(table_anchor, table_replacement, 1)

          completion_anchor = """### Shell completion
"""
          interop_note = """Git-submodule cooperation, takeover validation, frozen replay, and reversibility are documented in [Git submodule interoperability](docs/git-submodules.md).

### Shell completion
"""
          if text.count(completion_anchor) != 1:
              raise SystemExit("unexpected README completion heading shape")
          text = text.replace(completion_anchor, interop_note, 1)
          path.write_text(text)
          PY

          rm .github/workflows/document-git-submodule-interop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/document-git-submodule-interop.yml
          git diff --cached --check
          git commit -m 'docs: expose Git submodule install and takeover'
          git push origin HEAD:feat/git-submodule-interop
