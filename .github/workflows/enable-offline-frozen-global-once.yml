name: Enable offline frozen global restore once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/enable-offline-frozen-global-once.yml

permissions:
  contents: write

concurrency:
  group: enable-offline-frozen-global-once
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/global-zed-packages-current-main
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Make frozen replay lock-authoritative when bytes are local
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ops.rs')
          text = path.read_text()
          old = '''        for locked in &lock.packages {
                      if !is_slug(&locked.org) || !is_slug(&locked.name) {
                          bail!(
                              "lockfile entry `{}/{}` has an invalid identity; refusing",
                              locked.org,
                              locked.name
                          );
                      }
                      require_sha256(&locked.sha256)?;
                      let vm = reg.get_version(&locked.org, &locked.name, &locked.version)?;
                      if vm.sha256 != locked.sha256 {
                          bail!(
                              "registry artifact for {}@{} changed (lock {} vs registry {}); refusing",
                              locked.full_name(),
                              locked.version,
                              locked.sha256,
                              vm.sha256
                          );
                      }
                      validate_version_metadata(&vm)?;
                      resolved.insert(locked.full_name(), vm);
                  }
          '''
          new = '''        for locked in &lock.packages {
                      if !is_slug(&locked.org) || !is_slug(&locked.name) {
                          bail!(
                              "lockfile entry `{}/{}` has an invalid identity; refusing",
                              locked.org,
                              locked.name
                          );
                      }
                      require_sha256(&locked.sha256)?;
                      let vm = if store.has(&locked.sha256)
                          || store.cached_artifact(&locked.sha256).is_file()
                      {
                          // The lock already carries every immutable field needed
                          // to authenticate locally cached bytes. Avoid turning an
                          // exact frozen replay into a registry availability check.
                          locked_version_metadata(locked)
                      } else {
                          let vm = reg.get_version(&locked.org, &locked.name, &locked.version)?;
                          if vm.sha256 != locked.sha256 {
                              bail!(
                                  "registry artifact for {}@{} changed (lock {} vs registry {}); refusing",
                                  locked.full_name(),
                                  locked.version,
                                  locked.sha256,
                                  vm.sha256
                              );
                          }
                          vm
                      };
                      validate_version_metadata(&vm)?;
                      resolved.insert(locked.full_name(), vm);
                  }
          '''
          if old not in text:
              raise SystemExit('frozen registry verification block not found')
          text = text.replace(old, new, 1)

          marker = '''/// Install body, called with the store lock already held. Split out so the
          /// build-hook path can install `[build-dependencies]` into a staging dir
          /// under the same lock without deadlocking on a re-acquire.
          '''
          helper = '''fn locked_version_metadata(locked: &LockedPackage) -> VersionMetadata {
              VersionMetadata {
                  org: locked.org.clone(),
                  name: locked.name.clone(),
                  version: locked.version.clone(),
                  sha256: locked.sha256.clone(),
                  size: locked.size,
                  format: locked.format,
                  vcs_tag: locked.vcs_tag.clone(),
                  vcs_commit: locked.vcs_commit.clone(),
                  // Never consumed while the store or verified cache owns the
                  // bytes. If local verification fails, ensure_artifact falls
                  // back to the configured registry and reports that failure.
                  download_url: String::new(),
                  published_at: "1970-01-01T00:00:00Z".to_string(),
                  yanked: false,
              }
          }

          #[cfg(test)]
          #[test]
          fn frozen_local_metadata_preserves_lock_identity_and_provenance() {
              let locked = LockedPackage {
                  org: "acme".to_string(),
                  name: "tool".to_string(),
                  version: "1.2.3".to_string(),
                  sha256: "a".repeat(64),
                  size: 42,
                  format: zed_interfaces::artifact::ArtifactFormat::TarGz,
                  vcs_tag: "v1.2.3".to_string(),
                  vcs_commit: Some("b".repeat(40)),
                  source: "https://registry.invalid".to_string(),
              };
              let metadata = locked_version_metadata(&locked);
              assert_eq!(metadata.org, locked.org);
              assert_eq!(metadata.name, locked.name);
              assert_eq!(metadata.version, locked.version);
              assert_eq!(metadata.sha256, locked.sha256);
              assert_eq!(metadata.size, locked.size);
              assert_eq!(metadata.format, locked.format);
              assert_eq!(metadata.vcs_tag, locked.vcs_tag);
              assert_eq!(metadata.vcs_commit, locked.vcs_commit);
              assert!(metadata.download_url.is_empty());
              assert!(!metadata.yanked);
          }

          '''
          if 'fn locked_version_metadata' not in text:
              if marker not in text:
                  raise SystemExit('locked metadata helper insertion point not found')
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY

          rustfmt --edition 2024 src/ops.rs
          cargo test --locked frozen_local_metadata_preserves_lock_identity_and_provenance
          cargo test --locked --test global_cli
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit permanent frozen-replay hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/enable-offline-frozen-global-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ops.rs .github/workflows/enable-offline-frozen-global-once.yml
          git commit -m 'fix: replay frozen installs from the local store'
          git push origin HEAD:agent/global-zed-packages-current-main
