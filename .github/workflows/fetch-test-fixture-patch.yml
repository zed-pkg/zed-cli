name: one-shot verified resolver fixture patch

on:
  push:
    branches:
      - agent/den-1436-frozen-fetch-main
    paths:
      - .github/workflows/fetch-test-fixture-patch.yml

permissions:
  contents: write

concurrency:
  group: one-shot-resolver-test-fixture-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/den-1436-frozen-fetch-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1436-frozen-fetch-main
          persist-credentials: true
          fetch-depth: 0
          show-progress: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Apply the already-verified test-only compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/fetch.rs')
          source = path.read_text(encoding='utf-8')

          old_duplicate = '        assert!(error.to_string().contains("duplicate package identity"));'
          new_duplicate = '''        let message = format!("{error:#}");
          assert!(
              message.contains("duplicate locked package identity")
                  && message.contains("acme/duplicate"),
              "unexpected duplicate diagnostic: {message}"
          );'''
          if source.count(old_duplicate) != 1:
              raise SystemExit('expected exactly one stale duplicate assertion')
          source = source.replace(old_duplicate, new_duplicate)

          replacement = (
              '            vcs_commit: '
              'Some("0123456789abcdef0123456789abcdef01234567".to_string()),'
          )

          def replace_single_revision(source: str, marker: str, label: str) -> str:
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'{label} fixture start not found')
              end = source.find('\n        };', start)
              if end < 0:
                  raise SystemExit(f'{label} fixture end not found')
              block = source[start:end]
              old = '            vcs_commit: None,'
              if block.count(old) != 1:
                  raise SystemExit(f'{label} fixture must contain exactly one empty VCS revision')
              block = block.replace(old, replacement)
              return source[:start] + block + source[end:]

          source = replace_single_revision(
              source,
              '        let package = LockedPackage {',
              'duplicate package',
          )
          source = replace_single_revision(
              source,
              '        let mut credentialed = LockedPackage {',
              'credential source',
          )
          path.write_text(source, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
          cargo test --locked \
            fetch::tests::duplicate_identities_and_credential_bearing_sources_fail_closed \
            -- --nocapture --test-threads=1

      - name: Commit the verified source and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fetch-test-fixture-patch.yml
          git add src/fetch.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(DEN-1436): preserve resolver fail-closed boundary coverage'
          git push origin HEAD:agent/den-1436-frozen-fetch-main
