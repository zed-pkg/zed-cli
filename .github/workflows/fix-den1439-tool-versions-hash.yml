name: preserve hashes inside DEN-1439 tool-version tokens

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-den1439-tool-versions-hash.yml
      - src/environment.rs

permissions:
  contents: write

concurrency:
  group: fix-den1439-tool-versions-hash
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'alexanderdmills/den-1439-mise-import-verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: alexanderdmills/den-1439-mise-import-verify
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - name: Apply the lossless comment-boundary fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/environment.rs')
          text = path.read_text()

          old = "        let line = original.split('#').next().unwrap_or_default().trim();"
          new = "        let line = strip_tool_versions_comment(original).trim();"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('tool-versions comment split not found')

          marker = '''fn parse_tool_versions(input: &str, path: &str) -> Result<BTreeMap<String, ConfiguredTool>> {
'''
          helper = '''fn strip_tool_versions_comment(line: &str) -> &str {
              for (index, character) in line.char_indices() {
                  if character != '#' {
                      continue;
                  }
                  let begins_comment = index == 0
                      || line[..index]
                          .chars()
                          .next_back()
                          .is_some_and(char::is_whitespace);
                  if begins_comment {
                      return &line[..index];
                  }
              }
              line
          }

          fn parse_tool_versions(input: &str, path: &str) -> Result<BTreeMap<String, ConfiguredTool>> {
'''
          if marker in text and 'fn strip_tool_versions_comment' not in text:
              text = text.replace(marker, helper, 1)

          test_marker = '''    #[test]
              fn normalized_digest_ignores_toml_presentation_but_tracks_semantics() {
          '''
          regression = '''    #[test]
              fn tool_versions_preserves_hash_inside_version_token() {
                  let parsed = parse_tool_versions(
                      "custom ref:feature#anchor # trailing comment\\n# full-line comment\\n",
                      ".tool-versions",
                  )
                  .unwrap();
                  assert_eq!(parsed["custom"].requirement, "ref:feature#anchor");
              }

              #[test]
              fn normalized_digest_ignores_toml_presentation_but_tracks_semantics() {
          '''
          if test_marker in text and 'tool_versions_preserves_hash_inside_version_token' not in text:
              text = text.replace(test_marker, regression, 1)

          path.write_text(text)
          PY

      - name: Validate the parser and full adapter surface
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked tool_versions_preserves_hash_inside_version_token
          cargo test --locked --lib environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit ordinary source and remove bootstrap workflow
        run: |
          rm .github/workflows/fix-den1439-tool-versions-hash.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/environment.rs .github/workflows/fix-den1439-tool-versions-hash.yml
          git diff --cached --check
          git commit -m 'fix(DEN-1439): preserve hashes inside tool-version tokens'
          git push origin HEAD:alexanderdmills/den-1439-mise-import-verify
