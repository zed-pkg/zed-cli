name: repair DEN-1439 relocation test portability

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-den1439-windows-relocation-test.yml
      - tests/e2e.rs

permissions:
  contents: write

concurrency:
  group: repair-den1439-relocation-test
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'alexanderdmills/den-1439-mise-import-verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: alexanderdmills/den-1439-mise-import-verify
          persist-credentials: true
          show-progress: false

      - name: Gate the Unix shell fixture precisely
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e.rs')
          text = path.read_text()
          old = '''#[test]
          fn install_dir_is_honored_by_install_run_and_remove() {'''
          new = '''#[cfg(unix)]
          #[test]
          fn install_dir_is_honored_by_install_run_and_remove() {'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('relocation test header not found')
          path.write_text(text)
          PY

      - name: Validate the focused and full Rust surfaces
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked install_dir_is_honored_by_install_run_and_remove
          cargo test --locked --lib environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit ordinary test source and remove bootstrap workflow
        run: |
          rm .github/workflows/fix-den1439-windows-relocation-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e.rs .github/workflows/fix-den1439-windows-relocation-test.yml
          git diff --cached --check
          git commit -m 'test(DEN-1439): gate relocation shell fixture on Unix'
          git push origin HEAD:alexanderdmills/den-1439-mise-import-verify
