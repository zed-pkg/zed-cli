name: repair DEN-1439 Windows test portability

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-den1439-windows-tests.yml
      - tests/develop_shell_edge_cases.rs
      - tests/e2e.rs

permissions:
  contents: write

concurrency:
  group: repair-den1439-windows-tests
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'alexanderdmills/den-1439-mise-import-verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: alexanderdmills/den-1439-mise-import-verify
          persist-credentials: true
          show-progress: false

      - name: Apply target-specific test boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new not in text:
                  raise SystemExit(f'expected source fragment not found: {old!r}')
              return text

          edge = Path('tests/develop_shell_edge_cases.rs')
          text = edge.read_text()
          replacements = [
              (
                  'use std::collections::BTreeMap;\nuse std::env;\nuse std::ffi::{OsStr, OsString};',
                  '#[cfg(unix)]\nuse std::collections::BTreeMap;\nuse std::env;\n#[cfg(unix)]\nuse std::ffi::{OsStr, OsString};',
              ),
              (
                  'fn assert_success(output: &Output) {',
                  '#[cfg(unix)]\nfn assert_success(output: &Output) {',
              ),
              (
                  'fn stdout(output: &Output) -> String {',
                  '#[cfg(unix)]\nfn stdout(output: &Output) -> String {',
              ),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new)
          edge.write_text(text)

          e2e = Path('tests/e2e.rs')
          text = e2e.read_text()
          replacements = [
              (
                  'fn write_executable(path: &Path, contents: &str) {',
                  '#[cfg(unix)]\nfn write_executable(path: &Path, contents: &str) {',
              ),
              (
                  'fn bin_fixture(root: &Path, name: &str, bin_name: &str, script: &str) -> PathBuf {',
                  '#[cfg(unix)]\nfn bin_fixture(root: &Path, name: &str, bin_name: &str, script: &str) -> PathBuf {',
              ),
              (
                  '#[test]\nfn hoisted_bins_are_container_safe_in_copy_mode() {',
                  '#[cfg(unix)]\n#[test]\nfn hoisted_bins_are_container_safe_in_copy_mode() {',
              ),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new)
          e2e.write_text(text)
          PY

      - name: Format and validate native target
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --lib environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit the portability repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/develop_shell_edge_cases.rs tests/e2e.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m 'test(DEN-1439): gate Unix-only fixtures on Windows'
          git push origin HEAD:alexanderdmills/den-1439-mise-import-verify
