name: repair Devbox and Flox Rust 1.97 lints

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-devbox-flox-clippy.yml
      - src/nix_environment_export.rs

permissions:
  contents: write

concurrency:
  group: repair-den-1468-clippy
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/den-1468-devbox-flox-current-main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1468-devbox-flox-current-main
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply semantics-preserving let-chain forms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/nix_environment_export.rs')
          text = path.read_text()

          replacements = [
              (
                  '''        if let Some(existing) =
                      output_packages.insert(package.package_ref.clone(), candidate.clone())
                  {
                      if existing != candidate {
                          bail!(
                              "Devbox package `{}` is requested with conflicting versions or platforms",
                              package.package_ref
                          );
                      }
                  }
                  ''',
                  '''        if let Some(existing) =
                      output_packages.insert(package.package_ref.clone(), candidate.clone())
                      && existing != candidate
                  {
                      bail!(
                          "Devbox package `{}` is requested with conflicting versions or platforms",
                          package.package_ref
                      );
                  }
                  ''',
              ),
              (
                  '''    if let Ok(metadata) = fs::symlink_metadata(&joined) {
                      if metadata.file_type().is_symlink() {
                          bail!("{kind} `{relative}` must not be a symlink");
                      }
                  }
                  ''',
                  '''    if let Ok(metadata) = fs::symlink_metadata(&joined)
                      && metadata.file_type().is_symlink()
                  {
                      bail!("{kind} `{relative}` must not be a symlink");
                  }
                  ''',
              ),
              (
                  '''    if receipt_state == FileDisposition::Missing {
                      if let Err(error) = persist_new_file(root, receipt_path, receipt, "export receipt") {
                          if wrote_output {
                              let _ = fs::remove_file(output_path);
                          }
                          return Err(error);
                      }
                  }
                  ''',
                  '''    if receipt_state == FileDisposition::Missing
                      && let Err(error) = persist_new_file(root, receipt_path, receipt, "export receipt")
                  {
                      if wrote_output {
                          let _ = fs::remove_file(output_path);
                      }
                      return Err(error);
                  }
                  ''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected lint source fragment not found:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate focused and strict surfaces
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --bin zed-env-export
          cargo test --locked --test nix_environment_export_cli
          cargo clippy --locked --bin zed-env-export --test nix_environment_export_cli -- -D warnings

      - name: Commit ordinary source
        run: |
          set -euo pipefail
          rm .github/workflows/fix-devbox-flox-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/nix_environment_export.rs .github/workflows/fix-devbox-flox-clippy.yml
          git diff --cached --check
          git commit -m 'fix(DEN-1468): satisfy Rust 1.97 strict Clippy'
          git push origin HEAD:agent/den-1468-devbox-flox-current-main
