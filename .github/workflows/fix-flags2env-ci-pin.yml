# Trigger after the repair workflow exists on the branch.
name: update immutable flags2env help-contract pin

on:
  push:
    branches:
      - chore/flags2env-inline-value-fix-clean
    paths:
      - .github/workflows/fix-flags2env-ci-pin.yml

permissions:
  contents: write

concurrency:
  group: fix-flags2env-ci-pin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/flags2env-inline-value-fix-clean
          persist-credentials: true
          show-progress: false

      - name: Advance the immutable parser assertions
        run: |
          set -euo pipefail
          old='2f62e40932a0fcb8b9bf1b4c84473e34fa3c51c7'
          new='8c8465561075a8d7ebb58074b3a8087138e97d8f'
          test "$(grep -o "$old" .github/workflows/ci.yml | wc -l)" -eq 2
          python3 - "$old" "$new" <<'PY'
          from pathlib import Path
          import sys

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old, new = sys.argv[1:]
          updated = text.replace(old, new)
          if updated == text:
              raise SystemExit('immutable parser assertion was not updated')
          path.write_text(updated)
          PY
          test "$(grep -o "$new" .github/workflows/ci.yml | wc -l)" -eq 2
          ! grep -F "$old" .github/workflows/ci.yml
          git diff --check

      - name: Re-run the exact parser assertion and build
        run: |
          set -euo pipefail
          grep -F 'rev = "8c8465561075a8d7ebb58074b3a8087138e97d8f"' Cargo.toml
          grep -F '8c8465561075a8d7ebb58074b3a8087138e97d8f' Cargo.lock
          cargo build --locked --bin zed

      - name: Commit ordinary workflow correction
        run: |
          set -euo pipefail
          rm .github/workflows/fix-flags2env-ci-pin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/fix-flags2env-ci-pin.yml
          git diff --cached --check
          git commit -m 'ci: advance immutable flags2env parser pin'
          git push origin HEAD:chore/flags2env-inline-value-fix-clean
