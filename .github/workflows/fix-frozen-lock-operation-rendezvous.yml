name: materialize frozen-lock rendezvous assertion

on:
  push:
    branches:
      - test/frozen-lock-operation-rendezvous
    paths:
      - .github/workflows/fix-frozen-lock-operation-rendezvous.yml

permissions:
  contents: write

concurrency:
  group: frozen-lock-operation-rendezvous
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/frozen-lock-operation-rendezvous
          persist-credentials: true
          show-progress: false

      - name: Preserve the deliberate operation rendezvous only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/frozen-lock-integrity-e2e.sh')
          text = path.read_text()
          old = '''  [[ ! -e "$root/zed_modules" ]] || fail "$label materialized zed_modules"
            [[ ! -e "$root/node_modules" ]] || fail "$label materialized node_modules"
            [[ ! -e "$root/.zed" ]] || fail "$label materialized native adapter state"
            if [[ -d "$root/.zpkg-staging" ]]; then
          '''
          new = '''  [[ ! -e "$root/zed_modules" ]] || fail "$label materialized zed_modules"
            [[ ! -e "$root/node_modules" ]] || fail "$label materialized node_modules"
            if [[ -e "$root/.zed" ]]; then
              [[ -d "$root/.zed" && ! -L "$root/.zed" ]] \\
                || fail "$label left an unsafe .zed path"
              [[ -f "$root/.zed/operation.lock" && ! -L "$root/.zed/operation.lock" ]] \\
                || fail "$label did not retain the regular operation rendezvous"
              extra_zed_entry="$(
                find "$root/.zed" -mindepth 1 \\
                  ! -path "$root/.zed/operation.lock" \\
                  -print -quit
              )"
              [[ -z "$extra_zed_entry" ]] \\
                || fail "$label materialized native adapter state: $extra_zed_entry"
            fi
            if [[ -d "$root/.zpkg-staging" ]]; then
          '''
          if old not in text:
              raise SystemExit('frozen atomicity anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate shell and focused frozen test
        run: |
          set -euo pipefail
          bash -n tests/frozen-lock-integrity-e2e.sh
          cargo build --locked --bin zed
          root="$RUNNER_TEMP/frozen-lock-operation-rendezvous"
          ZED_FROZEN_LOCK_E2E_ROOT="$root" \
            tests/frozen-lock-integrity-e2e.sh "$PWD/target/debug/zed"
          test -f "$root/negative-cases/empty-lock/.zed/operation.lock"
          test -z "$(
            find "$root/negative-cases/empty-lock/.zed" -mindepth 1 \
              ! -path "$root/negative-cases/empty-lock/.zed/operation.lock" \
              -print -quit
          )"

      - name: Commit ordinary test source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/frozen-lock-integrity-e2e.sh
          git diff --cached --check
          git commit -m 'test: allow only the operation rendezvous after frozen rejection'
          git push origin HEAD:test/frozen-lock-operation-rendezvous
