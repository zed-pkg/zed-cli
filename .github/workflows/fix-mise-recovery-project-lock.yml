name: serialize mise recovery with checkout ownership

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main
    paths:
      - .github/workflows/fix-mise-recovery-project-lock.yml

permissions:
  contents: write

concurrency:
  group: fix-mise-recovery-project-lock
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Acquire checkout ownership before transaction recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          text = path.read_text()
          old = '''    if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {
                  // Every live project transaction already owns this kernel-backed
                  // install lock. Recover under the same lock so a concurrent process
                  // cannot mistake an in-flight rollback journal for an abandoned one.
                  let store = Store::new(&cfg.home);
                  let _recovery_lock = store.install_lock()?;
                  zed_cli::transaction::recover_pending(&cwd)?;
              }
          '''
          new = '''    if cwd.join(zed_cli::transaction::STAGING_DIR).is_dir() {
                  // Recovery mutates checkout-owned paths. Acquire the canonical
                  // checkout operation lock before the store lock so another process
                  // cannot mistake a live transaction journal for an abandoned one.
                  zed_cli::project_lock::with_lock(
                      &cwd,
                      "recover interrupted project transaction",
                      || {
                          let store = Store::new(&cfg.home);
                          let _recovery_lock = store.install_lock()?;
                          zed_cli::transaction::recover_pending(&cwd)?;
                          Ok(())
                      },
                  )?;
              }
          '''
          if old not in text:
              raise SystemExit('startup recovery lock anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate exact recovery and exporter boundaries
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --test mise_export_api_boundaries
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo clippy --locked --bin zed --test mise_export_api_boundaries \
            --test mise_export_cli --test mise_export_reserved_paths_cli -- -D warnings

      - name: Commit ordinary product source
        run: |
          set -euo pipefail
          rm .github/workflows/fix-mise-recovery-project-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs .github/workflows/fix-mise-recovery-project-lock.yml
          git diff --cached --check
          git commit -m 'fix(DEN-1462): serialize startup recovery by checkout'
          git push origin HEAD:agent/den-1462-mise-export-current-main
