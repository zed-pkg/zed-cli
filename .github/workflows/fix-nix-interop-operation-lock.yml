name: materialize deterministic Nix operation-lock exclusion

on:
  push:
    branches:
      - fix/nix-interop-exclude-operation-lock
    paths:
      - .github/workflows/fix-nix-interop-operation-lock.yml

permissions:
  contents: write

concurrency:
  group: fix-nix-interop-operation-lock
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/nix-interop-exclude-operation-lock
          persist-credentials: true
          show-progress: false

      - name: Remove volatile operation-lock diagnostics from fixed outputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          package = Path('nix/zed-package.nix')
          text = package.read_text()
          old = '''        if [[ -e "$work/.zpkg-staging" ]]; then
                    echo "zed-pkg Nix bridge: successful install left transaction state behind" >&2
                    exit 1
                  fi

                  mkdir -p "$out/tree" "$out/metadata"
          '''
          new = '''        if [[ -e "$work/.zpkg-staging" ]]; then
                    echo "zed-pkg Nix bridge: successful install left transaction state behind" >&2
                    exit 1
                  fi

                  # `.zed/operation.lock` is a durable local rendezvous point whose
                  # diagnostic payload contains process/host/timing data. Descriptor
                  # ownership—not those bytes—is authoritative. It must not enter a
                  # recursive fixed output or identical frozen installs hash differently.
                  operation_lock="$work/.zed/operation.lock"
                  if [[ -L "$operation_lock" ]]; then
                    echo "zed-pkg Nix bridge: operation lock must not be a symlink" >&2
                    exit 1
                  fi
                  if [[ -e "$operation_lock" ]]; then
                    if [[ ! -f "$operation_lock" ]]; then
                      echo "zed-pkg Nix bridge: operation lock must be a regular file" >&2
                      exit 1
                    fi
                    rm -f -- "$operation_lock"
                    rmdir "$work/.zed" 2>/dev/null || true
                  fi

                  mkdir -p "$out/tree" "$out/metadata"
          '''
          if old not in text:
              raise SystemExit('Nix bridge transaction-state anchor not found')
          package.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/nix-interop.yml')
          text = workflow.read_text()
          old = '''          test ! -e "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"
                    test -f "$deps_a/metadata/bridge.json"
          '''
          new = '''          test ! -e "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"
                    test ! -e "$deps_a/tree/.zed/operation.lock"
                    test -f "$deps_a/metadata/bridge.json"
          '''
          if old not in text:
              raise SystemExit('Nix interop output assertion anchor not found')
          workflow.write_text(text.replace(old, new, 1))
          PY

      - name: Validate patch shape
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'operation_lock="$work/.zed/operation.lock"' nix/zed-package.nix
          grep -F 'test ! -e "$deps_a/tree/.zed/operation.lock"' .github/workflows/nix-interop.yml

      - name: Commit ordinary repair source
        run: |
          set -euo pipefail
          rm .github/workflows/fix-nix-interop-operation-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nix/zed-package.nix .github/workflows/nix-interop.yml .github/workflows/fix-nix-interop-operation-lock.yml
          git diff --cached --check
          git commit -m 'fix: exclude operation-lock diagnostics from Nix fixed outputs'
          git push origin HEAD:fix/nix-interop-exclude-operation-lock
