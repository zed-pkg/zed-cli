name: Fix release-plan flag scope (temporary)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/den-100-release-plan' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zed-pkg/zed-interfaces
          ref: main
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Keep release JSON command-scoped
        working-directory: zed-cli
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.cli-flags.toml')
          text = path.read_text(encoding='utf-8')
          block = '''[flags.release_json]
          env = "ZED_PKG_RELEASE_JSON"
          aliases = ["json"]
          type = "bool"
          default = "false"
          help = "Emit a machine-readable release plan."

          '''.replace('          ', '')
          assert text.count(block) == 1
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
      - name: Verify full Rust and flags contract
        working-directory: zed-cli
        run: |
          cargo fmt --all --check
          cargo test --locked
      - name: Commit the scoped flag fix
        working-directory: zed-cli
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cli-flags.toml
          git commit -m "fix: scope release JSON flag to plan"
          git push origin HEAD:feat/den-100-release-plan
