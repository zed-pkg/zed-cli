name: fix Windows auth helper lint

on:
  push:
    branches:
      - agent/den-1439-mise-import-current-main
    paths:
      - .github/workflows/fix-windows-auth-path.yml

permissions:
  contents: write

concurrency:
  group: fix-windows-auth-path
  cancel-in-progress: false

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out current candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1439-mise-import-current-main
          persist-credentials: false
          show-progress: false

      - name: Apply portable parameter naming
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/auth.rs')
          text = path.read_text()
          old = '''fn secure_file_mode(path: &Path) -> Result<()> {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt as _;
                  fs::set_permissions(path, fs::Permissions::from_mode(0o600))?;
              }
              Ok(())
          }
          '''
          new = '''fn secure_file_mode(_path: &Path) -> Result<()> {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt as _;
                  fs::set_permissions(_path, fs::Permissions::from_mode(0o600))?;
              }
              Ok(())
          }
          '''
          if old not in text:
              raise SystemExit('secure_file_mode source anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate native Windows surfaces
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo fmt --all -- --check
          cargo test --locked --lib environment::tests
          cargo test --locked --test mise_environment_cli
          cargo clippy --locked --all-targets -- -D warnings

  commit:
    needs: validate-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/den-1439-mise-import-current-main
          persist-credentials: true
          show-progress: false

      - name: Apply validated repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/auth.rs')
          text = path.read_text()
          old = '''fn secure_file_mode(path: &Path) -> Result<()> {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt as _;
                  fs::set_permissions(path, fs::Permissions::from_mode(0o600))?;
              }
              Ok(())
          }
          '''
          new = '''fn secure_file_mode(_path: &Path) -> Result<()> {
              #[cfg(unix)]
              {
                  use std::os::unix::fs::PermissionsExt as _;
                  fs::set_permissions(_path, fs::Permissions::from_mode(0o600))?;
              }
              Ok(())
          }
          '''
          if old not in text:
              raise SystemExit('secure_file_mode source anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-windows-auth-path.yml

      - name: Commit the Windows portability repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/auth.rs .github/workflows/fix-windows-auth-path.yml
          git diff --cached --check
          git commit -m 'fix: make auth permission helper warning-free on Windows'
          git push origin HEAD:agent/den-1439-mise-import-current-main
