name: Fix Windows copy-mode and hoisted bins once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-windows-copy-mode-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-windows-copy-mode-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-3020-cli-portability'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3020-cli-portability
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply the bounded Windows portability repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          @'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact boundary, found {count}')
              return source.replace(old, new, 1)

          ops = Path('src/ops.rs')
          text = ops.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'use std::io::BufRead;\n',
              'use std::io::{BufRead, Read};\n',
              'ops I/O import',
          )

          documentation = '''/// `zed run <command>` — run a hoisted dependency binary (from
          /// `<install.dir>/.bin`, default `zed_modules/.bin`) or any command, with that
          /// directory prepended to PATH — npx-style, without polluting the OS PATH
          /// (zed-docs issue #7). Returns the child's exit code.
          '''
          helpers = r'''fn hoisted_bin_candidate(bin_dir: &Path, command: &str) -> Option<PathBuf> {
              let exact = bin_dir.join(command);
              if exact.is_file() {
                  return Some(exact);
              }
              #[cfg(windows)]
              for extension in ["exe", "cmd", "bat", "ps1"] {
                  let candidate = bin_dir.join(command).with_extension(extension);
                  if candidate.is_file() {
                      return Some(candidate);
                  }
              }
              None
          }

          #[cfg(windows)]
          fn windows_shebang_command(path: &Path) -> Option<Command> {
              let mut file = fs::File::open(path).ok()?;
              let mut prefix = [0_u8; 512];
              let read = file.read(&mut prefix).ok()?;
              let first_line = std::str::from_utf8(&prefix[..read]).ok()?.lines().next()?;
              let shebang = first_line.strip_prefix("#!")?.trim();
              let mut parts = shebang.split_whitespace();
              let raw_interpreter = parts.next()?;
              let raw_name = Path::new(raw_interpreter).file_name()?.to_string_lossy();
              let interpreter = if raw_name.eq_ignore_ascii_case("env") {
                  parts.next()?.to_string()
              } else {
                  raw_name.into_owned()
              };
              let mut command = Command::new(interpreter);
              command.args(parts).arg(path);
              Some(command)
          }

          #[cfg(windows)]
          fn command_for_hoisted_bin(path: &Path) -> Command {
              match path
                  .extension()
                  .and_then(|extension| extension.to_str())
                  .map(str::to_ascii_lowercase)
                  .as_deref()
              {
                  Some("cmd" | "bat") => {
                      let mut command = Command::new("cmd.exe");
                      command.args(["/D", "/S", "/C"]).arg(path);
                      command
                  }
                  Some("ps1") => {
                      let mut command = Command::new("powershell.exe");
                      command
                          .args(["-NoLogo", "-NoProfile", "-NonInteractive", "-File"])
                          .arg(path);
                      command
                  }
                  _ => windows_shebang_command(path).unwrap_or_else(|| Command::new(path)),
              }
          }

          '''
          text = replace_once(
              text,
              documentation,
              helpers + documentation,
              'zed run documentation boundary',
          )

          run_start = text.find(
              'pub fn run(project: &Path, command: &str, args: &[String]) -> Result<i32> {'
          )
          run_end = text.find('\n/// `zed yank', run_start)
          if run_start < 0 or run_end < 0:
              raise SystemExit('zed run semantic boundary drifted')
          new_run = r'''pub fn run(project: &Path, command: &str, args: &[String]) -> Result<i32> {
              let modules_dir = project_modules_dir(project);
              let bin_dir = project.join(&modules_dir).join(BIN_DIR);
              let hoisted = hoisted_bin_candidate(&bin_dir, command);
              let mut paths: Vec<PathBuf> = vec![bin_dir.clone()];
              if let Some(existing) = std::env::var_os("PATH") {
                  paths.extend(std::env::split_paths(&existing));
              }
              let new_path = std::env::join_paths(&paths).context("assembling PATH for zed run")?;
              // Prefer a hoisted bin by absolute path; otherwise fall through to a
              // normal PATH lookup (with .bin still prepended for the child's tools).
              let program = hoisted.as_deref().unwrap_or_else(|| Path::new(command));
              #[cfg(windows)]
              let mut child = if hoisted.is_some() {
                  command_for_hoisted_bin(program)
              } else {
                  Command::new(program)
              };
              #[cfg(not(windows))]
              let mut child = Command::new(program);
              let status = child
                  .args(args)
                  .env("PATH", &new_path)
                  .current_dir(project)
                  .status();
              match status {
                  Ok(status) => Ok(status.code().unwrap_or(1)),
                  Err(_) => {
                      let available: Vec<String> = fs::read_dir(&bin_dir)
                          .map(|entries| {
                              entries
                                  .flatten()
                                  .map(|e| e.file_name().to_string_lossy().to_string())
                                  .collect()
                          })
                          .unwrap_or_default();
                      bail!(
                          "failed to run `{command}` — not a hoisted bin in {modules_dir}/{BIN_DIR}/ \
                           (available: {}) nor on PATH; packages expose binaries via their [bin] table",
                          if available.is_empty() {
                              "none".to_string()
                          } else {
                              available.join(", ")
                          }
                      )
                  }
              }
          }
          '''
          text = text[:run_start] + new_run + text[run_end:]
          ops.write_text(text, encoding='utf-8')

          e2e = Path('tests/e2e.rs')
          tests = e2e.read_text(encoding='utf-8')

          roundtrip_start = tests.find(
              '    assert!(\n        fs::symlink_metadata(&demo_link)'
          )
          roundtrip_end = tests.find(
              '    assert!(demo_link.join("src/lib.txt").exists());',
              roundtrip_start,
          )
          if roundtrip_start < 0 or roundtrip_end < 0:
              raise SystemExit('roundtrip materialization boundary drifted')
          roundtrip = r'''    let demo_metadata = fs::symlink_metadata(&demo_link).unwrap();
              #[cfg(unix)]
              assert!(demo_metadata.file_type().is_symlink());
              #[cfg(not(unix))]
              assert!(
                  !demo_metadata.file_type().is_symlink() && demo_link.is_dir(),
                  "non-Unix installs must normalize symlink mode to a project-owned directory"
              );
              assert!(base_link.join("src/base.txt").exists());
              let link_target = fs::canonicalize(&demo_link).unwrap();
              let store_root = fs::canonicalize(cfg.home.join("store")).unwrap();
              #[cfg(unix)]
              assert!(
                  link_target.starts_with(&store_root),
                  "symlink must point into the global store"
              );
              #[cfg(not(unix))]
              assert!(
                  !link_target.starts_with(&store_root),
                  "copy-mode materialization must remain project-owned"
              );
          '''
          tests = tests[:roundtrip_start] + roundtrip + tests[roundtrip_end:]

          live_start = tests.find(
              '    // Live editing: a change in the member source is visible immediately.\n'
          )
          live_end_marker = (
              '    assert_eq!(fs::read_to_string(&linked_lib).unwrap(), "v2 of liba\\n");\n'
          )
          live_end = tests.find(live_end_marker, live_start)
          if live_start < 0 or live_end < 0:
              raise SystemExit('workspace live-edit boundary drifted')
          live_end += len(live_end_marker)
          live = r'''    fs::write(liba.join("src/lib.txt"), "v2 of liba\n").unwrap();
              #[cfg(unix)]
              assert_eq!(
                  fs::read_to_string(&linked_lib).unwrap(),
                  "v2 of liba\n",
                  "Unix workspace links must expose live source edits"
              );
              #[cfg(not(unix))]
              {
                  assert_eq!(
                      fs::read_to_string(&linked_lib).unwrap(),
                      "v1 of liba\n",
                      "copy-mode workspace materialization must remain a stable snapshot"
                  );
                  ops::install(
                      &app,
                      &cfg,
                      false,
                      InstallMode::Symlink,
                      Adapter::None,
                      false,
                      None,
                      false,
                  )
                  .unwrap();
                  assert_eq!(
                      fs::read_to_string(&linked_lib).unwrap(),
                      "v2 of liba\n",
                      "reinstall must refresh the non-Unix workspace snapshot"
                  );
              }
          '''
          tests = tests[:live_start] + live + tests[live_end:]
          tests = tests.replace(
              '/// [workspace] members resolve straight to their source directories, so\n'
              '/// edits are live and the registry is never consulted for them.\n',
              '/// Workspace members use live source links on Unix and project-owned snapshots\n'
              '/// where directory symlinks are unavailable; the registry is never consulted.\n',
              1,
          )

          workspace_start = tests.find(
              '    // The local member is path-linked to its source (live editing)...\n'
          )
          workspace_end = tests.find(
              '    // The lockfile pins the external dep but not the path-linked member.\n',
              workspace_start,
          )
          if workspace_start < 0 or workspace_end < 0:
              raise SystemExit('workspace materialization boundary drifted')
          workspace = r'''    let util_link = web.join(MODULES_DIR).join("acme").join("util");
              let util_metadata = fs::symlink_metadata(&util_link).unwrap();
              #[cfg(unix)]
              assert!(util_metadata.file_type().is_symlink());
              #[cfg(not(unix))]
              assert!(!util_metadata.file_type().is_symlink() && util_link.is_dir());
              assert!(util_link.join("util.txt").exists());
              #[cfg(unix)]
              assert_eq!(
                  fs::canonicalize(&util_link).unwrap(),
                  fs::canonicalize(&util).unwrap(),
                  "local member must link to its source dir, not the store"
              );
              #[cfg(not(unix))]
              assert_ne!(
                  fs::canonicalize(&util_link).unwrap(),
                  fs::canonicalize(&util).unwrap(),
                  "non-Unix workspace dependencies must use project-owned copy mode"
              );

              let ext_link = web.join(MODULES_DIR).join("acme").join("ext");
              assert!(ext_link.join("e.txt").exists());
              let ext_materialized = fs::canonicalize(&ext_link).unwrap();
              let store_root = fs::canonicalize(cfg.home.join("store")).unwrap();
              #[cfg(unix)]
              assert!(ext_materialized.starts_with(&store_root));
              #[cfg(not(unix))]
              assert!(!ext_materialized.starts_with(&store_root));

          '''
          tests = tests[:workspace_start] + workspace + tests[workspace_end:]
          e2e.write_text(tests, encoding='utf-8')
          Path('.github/workflows/fix-windows-copy-mode-once.yml').unlink()
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Windows portability transform failed with exit code $LASTEXITCODE"
          }
          git diff --check

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate focused Windows behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --test e2e bins_are_hoisted_and_runnable -- --nocapture
          cargo test --locked --test e2e publish_install_roundtrip_with_transitive_deps -- --nocapture
          cargo test --locked --test e2e workspace_members_link_from_source -- --nocapture
          cargo test --locked --test e2e workspace_installs_members_against_one_lock -- --nocapture
          cargo test --locked --all-targets -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit only the permanent Windows portability repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
            $PSNativeCommandUseErrorActionPreference = $true
          }
          git diff --check
          if (Test-Path '.github/workflows/fix-windows-copy-mode-once.yml') {
            throw 'temporary writer was not removed'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/ops.rs tests/e2e.rs .github/workflows/fix-windows-copy-mode-once.yml
          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @('.github/workflows/fix-windows-copy-mode-once.yml', 'src/ops.rs', 'tests/e2e.rs')
          if (Compare-Object $changed $expected) {
            throw "unexpected staged paths: $($changed -join ', ')"
          }
          git commit -m 'fix(DEN-3020): support Windows copy mode and hoisted scripts'
          git push origin HEAD:agent/den-3020-cli-portability
