name: Fix Windows self-update backup cleanup once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/fix-windows-self-update-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-windows-self-update-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-3020-cli-portability'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3020-cli-portability
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply the bounded Windows cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          source = Path('src/update.rs')
          text = source.read_text(encoding='utf-8')
          old = '''    std::fs::rename(&tmp, exe).with_context(|| format!("replacing {}", exe.display()))?;
              Ok(())
          }
          '''
          new = '''    std::fs::rename(&tmp, exe).with_context(|| format!("replacing {}", exe.display()))?;
              #[cfg(windows)]
              {
                  // A live Windows executable can keep the renamed image locked until
                  // process exit. Remove the backup whenever Windows permits it, while
                  // preserving the successful replacement if the live-image deletion is
                  // deferred by the operating system.
                  let _ = std::fs::remove_file(dir.join(".zed-update.old"));
              }
              Ok(())
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('self-update replacement anchor drifted')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-windows-self-update-once.yml').unlink()
          '@ | python -
          git diff --check

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Validate the Windows updater and complete locked suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked update::tests::replace_exe_swaps_contents_atomically_and_keeps_exec_bit -- --nocapture
          cargo test --locked --all-targets -- --nocapture
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit only the permanent product fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if (Test-Path '.github/workflows/fix-windows-self-update-once.yml') {
            throw 'temporary writer was not removed'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/update.rs .github/workflows/fix-windows-self-update-once.yml
          $changed = @(git diff --cached --name-only | Sort-Object)
          $expected = @('.github/workflows/fix-windows-self-update-once.yml', 'src/update.rs')
          if (Compare-Object $changed $expected) {
            throw "unexpected staged paths: $($changed -join ', ')"
          }
          git commit -m 'fix(DEN-3020): clean removable Windows self-update backups'
          git push origin HEAD:agent/den-3020-cli-portability
