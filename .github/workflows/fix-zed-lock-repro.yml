name: fix zed lock reproducibility

on:
  push:
    branches:
      - fix-zed-lock-repro
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-zed-lock-repro
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Refresh only the stale zed-lock pin
        run: cargo update -p zed-lock

      - name: Certify formatted locked build
        run: |
          cargo fmt --all -- --check
          cargo build --locked --release --bin zed

      - name: Commit deterministic repair when required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Repository is already reproducible"
            exit 0
          fi
          git diff --check
          git diff -- Cargo.lock tests/toml_contract.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock tests/toml_contract.rs
          git commit -m "build: repair locked zed-cli build"
          git push origin HEAD:fix-zed-lock-repro
