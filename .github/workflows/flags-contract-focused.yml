name: CLI flags2env contract parity (focused)

on:
  pull_request:
    paths:
      - '.cli-flags.toml'
      - 'src/cli.rs'
      - 'tests/cli_flags_canonical_types.rs'
      - 'tests/cli_flags_contract_parity.rs'
      - '.github/workflows/flags-contract-focused.yml'
  push:
    branches: [main]
    paths:
      - '.cli-flags.toml'
      - 'src/cli.rs'
      - 'tests/cli_flags_canonical_types.rs'
      - 'tests/cli_flags_contract_parity.rs'
      - '.github/workflows/flags-contract-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flags-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flags-contracts:
    name: Canonical CLI flags and public scope parity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Validate actual flags2env contract tests, locked
        run: cargo test --locked --test cli_flags_canonical_types --test cli_flags_contract_parity
      - name: Verify typed CLI contract and updater security boundary
        run: |
          cargo test --locked --lib cli_flags_toml_is_in_sync_with_clap
          cargo test --locked --lib updater_external_flag_scope_is_explicit_and_conflicting_options_fail
