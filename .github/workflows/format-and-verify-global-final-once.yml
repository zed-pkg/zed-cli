name: Format and verify hardened global packages once

on:
  push:
    branches:
      - agent/global-zed-packages-final
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-and-verify-global-final-once.yml

permissions:
  contents: write

concurrency:
  group: format-and-verify-global-final-once
  cancel-in-progress: false

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/global-zed-packages-final
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install Rust validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Format and verify the complete candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib global::tests
          cargo test --locked --test global_cli
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features --locked

      - name: Commit permanent formatted product changes only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-and-verify-global-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatted product change required.'
            exit 0
          fi
          git commit -m 'style: format and verify global package profiles'
          git push origin HEAD:agent/global-zed-packages-final
