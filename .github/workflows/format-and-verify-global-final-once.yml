name: Format hardened global packages once

on:
  push:
    branches:
      - agent/global-zed-packages-final
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-and-verify-global-final-once.yml

permissions:
  contents: write

concurrency:
  group: format-global-packages-final-once
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/global-zed-packages-final
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply formatter
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check

      - name: Commit permanent formatted product changes only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-and-verify-global-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format hardened global package profiles'
          git push origin HEAD:agent/global-zed-packages-final
