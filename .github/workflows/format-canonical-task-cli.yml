name: format canonical task CLI files

on:
  push:
    branches:
      - feat/den-2443-canonical-task-cli
    paths:
      - .github/workflows/format-canonical-task-cli.yml

permissions:
  contents: write

concurrency:
  group: format-canonical-task-cli
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-2443-canonical-task-cli
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply exact rustfmt and validate task surfaces
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib task_runtime::tests
          cargo test --locked --lib task_cli::tests
          cargo test --locked --test task_runtime_cli
          cargo test --locked --test task_main_cli
          cargo clippy --locked --bin zed --bin zed-task \
            --test task_runtime_cli --test task_main_cli -- -D warnings

      - name: Commit only durable formatted source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/zed-task.rs src/task_cli.rs tests/task_main_cli.rs
          git diff --cached --check
          git commit -m 'style(DEN-2443): format canonical task command sources'
          git push origin HEAD:feat/den-2443-canonical-task-cli
