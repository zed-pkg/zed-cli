name: Materialize current-main Nix bundle rustfmt patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-current-main-nix-bundle-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-current-main-nix-bundle-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out exact repair candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Generate and constrain formatting patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          python3 - <<'PY'
          import subprocess

          allowed = {
              'src/nix_bundle_write.rs',
              'tests/nix_bundle_write_boundaries.rs',
              'tests/nix_bundle_write_cli.rs',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  'formatter changed files outside the reviewed repair boundary: '
                  + ', '.join(sorted(unexpected))
              )
          if not changed:
              raise SystemExit('current main is already rustfmt-clean; no repair needed')
          PY

          cargo fmt --all --check
          cargo test --locked --test nix_bundle_write_cli --no-run
          cargo test --locked --test nix_bundle_write_boundaries --no-run
          git diff --binary -- \
            src/nix_bundle_write.rs \
            tests/nix_bundle_write_boundaries.rs \
            tests/nix_bundle_write_cli.rs \
            > "$RUNNER_TEMP/nix-bundle-rustfmt.patch"
          test -s "$RUNNER_TEMP/nix-bundle-rustfmt.patch"
          git diff --check

      - name: Upload reviewed formatter patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nix-bundle-rustfmt-${{ github.sha }}
          path: ${{ runner.temp }}/nix-bundle-rustfmt.patch
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
