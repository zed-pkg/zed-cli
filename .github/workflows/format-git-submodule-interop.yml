name: format git-submodule interop branch

on:
  push:
    branches:
      - feat/git-submodule-interop

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/git-submodule-interop
          persist-credentials: true
      - name: Install the pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply Rustfmt and commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git diff --cached --check
          git commit -m 'style: apply rustfmt to git-submodule interop'
          git push origin HEAD:feat/git-submodule-interop
