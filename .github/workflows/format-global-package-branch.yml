name: Format global package branch once

on:
  push:
    branches:
      - agent/global-zed-packages

permissions:
  contents: write

concurrency:
  group: format-global-package-branch
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply formatter and Clippy lock annotation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/global.rs')
          text = path.read_text()
          old = '''    let file = fs::OpenOptions::new()
              .create(true)
              .read(true)
              .write(true)
              .open(root.join(LOCK_FILE))?;'''
          new = '''    let file = fs::OpenOptions::new()
              .create(true)
              .truncate(false)
              .read(true)
              .write(true)
              .open(root.join(LOCK_FILE))?;'''
          if old not in text:
              raise SystemExit('expected lock-file OpenOptions block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- src/global.rs src/completion.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/global.rs src/completion.rs
          git commit -m 'style: apply Rust formatting'
          git push origin HEAD:agent/global-zed-packages
