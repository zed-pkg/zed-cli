name: one-shot lifecycle formatter

on:
  push:
    branches:
      - feat/root-project-lifecycle-hooks-v2

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip lifecycle-format]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/root-project-lifecycle-hooks-v2
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Format only lifecycle-owned Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          unexpected="$(git diff --name-only | grep -Ev '^(src/lifecycle\.rs|src/ops_lifecycle_entry\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'cargo fmt changed unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lifecycle.rs src/ops_lifecycle_entry.rs
          git rm .github/workflows/format-lifecycle-branch.yml
          git commit -m 'style(lifecycle): apply cargo fmt [skip lifecycle-format]'
          git push origin HEAD:feat/root-project-lifecycle-hooks-v2
