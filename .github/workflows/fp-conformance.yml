name: fp-conformance

# Functional-programming conformance ratchet.
#
# Deliberately cheap: stdlib Python, no dependency install, no dependency
# network. It compares current findings against the recorded budget and fails
# only on regression, so the pre-existing backlog never blocks a pull request
# while new violations do.
#
# Language-native checks (cargo clippy, eslint, dart analyze) are configured in
# the tree but not run here, to keep Actions minutes low. See FP-GUIDELINES.md.

on:
  pull_request:
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
      - 'tools/fp-conformance/**'
      - '.github/workflows/fp-conformance.yml'
  push:
    branches: [main, dev]
    paths:
      - '**.rs'
      - '**.ts'
      - '**.tsx'
      - '**.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fp-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: functional programming conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: ''

      - name: Scan
        run: |
          python3 tools/fp-conformance/fp_conformance.py . \
            --json fp-findings.json \
            --budget tools/fp-conformance/budget.json \
            --limit 60

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fp-findings
          path: fp-findings.json
          if-no-files-found: ignore
          retention-days: 14
