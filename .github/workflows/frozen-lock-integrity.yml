name: frozen lock integrity

on:
  pull_request:
    paths:
      - '.github/workflows/frozen-lock-integrity.yml'
      - 'tests/frozen-lock-integrity-e2e.sh'
      - 'tests/content-addressed-provenance-e2e.sh'
      - 'tests/fixtures/polyglot/**'
      - 'src/config.rs'
      - 'src/ops.rs'
      - 'src/manifestless.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/frozen-lock-integrity.yml'
      - 'tests/frozen-lock-integrity-e2e.sh'
      - 'tests/content-addressed-provenance-e2e.sh'
      - 'tests/fixtures/polyglot/**'
      - 'src/config.rs'
      - 'src/ops.rs'
      - 'src/manifestless.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Strict committed locks and content-addressed compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact zed-cli candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: zed-cli
          persist-credentials: false

      - name: Verify exact zed-cli candidate
        working-directory: zed-cli
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Resolve immutable graph and toolchain authorities
        id: authorities
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib

          canonical_repo = "https://github.com/zed-pkg/zed-interfaces.git"
          with open("Cargo.toml", "rb") as source:
              manifest = tomllib.load(source)
          with open("Cargo.lock", "rb") as source:
              lock = tomllib.load(source)
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]["channel"]

          dependency = manifest.get("dependencies", {}).get("zed-interfaces")
          if not isinstance(dependency, dict) or dependency.get("git") != canonical_repo:
              raise SystemExit(f"unexpected zed-interfaces dependency authority: {dependency!r}")
          rev = dependency.get("rev")
          if not isinstance(rev, str) or re.fullmatch(r"[0-9a-f]{40}", rev) is None:
              raise SystemExit(f"zed-interfaces rev must be a full immutable SHA: {rev!r}")
          for forbidden in ("branch", "tag", "path"):
              if forbidden in dependency:
                  raise SystemExit(f"zed-interfaces dependency mixes rev with {forbidden}: {dependency!r}")

          packages = [
              package
              for package in lock.get("package", [])
              if package.get("name") == "zed-interfaces"
          ]
          expected_source = f"git+{canonical_repo}?rev={rev}#{rev}"
          if len(packages) != 1 or packages[0].get("source") != expected_source:
              raise SystemExit(
                  "Cargo.lock must contain exactly one zed-interfaces package at the declared immutable source: "
                  f"packages={packages!r} expected={expected_source!r}"
              )

          if not isinstance(toolchain, str) or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", toolchain) is None:
              raise SystemExit(f"Rust toolchain must be an immutable version: {toolchain!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"zed_interfaces_sha={rev}\n")
              output.write(f"rust_toolchain={toolchain}\n")
          PY

      - name: Checkout the exact merged strict and compatibility interface contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ steps.authorities.outputs.zed_interfaces_sha }}
          path: zed-interfaces
          persist-credentials: false

      - name: Prove the CLI, lock, and sibling use the reviewed merge
        shell: bash
        env:
          ZED_INTERFACES_SHA: ${{ steps.authorities.outputs.zed_interfaces_sha }}
        run: |
          set -euo pipefail
          test "$(git -C zed-interfaces rev-parse HEAD)" = "$ZED_INTERFACES_SHA"
          grep -F 'vcs_commit must be explicitly present' zed-interfaces/src/rust/lockfile.rs
          grep -F 'artifact-sha256:' zed-interfaces/src/rust/lockfile.rs
          grep -F 'normalize_missing_package_revisions' zed-interfaces/src/rust/lockfile.rs
          grep -F '"vcs_commit"' zed-interfaces/schemas/lockfile.json
          test ! -e zed-cli/.github/workflows/den-1464-retarget.yml
          for old in \
            dc0e0a0620b9462817950b552d3d334a184b1cb1 \
            2d397c60cdaa8fe0d331e98caba5202e61eaca4f \
            50ff18ed934c9871920373403fff69b1dc1a0e0a \
            31caf94d89ef04b9e4fc589fa945d028d0c8e0a0 \
            625ba7bdf4339df7d0880f791a0715ca894558fe \
            cc5ed7339672543c734c5f1fd19f7e017a771854; do
            ! grep -q "$old" zed-cli/Cargo.toml
            ! grep -q "$old" zed-cli/Cargo.lock
          done

      - name: Install repository-declared Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ steps.authorities.outputs.rust_toolchain }}

      - name: Restore bounded Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: zed-cli

      - name: Build the exact zed executable under test
        working-directory: zed-cli
        run: cargo build --locked --bin zed

      - name: Check both binary-level harnesses
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/frozen-lock-integrity-e2e.sh
          bash -n tests/content-addressed-provenance-e2e.sh

      - name: Prove frozen dependency locks fail closed and atomically
        working-directory: zed-cli
        env:
          ZED_FROZEN_LOCK_E2E_ROOT: ${{ runner.temp }}/frozen-lock-integrity
          ZED_FROZEN_LOCK_E2E_KEEP: '1'
        shell: bash
        run: |
          set -o pipefail
          bash tests/frozen-lock-integrity-e2e.sh "$PWD/target/debug/zed" \
            2>&1 | tee "$RUNNER_TEMP/frozen-lock-integrity.log"

      - name: Prove legacy publication emits explicit content-addressed provenance
        working-directory: zed-cli
        env:
          ZED_CONTENT_PROVENANCE_E2E_ROOT: ${{ runner.temp }}/content-addressed-provenance
          ZED_CONTENT_PROVENANCE_E2E_KEEP: '1'
        shell: bash
        run: |
          set -o pipefail
          bash tests/content-addressed-provenance-e2e.sh "$PWD/target/debug/zed" \
            2>&1 | tee "$RUNNER_TEMP/content-addressed-provenance.log"

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-lock-integrity-diagnostics
          path: |
            ${{ runner.temp }}/frozen-lock-integrity.log
            ${{ runner.temp }}/frozen-lock-integrity/negative-cases/*/frozen.log
            ${{ runner.temp }}/frozen-lock-integrity/negative-cases/*/.zpkg.toml
            ${{ runner.temp }}/frozen-lock-integrity/negative-cases/*/.zpkg.lock
            ${{ runner.temp }}/content-addressed-provenance.log
            ${{ runner.temp }}/content-addressed-provenance/consumer/.zpkg.toml
            ${{ runner.temp }}/content-addressed-provenance/consumer/.zpkg.lock
          if-no-files-found: warn
          retention-days: 1
