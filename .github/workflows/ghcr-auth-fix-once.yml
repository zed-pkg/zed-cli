name: apply GHCR auth fix once

on:
  push:
    branches:
      - DEN-3829-github-control-plane-fallback
    paths:
      - '.github/workflows/ghcr-auth-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3829-github-control-plane-fallback
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Replace raw GitHub bearer use with GHCR registry-token exchange
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/github_packages.rs')
          s = p.read_text()
          old = '    let bearer = ghcr_bearer(&client, token, &identity)?;'
          new = '    let bearer = ghcr_bearer(&client, Some(token), &identity, GhcrScope::PushPull)?;'
          assert old in s
          s = s.replace(old, new, 1)

          replacement = r'''#[derive(Clone, Copy, Debug)]
          enum GhcrScope {
              Pull,
              PushPull,
          }

          impl GhcrScope {
              fn actions(self) -> &'static str {
                  match self {
                      Self::Pull => "pull",
                      Self::PushPull => "pull,push",
                  }
              }
          }

          fn ghcr_bearer(
              client: &reqwest::blocking::Client,
              github_token: Option<&str>,
              identity: &GithubIdentity,
              scope: GhcrScope,
          ) -> Result<String> {
              let scope = format!(
                  "repository:{}:{}",
                  ghcr_repository(identity),
                  scope.actions()
              );
              let mut request = client
                  .get("https://ghcr.io/token")
                  .query(&[("service", "ghcr.io"), ("scope", scope.as_str())]);
              if let Some(token) = github_token {
                  let username = github_username(client, token)?;
                  request = request.basic_auth(username, Some(token));
              }
              let response = request.send().context("request GHCR registry token")?;
              let status = response.status();
              if !status.is_success() {
                  bail!("GHCR registry token request for {scope} returned {status}");
              }
              let body = response
                  .json::<GhcrTokenResponse>()
                  .context("decode GHCR registry token response")?;
              body.token
                  .or(body.access_token)
                  .filter(|token| !token.trim().is_empty())
                  .context("GHCR registry token response contained no token")
          }

          fn github_username(client: &reqwest::blocking::Client, token: &str) -> Result<String> {
              for key in ["ZED_PKG_GITHUB_USER", "GITHUB_ACTOR", "GH_USER"] {
                  if let Ok(value) = std::env::var(key)
                      && !value.trim().is_empty()
                  {
                      return Ok(value);
                  }
              }
              let response = client
                  .get("https://api.github.com/user")
                  .header("Accept", "application/vnd.github+json")
                  .bearer_auth(token)
                  .send()
                  .context("resolve GitHub login for GHCR authentication")?;
              let status = response.status();
              if !status.is_success() {
                  bail!("GitHub /user returned {status} while resolving GHCR login");
              }
              let user = response
                  .json::<GithubUser>()
                  .context("decode GitHub user for GHCR authentication")?;
              if user.login.trim().is_empty() {
                  bail!("GitHub /user returned an empty login for GHCR authentication");
              }
              Ok(user.login)
          }

          #[derive(Debug, serde::Deserialize)]
          struct GhcrTokenResponse {
              #[serde(default)]
              token: Option<String>,
              #[serde(default)]
              access_token: Option<String>,
          }

          #[derive(Debug, serde::Deserialize)]
          struct GithubUser {
              login: String,
          }

          fn ghcr_identity_from_registry_url(url: &str) -> Result<GithubIdentity> {
              let parsed = reqwest::Url::parse(url).with_context(|| format!("parse GHCR URL {url}"))?;
              if parsed.scheme() != "https"
                  || !matches!(parsed.host_str(), Some(host) if host.eq_ignore_ascii_case("ghcr.io"))
              {
                  bail!("GHCR fallback URL must use https://ghcr.io: {url}");
              }
              let segments = parsed
                  .path_segments()
                  .context("GHCR URL cannot be a base URL")?
                  .collect::<Vec<_>>();
              if segments.len() < 4
                  || segments[0] != "v2"
                  || segments[1].is_empty()
                  || segments[2].is_empty()
                  || !matches!(segments[3], "manifests" | "blobs")
              {
                  bail!("GHCR URL does not identify a canonical owner/repo artifact: {url}");
              }
              Ok(GithubIdentity {
                  owner: segments[1].to_string(),
                  repo: segments[2].to_string(),
              })
          }

          pub(crate) fn ghcr_manifest_json(
              client: &reqwest::blocking::Client,
              github_token: Option<&str>,
              identity: &GithubIdentity,
              tag: &str,
          ) -> Result<serde_json::Value> {
              let bearer = ghcr_bearer(client, github_token, identity, GhcrScope::Pull)?;
              let url = ghcr_manifest_url(identity, tag);
              let response = client
                  .get(&url)
                  .header("Accept", OCI_IMAGE_MANIFEST_MEDIA_TYPE)
                  .bearer_auth(&bearer)
                  .send()
                  .with_context(|| format!("GET {url}"))?;
              if !response.status().is_success() {
                  bail!("{url} returned {}", response.status());
              }
              response
                  .json::<serde_json::Value>()
                  .with_context(|| format!("decode GHCR manifest {url}"))
          }

          fn upload_blob'''
          pattern = re.compile(
              r'fn ghcr_bearer\([\s\S]*?\n\}\n\n#\[derive\(Debug, serde::Deserialize\)\]\nstruct GhcrTokenResponse \{[\s\S]*?\n\}\n\nfn upload_blob',
              re.M,
          )
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, n

          replacement = r'''pub fn download_ghcr_layer(
              client: &reqwest::blocking::Client,
              token: Option<&str>,
              url: &str,
              dest: &std::path::Path,
              declared_size: u64,
              max_bytes: u64,
          ) -> Result<()> {
              let identity = ghcr_identity_from_registry_url(url)?;
              let bearer = ghcr_bearer(client, token, &identity, GhcrScope::Pull)?;
              if url.contains("/blobs/") {
                  return download_blob(client, &bearer, url, dest, declared_size, max_bytes);
              }
              let response = client
                  .get(url)
                  .header("Accept", OCI_IMAGE_MANIFEST_MEDIA_TYPE)
                  .bearer_auth(&bearer)
                  .send()
                  .with_context(|| format!("GET {url}"))?;
              if !response.status().is_success() {
                  bail!("{url} returned {}", response.status());
              }
              let manifest: serde_json::Value = response.json()?;
              let layer = manifest
                  .get("layers")
                  .and_then(|layers| layers.as_array())
                  .and_then(|layers| layers.first())
                  .context("GHCR manifest has no layers")?;
              let digest = layer
                  .get("digest")
                  .and_then(|value| value.as_str())
                  .context("GHCR layer missing digest")?;
              let blob_url = url
                  .split("/manifests/")
                  .next()
                  .map(|prefix| format!("{prefix}/blobs/{digest}"))
                  .context("GHCR manifest URL is not a registry manifest")?;
              download_blob(client, &bearer, &blob_url, dest, declared_size, max_bytes)
          }

          fn download_blob(
              client: &reqwest::blocking::Client,
              bearer: &str,
              url: &str,
              dest: &std::path::Path,
              declared_size: u64,
              max_bytes: u64,
          ) -> Result<()> {
              let response = client
                  .get(url)
                  .bearer_auth(bearer)
                  .send()
                  .with_context(|| format!("GET {url}"))?;
              if !response.status().is_success() {
                  bail!("{url} returned {}", response.status());
              }
              fs::create_dir_all(dest.parent().context("dest has parent")?)?;
              let limit = if declared_size > 0 {
                  declared_size.saturating_add(1024 * 1024).min(max_bytes)
              } else {
                  max_bytes
              };
              let temp = dest.with_extension(format!(
                  "{}.part",
                  dest.extension().and_then(|ext| ext.to_str()).unwrap_or("zed")
              ));
              let _ = fs::remove_file(&temp);
              let mut file = fs::File::create(&temp)?;
              let mut limited = std::io::Read::take(response, limit.saturating_add(1));
              let copied = std::io::copy(&mut limited, &mut file)?;
              if copied > limit {
                  let _ = fs::remove_file(&temp);
                  bail!("GHCR blob exceeded {limit} bytes from {url}");
              }
              if copied == 0 {
                  let _ = fs::remove_file(&temp);
                  bail!("GHCR blob from {url} was empty");
              }
              file.sync_all()?;
              drop(file);
              fs::rename(&temp, dest)?;
              Ok(())
          }

          #[cfg(test)]'''
          pattern = re.compile(
              r'pub fn download_ghcr_layer\([\s\S]*?\n\}\n\nfn download_blob\([\s\S]*?\n\}\n\n#\[cfg\(test\)\]',
              re.M,
          )
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, n
          p.write_text(s)

          p = Path('src/source_fallback.rs')
          s = p.read_text()
          old = '''        let mut request = self
              .client
              .get(&url)
              .header("Accept", "application/vnd.oci.image.manifest.v1+json");
          if let Some(token) = &self.config.github_token {
              request = request.bearer_auth(token);
          }
          let Ok(response) = request.send() else {
              return None;
          };
          if !response.status().is_success() {
              return None;
          }
          let Ok(manifest) = response.json::<serde_json::Value>() else {
              return None;
          };'''
          new = '''        let Ok(manifest) = crate::github_packages::ghcr_manifest_json(
              &self.client,
              self.config.github_token.as_deref(),
              identity,
              tag,
          ) else {
              return None;
          };'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --locked github_packages --lib
          cargo test --locked source_fallback --lib
          git diff --check
      - name: Commit verified GHCR auth fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/github_packages.rs src/source_fallback.rs
          git commit -m 'fix: authenticate GHCR through registry tokens'
          git push origin HEAD:DEN-3829-github-control-plane-fallback
