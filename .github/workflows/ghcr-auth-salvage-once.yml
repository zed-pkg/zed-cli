name: salvage proven GHCR auth once

on:
  push:
    branches:
      - DEN-3829-github-control-plane-fallback
    paths:
      - '.github/workflows/ghcr-auth-salvage-once.yml'

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3829-github-control-plane-fallback
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Salvage proven GHCR protocol changes without stale identity guessing
        shell: bash
        run: |
          set -Eeuo pipefail
          git show 3d498147d755f7824ef5c1c1d8072ec6bcedb53a -- src/github_packages.rs > /tmp/ghcr-auth.patch
          git apply --3way /tmp/ghcr-auth.patch
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/source_fallback.rs')
          s = p.read_text()
          pattern = re.compile(
              r'''        let mut request = self\n            \.client\n            \.get\(&url\)\n            \.header\("Accept", "application/vnd\.oci\.image\.manifest\.v1\+json"\);\n        if let Some\(token\) = &self\.config\.github_token \{\n            request = request\.bearer_auth\(token\);\n        \}'''
          )
          replacement = '''        let mut request = self
              .client
              .get(&url)
              .header("Accept", "application/vnd.oci.image.manifest.v1+json");
          if let Some(token) = &self.config.github_token {
              match crate::github_packages::ghcr_registry_token(&self.client, token, identity, "pull")
              {
                  Ok(bearer) => request = request.bearer_auth(bearer),
                  Err(_) => return None,
              }
          }'''
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, f'expected one ghcr_version auth block, found {n}'
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --locked github_packages --lib
          cargo test --locked source_fallback --lib
          git diff --check
          grep -F '.basic_auth("x-access-token", Some(github_token))' src/github_packages.rs
          ! grep -A8 'fn ghcr_version' src/source_fallback.rs | grep -F 'bearer_auth(token)'
      - name: Commit verified salvage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/github_packages.rs src/source_fallback.rs
          git commit -m 'fix: use proven GHCR registry token exchange'
          git push origin HEAD:DEN-3829-github-control-plane-fallback
