name: github-source-fallback

on:
  pull_request:
    paths:
      - "src/github_source_archive.rs"
      - "src/source_fallback.rs"
      - "src/lib.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/github-source-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: GitHub source archive fallback
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # main currently carries an older zed-lock source in Cargo.lock than the
      # immutable revision already required by Cargo.toml. Refresh that one
      # package in-run so this focused job tests the fallback code instead of
      # being masked by the unrelated graph-authority failure.
      - name: Refresh declared zed-lock revision in runner
        run: cargo update -p zed-lock

      - name: Verify lock refresh is scoped
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.toml

      - name: Check candidate
        run: cargo check --all-targets

      - name: Test GitHub source normalizer
        run: cargo test --lib github_source_archive -- --nocapture

      - name: Test source fallback
        run: cargo test --lib source_fallback -- --nocapture
