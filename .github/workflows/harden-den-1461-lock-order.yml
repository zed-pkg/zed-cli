name: materialize DEN-1461 lock contract

on:
  push:
    branches:
      - feat/den-1461-mise-lock-contract
    paths:
      - .github/workflows/harden-den-1461-lock-order.yml
      - scripts/apply_den1461_current_wire.py
      - scripts/harden_den1461_lock.py
      - scripts/fix_den1461_enum_size.py
      - src/mise_lock.rs
      - docs/mise-lock-contract.md
      - tests/mise_lock_contract.rs
      - tests/fixtures/mise-lock/current-actionlint.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/harden-den-1461-lock-order.yml
      - scripts/apply_den1461_current_wire.py
      - scripts/harden_den1461_lock.py
      - scripts/fix_den1461_enum_size.py
      - src/mise_lock.rs
      - docs/mise-lock-contract.md
      - tests/mise_lock_contract.rs
      - tests/fixtures/mise-lock/current-actionlint.lock

permissions:
  contents: write

concurrency:
  group: harden-den-1461-lock-semantics
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/den-1461-mise-lock-contract'))
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-1461-mise-lock-contract
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply current wire format and semantic hardening
        run: |
          set -euo pipefail
          python scripts/apply_den1461_current_wire.py
          python scripts/harden_den1461_lock.py
          python scripts/fix_den1461_enum_size.py
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          cargo test --locked --lib mise_lock::tests
          cargo test --locked --test mise_lock_contract
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit ordinary source and remove bootstrap materializers
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/harden-den-1461-lock-order.yml \
            .github/workflows/apply-den-1461-current-wire.yml \
            scripts/apply_den1461_current_wire.py \
            scripts/harden_den1461_lock.py \
            scripts/fix_den1461_enum_size.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-1461): preserve current lock wire and semantic order'
          git push origin HEAD:feat/den-1461-mise-lock-contract
