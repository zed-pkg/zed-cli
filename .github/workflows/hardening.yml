name: repository hardening

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: GitHub Actions fail-closed policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run policy unit tests
        run: python3 -m unittest -v tests/workflow_policy_test.py
      - name: Audit every workflow
        run: python3 scripts/audit-github-actions.py

  locked-rust-contract:
    name: Locked Rust metadata, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: zed-cli
          persist-credentials: false
      - name: Resolve zed-interfaces checkout from Cargo.lock
        id: zed-interfaces-lock
        working-directory: zed-cli
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from urllib.parse import parse_qs, urlsplit

          with open("Cargo.lock", "rb") as handle:
              lock = tomllib.load(handle)

          sources = {
              package.get("source")
              for package in lock.get("package", [])
              if package.get("name") == "zed-interfaces" and package.get("source")
          }
          if len(sources) != 1:
              raise SystemExit(
                  f"Cargo.lock must resolve exactly one zed-interfaces source; got {sorted(sources)}"
              )

          source = next(iter(sources))
          expected_repo = "https://github.com/zed-pkg/zed-interfaces.git"
          if not source.startswith(f"git+{expected_repo}?") or "#" not in source:
              raise SystemExit(f"unexpected zed-interfaces Cargo source: {source}")

          resolved = source.rsplit("#", 1)[1]
          if re.fullmatch(r"[0-9a-f]{40}", resolved) is None:
              raise SystemExit(f"zed-interfaces lock source is not pinned to a full commit: {source}")

          parsed = urlsplit(source.removeprefix("git+"))
          requested = parse_qs(parsed.query).get("rev", [])
          if requested != [resolved]:
              raise SystemExit(
                  "zed-interfaces Cargo source must request and resolve the same immutable commit: "
                  f"requested={requested!r} resolved={resolved}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha={resolved}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ steps.zed-interfaces-lock.outputs.sha }}
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Verify lockfile-resolved metadata
        working-directory: zed-cli
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check every target
        working-directory: zed-cli
        run: cargo check --locked --all-targets
      - name: Run every test target
        working-directory: zed-cli
        run: cargo test --locked --all-targets
      - name: Deny warnings
        working-directory: zed-cli
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify formatting
        working-directory: zed-cli
        run: cargo fmt --check
