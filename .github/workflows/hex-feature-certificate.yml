name: Hex feature certificate

on:
  push:
    branches:
      - feat/hex-read-parity

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Resolve repository Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print(f"toolchain={tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']}")
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt
      - name: Format exact feature head
        run: cargo fmt --all -- --check
      - name: Build Hex sibling binary
        run: cargo build --locked --bin zed-hex-pm
      - name: Test Hex sibling binary
        run: cargo test --locked --bin zed-hex-pm
      - name: Test dotted external route contract
        run: cargo test --locked routes_hex_pm_without_allowing_arbitrary_dotted_plugin_names
      - name: Smoke help surface
        run: ./target/debug/zed-hex-pm --help
