name: Integrate native registry interface contract

on:
  push:
    branches:
      - recovery/native-registry-http-main
    paths:
      - .github/workflows/integrate-native-registry-interface.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-native-registry-interface
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the preserved successor candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: recovery/native-registry-http-candidate
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Integrate the merged native-registry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          merged = "b3093e7b0d7d71bf2bfd45b261ca8b7ca1317d40"

          cargo = Path("Cargo.toml")
          text = cargo.read_text()
          replacement = (
              'zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", '
              f'rev = "{merged}" }}'
          )
          updated, count = re.subn(
              r'zed-interfaces = \{ git = "https://github\.com/zed-pkg/zed-interfaces\.git", rev = "[0-9a-f]{40}" \}',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected exactly one zed-interfaces dependency declaration")
          cargo.write_text(updated)

          workflows = [
              Path(".github/workflows/nix-bundle-write.yml"),
              Path(".github/workflows/frozen-lock-integrity.yml"),
              Path(".github/workflows/nix-export-bundle.yml"),
          ]
          for path in workflows:
              text = path.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*ZED_INTERFACES_SHA:\s*)[0-9a-f]{40}\s*$",
                  rf"\g<1>{merged}",
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"expected one ZED_INTERFACES_SHA in {path}")
              path.write_text(updated)

          # The merged interface now enforces that a whole-repository target
          # uses the root package's canonical identity. The recovered tests
          # still used the pre-contract synthetic `clients-repository` name.
          for filename in ("src/pack.rs", "src/release.rs"):
              path = Path(filename)
              text = path.read_text()
              updated, count = text.replace(
                  'name = "clients-repository"',
                  'name = "clients"',
                  1,
              ), text.count('name = "clients-repository"')
              if count != 1:
                  raise SystemExit(
                      f"expected one legacy whole-repository identity in {filename}, found {count}"
                  )
              path.write_text(updated)
          PY

          cargo update -p zed-interfaces
          grep -Fq 'rev = "b3093e7b0d7d71bf2bfd45b261ca8b7ca1317d40"' Cargo.toml
          for workflow in \
            .github/workflows/nix-bundle-write.yml \
            .github/workflows/frozen-lock-integrity.yml \
            .github/workflows/nix-export-bundle.yml
          do
            grep -Fq 'ZED_INTERFACES_SHA: b3093e7b0d7d71bf2bfd45b261ca8b7ca1317d40' "$workflow"
          done
          grep -Fq '#b3093e7b0d7d71bf2bfd45b261ca8b7ca1317d40' Cargo.lock
          ! grep -R -F 'name = "clients-repository"' src/pack.rs src/release.rs
          grep -Fq 'name = "clients"' src/pack.rs
          grep -Fq 'name = "clients"' src/release.rs
          git diff --check

      - name: Validate the integrated successor
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets
          cargo test --all-targets
          cargo test --doc
          cargo clippy --all-targets -- -D warnings
          python3 scripts/audit-github-actions.py
          git diff --check

      - name: Enforce the integration change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual
          cat > /tmp/allowed <<'EOF'
          .github/workflows/frozen-lock-integrity.yml
          .github/workflows/nix-bundle-write.yml
          .github/workflows/nix-export-bundle.yml
          Cargo.lock
          Cargo.toml
          src/pack.rs
          src/release.rs
          EOF
          sort -o /tmp/allowed /tmp/allowed
          unexpected="$(comm -23 /tmp/actual /tmp/allowed)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected integration paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          grep -Fq 'zed-interfaces.git?rev=b3093e7b0d7d71bf2bfd45b261ca8b7ca1317d40#b3093e7b' Cargo.lock

      - name: Commit and publish the integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Cargo.toml Cargo.lock \
            .github/workflows/nix-bundle-write.yml \
            .github/workflows/frozen-lock-integrity.yml \
            .github/workflows/nix-export-bundle.yml \
            src/pack.rs src/release.rs
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'fix: integrate the merged native registry contract'
          fi
          git push --force-with-lease origin HEAD:refs/heads/recovery/native-registry-http-candidate
