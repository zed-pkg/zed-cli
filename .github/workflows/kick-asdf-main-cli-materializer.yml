# This second commit intentionally triggers the push workflow after the file
# already exists on the branch; the workflow removes itself after arming the
# reviewed ordinary-source materializer.
name: arm stacked asdf main-CLI materializer

on:
  push:
    branches:
      - agent/den-1420-asdf-main-cli
    paths:
      - .github/workflows/kick-asdf-main-cli-materializer.yml

permissions:
  contents: write

concurrency:
  group: arm-asdf-main-cli-materializer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  arm:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1420-asdf-main-cli
          persist-credentials: true
          show-progress: false

      - name: Convert the reviewed one-shot workflow to a branch push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/materialize-asdf-main-cli.yml')
          text = path.read_text()
          old = '''on:
            pull_request:
              branches:
                - agent/den-1420-asdf-current-main
              paths:
                - .github/workflows/materialize-asdf-main-cli.yml
          '''
          new = '''on:
            push:
              branches:
                - agent/den-1420-asdf-main-cli
              paths:
                - .github/workflows/materialize-asdf-main-cli.yml
          '''
          if old not in text:
              raise SystemExit('materializer event anchor not found')
          text = text.replace(old, new, 1)
          old = "    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/den-1420-asdf-main-cli' && github.actor != 'github-actions[bot]'\n"
          if old not in text:
              raise SystemExit('materializer job condition not found')
          text = text.replace(old, '', 1)
          path.write_text(text)
          PY

      - name: Commit the armed materializer and remove this bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/kick-asdf-main-cli-materializer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ci(DEN-1420): run typed asdf routing materializer'
          git push origin HEAD:agent/den-1420-asdf-main-cli
