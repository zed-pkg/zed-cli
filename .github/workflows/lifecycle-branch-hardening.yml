name: one-time lifecycle branch hardening

on:
  push:
    branches:
      - feat/convention-lifecycle-hooks

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[lifecycle-hardening]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Apply exact lifecycle hardening patch
        run: python3 scripts/harden_lifecycle_branch.py
      - name: Format and test the lifecycle implementation
        run: |
          cargo fmt --all
          cargo test --lib lifecycle::tests
          cargo check --all-targets
      - name: Commit reviewed source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "lifecycle branch already hardened"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lifecycle.rs docs/lifecycle-hooks.md
          git commit -m "Harden lifecycle hook discovery and validation [lifecycle-hardening]"
          git push origin HEAD
