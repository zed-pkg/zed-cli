name: lifecycle review hardening

on:
  push:
    branches:
      - feat/root-project-lifecycle-hooks-v2

permissions:
  contents: write

jobs:
  apply-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Apply reviewed source changes
        run: python3 scripts/apply_lifecycle_review.py
      - name: Format and test
        run: |
          cargo fmt --all
          cargo test --lib lifecycle::tests
          cargo check --all-targets
      - name: Remove one-time automation and commit
        shell: bash
        run: |
          rm scripts/apply_lifecycle_review.py
          rm .github/workflows/lifecycle-review-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden lifecycle hook discovery and validation"
          git push origin HEAD
