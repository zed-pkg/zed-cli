name: Local registry explicit admission (focused)

on:
  pull_request:
    paths:
      - 'src/manifestless.rs'
      - 'src/managed_install.rs'
      - 'src/config.rs'
      - 'tests/local_registry_cli.rs'
      - '.github/workflows/local-registry-authority.yml'
  push:
    branches: [main]
    paths:
      - 'src/manifestless.rs'
      - 'src/managed_install.rs'
      - 'src/config.rs'
      - 'tests/local_registry_cli.rs'
      - '.github/workflows/local-registry-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-registry-authority-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-registry:
    name: Explicit CLI and manifestless local policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust 1.98.1
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Execute full local-registry CLI regression suite on locked graph
        run: cargo test --locked --test local_registry_cli -- --nocapture
      - name: Declare evidence ceiling
        run: echo 'LOCAL_REGISTRY_CLI_ONLY; not compiler guest parity or package provenance certification'
