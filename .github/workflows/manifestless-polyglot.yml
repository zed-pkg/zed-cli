name: manifestless polyglot installs

on:
  pull_request:
    paths:
      - ".github/workflows/manifestless-polyglot.yml"
      - "tests/manifestless-polyglot-e2e.sh"
      - "tests/fixtures/polyglot/**"
      - "src/manifestless.rs"
      - "src/ops.rs"
      - "src/config.rs"
      - "src/cli.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/manifestless-polyglot.yml"
      - "tests/manifestless-polyglot-e2e.sh"
      - "tests/fixtures/polyglot/**"
      - "src/manifestless.rs"
      - "src/ops.rs"
      - "src/config.rs"
      - "src/cli.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-layouts:
    name: Node, Python, Go, Rust, and Ruby layouts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out zed-cli
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: zed-cli

      - name: Check out the matching interface contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: zed-pkg/zed-interfaces
          ref: 15577e17a820c3b2b1a39ee178d4645185309a05
          path: zed-interfaces

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444
        with:
          make-default: true

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: zed-cli

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3"

      - name: Build the exact zed executable under test
        working-directory: zed-cli
        run: cargo build --locked --bin zed

      - name: Check the E2E harness syntax
        working-directory: zed-cli
        run: bash -n tests/manifestless-polyglot-e2e.sh

      - name: Exercise automatic roots, adapters, frozen restores, and store locking
        working-directory: zed-cli
        env:
          ZED_MANIFESTLESS_E2E_ROOT: ${{ runner.temp }}/manifestless-polyglot
          ZED_MANIFESTLESS_E2E_KEEP: "1"
        shell: bash
        run: |
          set -o pipefail
          bash tests/manifestless-polyglot-e2e.sh "$PWD/target/debug/zed" \
            2>&1 | tee "$RUNNER_TEMP/manifestless-polyglot.log"

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manifestless-polyglot-diagnostics
          path: |
            ${{ runner.temp }}/manifestless-polyglot.log
            ${{ runner.temp }}/manifestless-polyglot/parallel-*.log
          if-no-files-found: warn
          retention-days: 1
