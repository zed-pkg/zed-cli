name: materialize canonical Devbox and Flox routing

on:
  push:
    branches:
      - feat/den-2487-canonical-devbox-flox-export
    paths:
      - .github/workflows/materialize-canonical-devbox-flox.yml

permissions:
  contents: write

concurrency:
  group: materialize-canonical-devbox-flox
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-2487-canonical-devbox-flox-export
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Add typed canonical manager routing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('src/cli.rs')
          text = cli.read_text()

          manager_anchor = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentManagerArg {
              /// Import, verify, or export project-local mise configuration.
              Mise,
              /// Import or verify project-local asdf configuration and Zed-owned provenance.
              Asdf,
          }
          '''
          manager_replacement = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentManagerArg {
              /// Import or verify project-local mise configuration.
              Mise,
              /// Import or verify project-local asdf configuration and Zed-owned provenance.
              Asdf,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentExportManagerArg {
              /// Export deterministic mise TOML from a schema-v2 plan.
              Mise,
              /// Export deterministic Devbox JSON and a Zed-owned receipt.
              Devbox,
              /// Export deterministic Flox manifest TOML and a Zed-owned receipt.
              Flox,
          }
          '''
          if manager_anchor not in text:
              raise SystemExit('environment manager enum anchor not found')
          text = text.replace(manager_anchor, manager_replacement, 1)

          export_anchor = '''    /// Export a schema-v2 EnvironmentPlan as deterministic mise TOML.
              Export {
                  #[arg(value_enum)]
                  manager: EnvironmentManagerArg,
                  /// Project-local schema-v2 EnvironmentPlan (.toml or .json).
                  #[arg(long, env = "ZED_PKG_ENV_PLAN")]
                  plan: PathBuf,
                  /// Project-local mise output path.
                  #[arg(long, env = "ZED_PKG_ENV_OUTPUT", default_value = ".mise.toml")]
                  output: PathBuf,
                  /// Verify that the output already equals the deterministic projection.
                  #[arg(long, env = "ZED_PKG_ENV_CHECK")]
                  check: bool,
                  /// Transactionally create/update a Zed-owned manager view.
                  #[arg(long, env = "ZED_PKG_ENV_WRITE")]
                  write: bool,
                  /// Emit a machine-readable export result.
                  #[arg(long, env = "ZED_PKG_ENV_JSON")]
                  json: bool,
              },
          '''
          export_replacement = '''    /// Export a deterministic project-local manager view from an EnvironmentPlan.
              Export {
                  #[arg(value_enum)]
                  manager: EnvironmentExportManagerArg,
                  /// Project-local EnvironmentPlan. Required for mise; Devbox/Flox default to `.zed/environment-plan.json`.
                  #[arg(long, env = "ZED_PKG_ENV_PLAN")]
                  plan: Option<PathBuf>,
                  /// Project-local manager output. Defaults are manager-specific.
                  #[arg(long, env = "ZED_PKG_ENV_OUTPUT")]
                  output: Option<PathBuf>,
                  /// Zed-owned deterministic receipt for Devbox/Flox export.
                  #[arg(long, env = "ZED_PKG_ENV_RECEIPT")]
                  receipt: Option<PathBuf>,
                  /// Verify that the mise output already equals the deterministic projection.
                  #[arg(long, env = "ZED_PKG_ENV_CHECK")]
                  check: bool,
                  /// Transactionally create/update a Zed-owned mise projection.
                  #[arg(long, env = "ZED_PKG_ENV_WRITE")]
                  write: bool,
                  /// Emit a machine-readable export result.
                  #[arg(long, env = "ZED_PKG_ENV_JSON")]
                  json: bool,
              },
          '''
          if export_anchor not in text:
              raise SystemExit('environment export command anchor not found')
          text = text.replace(export_anchor, export_replacement, 1)

          test_start = '''    #[test]
              fn environment_export_is_typed_and_rejects_ambiguous_write_modes() {
          '''
          test_end = '''    #[test]
              fn completion_shells_are_typed_positionals() {
          '''
          start = text.find(test_start)
          end = text.find(test_end, start)
          if start < 0 or end < 0:
              raise SystemExit('environment export CLI test anchors not found')
          replacement = '''    #[test]
              fn environment_export_is_typed_and_rejects_ambiguous_write_modes() {
                  let mise = Cli::try_parse_from([
                      "zed",
                      "env",
                      "export",
                      "mise",
                      "--plan",
                      "zed-env.toml",
                      "--output",
                      ".mise.toml",
                      "--check",
                      "--json",
                  ])
                  .unwrap();
                  assert!(matches!(mise.cmd, Cmd::Env { .. }));

                  for manager in ["devbox", "flox"] {
                      let cli = Cli::try_parse_from([
                          "zed",
                          "env",
                          "export",
                          manager,
                          "--output",
                          "generated/manager.toml",
                          "--receipt",
                          "generated/receipt.json",
                          "--json",
                      ])
                      .unwrap();
                      assert!(matches!(cli.cmd, Cmd::Env { .. }));
                  }

                  assert!(Cli::try_parse_from(["zed", "env", "export", "asdf"]).is_err());
                  assert!(matches!(
                      Cli::try_parse_from([
                          "zed",
                          "env",
                          "export",
                          "mise",
                          "--plan",
                          "zed-env.toml",
                          "--check",
                          "--write",
                      ])
                      .unwrap()
                      .cmd,
                      Cmd::Env {
                          cmd: EnvCmd::Export {
                              check: true,
                              write: true,
                              ..
                          }
                      }
                  ));
              }

          '''
          text = text[:start] + replacement + text[end:]
          cli.write_text(text)

          main = Path('src/main.rs')
          text = main.read_text()
          cli_import = '''use zed_cli::cli::{
              AuthCmd, CacheCmd, Cli, Cmd, EnvironmentManagerArg, OrgCmd, ReleaseCmd, StoreCmd,
          };
          '''
          cli_replacement = '''use zed_cli::cli::{
              AuthCmd, CacheCmd, Cli, Cmd, EnvironmentExportManagerArg, EnvironmentManagerArg,
              OrgCmd, ReleaseCmd, StoreCmd,
          };
          '''
          if cli_import not in text:
              raise SystemExit('main CLI import anchor not found')
          text = text.replace(cli_import, cli_replacement, 1)
          text = text.replace(
              'use zed_cli::environment;\n',
              'use zed_cli::environment;\nuse zed_cli::environment_export_cli::{self, ExportOptions};\n',
              1,
          )
          text = text.replace(
              'use zed_cli::nix_export_plan;\n',
              'use zed_cli::nix_environment_export::ExportManager;\nuse zed_cli::nix_export_plan;\n',
              1,
          )

          old_dispatch = '''            EnvCmd::Export {
                          manager: EnvironmentManagerArg::Mise,
                          plan,
                          output,
                          check,
                          write,
                          json,
                      } => {
                          if check && write {
                              anyhow::bail!("the arguments '--check' and '--write' cannot be used together");
                          }
                          let mode = if check {
                              MiseExportMode::Check
                          } else if write {
                              MiseExportMode::Write
                          } else {
                              MiseExportMode::Print
                          };
                          let exported = mise_export::export_mise(&cwd, &plan, &output, mode)?;
                          mise_export::print_export(&exported, json)
                      }
                      EnvCmd::Export {
                          manager: EnvironmentManagerArg::Asdf,
                          ..
                      } => anyhow::bail!("asdf export is not implemented; use `zed env export mise`"),
          '''
          new_dispatch = '''            EnvCmd::Export {
                          manager,
                          plan,
                          output,
                          receipt,
                          check,
                          write,
                          json,
                      } => match manager {
                          EnvironmentExportManagerArg::Mise => {
                              if check && write {
                                  anyhow::bail!(
                                      "the arguments '--check' and '--write' cannot be used together"
                                  );
                              }
                              if receipt.is_some() {
                                  anyhow::bail!(
                                      "--receipt is supported only for Devbox and Flox export"
                                  );
                              }
                              let Some(plan) = plan else {
                                  anyhow::bail!("mise export requires --plan PATH");
                              };
                              let output = output.unwrap_or_else(|| ".mise.toml".into());
                              let mode = if check {
                                  MiseExportMode::Check
                              } else if write {
                                  MiseExportMode::Write
                              } else {
                                  MiseExportMode::Print
                              };
                              let exported = mise_export::export_mise(&cwd, &plan, &output, mode)?;
                              mise_export::print_export(&exported, json)
                          }
                          EnvironmentExportManagerArg::Devbox
                          | EnvironmentExportManagerArg::Flox => {
                              if check || write {
                                  anyhow::bail!(
                                      "--check and --write are supported only for mise export"
                                  );
                              }
                              let manager = match manager {
                                  EnvironmentExportManagerArg::Devbox => ExportManager::Devbox,
                                  EnvironmentExportManagerArg::Flox => ExportManager::Flox,
                                  EnvironmentExportManagerArg::Mise => unreachable!(),
                              };
                              environment_export_cli::execute(
                                  &cwd,
                                  manager,
                                  ExportOptions {
                                      plan,
                                      output,
                                      receipt,
                                      json,
                                  },
                              )
                          }
                      },
          '''
          if old_dispatch not in text:
              raise SystemExit('main environment export dispatch anchor not found')
          main.write_text(text.replace(old_dispatch, new_dispatch, 1))

          flags = Path('.cli-flags.toml')
          text = flags.read_text()
          text = text.replace('default = ".mise.toml"\n', '', 1)
          output_block = '''[commands.env.commands.export.flags.env_output]
          env = "ZED_PKG_ENV_OUTPUT"
          aliases = ["output"]
          type = "string"
          help = "Project-local manager export path."
          '''
          receipt_block = output_block + '''
          [commands.env.commands.export.flags.env_receipt]
          env = "ZED_PKG_ENV_RECEIPT"
          aliases = ["receipt"]
          type = "string"
          help = "Project-local Zed-owned Devbox/Flox export receipt."
          '''
          if output_block not in text:
              raise SystemExit('flags registry output block not found')
          flags.write_text(text.replace(output_block, receipt_block, 1))

          readme = Path('README.md')
          text = readme.read_text()
          mise_row = '| `zed env export mise --plan PATH [--output .mise.toml] [--check|--write] [--json]` | Deterministically project a schema-v2 environment plan into conflict-safe project-local mise TOML without invoking mise or executing project code |\n'
          rows = mise_row + '| `zed env export devbox [--plan PATH] [--output devbox.json] [--receipt PATH] [--json]` | Generate deterministic Devbox configuration plus a Zed-owned provenance receipt without invoking Devbox or Nix |\n| `zed env export flox [--plan PATH] [--output .flox/env/manifest.toml] [--receipt PATH] [--json]` | Generate deterministic Flox manifest configuration plus a Zed-owned provenance receipt without invoking Flox or Nix |\n'
          if 'zed env export devbox' not in text:
              if mise_row not in text:
                  raise SystemExit('README mise export row not found')
              text = text.replace(mise_row, rows, 1)
          readme.write_text(text)

          module = Path('src/nix_environment_export.rs')
          text = module.read_text()
          text = text.replace('pub fn generate_devbox(', 'pub(crate) fn generate_devbox(', 1)
          text = text.replace('pub fn generate_flox(', 'pub(crate) fn generate_flox(', 1)
          module.write_text(text)
          PY

      - name: Format, test, and lint the canonical route
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib environment_export_cli::tests
          cargo test --locked --lib nix_environment_export::tests
          cargo test --locked --test nix_environment_export_cli
          cargo test --locked --test nix_environment_export_main_cli
          cargo test --locked cli::tests::environment_export_is_typed_and_rejects_ambiguous_write_modes
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo test --locked cli::tests::readme_documents_every_command
          cargo clippy --locked --bin zed --bin zed-env-export \
            --test nix_environment_export_cli \
            --test nix_environment_export_main_cli -- -D warnings

      - name: Commit ordinary typed integration files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli.rs src/main.rs src/nix_environment_export.rs .cli-flags.toml README.md
          git diff --cached --check
          git commit -m 'feat(DEN-2487): route Devbox and Flox through zed env export'
          git push origin HEAD:feat/den-2487-canonical-devbox-flox-export
