# Re-run after synchronizing the current deterministic mise-export base.
name: materialize canonical Devbox and Flox routing

on:
  push:
    branches:
      - feat/den-2487-canonical-devbox-flox-export
    paths:
      - .github/workflows/materialize-canonical-devbox-flox.yml

permissions:
  contents: write

concurrency:
  group: materialize-canonical-devbox-flox
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-2487-canonical-devbox-flox-export
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Add typed canonical manager routing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli = Path('src/cli.rs')
          text = cli.read_text()

          manager_anchor = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentManagerArg {
              /// Import, verify, or export project-local mise configuration.
              Mise,
              /// Import or verify project-local asdf configuration and Zed-owned provenance.
              Asdf,
          }
          '''
          manager_replacement = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentManagerArg {
              /// Import or verify project-local mise configuration.
              Mise,
              /// Import or verify project-local asdf configuration and Zed-owned provenance.
              Asdf,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq, ValueEnum)]
          pub enum EnvironmentExportManagerArg {
              /// Export deterministic mise TOML from a schema-v2 plan.
              Mise,
              /// Export deterministic Devbox JSON and a Zed-owned receipt.
              Devbox,
              /// Export deterministic Flox manifest TOML and a Zed-owned receipt.
              Flox,
          }
          '''
          if 'pub enum EnvironmentExportManagerArg {' not in text:
              if manager_anchor not in text:
                  raise SystemExit('environment manager enum anchor not found')
              text = text.replace(manager_anchor, manager_replacement, 1)

          export_anchor = '''    /// Export a schema-v2 EnvironmentPlan as deterministic mise TOML.
              Export {
          '''
          export_replacement = '''    /// Export a schema-v2 EnvironmentPlan to a supported deterministic manager format.
              Export {
          '''
          if export_anchor in text:
              text = text.replace(export_anchor, export_replacement, 1)

          text = text.replace(
              'manager: EnvironmentManagerArg,\n        /// Project-local schema-v2 environment plan.',
              'manager: EnvironmentExportManagerArg,\n        /// Project-local schema-v2 environment plan.',
              1,
          )

          if 'receipt: Option<PathBuf>' not in text:
              marker = '''        /// Emit one stable JSON result object.
                  #[arg(long, env = "ZED_PKG_ENV_JSON")]
                  json: bool,
              },
          '''
              replacement = '''        /// Optional project-local receipt path for Devbox/Flox exports.
                  #[arg(long, env = "ZED_PKG_ENV_RECEIPT")]
                  receipt: Option<PathBuf>,
                  /// Emit one stable JSON result object.
                  #[arg(long, env = "ZED_PKG_ENV_JSON")]
                  json: bool,
              },
          '''
              if marker not in text:
                  raise SystemExit('environment export receipt anchor not found')
              text = text.replace(marker, replacement, 1)
          cli.write_text(text)

          main = Path('src/main.rs')
          text = main.read_text()
          if 'EnvironmentExportManagerArg' not in text:
              text = text.replace(
                  'EnvironmentManagerArg, OrgCmd, ReleaseCmd, StoreCmd,',
                  'EnvironmentExportManagerArg, EnvironmentManagerArg, OrgCmd, ReleaseCmd, StoreCmd,',
                  1,
              )
          if 'use zed_cli::environment_export_cli' not in text:
              marker = 'use zed_cli::environment;\n'
              text = text.replace(
                  marker,
                  marker + 'use zed_cli::environment_export_cli::{self, EnvironmentExportAction};\n',
                  1,
              )

          old = '''            EnvCmd::Export {
                              manager: _,
                              plan,
                              output,
                              check,
                              write,
                              json,
                          } => environment::export_mise(&cwd, &plan, output.as_deref(), check, write, json),
          '''
          new = '''            EnvCmd::Export {
                              manager,
                              plan,
                              output,
                              check,
                              write,
                              receipt,
                              json,
                          } => match manager {
                              EnvironmentExportManagerArg::Mise => {
                                  if receipt.is_some() {
                                      anyhow::bail!("`--receipt` is only supported for Devbox and Flox export");
                                  }
                                  environment::export_mise(
                                      &cwd,
                                      &plan,
                                      output.as_deref(),
                                      check,
                                      write,
                                      json,
                                  )
                              }
                              EnvironmentExportManagerArg::Devbox => {
                                  if check || write {
                                      anyhow::bail!("`--check` and `--write` are only supported for mise export");
                                  }
                                  environment_export_cli::execute(
                                      &cwd,
                                      EnvironmentExportAction::Devbox,
                                      Some(plan),
                                      output,
                                      receipt,
                                      json,
                                  )
                              }
                              EnvironmentExportManagerArg::Flox => {
                                  if check || write {
                                      anyhow::bail!("`--check` and `--write` are only supported for mise export");
                                  }
                                  environment_export_cli::execute(
                                      &cwd,
                                      EnvironmentExportAction::Flox,
                                      Some(plan),
                                      output,
                                      receipt,
                                      json,
                                  )
                              }
                          },
          '''
          if old not in text:
              raise SystemExit('main environment export dispatch anchor not found')
          main.write_text(text.replace(old, new, 1))
          PY

      - name: Update flags and documentation contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          flags = Path('.cli-flags.toml')
          text = flags.read_text()
          if '[commands.env.commands.export.flags.receipt]' not in text:
              marker = '''[commands.env.commands.export.flags.json]
          env = "ZED_PKG_ENV_JSON"
          '''
              contract = '''[commands.env.commands.export.flags.receipt]
          env = "ZED_PKG_ENV_RECEIPT"
          aliases = ["receipt"]
          type = "string"
          help = "Project-local receipt path for Devbox or Flox export."

          [commands.env.commands.export.flags.json]
          env = "ZED_PKG_ENV_JSON"
          '''
              if marker not in text:
                  raise SystemExit('flags receipt insertion anchor not found')
              text = text.replace(marker, contract, 1)
          flags.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          mise = '| `zed env export mise --plan PATH [--output .mise.toml] [--check|--write] [--json]` | Deterministically project a schema-v2 environment plan into conflict-safe project-local mise TOML without invoking mise or executing project code |\n'
          rows = '| `zed env export devbox [--plan PATH] [--output devbox.json] [--receipt PATH] [--json]` | Deterministically generate Devbox configuration and a Zed-owned provenance receipt without invoking Devbox |\n| `zed env export flox [--plan PATH] [--output manifest.toml] [--receipt PATH] [--json]` | Deterministically generate Flox manifest TOML and a Zed-owned provenance receipt without invoking Flox |\n'
          if rows not in text:
              if mise not in text:
                  raise SystemExit('README mise export anchor not found')
              text = text.replace(mise, mise + rows, 1)
          readme.write_text(text)
          PY

      - name: Validate canonical and staged parity
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib nix_environment_export::tests
          cargo test --locked --test nix_environment_export_cli
          cargo test --locked --test nix_environment_export_main_cli
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo test --locked cli::tests::readme_documents_every_command
          cargo clippy --locked --bin zed --bin zed-env-export \
            --test nix_environment_export_cli --test nix_environment_export_main_cli -- -D warnings

      - name: Commit ordinary typed integration files
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-canonical-devbox-flox.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/cli.rs src/main.rs .cli-flags.toml README.md \
            .github/workflows/materialize-canonical-devbox-flox.yml
          git diff --cached --check
          git commit -m 'feat(DEN-2487): expose Devbox and Flox through zed env export'
          git push origin HEAD:feat/den-2487-canonical-devbox-flox-export
