name: materialize certified DEN-2923 Windows fix

on:
  push:
    branches:
      - feat/den-2923-offline-tool-profile
    paths:
      - .github/workflows/materialize-den-2923-windows-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-den-2923-windows-fix
  cancel-in-progress: true

env:
  EXPECTED_PRODUCT_PARENT: 9c325e54a4058c8e55500639f1b18caffa8973c9
  EXPECTED_FORMATTED_SHA256: 2749b999c67cf2fc609db22b8cb784ce6b1db2284df376225fedbec56a41c442

jobs:
  materialize:
    name: apply certified bytes and remove carrier
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Apply the exact certified repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/materialize-den-2923-windows-fix.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/tool_profile.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "use std::fs::{self, File, OpenOptions};\n",
                  "use std::fs::{self, OpenOptions};\n#[cfg(unix)]\nuse std::fs::File;\n",
                  "shared File/OpenOptions import",
              ),
              (
                  "        File::open(destination)?.sync_all()?;\n",
                  """        OpenOptions::new()\n            .write(true)\n            .open(destination)\n            .with_context(|| {\n                format!(\n                    \"opening copied tool executable `{}` for synchronization\",\n                    portable_display(destination)\n                )\n            })?\n            .sync_all()\n            .with_context(|| {\n                format!(\n                    \"synchronizing copied tool executable `{}`\",\n                    portable_display(destination)\n                )\n            })?;\n""",
                  "read-only copied-executable sync handle",
              ),
              (
                  """        let mut lock = EnvironmentLock::default();\n        lock.plan_digest_sha256 = \"a\".repeat(64);\n        assert_eq!(select_exact_target(&lock, \"x86_64-linux\").unwrap().len(), 0);\n""",
                  """        let lock = EnvironmentLock {\n            plan_digest_sha256: \"a\".repeat(64),\n            ..EnvironmentLock::default()\n        };\n        assert_eq!(select_exact_target(&lock, \"x86_64-linux\").unwrap().len(), 0);\n""",
                  "Clippy-rejected EnvironmentLock fixture",
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label}")
              text = text.replace(old, new, 1)

          marker = """    #[test]\n    fn profile_state_is_secret_free_by_shape() {\n        let state = ToolProfileState {\n            schema: TOOL_PROFILE_SCHEMA_V1.to_string(),\n            lock_sha256: \"a\".repeat(64),\n            target: \"x86_64-linux\".to_string(),\n            tools: Vec::new(),\n        };\n        let json = serde_json::to_string(&state).unwrap();\n        for forbidden in [\"locator\", \"url\", \"token\", \"credential\", \"environment\"] {\n            assert!(!json.contains(forbidden));\n        }\n    }\n}\n"""
          replacement = marker[:-2] + """\n\n    #[cfg(windows)]\n    #[test]\n    fn copied_windows_executable_is_opened_with_sync_capable_access() {\n        let root = tempfile::tempdir().unwrap();\n        let source = root.path().join(\"hello.cmd\");\n        let destination = root.path().join(\"hello-copy.cmd\");\n        fs::write(&source, b\"@echo off\\r\\necho hello\\r\\n\").unwrap();\n\n        materialize_executable(&source, &destination).unwrap();\n\n        assert_eq!(fs::read(destination).unwrap(), fs::read(source).unwrap());\n    }\n}\n"""
          if text.count(marker) != 1:
              raise SystemExit("expected exact tool-profile unit-test tail")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

          cargo fmt --all
          actual="$(sha256sum src/tool_profile.rs | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_FORMATTED_SHA256"
          git diff --check

      - name: Re-run exact Windows product contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib tool_profile::tests -- --nocapture --test-threads=1
          cargo test --locked --test tool_profile_cli -- --nocapture --test-threads=1
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit only the certified product file
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/materialize-den-2923-windows-fix.yml
          changed="$(git diff --name-only HEAD)"
          expected=$'.github/workflows/materialize-den-2923-windows-fix.yml\nsrc/tool_profile.rs'
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tool_profile.rs
          git commit -m "fix(DEN-2923): synchronize copied Windows tool executables"
          git push origin HEAD:feat/den-2923-offline-tool-profile
