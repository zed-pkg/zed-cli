name: Materialize DEN-567 product diff

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/materialize-den-567.py
      - .github/workflows/materialize-den-567.yml

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.head_ref == 'feat/den-567-manifestless-flags-completion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the writable feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true

      - name: Check out the sibling interfaces crate
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply the reviewed product patch
        working-directory: zed-cli
        run: python3 scripts/materialize-den-567.py

      - name: Synchronize the immutable flags2env lock entry
        working-directory: zed-cli
        run: cargo update -p flags2env

      - name: Format, lint, and test before committing
        working-directory: zed-cli
        run: |
          set -euo pipefail
          cargo fmt
          git diff --check
          cargo test --all-targets
          cargo test --doc
          cargo clippy --all-targets -- -D warnings

      - name: Commit only the validated product diff
        working-directory: zed-cli
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          rm scripts/materialize-den-567.py
          rm .github/workflows/materialize-den-567.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(DEN-567): support manifestless installs and shell completion'
          git push origin "HEAD:$HEAD_BRANCH"
