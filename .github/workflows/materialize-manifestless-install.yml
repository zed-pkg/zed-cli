name: materialize manifestless install

on:
  push:
    branches:
      - agent/manifestless-install
    paths:
      - '.github/workflows/materialize-manifestless-install.yml'
      - 'scripts/materialize-manifestless-install.py'

permissions:
  contents: write

concurrency:
  group: materialize-manifestless-install
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'zed-pkg/zed-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/manifestless-install
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Checkout zed interfaces sibling
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply product changes
        working-directory: zed-cli
        run: python3 scripts/materialize-manifestless-install.py

      - name: Format, test, and lint
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo test --doc
          cargo clippy --all-targets -- -D warnings

      - name: Commit product diff and remove bootstrap
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/materialize-manifestless-install.yml \
            scripts/materialize-manifestless-install.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --unified=0 | grep -E '^\+(<<<<<<<|=======|>>>>>>>)'; then
            echo 'new conflict marker detected' >&2
            exit 1
          fi
          test -z "$(git diff --cached --name-only | grep -E 'materialize-manifestless-install' || true)"
          git diff --cached --name-status
          git commit -m 'feat: support manifestless dependency installs'
          git push origin HEAD:agent/manifestless-install

# Activation update: the workflow already existed in the branch parent.
