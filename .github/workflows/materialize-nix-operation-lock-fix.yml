name: Materialize Nix operation-lock determinism fix

on:
  push:
    branches:
      - agent/fix-nix-operation-lock-determinism-20260805

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-nix-operation-lock-determinism-20260805
          persist-credentials: true
          fetch-depth: 0
      - name: Apply the focused source patch
        run: python3 scripts/materialize_nix_operation_lock_fix.py
      - name: Verify the exact ordinary-source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/nix-interop.yml' 'nix/zed-package.nix' | sort)"
          test "$actual" = "$expected"
      - name: Commit ordinary source and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/materialize-nix-operation-lock-fix.yml \
            scripts/materialize_nix_operation_lock_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: exclude volatile operation lock from Nix fixed output'
          git push origin HEAD:agent/fix-nix-operation-lock-determinism-20260805
