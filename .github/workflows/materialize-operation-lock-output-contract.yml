name: materialize operation-lock immutable-output contract

on:
  push:
    branches:
      - agent/exclude-operation-lock-from-immutable-output
    paths:
      - .github/workflows/materialize-operation-lock-output-contract.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-operation-lock-output-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-operation-lock-output-contract
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact current-main carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/exclude-operation-lock-from-immutable-output
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Patch mutable-checkout and immutable-output ownership contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          nix_path = Path('nix/zed-package.nix')
          nix = nix_path.read_text(encoding='utf-8')
          anchor = '''        if [[ -e "$work/.zpkg-staging" ]]; then
                    echo "zed-pkg Nix bridge: successful install left transaction state behind" >&2
                    exit 1
                  fi

                  mkdir -p "$out/tree" "$out/metadata"
          '''
          replacement = '''        if [[ -e "$work/.zpkg-staging" ]]; then
                    echo "zed-pkg Nix bridge: successful install left transaction state behind" >&2
                    exit 1
                  fi

                  # `.zed/operation.lock` is durable mutable-checkout coordination
                  # state. It records process diagnostics and therefore must never
                  # enter a recursive fixed output. Adapter-owned state such as
                  # `.zed/node_path` remains part of the materialized tree.
                  operation_lock="$work/.zed/operation.lock"
                  if [[ -e "$operation_lock" ]]; then
                    if [[ -L "$operation_lock" || ! -f "$operation_lock" ]]; then
                      echo "zed-pkg Nix bridge: operation lock is not a regular file" >&2
                      exit 1
                    fi
                    rm -f "$operation_lock"
                    rmdir "$work/.zed" 2>/dev/null || true
                  fi

                  mkdir -p "$out/tree" "$out/metadata"
          '''
          if anchor not in nix:
              raise SystemExit('Nix operation-lock insertion anchor not found')
          nix_path.write_text(nix.replace(anchor, replacement, 1), encoding='utf-8')

          frozen_path = Path('tests/frozen-lock-integrity-e2e.sh')
          frozen = frozen_path.read_text(encoding='utf-8')
          old = '''  [[ ! -e "$root/.zed" ]] || fail "$label materialized native adapter state"
          '''
          new = '''  if [[ -e "$root/.zed" ]]; then
                  [[ -d "$root/.zed" && ! -L "$root/.zed" ]] \\
                    || fail "$label created unsafe .zed state"
                  unexpected_state="$(
                    find "$root/.zed" -mindepth 1 \\
                      ! -path "$root/.zed/operation.lock" -print -quit
                  )"
                  [[ -z "$unexpected_state" ]] \\
                    || fail "$label materialized native adapter state: $unexpected_state"
                  if [[ -e "$root/.zed/operation.lock" ]]; then
                    [[ -f "$root/.zed/operation.lock" && ! -L "$root/.zed/operation.lock" ]] \\
                      || fail "$label left an unsafe operation lock"
                  fi
                fi
          '''
          if old not in frozen:
              raise SystemExit('frozen-lock adapter-state assertion anchor not found')
          frozen_path.write_text(frozen.replace(old, new, 1), encoding='utf-8')

          interop_path = Path('tests/nix/interop.nix')
          interop = interop_path.read_text(encoding='utf-8')
          old = '''      test ! -e .vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt
                runHook postCheck
          '''
          new = '''      test ! -e .vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt
                test ! -e .zed/operation.lock
                runHook postCheck
          '''
          if old not in interop:
              raise SystemExit('Nix consumer check anchor not found')
          interop_path.write_text(interop.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run mutable-checkout ownership certification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo build --release --locked --bin zed
          tests/frozen-lock-integrity-e2e.sh "$PWD/target/release/zed"
          git diff --check

      - name: Commit ordinary contract changes only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-operation-lock-output-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            nix/zed-package.nix \
            tests/frozen-lock-integrity-e2e.sh \
            tests/nix/interop.nix \
            .github/workflows/materialize-operation-lock-output-contract.yml
          git diff --cached --check
          git commit -m 'fix: exclude mutable operation locks from immutable outputs'
          git push origin HEAD:agent/exclude-operation-lock-from-immutable-output
