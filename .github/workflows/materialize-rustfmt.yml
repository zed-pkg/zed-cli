name: materialize current-main rustfmt repair

on:
  pull_request:
  push:
    branches:
      - agent/den-1592-rustfmt-materialize

permissions:
  contents: read

concurrency:
  group: rustfmt-materialize-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact helper candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt

      - name: Materialize canonical Rust formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff --name-only -- '*.rs' | sort | tee "$RUNNER_TEMP/rustfmt-paths.txt"
          test -s "$RUNNER_TEMP/rustfmt-paths.txt"

      - name: Capture formatted files and patch
        if: always()
        run: |
          set +e
          evidence="$RUNNER_TEMP/rustfmt-materialized"
          mkdir -p "$evidence/files"
          cp "$RUNNER_TEMP/rustfmt-paths.txt" "$evidence/paths.txt" 2>/dev/null
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$evidence/files/$(dirname "$path")"
            cp "$path" "$evidence/files/$path"
          done < "$RUNNER_TEMP/rustfmt-paths.txt"
          git diff --binary -- '*.rs' > "$evidence/rustfmt.patch" 2>&1
          git status --porcelain=v1 --untracked-files=all \
            > "$evidence/repository-status.txt" 2>&1
          sha256sum $(cat "$RUNNER_TEMP/rustfmt-paths.txt") \
            > "$evidence/sha256sums.txt" 2>/dev/null

      - name: Upload canonical formatter output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-cli-rustfmt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rustfmt-materialized
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
