name: one-shot materialize v0.3.1 Cargo lock

on:
  push:
    branches:
      - automation/harden-pr453-provenance

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release-prep head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release-prep/v0.3.1-den4078
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact authored release head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ac1559d827c3b1b398eb406d084dd7ea92a07fb3"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -F 'version = "0.3.1"' Cargo.toml >/dev/null
          grep -F 'version = "0.3.1"' .zpkg.toml >/dev/null

      - name: Install reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'

      - name: Let Cargo regenerate the lock and compile
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace
          changed="$(git diff --name-only)"
          test "$changed" = "Cargo.lock"
          git diff --check -- Cargo.lock
          awk '
            $0 == "name = \"zed-cli\"" { seen_name=1; next }
            seen_name && $0 == "version = \"0.3.1\"" { found=1; exit }
            seen_name && /^\[\[package\]\]/ { seen_name=0 }
            END { exit(found ? 0 : 1) }
          ' Cargo.lock
          cargo check --workspace --locked

      - name: Execute release preflight regressions on generated lock
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked cargo_adapter_resolves_git_dependency_offline_from_zed_patch
          cargo test --locked rust_cargo_config_patches_matching_git_source_to_zed_path
          cargo test --locked rust_cargo_config_patches_workspace_git_dependency
          cargo test --locked live_git_checkout_requires_matching_origin_and_clean_tree
          cargo test --locked rust_cargo_config_discovers_git_dependency_in_workspace_member

      - name: Commit Cargo-generated lock to release-prep branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ac1559d827c3b1b398eb406d084dd7ea92a07fb3"
          test "$(git diff --name-only)" = "Cargo.lock"
          git add Cargo.lock
          git -c user.name='ORESoftware' -c user.email='alex@oresoftware.com' commit -m 'release: regenerate Cargo.lock for 0.3.1'
          git push origin HEAD:release-prep/v0.3.1-den4078
