name: materialize current zed-lock provenance pins

on:
  pull_request:
    branches:
      - chore/zed-lock-windows-contention
    paths:
      - .github/workflows/materialize-zed-lock-provenance-pins.yml
      - .github/workflows/recursive-install-windows.yml
      - .github/workflows/zed-package-graph.yml
      - scripts/validate-zed-package-graph.sh
      - docs/package-dependency-graph.md

permissions:
  contents: write

concurrency:
  group: zed-lock-provenance-pins
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/zed-lock-provenance-pins'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/zed-lock-provenance-pins
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Replace stale package provenance assertions
        env:
          OLD_ZED_LOCK: a0dc78d385bc3ab553d3027b427f5f1428239c9c
          NEW_ZED_LOCK: 1db0da00d30fcf2e0762f50eedb1f88458020b52
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          old = os.environ['OLD_ZED_LOCK']
          new = os.environ['NEW_ZED_LOCK']
          paths = [
              Path('scripts/validate-zed-package-graph.sh'),
              Path('.github/workflows/zed-package-graph.yml'),
              Path('.github/workflows/recursive-install-windows.yml'),
              Path('docs/package-dependency-graph.md'),
          ]
          changed = []
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  changed.append(str(path))
          if len(changed) < 3:
              raise SystemExit(f'expected at least three stale provenance owners, changed={changed}')
          print('\n'.join(changed))
          PY
          ! grep -R -nF "$OLD_ZED_LOCK" \
            scripts/validate-zed-package-graph.sh \
            .github/workflows/zed-package-graph.yml \
            .github/workflows/recursive-install-windows.yml \
            docs/package-dependency-graph.md 2>/dev/null
          grep -R -nF "$NEW_ZED_LOCK" \
            scripts/validate-zed-package-graph.sh \
            .github/workflows/zed-package-graph.yml \
            .github/workflows/recursive-install-windows.yml

      - name: Validate package graph and lock consumers
        run: |
          set -euo pipefail
          bash -n scripts/validate-zed-package-graph.sh
          bash scripts/validate-zed-package-graph.sh
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json
          metadata = json.load(open('/tmp/metadata.json'))
          packages = [package for package in metadata['packages'] if package['name'] == 'zed-lock']
          assert len(packages) == 1, packages
          source = packages[0]['source']
          assert '1db0da00d30fcf2e0762f50eedb1f88458020b52' in source, source
          PY
          cargo check --locked --all-targets
          cargo test --locked --lib project_lock::tests
          cargo test --locked --test store_lock_evented

      - name: Commit durable provenance contracts and remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-zed-lock-provenance-pins.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate-zed-package-graph.sh \
            .github/workflows/zed-package-graph.yml \
            .github/workflows/recursive-install-windows.yml \
            docs/package-dependency-graph.md \
            .github/workflows/materialize-zed-lock-provenance-pins.yml
          git diff --cached --check
          git commit -m 'test(DEN-3167): pin current zed-lock provenance'
          git push origin HEAD:fix/zed-lock-provenance-pins
