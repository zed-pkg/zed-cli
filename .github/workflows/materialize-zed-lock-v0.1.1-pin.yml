name: materialize hardened zed-lock v0.1.1 pin

on:
  push:
    branches:
      - agent/pin-zed-lock-v0.1.1
    paths:
      - .github/workflows/materialize-zed-lock-v0.1.1-pin.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-zed-lock-v0.1.1-pin.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-zed-lock-v0.1.1-pin
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact CLI branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/pin-zed-lock-v0.1.1
          path: zed-cli
          fetch-depth: 0
          persist-credentials: true

      - name: Check out canonical package contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false

      - name: Check out canonical clients package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-clients
          path: zed-clients
          persist-credentials: false

      - name: Check out the exact hardened lock package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-lock
          ref: a0dc78d385bc3ab553d3027b427f5f1428239c9c
          path: zed-lock
          persist-credentials: false

      - name: Install the supported Rust quality toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Regenerate only the zed-lock lock entry
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          cargo update -p zed-lock
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          expected_commit = "a0dc78d385bc3ab553d3027b427f5f1428239c9c"
          expected_source = (
              "git+https://github.com/zed-pkg/zed-lock.git"
              f"?rev={expected_commit}#{expected_commit}"
          )

          before = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())
          after = tomllib.loads(Path('Cargo.lock').read_text())

          before_other = [p for p in before['package'] if p.get('name') != 'zed-lock']
          after_other = [p for p in after['package'] if p.get('name') != 'zed-lock']
          if before_other != after_other:
              raise SystemExit('cargo update changed packages other than zed-lock')

          before_lock = [p for p in before['package'] if p.get('name') == 'zed-lock']
          after_lock = [p for p in after['package'] if p.get('name') == 'zed-lock']
          if len(before_lock) != 1 or len(after_lock) != 1:
              raise SystemExit('expected exactly one zed-lock entry before and after')
          if before_lock[0].get('version') != '0.1.0':
              raise SystemExit(f"unexpected previous zed-lock version: {before_lock[0]}")
          if after_lock[0].get('version') != '0.1.1':
              raise SystemExit(f"unexpected new zed-lock version: {after_lock[0]}")
          if after_lock[0].get('source') != expected_source:
              raise SystemExit(f"unexpected new zed-lock source: {after_lock[0].get('source')}")
          PY
          git diff --check -- Cargo.lock

      - name: Validate package graph and CLI integration
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-zed-package-graph.sh \
            ../zed-interfaces/.zpkg.toml \
            ../zed-clients/.zpkg.toml \
            ../zed-lock/.zpkg.toml
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit the generated lock and remove the carrier
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-zed-lock-v0.1.1-pin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/materialize-zed-lock-v0.1.1-pin.yml
          git diff --cached --check
          git commit -m 'chore: materialize hardened zed-lock v0.1.1 pin'
          git push origin HEAD:agent/pin-zed-lock-v0.1.1
