name: Materialize zed-lock v0.1.1 integration

on:
  push:
    branches:
      - agent/zed-lock-v0.1.1-integration-20260805

permissions:
  contents: write

concurrency:
  group: materialize-zed-lock-v0.1.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'zed-pkg/zed-cli' && github.ref == 'refs/heads/agent/zed-lock-v0.1.1-integration-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/zed-lock-v0.1.1-integration-20260805
          persist-credentials: true
          fetch-depth: 0
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Regenerate only the external zed-lock resolution
        run: |
          cargo update -p zed-lock
          python3 - <<'PY'
          from pathlib import Path
          lock = Path('Cargo.lock').read_text(encoding='utf-8')
          revision = 'a0dc78d385bc3ab553d3027b427f5f1428239c9c'
          source = f'git+https://github.com/zed-pkg/zed-lock.git?rev={revision}#{revision}'
          assert 'name = "zed-lock"\nversion = "0.1.1"' in lock
          assert source in lock
          PY
          cargo check --locked --all-targets
          test "$(git diff --name-only)" = "Cargo.lock"
      - name: Commit resolver output and remove the materializer
        run: |
          rm .github/workflows/materialize-zed-lock-v0.1.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/materialize-zed-lock-v0.1.1.yml
          git commit -m 'chore: regenerate Cargo lock for zed-lock v0.1.1'
          git push origin HEAD:agent/zed-lock-v0.1.1-integration-20260805
