name: materialize guarded zpkg.net cutover

on:
  push:
    branches:
      - fix/den-2760-zpkg-net-clean
    paths:
      - .github/workflows/materialize-zpkg-net-cutover.yml

permissions:
  contents: write

concurrency:
  group: materialize-zpkg-net-cutover
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact cutover branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/den-2760-zpkg-net-clean
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Replace only known public-registry defaults
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l -F 'registry.zpkg.tech' -- . ':!Cargo.lock' | sort)
          test "${#files[@]}" -gt 0
          printf 'registry cutover inputs:\n'
          printf '  %s\n' "${files[@]}"

          for file in "${files[@]}"; do
            case "$file" in
              .cli-flags.toml|.dev-cli-flags.toml|.fetch-cli-flags.toml|.nix-interop-cli-flags.toml|README.md|Formula/zed-pkg.rb|scripts/check-native-parity.py|.github/workflows/polyglot.yml|tests/fixtures/polyglot/.zpkg.toml|src/registry.rs|src/oci.rs)
                ;;
              *)
                echo "unexpected zpkg.tech reference in $file" >&2
                exit 1
                ;;
            esac
          done

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(
              ['git', 'grep', '-l', '-F', 'registry.zpkg.tech', '--', '.', ':!Cargo.lock'],
              text=True,
          ).splitlines()
          for name in files:
              path = Path(name)
              text = path.read_text()
              updated = text.replace('registry.zpkg.tech', 'registry.zpkg.net')
              if updated == text:
                  raise SystemExit(f'expected replacement in {name}')
              path.write_text(updated)
          PY

          if git grep -n -F 'registry.zpkg.tech' -- . ':!Cargo.lock'; then
            echo 'legacy registry hostname remains' >&2
            exit 1
          fi

      - name: Refresh interface lock and validate product contracts
        run: |
          set -euo pipefail
          cargo update -p zed-interfaces
          grep -F 'git+https://github.com/zed-pkg/zed-interfaces.git?rev=d1bf8ef7c88a75292cbe8d697bfd269f30d62e2b#d1bf8ef7c88a75292cbe8d697bfd269f30d62e2b' Cargo.lock
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo test --locked cli::tests::readme_documents_every_command
          cargo test --locked --test startup_environment_contract
          cargo test --locked --lib registry::tests
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit ordinary cutover files
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-zpkg-net-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(DEN-2760): point public registry defaults at zpkg.net'
          git push origin HEAD:fix/den-2760-zpkg-net-clean
