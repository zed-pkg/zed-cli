name: migrate to standalone zed-lock

on:
  push:
    branches:
      - agent/use-standalone-zed-lock
    paths:
      - .github/workflows/migrate-standalone-zed-lock.yml

permissions:
  contents: write

concurrency:
  group: migrate-standalone-zed-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/use-standalone-zed-lock
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Remove the duplicated crate and update the locking document
        shell: bash
        run: |
          set -euo pipefail
          git rm -r crates/zed-lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/locking.md')
          text = path.read_text()
          start = text.index('## Standalone zed-lock extraction\n')
          end = text.index('## Distributed coordination\n', start)
          replacement = '''## Standalone zed-lock repository and release

          The canonical local-lock implementation now lives in the public
          [`zed-pkg/zed-lock`](https://github.com/zed-pkg/zed-lock) repository.
          `zed-cli` consumes immutable commit
          `0fc100afc3cd60b5ce091b4207f910bf08f2cfb7`, which is also the source of the
          [`v0.1.0` release](https://github.com/zed-pkg/zed-lock/releases/tag/v0.1.0).

          The release contains the packaged `zed-lock-0.1.0.crate` archive and a
          SHA-256 sidecar. The crate archive digest is
          `2850b39d1906433ea584fb649934936137dae873eaecf127666f5d88740b3f20`.

          Ownership is deliberately split:

          - `zed-lock` owns native acquisition, waiter resources, canonical identity,
            guard lifetime, timeout/cancellation cleanup, lock ordering, structured
            events, package metadata, and crate-level cross-platform conformance;
          - `zed-cli` owns project and store integration, post-wake revalidation,
            recursive planning, downloads, staging, atomic publication, rollback, and
            command-level process tests;
          - `zed-pkg-test/concurrent-install-locking` independently pins the same
            immutable standalone commit and validates contention, crash recovery,
            timeout, cancellation, aliasing, ordering, and protected counters on
            Linux, macOS, and Windows.

          The old in-tree workspace copy has been removed so there is one production
          source of truth. Remaining backend hardening—native Windows cancellation,
          descriptor/handle inheritance, network-filesystem capability classification,
          deeper alias testing, and expanded fault injection—is tracked in
          [`zed-pkg/zed-lock#3`](https://github.com/zed-pkg/zed-lock/issues/3).

          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '- symlink, case, and path aliases contending on one canonical lock identity;\n'
              '- close-on-exec/non-inheritable descriptor and handle behavior;\n',
              '- Unix symlink and canonical path aliases contending on one lock identity;\n'
              '- standalone Linux, macOS, and Windows crate conformance plus separate\n'
              '  zed-cli integration tests;\n',
          )
          path.write_text(text)
          PY

      - name: Generate the immutable dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /tmp/metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/metadata.json').read_text())
          packages = [package for package in data['packages'] if package['name'] == 'zed-lock']
          assert len(packages) == 1, packages
          source = packages[0]['source'] or ''
          assert 'github.com/zed-pkg/zed-lock' in source, source
          assert '0fc100afc3cd60b5ce091b4207f910bf08f2cfb7' in source, source
          assert not Path('crates/zed-lock').exists()
          print(source)
          PY

      - name: Validate zed-cli locking integration
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked -p zed-cli --lib store::tests -- --nocapture
          cargo test --locked -p zed-cli --lib project_lock::tests -- --nocapture
          cargo test --locked -p zed-cli --lib install_graph::tests -- --nocapture
          cargo test --locked -p zed-cli --test store_lock_evented -- --nocapture
          cargo test --locked -p zed-cli --test lock_waiter_process_lock -- --nocapture
          cargo test --locked -p zed-cli --test recursive_install_concurrency -- --nocapture
          cargo clippy --locked -p zed-cli --all-targets -- -D warnings

      - name: Commit generated migration files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/migrate-standalone-zed-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock docs/locking.md
          git commit -m 'deps: complete standalone zed-lock migration'
          git push origin HEAD:agent/use-standalone-zed-lock
