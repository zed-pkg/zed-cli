name: current mise lock contract

on:
  pull_request:
    paths:
      - src/mise_lock.rs
      - src/lib.rs
      - tests/mise_lock_contract.rs
      - docs/mise-lock-contract.md
      - .github/workflows/mise-lock-contract.yml
  push:
    branches: [main]
    paths:
      - src/mise_lock.rs
      - src/lib.rs
      - tests/mise_lock_contract.rs
      - docs/mise-lock-contract.md
      - .github/workflows/mise-lock-contract.yml

permissions:
  contents: read

concurrency:
  group: mise-lock-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  contract:
    name: contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run module and public contract tests
        run: |
          cargo test --locked mise_lock
          cargo test --locked --test mise_lock_contract

      - name: Lint every target
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify deterministic contract twice
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked \
            mise_lock::tests::complete_current_lock_round_trips_and_is_frozen_portable
          cargo test --locked \
            mise_lock::tests::complete_current_lock_round_trips_and_is_frozen_portable
