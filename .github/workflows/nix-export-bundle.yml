name: nix-export-bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix-export-bundle.yml"
      - "docs/nix-export-bundle.md"
      - "src/lib.rs"
      - "src/nix_export_bundle/**"
      - "src/nix_export_plan.rs"
      - "tests/nix_export_bundle.rs"
      - "tests/nix_export_bundle/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/nix-export-bundle.yml"
      - "docs/nix-export-bundle.md"
      - "src/lib.rs"
      - "src/nix_export_bundle/**"
      - "src/nix_export_plan.rs"
      - "tests/nix_export_bundle.rs"
      - "tests/nix_export_bundle/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-export-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Deterministic bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt,clippy

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Verify immutable shared-contract pin
        shell: python
        run: |
          import re
          import tomllib
          from pathlib import Path

          canonical_repo = "https://github.com/zed-pkg/zed-interfaces.git"
          with Path("Cargo.toml").open("rb") as source:
              manifest = tomllib.load(source)
          with Path("Cargo.lock").open("rb") as source:
              lock = tomllib.load(source)

          dependency = manifest.get("dependencies", {}).get("zed-interfaces")
          assert isinstance(dependency, dict), dependency
          assert dependency.get("git") == canonical_repo, dependency
          rev = dependency.get("rev")
          assert isinstance(rev, str) and re.fullmatch(r"[0-9a-f]{40}", rev), rev
          for forbidden in ("branch", "tag", "path"):
              assert forbidden not in dependency, (forbidden, dependency)

          packages = [
              package
              for package in lock.get("package", [])
              if package.get("name") == "zed-interfaces"
          ]
          assert len(packages) == 1, packages
          expected_source = f"git+{canonical_repo}?rev={rev}#{rev}"
          assert packages[0].get("source") == expected_source, (
              packages[0].get("source"),
              expected_source,
          )
          print(f"zed-interfaces authority admitted: {rev}")

      - name: Check formatting and warnings
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run pure renderer tests
        run: |
          cargo test --locked nix_export_bundle:: -- --test-threads=1
          cargo test --locked --test nix_export_bundle -- --test-threads=1

      - name: Certify generated flake with offline evaluation and build
        run: >-
          cargo test --locked --test nix_export_bundle --
          --ignored --exact nix::generated_flake_checks_and_builds_offline_after_archive
          --nocapture --test-threads=1

      - name: Prove workflow and generated-code boundary are read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/nix-export-bundle.yml').read_text()
          module = '\n'.join(
              path.read_text()
              for path in sorted(Path('src/nix_export_bundle').glob('*.rs'))
          )
          assert 'permissions:\n  contents: read' in workflow
          assert 'persist-credentials: false' in workflow
          for forbidden in (
              'contents' + ': write',
              'pull_request' + '_target:',
              'git' + ' push',
              'Command' + '::new("nix")',
              'std::fs' + '::write',
              'reqwest' + '::',
              'ZED_PKG' + '_TOKEN',
          ):
              assert forbidden not in workflow + '\n' + module, forbidden
          PY
