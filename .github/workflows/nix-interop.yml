name: nix-interop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix-interop.yml"
      - "nix/**"
      - "tests/nix/**"
      - "tests/fixtures/docker-install/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/nix-interop.yml"
      - "nix/**"
      - "tests/nix/**"
      - "tests/fixtures/docker-install/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nix-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-frozen-lock-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/den-1411-nix-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the bridge branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/den-1411-nix-bridge
          fetch-depth: 2
          persist-credentials: true

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Preserve frozen lock bytes and restore this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/ops.rs")
          text = path.read_text(encoding="utf-8")

          anchor = '''fn validate_frozen_manifest_requirements(
              manifest: &Manifest,
              lock: &Lockfile,
              workspace: Option<&WorkspaceInfo>,
              enforce: bool,
          ) -> Result<()> {
              if !enforce {
                  return Ok(());
              }
              for (key, req_str) in &manifest.dependencies {
                  let (org, name) = split_key(key)?;
                  if workspace.is_some_and(|ws| ws.members.contains_key(key)) {
                      continue;
                  }
                  let entry = lock
                      .find(&org, &name)
                      .with_context(|| format!("--frozen: `{key}` is not in {LOCKFILE_FILE}"))?;
                  let req = Requirement::parse(req_str);
                  if !req.matches(&entry.version) {
                      bail!(
                          "--frozen: lockfile pins {key}@{} which no longer satisfies `{req_str}`",
                          entry.version
                      );
                  }
              }
              Ok(())
          }
          '''
          replacement = anchor + '''
          /// Write a newly resolved lockfile. A frozen install is a verifier and
          /// materializer only: it must preserve the caller's exact lock bytes,
          /// including comments and provenance fields newer than this CLI knows.
          fn write_resolved_lockfile(
              lock_path: &Path,
              frozen: bool,
              resolved: &BTreeMap<String, VersionMetadata>,
              registry: &str,
          ) -> Result<()> {
              if frozen {
                  return Ok(());
              }
              let mut lock = Lockfile::default();
              for vm in resolved.values() {
                  lock.upsert(LockedPackage {
                      org: vm.org.clone(),
                      name: vm.name.clone(),
                      version: vm.version.clone(),
                      sha256: vm.sha256.clone(),
                      size: vm.size,
                      format: vm.format,
                      vcs_tag: vm.vcs_tag.clone(),
                      vcs_commit: vm.vcs_commit.clone(),
                      source: registry.to_string(),
                  });
              }
              fs::write(lock_path, lock.to_toml_string()?)?;
              Ok(())
          }

          #[cfg(test)]
          #[test]
          fn frozen_lock_write_preserves_exact_bytes() {
              let dir = tempfile::tempdir().unwrap();
              let lock_path = dir.path().join(LOCKFILE_FILE);
              let original = b"# retained provenance and formatting\nversion = 1\n";
              fs::write(&lock_path, original).unwrap();

              write_resolved_lockfile(
                  &lock_path,
                  true,
                  &BTreeMap::new(),
                  "file:///temporary-registry-mirror",
              )
              .unwrap();

              assert_eq!(fs::read(&lock_path).unwrap(), original);
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit("could not find unique frozen-validation insertion point")
          text = text.replace(anchor, replacement, 1)

          old = '''    let mut lock = Lockfile::default();
              for vm in resolved.values() {
                  lock.upsert(LockedPackage {
                      org: vm.org.clone(),
                      name: vm.name.clone(),
                      version: vm.version.clone(),
                      sha256: vm.sha256.clone(),
                      size: vm.size,
                      format: vm.format,
                      vcs_tag: vm.vcs_tag.clone(),
                      vcs_commit: vm.vcs_commit.clone(),
                      source: cfg.registry.clone(),
                  });
              }
              interactive::confirm(
                  cfg.interactive,
                  &format!(
                      "write {LOCKFILE_FILE}, update project references, and commit transaction {}",
                      transaction.id()
                  ),
              )?;
              fs::write(&lock_path, lock.to_toml_string()?)?;
          '''
          new = '''    let transaction_summary = if frozen {
                  format!(
                      "preserve {LOCKFILE_FILE} byte-for-byte, update project references, and commit transaction {}",
                      transaction.id()
                  )
              } else {
                  format!(
                      "write {LOCKFILE_FILE}, update project references, and commit transaction {}",
                      transaction.id()
                  )
              };
              interactive::confirm(cfg.interactive, &transaction_summary)?;
              write_resolved_lockfile(&lock_path, frozen, &resolved, &cfg.registry)?;
          '''
          if text.count(old) != 1:
              raise SystemExit("could not find unique lockfile write block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cargo fmt --all
          git show HEAD^:.github/workflows/nix-interop.yml > .github/workflows/nix-interop.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(DEN-1418): preserve frozen lockfile bytes exactly"
          git push origin HEAD:agent/den-1411-nix-bridge

  bridge:
    name: Frozen Zed graph through Nix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Load the locked Nixpkgs input
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs_path="$(
            nix eval --raw ./nix#lib.nixpkgsPath --no-update-lock-file
          )"
          case "$nixpkgs_path" in
            /nix/store/*) ;;
            *)
              echo "locked Nixpkgs input did not resolve to the Nix store: $nixpkgs_path" >&2
              exit 1
              ;;
          esac
          test -d "$nixpkgs_path"
          printf 'NIX_PATH=nixpkgs=%s\n' "$nixpkgs_path" >> "$GITHUB_ENV"

      - name: Build the exact Zed CLI under test
        run: cargo build --release --locked --bin zed

      - name: Create an immutable file-registry and frozen consumer
        shell: bash
        run: |
          set -euo pipefail

          zed="$GITHUB_WORKSPACE/target/release/zed"
          fixture_root="$RUNNER_TEMP/zed-nix-fixtures"
          registry="$RUNNER_TEMP/zed-nix-registry"
          zed_home="$RUNNER_TEMP/zed-nix-home"
          consumer="$fixture_root/node-app"

          mkdir -p "$fixture_root" "$registry" "$zed_home"
          cp -R tests/fixtures/docker-install/node-lib "$fixture_root/node-lib"
          cp -R tests/fixtures/docker-install/node-app "$consumer"
          chmod -R u+w "$fixture_root"

          (
            cd "$fixture_root/node-lib"
            "$zed" --registry "file://$registry" publish --skip-vcs-checks
          )

          # The registry URL recorded in .zpkg.lock must itself be immutable and
          # visible inside the later Nix sandbox. Add it to the store before
          # resolution rather than rewriting the lock after the fact.
          registry_store="$(nix store add-path "$registry")"
          (
            cd "$consumer"
            "$zed" \
              --registry "file://$registry_store" \
              --home "$zed_home" \
              install --install-mode copy
            node src/main.js
            test ! -e .vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt
            "$zed" --home "$zed_home" uninstall
          )

          test -f "$consumer/.zpkg.lock"
          test ! -e "$consumer/.vendor/.zed"
          test ! -e "$consumer/node_modules/@zed-pkg/docker-node-lib"
          grep -F "source = \"file://$registry_store\"" "$consumer/.zpkg.lock"

          zed_store="$(nix store add-path "$zed")"
          consumer_store="$(nix store add-path "$consumer")"

          printf 'ZED_BINARY_STORE=%s\n' "$zed_store" >> "$GITHUB_ENV"
          printf 'ZED_CONSUMER_STORE=%s\n' "$consumer_store" >> "$GITHUB_ENV"
          printf 'ZED_REGISTRY_STORE=%s\n' "$registry_store" >> "$GITHUB_ENV"
          printf 'ZED_CONSUMER_WORK=%s\n' "$consumer" >> "$GITHUB_ENV"

      - name: Evaluate the standalone flake library
        run: >-
          nix flake check ./nix
          --no-build
          --no-update-lock-file
          --print-build-logs

      - name: Bootstrap and verify the recursive fixed output
        shell: bash
        run: |
          set -euo pipefail

          build_deps() {
            local name="$1"
            shift
            nix-build tests/nix/interop.nix \
              --no-out-link \
              --arg zedBinary "$ZED_BINARY_STORE" \
              --arg consumerSrc "$ZED_CONSUMER_STORE" \
              --argstr registryStore "$ZED_REGISTRY_STORE" \
              --argstr name "$name" \
              --argstr mode deps \
              "$@"
          }

          set +e
          bootstrap_output="$(build_deps zed-nix-bootstrap 2>&1)"
          bootstrap_status=$?
          set -e
          printf '%s\n' "$bootstrap_output"
          if [[ $bootstrap_status -eq 0 ]]; then
            echo "expected the lib.fakeHash bootstrap build to fail" >&2
            exit 1
          fi

          output_hash="$(
            printf '%s\n' "$bootstrap_output" |
              python3 -c 'import re,sys; matches=re.findall(r"got:\s*(sha256-[A-Za-z0-9+/=]+)", sys.stdin.read()); print(matches[-1] if matches else "")'
          )"
          if [[ -z "$output_hash" ]]; then
            echo "could not recover the recursive output hash from Nix" >&2
            exit 1
          fi
          printf 'ZED_DEPS_HASH=%s\n' "$output_hash" >> "$GITHUB_ENV"

          deps_a="$(build_deps zed-nix-a --argstr hash "$output_hash")"
          deps_b="$(build_deps zed-nix-b --argstr hash "$output_hash")"

          hash_a="$(nix hash path --type sha256 --sri "$deps_a")"
          hash_b="$(nix hash path --type sha256 --sri "$deps_b")"
          test "$hash_a" = "$hash_b"
          test "$hash_a" = "$output_hash"

          test -f "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/package.json"
          test -f "$deps_a/tree/node_modules/@zed-pkg/docker-node-lib/package.json"
          test ! -e "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"
          test -f "$deps_a/metadata/.zpkg.lock"
          test -f "$deps_a/metadata/bridge.json"
          grep -F '"schema":"zed.nix-fetch-bridge/v1"' "$deps_a/metadata/bridge.json"
          grep -F '"install_mode":"copy"' "$deps_a/metadata/bridge.json"
          grep -F '"build_hooks":false' "$deps_a/metadata/bridge.json"
          grep -F '"canonical_adapter_record":false' "$deps_a/metadata/bridge.json"

          python3 - "$deps_a/tree" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for path in root.rglob("*"):
              if path.is_symlink() and os.path.isabs(os.readlink(path)):
                  raise SystemExit(f"fixed output contains an absolute symlink: {path}")
          PY

      - name: Build the ordinary offline consumer derivation
        shell: bash
        run: |
          set -euo pipefail
          package="$(
            nix-build tests/nix/interop.nix \
              --no-out-link \
              --arg zedBinary "$ZED_BINARY_STORE" \
              --arg consumerSrc "$ZED_CONSUMER_STORE" \
              --argstr registryStore "$ZED_REGISTRY_STORE" \
              --argstr hash "$ZED_DEPS_HASH" \
              --argstr name zed-nix-package \
              --argstr mode package
          )"
          test -f "$package/share/zed-nix-consumer/src/main.js"
          test -f "$package/share/zed-nix-consumer/.vendor/.zed/zed-pkg/docker-node-lib/package.json"
          test ! -e "$package/share/zed-nix-consumer/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"

      - name: Reject an incorrect Nix output hash
        shell: bash
        run: |
          set -euo pipefail
          if nix-build tests/nix/interop.nix \
            --no-out-link \
            --arg zedBinary "$ZED_BINARY_STORE" \
            --arg consumerSrc "$ZED_CONSUMER_STORE" \
            --argstr registryStore "$ZED_REGISTRY_STORE" \
            --argstr hash sha256-BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB= \
            --argstr name zed-nix-bad-output-hash \
            --argstr mode deps
          then
            echo "Nix accepted an incorrect recursive output hash" >&2
            exit 1
          fi

      - name: Reject tampered Zed lock provenance
        shell: bash
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/zed-nix-tampered-consumer"
          cp -R "$ZED_CONSUMER_WORK" "$tampered"
          chmod -R u+w "$tampered"
          python3 - "$tampered/.zpkg.lock" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacement = 'sha256 = "' + ('0' * 64) + '"'
          text, count = re.subn(
              r'^sha256 = "[0-9a-f]{64}"$',
              replacement,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("expected one locked artifact sha256 to tamper")
          path.write_text(text, encoding="utf-8")
          PY

          tampered_store="$(nix store add-path "$tampered")"
          if nix-build tests/nix/interop.nix \
            --no-out-link \
            --arg zedBinary "$ZED_BINARY_STORE" \
            --arg consumerSrc "$tampered_store" \
            --argstr registryStore "$ZED_REGISTRY_STORE" \
            --argstr hash "$ZED_DEPS_HASH" \
            --argstr name zed-nix-tampered-lock \
            --argstr mode deps
          then
            echo "tampered .zpkg.lock unexpectedly produced the trusted fixed output" >&2
            exit 1
          fi
