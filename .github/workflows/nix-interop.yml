name: nix-interop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix-interop.yml"
      - "nix/**"
      - "tests/nix/**"
      - "tests/fixtures/docker-install/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/nix-interop.yml"
      - "nix/**"
      - "tests/nix/**"
      - "tests/fixtures/docker-install/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Frozen Zed graph through Nix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Wait for the Nix store to become ready
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            nix store ping
            exit 0
          fi

          for attempt in $(seq 1 20); do
            if NIX_REMOTE=daemon nix store ping >/dev/null 2>&1; then
              printf 'NIX_REMOTE=daemon\n' >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Nix daemon is not ready yet (attempt ${attempt}/20)" >&2
            sudo launchctl kickstart -k system/org.nixos.nix-daemon >/dev/null 2>&1 || true
            sleep 2
          done

          sudo launchctl print system/org.nixos.nix-daemon || true
          ls -la /nix/var/nix/daemon-socket || true
          echo "Nix daemon did not become ready" >&2
          exit 1

      - name: Load the locked Nixpkgs input
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs_path="$(
            nix eval --raw ./nix#lib.nixpkgsPath --no-update-lock-file
          )"
          case "$nixpkgs_path" in
            /nix/store/*) ;;
            *)
              echo "locked Nixpkgs input did not resolve to the Nix store: $nixpkgs_path" >&2
              exit 1
              ;;
          esac
          test -d "$nixpkgs_path"
          printf 'NIX_PATH=nixpkgs=%s\n' "$nixpkgs_path" >> "$GITHUB_ENV"

      - name: Build the exact Zed CLI under test
        run: cargo build --release --locked --bin zed

      - name: Create an immutable file-registry and frozen consumer
        shell: bash
        run: |
          set -euo pipefail

          zed="$GITHUB_WORKSPACE/target/release/zed"
          fixture_root="$RUNNER_TEMP/zed-nix-fixtures"
          registry="$RUNNER_TEMP/zed-nix-registry"
          zed_home="$RUNNER_TEMP/zed-nix-home"
          consumer="$fixture_root/node-app"

          mkdir -p "$fixture_root" "$registry" "$zed_home"
          cp -R tests/fixtures/docker-install/node-lib "$fixture_root/node-lib"
          cp -R tests/fixtures/docker-install/node-app "$consumer"
          chmod -R u+w "$fixture_root"

          (
            cd "$fixture_root/node-lib"
            "$zed" --registry "file://$registry" publish --skip-vcs-checks
          )

          # The registry URL recorded in .zpkg.lock must itself be immutable and
          # visible inside the later Nix sandbox. Add it to the store before
          # resolution rather than rewriting the lock after the fact.
          registry_store="$(nix store add-path "$registry")"
          (
            cd "$consumer"
            "$zed" \
              --registry "file://$registry_store" \
              --home "$zed_home" \
              install --install-mode copy
            node src/main.js
            test ! -e .vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt
            "$zed" --home "$zed_home" uninstall
          )

          test -f "$consumer/.zpkg.lock"
          test ! -e "$consumer/.vendor/.zed"
          test ! -e "$consumer/node_modules/@zed-pkg/docker-node-lib"
          grep -F "source = \"file://$registry_store\"" "$consumer/.zpkg.lock"

          lock_sha256="$(
            python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
              "$consumer/.zpkg.lock"
          )"
          manifest_sha256="$(
            python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
              "$consumer/.zpkg.toml"
          )"
          zed_store="$(nix store add-path "$zed")"
          consumer_store="$(nix store add-path "$consumer")"

          printf 'ZED_BINARY_STORE=%s\n' "$zed_store" >> "$GITHUB_ENV"
          printf 'ZED_CONSUMER_STORE=%s\n' "$consumer_store" >> "$GITHUB_ENV"
          printf 'ZED_REGISTRY_STORE=%s\n' "$registry_store" >> "$GITHUB_ENV"
          printf 'ZED_CONSUMER_WORK=%s\n' "$consumer" >> "$GITHUB_ENV"
          printf 'ZED_LOCK_SHA256=%s\n' "$lock_sha256" >> "$GITHUB_ENV"
          printf 'ZED_MANIFEST_SHA256=%s\n' "$manifest_sha256" >> "$GITHUB_ENV"

      - name: Evaluate the standalone flake library
        run: >-
          nix flake check ./nix
          --no-build
          --no-update-lock-file
          --print-build-logs

      - name: Bootstrap and verify the recursive fixed output
        shell: bash
        run: |
          set -euo pipefail

          build_deps() {
            local name="$1"
            shift
            nix-build tests/nix/interop.nix \
              --no-out-link \
              --arg zedBinary "$ZED_BINARY_STORE" \
              --arg consumerSrc "$ZED_CONSUMER_STORE" \
              --argstr registryStore "$ZED_REGISTRY_STORE" \
              --argstr name "$name" \
              --argstr mode deps \
              "$@"
          }

          set +e
          bootstrap_output="$(build_deps zed-nix-bootstrap 2>&1)"
          bootstrap_status=$?
          set -e
          printf '%s\n' "$bootstrap_output"
          if [[ $bootstrap_status -eq 0 ]]; then
            echo "expected the lib.fakeHash bootstrap build to fail" >&2
            exit 1
          fi

          output_hash="$(
            printf '%s\n' "$bootstrap_output" |
              python3 -c 'import re,sys; matches=re.findall(r"got:\s*(sha256-[A-Za-z0-9+/=]+)", sys.stdin.read()); print(matches[-1] if matches else "")'
          )"
          if [[ -z "$output_hash" ]]; then
            echo "could not recover the recursive output hash from Nix" >&2
            exit 1
          fi
          printf 'ZED_DEPS_HASH=%s\n' "$output_hash" >> "$GITHUB_ENV"

          deps_a="$(build_deps zed-nix-a --argstr hash "$output_hash")"
          deps_b="$(build_deps zed-nix-b --argstr hash "$output_hash")"

          hash_a="$(nix hash path --type sha256 --sri "$deps_a")"
          hash_b="$(nix hash path --type sha256 --sri "$deps_b")"
          test "$hash_a" = "$hash_b"
          test "$hash_a" = "$output_hash"

          test -f "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/package.json"
          test -f "$deps_a/tree/node_modules/@zed-pkg/docker-node-lib/package.json"
          test ! -e "$deps_a/tree/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"
          test -f "$deps_a/metadata/bridge.json"
          test -f "$deps_a/metadata/lock-summary.json"
          test -f "$deps_a/metadata/lock.sha256"
          test -f "$deps_a/metadata/manifest.sha256"
          test ! -e "$deps_a/metadata/.zpkg.lock"
          test ! -e "$deps_a/metadata/.zpkg.toml"
          test "$(cat "$deps_a/metadata/lock.sha256")" = "$ZED_LOCK_SHA256"
          test "$(cat "$deps_a/metadata/manifest.sha256")" = "$ZED_MANIFEST_SHA256"

          python3 - \
            "$deps_a/metadata/bridge.json" \
            "$deps_a/metadata/lock-summary.json" \
            "$ZED_LOCK_SHA256" <<'PY'
          import json
          import pathlib
          import sys

          bridge = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_lock_digest = sys.argv[3]

          assert bridge["schema"] == "zed.nix-fetch-bridge/v1"
          assert bridge["install_mode"] == "copy"
          assert bridge["build_hooks"] is False
          assert bridge["registry_kind"] == "immutable-nix-store-input"
          assert bridge["registry_literal_retained"] is False
          assert bridge["raw_lock_retained"] is False
          assert bridge["raw_manifest_retained"] is False
          assert bridge["canonical_adapter_record"] is False

          assert summary["schema"] == "zed.nix-lock-summary/v1"
          assert summary["raw_lock_sha256"] == expected_lock_digest
          assert summary["source_literals_retained"] is False
          assert summary["package_count"] == 1
          package = summary["packages"][0]
          assert package["org"] == "zed-pkg"
          assert package["name"] == "docker-node-lib"
          assert package["version"] == "1.0.0"
          assert package["source_kind"] == "immutable-nix-store-input"
          PY

          if grep -R -I -F '/nix/store/' "$deps_a/metadata"; then
            echo "fixed-output metadata retained a Nix store path" >&2
            exit 1
          fi

          references="$(nix-store --query --references "$deps_a")"
          if [[ -n "$references" ]]; then
            echo "fixed output unexpectedly retained store references:" >&2
            printf '%s\n' "$references" >&2
            exit 1
          fi

          python3 - "$deps_a/tree" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for path in root.rglob("*"):
              if path.is_symlink() and os.path.isabs(os.readlink(path)):
                  raise SystemExit(f"fixed output contains an absolute symlink: {path}")
          PY

      - name: Build the ordinary offline consumer derivation
        shell: bash
        run: |
          set -euo pipefail
          package="$(
            nix-build tests/nix/interop.nix \
              --no-out-link \
              --arg zedBinary "$ZED_BINARY_STORE" \
              --arg consumerSrc "$ZED_CONSUMER_STORE" \
              --argstr registryStore "$ZED_REGISTRY_STORE" \
              --argstr hash "$ZED_DEPS_HASH" \
              --argstr name zed-nix-package \
              --argstr mode package
          )"
          test -f "$package/share/zed-nix-consumer/src/main.js"
          test -f "$package/share/zed-nix-consumer/.vendor/.zed/zed-pkg/docker-node-lib/package.json"
          test ! -e "$package/share/zed-nix-consumer/.vendor/.zed/zed-pkg/docker-node-lib/generated/output.txt"

      - name: Reject an incorrect Nix output hash
        shell: bash
        run: |
          set -euo pipefail
          if nix-build tests/nix/interop.nix \
            --no-out-link \
            --arg zedBinary "$ZED_BINARY_STORE" \
            --arg consumerSrc "$ZED_CONSUMER_STORE" \
            --argstr registryStore "$ZED_REGISTRY_STORE" \
            --argstr hash sha256-BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB= \
            --argstr name zed-nix-bad-output-hash \
            --argstr mode deps
          then
            echo "Nix accepted an incorrect recursive output hash" >&2
            exit 1
          fi

      - name: Reject tampered Zed lock provenance
        shell: bash
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/zed-nix-tampered-consumer"
          cp -R "$ZED_CONSUMER_WORK" "$tampered"
          chmod -R u+w "$tampered"
          python3 - "$tampered/.zpkg.lock" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          replacement = 'sha256 = "' + ('0' * 64) + '"'
          text, count = re.subn(
              r'^sha256 = "[0-9a-f]{64}"$',
              replacement,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
            raise SystemExit("expected one locked artifact sha256 to tamper")
          path.write_text(text, encoding="utf-8")
          PY

          tampered_store="$(nix store add-path "$tampered")"
          if nix-build tests/nix/interop.nix \
            --no-out-link \
            --arg zedBinary "$ZED_BINARY_STORE" \
            --arg consumerSrc "$tampered_store" \
            --argstr registryStore "$ZED_REGISTRY_STORE" \
            --argstr hash "$ZED_DEPS_HASH" \
            --argstr name zed-nix-tampered-lock \
            --argstr mode deps
          then
            echo "tampered .zpkg.lock unexpectedly produced the trusted fixed output" >&2
            exit 1
          fi
