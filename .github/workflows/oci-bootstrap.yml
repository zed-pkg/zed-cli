name: oci-planner-bootstrap

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/oci.rs
      - src/cli_oci.rs
      - src/cli.rs
      - src/main.rs
      - src/lib.rs
      - .cli-flags.toml
      - .github/workflows/oci-bootstrap.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refresh the stacked interface lock entry
        run: cargo update -p zed-interfaces
      - name: Format
        run: cargo fmt --all
      - name: Commit generated lock and formatting without force-pushing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/oci.rs src/cli_oci.rs src/cli.rs src/main.rs src/lib.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize OCI planner lock and formatting"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check
        run: cargo check --all-targets
      - name: Test OCI contract and planner
        run: cargo test oci --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
