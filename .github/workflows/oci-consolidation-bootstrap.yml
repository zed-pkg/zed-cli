name: validate consolidated OCI interop once

# Commit the exact lock and rustfmt output already validated by the read-only materialization run.
on:
  push:
    branches:
      - agent/oci-interop-consolidated-v1
    paths:
      - .github/workflows/oci-consolidation-bootstrap.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-consolidation-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: oci-consolidation-bootstrap
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: agent/oci-interop-consolidated-v1
  OLD_INTERFACES_REF: c2e049006453c26ca8ca291783f681fce75cb01f
  NEW_INTERFACES_REF: 2082012d1903783a89200c3bd44d2659a6daf872
  EXPECTED_LOCK_SHA256: 84835b6def7b8254ded2916e0cbe5cd74b336f4b05c2643ee7ead36d48446ed7

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/oci-interop-consolidated-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/oci-interop-consolidated-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate with write capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install declared Rust validation tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Regenerate exact validated lock and formatting
        run: |
          set -euo pipefail
          grep -F "rev = \"$NEW_INTERFACES_REF\"" Cargo.toml
          cargo update -p zed-interfaces --precise "$NEW_INTERFACES_REF"
          grep -F "rev=$NEW_INTERFACES_REF#$NEW_INTERFACES_REF" Cargo.lock
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "$EXPECTED_LOCK_SHA256"
          cargo fmt --all
          git diff --check

          mapfile -t stale < <(git grep -l "$OLD_INTERFACES_REF" -- . ':!Cargo.lock' ':!Cargo.toml' || true)
          for path in "${stale[@]}"; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                python3 - "$path" "$OLD_INTERFACES_REF" "$NEW_INTERFACES_REF" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          old, new = sys.argv[2:]
          text = path.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit(f'{path}: stale pin disappeared')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
                ;;
              *)
                echo "unexpected stale interface pin outside a workflow: $path" >&2
                exit 1
                ;;
            esac
          done

          if git grep -n "$OLD_INTERFACES_REF" -- . ':!target' ':!Cargo.lock'; then
            echo 'stale interface pin remains' >&2
            exit 1
          fi

      - name: Reconfirm critical interop gates
        run: |
          set -euo pipefail
          cargo test --locked --test nix_bundle_write_boundaries
          cargo test --locked --test nix_export_bundle
          cargo test --locked --lib oci
          cargo test --locked --lib cli_oci
          cargo test --locked --lib oci_command
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release --bin zed
          target/release/zed --help | grep -F 'oci'
          target/release/zed oci --help | grep -F 'plan'
          target/release/zed oci --help | grep -F 'push'
          target/release/zed interop nix bundle write --help | grep -F -- '--flake-lock'

      - name: Remove bootstrap and publish validated bytes
        run: |
          set -euo pipefail
          rm .github/workflows/oci-consolidation-bootstrap.yml

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          for path in "${changed[@]}"; do
            case "$path" in
              Cargo.lock|src/cli_oci.rs|src/completion.rs|src/nix_bundle_write.rs|src/nix_export_bundle/archive.rs|src/nix_export_bundle/templates.rs|src/oci_command.rs|tests/nix_bundle_write_boundaries.rs|tests/nix_bundle_write_cli.rs|tests/nix_export_bundle/common.rs|.github/workflows/*.yml|.github/workflows/*.yaml)
                ;;
              *)
                echo "validation changed an unexpected path: $path" >&2
                exit 1
                ;;
            esac
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: lock and format consolidated OCI interoperability"
          git push origin HEAD:${TARGET_BRANCH}