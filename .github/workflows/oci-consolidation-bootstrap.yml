name: inventory stale OCI interface pins

on:
  push:
    branches:
      - agent/oci-interop-consolidated-v1
    paths:
      - .github/workflows/oci-consolidation-bootstrap.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-consolidation-bootstrap.yml

permissions:
  contents: read

concurrency:
  group: oci-interface-pin-inventory
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Print stale interface references
        env:
          OLD_INTERFACES_REF: c2e049006453c26ca8ca291783f681fce75cb01f
        run: |
          set -euo pipefail
          git grep -n "$OLD_INTERFACES_REF" -- . ':!Cargo.lock' ':!Cargo.toml' || true
          echo '--- unique files ---'
          git grep -l "$OLD_INTERFACES_REF" -- . ':!Cargo.lock' ':!Cargo.toml' | sort -u || true