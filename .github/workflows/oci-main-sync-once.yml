name: semantically consolidate OCI interop onto current main once

on:
  push:
    branches:
      - agent/oci-interop-main-sync-v1
    paths:
      - .github/workflows/oci-main-sync-once.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-main-sync-once.yml

permissions:
  contents: write

concurrency:
  group: oci-main-sync-once
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: agent/oci-interop-main-sync-v1

jobs:
  sync:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/oci-interop-main-sync-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/oci-interop-main-sync-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact OCI candidate with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install declared Rust validation tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Merge current main and reapply the certified OCI surface
        run: |
          set -euo pipefail
          python3 scripts/oci_main_sync.py
          cargo fmt --all
          git diff --check

      - name: Validate consolidated OCI interoperability
        run: |
          set -euo pipefail
          cargo test --locked --all-targets oci
          cargo test --locked --all-targets cli_oci
          cargo test --locked cli_flags_toml_is_in_sync_with_clap
          cargo test --locked readme_documents_every_command
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release --bin zed

      - name: Remove one-shot machinery and publish the semantic merge
        run: |
          set -euo pipefail
          rm .github/workflows/oci-main-sync-once.yml
          rm scripts/oci_main_sync.py
          git add -A
          git diff --cached --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: consolidate OCI interoperability on current main"
          git push origin HEAD:${TARGET_BRANCH}
