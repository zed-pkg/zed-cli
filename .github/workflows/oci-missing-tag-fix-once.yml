name: validate ORAS missing-tag classification once

on:
  push:
    branches:
      - agent/oci-oras-push-v1
    paths:
      - .github/workflows/oci-missing-tag-fix-once.yml
  pull_request:
    branches:
      - agent/oci-local-layout-v1
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-missing-tag-fix-once.yml

permissions:
  contents: write

concurrency:
  group: oci-missing-tag-fix-once
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: agent/oci-oras-push-v1

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/oci-oras-push-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/oci-oras-push-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install declared Rust tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Implement precise missing-tag recognition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/oci_push.rs")
          text = path.read_text(encoding="utf-8")

          predicate_old = '''fn is_missing_manifest(value: &str) -> bool {
              let value = value.to_ascii_lowercase();
              [
                  "manifest unknown",
                  "manifest not found",
                  "no such manifest",
                  "name unknown",
                  "response status code 404",
                  "404 not found",
              ]
              .iter()
              .any(|needle| value.contains(needle))
          }
          '''
          predicate_new = '''fn is_missing_manifest(value: &str) -> bool {
              let value = value.to_ascii_lowercase();
              if [
                  "manifest unknown",
                  "manifest not found",
                  "no such manifest",
                  "name unknown",
                  "response status code 404",
                  "404 not found",
              ]
              .iter()
              .any(|needle| value.contains(needle))
              {
                  return true;
              }

              let value = value.trim_end();
              value.contains("error response from registry:")
                  && value.contains("failed to resolve digest:")
                  && value.ends_with(": not found")
          }
          '''
          if text.count(predicate_old) != 1:
              raise SystemExit("expected exactly one missing-manifest predicate")
          text = text.replace(predicate_old, predicate_new)

          fake_old = "      echo 'manifest unknown' >&2\n"
          fake_new = (
              "      echo 'Error response from registry: failed to resolve digest: "
              "localhost:5000/acme/tool:1.2.3: not found' >&2\n"
          )
          if text.count(fake_old) != 1:
              raise SystemExit("expected exactly one fake missing-manifest response")
          text = text.replace(fake_old, fake_new)

          marker = '''    #[cfg(unix)]
              #[test]
              fn pushes_verified_layout_and_re_resolves_exact_digest() {
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected exact first-push test marker")
          tests = '''    #[test]
              fn recognizes_registry_missing_tags_without_masking_unrelated_errors() {
                  assert!(is_missing_manifest(
                      "Error response from registry: failed to resolve digest: registry.example/acme/tool:1.2.3: not found\n"
                  ));
                  assert!(is_missing_manifest(
                      "MANIFEST_UNKNOWN: manifest unknown"
                  ));
                  assert!(!is_missing_manifest(
                      "open /tmp/registry-config.json: no such file or directory"
                  ));
                  assert!(!is_missing_manifest(
                      "Error response from registry: failed to resolve digest: registry.example/acme/tool:1.2.3: unauthorized"
                  ));
                  assert!(!is_missing_manifest(
                      "dial tcp registry.example:443: connect: network is unreachable"
                  ));
              }

          '''
          text = text.replace(marker, tests + marker)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Run focused and integration hardening gates
        run: |
          set -euo pipefail
          cargo test --locked --all-targets oci_push
          cargo test --locked --all-targets cli_oci
          cargo test --locked cli_flags_toml_is_in_sync_with_clap
          cargo test --locked readme_documents_every_command
          cargo clippy --locked --all-targets -- -D warnings

      - name: Remove workflow and publish validated classifier
        run: |
          set -euo pipefail
          rm .github/workflows/oci-missing-tag-fix-once.yml

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          allowed=(
            .github/workflows/oci-missing-tag-fix-once.yml
            src/oci_push.rs
          )
          for changed_path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$changed_path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "missing-tag validation changed an unexpected path: $changed_path" >&2
              exit 1
            fi
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${allowed[@]}"
          git commit -m "fix: recognize ORAS registry missing tags precisely"
          git push origin HEAD:${TARGET_BRANCH}