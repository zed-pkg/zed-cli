name: validate and format ORAS push slice once

on:
  push:
    branches:
      - agent/oci-oras-push-v1
    paths:
      - .github/workflows/oci-oras-bootstrap.yml
  pull_request:
    branches:
      - agent/oci-local-layout-v1
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-oras-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: oci-oras-bootstrap-once
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: agent/oci-oras-push-v1

jobs:
  bootstrap:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/oci-oras-push-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/oci-oras-push-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install the declared Rust tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version

      - name: Apply deterministic source corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/oci_push.rs")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str, expected: int, label: str) -> None:
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} occurrence(s), found {count}")
              text = text.replace(old, new)

          replace_exact(
              "use std::io::{self, BufRead, IsTerminal, Read, Write};",
              "use std::io::{self, BufRead, IsTerminal, Read};",
              1,
              "global Write import",
          )
          replace_exact(
              "        use std::os::unix::fs::OpenOptionsExt;",
              "        use std::io::Write;\n        use std::os::unix::fs::OpenOptionsExt;",
              1,
              "Unix secure-file imports",
          )
          replace_exact(
              "while password.ends_with(['\\n', '\\r']) {",
              "while password.ends_with('\\n') || password.ends_with('\\r') {",
              2,
              "password newline trimming",
          )
          replace_exact(
              "    use std::os::unix::fs::PermissionsExt;",
              "    #[cfg(unix)]\n    use std::os::unix::fs::PermissionsExt;",
              1,
              "Unix test import",
          )

          lines = text.splitlines()

          def unique_line(fragment: str, label: str, start: int = 0) -> int:
              matches = [index for index, line in enumerate(lines[start:], start) if fragment in line]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one matching line, found {len(matches)}")
              return matches[0]

          duplicate_start = unique_line(
              "if let Some(previous_size) = expected.insert(digest.clone(), descriptor.size)",
              "duplicate descriptor block",
          )
          duplicate_end = next(
              (
                  index
                  for index in range(duplicate_start + 1, len(lines))
                  if lines[index] == "    }"
              ),
              None,
          )
          if duplicate_end is None:
              raise SystemExit("duplicate descriptor block: closing brace not found")
          lines[duplicate_start : duplicate_end + 1] = [
              "    if let Some(previous_size) = expected.insert(digest.clone(), descriptor.size) {",
              "        bail!(",
              "            \"OCI digest `{digest}` is declared more than once (sizes {previous_size} and {})\",",
              "            descriptor.size",
              "        );",
              "    }",
          ]

          missing_fn = unique_line("fn is_missing_manifest", "missing-manifest function")
          missing_start = next(
              (
                  index
                  for index in range(missing_fn + 1, len(lines))
                  if lines[index].strip() == "["
              ),
              None,
          )
          if missing_start is None:
              raise SystemExit("missing-manifest function: diagnostic array not found")
          missing_end = next(
              (
                  index
                  for index in range(missing_start + 1, len(lines))
                  if lines[index].strip() == "]"
              ),
              None,
          )
          if missing_end is None:
              raise SystemExit("missing-manifest function: diagnostic array end not found")
          lines[missing_start : missing_end + 1] = [
              "    [",
              "        \"manifest unknown\",",
              "        \"manifest not found\",",
              "        \"no such manifest\",",
              "        \"name unknown\",",
              "        \"response status code 404\",",
              "        \"404 not found\",",
              "    ]",
          ]

          truncation_start = unique_line(
              "if value.len() > MAX_DIAGNOSTIC_BYTES",
              "diagnostic truncation block",
          )
          truncation_end = next(
              (
                  index
                  for index in range(truncation_start + 1, len(lines))
                  if lines[index] == "    }"
              ),
              None,
          )
          if truncation_end is None:
              raise SystemExit("diagnostic truncation block: closing brace not found")
          lines[truncation_start : truncation_end + 1] = [
              "    if value.len() > MAX_DIAGNOSTIC_BYTES {",
              "        let mut end = MAX_DIAGNOSTIC_BYTES;",
              "        while !value.is_char_boundary(end) {",
              "            end -= 1;",
              "        }",
              "        value.truncate(end);",
              "        value.push('…');",
              "    }",
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Compile and test the ORAS transport boundary
        run: |
          set -euo pipefail
          cargo test --locked --all-targets oci_push
          cargo test --locked --all-targets cli_oci
          cargo clippy --locked --all-targets -- -D warnings

      - name: Remove the temporary workflow and publish the validated correction
        run: |
          set -euo pipefail
          rm .github/workflows/oci-oras-bootstrap.yml

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          allowed=(
            .github/workflows/oci-oras-bootstrap.yml
            src/cli_oci.rs
            src/lib.rs
            src/main.rs
            src/oci_push.rs
          )
          for changed_path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$changed_path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "validation changed an unexpected path: $changed_path" >&2
              exit 1
            fi
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${allowed[@]}"
          git commit -m "style: validate ORAS push implementation"
          git push origin HEAD:${TARGET_BRANCH}