name: validate and format ORAS push slice once

on:
  push:
    branches:
      - agent/oci-oras-push-v1
    paths:
      - .github/workflows/oci-oras-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: oci-oras-bootstrap-once
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install the declared Rust tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo fmt --version
          cargo clippy --version

      - name: Apply deterministic source corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/oci_push.rs')
          text = path.read_text(encoding='utf-8')

          newline_old = "while password.ends_with(['\\n', '\\r']) {"
          newline_new = "while password.ends_with('\\n') || password.ends_with('\\r') {"
          count = text.count(newline_old)
          if count != 2:
              raise SystemExit(f'expected two newline-trimming loops, found {count}')
          text = text.replace(newline_old, newline_new)

          unix_old = "    use std::os::unix::fs::PermissionsExt;"
          unix_new = "    #[cfg(unix)]\n    use std::os::unix::fs::PermissionsExt;"
          count = text.count(unix_old)
          if count != 1:
              raise SystemExit(f'expected one Unix test import, found {count}')
          text = text.replace(unix_old, unix_new)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Compile and test the ORAS transport boundary
        run: |
          set -euo pipefail
          cargo test --locked --all-targets oci_push
          cargo test --locked --all-targets cli_oci
          cargo clippy --locked --all-targets -- -D warnings

      - name: Remove the temporary workflow and publish the validated correction
        run: |
          set -euo pipefail
          rm .github/workflows/oci-oras-bootstrap.yml

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          allowed=(
            .github/workflows/oci-oras-bootstrap.yml
            src/cli_oci.rs
            src/lib.rs
            src/main.rs
            src/oci_push.rs
          )
          for path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "validation changed an unexpected path: $path" >&2
              exit 1
            fi
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${allowed[@]}"
          git commit -m "style: validate ORAS push implementation"
          git push origin HEAD:agent/oci-oras-push-v1