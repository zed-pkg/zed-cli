name: validate OCI push option combinations once

on:
  push:
    branches:
      - agent/oci-oras-push-v1
    paths:
      - .github/workflows/oci-push-runtime-validation-once.yml
  pull_request:
    branches:
      - agent/oci-local-layout-v1
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/oci-push-runtime-validation-once.yml

permissions:
  contents: write

concurrency:
  group: oci-push-runtime-validation-once
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: agent/oci-oras-push-v1

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/agent/oci-oras-push-v1') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/oci-oras-push-v1' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install declared Rust tools
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose
          cargo clippy --version

      - name: Move option-combination enforcement to runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/oci_push.rs")
          text = path.read_text(encoding="utf-8")

          transport_old = '''fn validate_transport_options(
              options: &OciPushOptions<'_>,
              destination: &OciReference,
          ) -> Result<()> {
              if options.plain_http && !is_loopback_registry(&destination.registry) {
          '''
          transport_new = '''fn validate_transport_options(
              options: &OciPushOptions<'_>,
              destination: &OciReference,
          ) -> Result<()> {
              if options.plain_http && (options.insecure_tls || options.ca_file.is_some()) {
                  bail!("--plain-http cannot be combined with --insecure-tls or --ca-file");
              }
              if options.insecure_tls && options.ca_file.is_some() {
                  bail!("--insecure-tls cannot be combined with --ca-file");
              }
              if options.plain_http && !is_loopback_registry(&destination.registry) {
          '''
          if text.count(transport_old) != 1:
              raise SystemExit("expected one transport validation function")
          text = text.replace(transport_old, transport_new)

          marker = '''    #[test]
              fn plain_http_fails_closed_for_non_loopback_registry() {
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected one plain-HTTP test marker")
          insertion = '''    #[test]
              fn runtime_auth_validation_rejects_missing_partial_and_conflicting_modes() {
                  let workspace = tempfile::tempdir().unwrap();
                  let layout = workspace.path().join("unused-layout");
                  let oras = workspace.path().join("unused-oras");
                  let destination =
                      parse_destination("oci://ghcr.io/acme/tool:1.2.3").unwrap();
                  let mut options = OciPushOptions {
                      layout: &layout,
                      destination: "oci://ghcr.io/acme/tool:1.2.3",
                      oras: &oras,
                      username: None,
                      password_stdin: false,
                      registry_config: None,
                      anonymous: false,
                      plain_http: false,
                      insecure_tls: false,
                      ca_file: None,
                      allow_tag_replacement: false,
                      interactive: false,
                      json: true,
                  };

                  let missing = prepare_registry_config(&options, &destination, None).unwrap_err();
                  assert!(missing.to_string().contains("choose exactly one OCI authentication mode"));

                  options.username = Some("user");
                  let partial = prepare_registry_config(&options, &destination, None).unwrap_err();
                  assert!(partial.to_string().contains("did not yield a password"));

                  options.username = None;
                  options.password_stdin = true;
                  let partial =
                      prepare_registry_config(&options, &destination, Some("pass")).unwrap_err();
                  assert!(partial.to_string().contains("--username is required"));

                  options.username = Some("user");
                  options.anonymous = true;
                  let conflicting =
                      prepare_registry_config(&options, &destination, Some("pass")).unwrap_err();
                  assert!(
                      conflicting
                          .to_string()
                          .contains("choose exactly one OCI authentication mode")
                  );
              }

              #[test]
              fn runtime_transport_validation_rejects_conflicting_security_modes() {
                  let workspace = tempfile::tempdir().unwrap();
                  let ca_file = workspace.path().join("registry-ca.pem");
                  fs::write(&ca_file, "test CA bytes").unwrap();
                  let layout = workspace.path().join("unused-layout");
                  let oras = workspace.path().join("unused-oras");
                  let destination =
                      parse_destination("oci://127.0.0.1:5000/acme/tool:1.2.3").unwrap();
                  let mut options = OciPushOptions {
                      layout: &layout,
                      destination: "oci://127.0.0.1:5000/acme/tool:1.2.3",
                      oras: &oras,
                      username: None,
                      password_stdin: false,
                      registry_config: None,
                      anonymous: true,
                      plain_http: true,
                      insecure_tls: true,
                      ca_file: None,
                      allow_tag_replacement: false,
                      interactive: false,
                      json: true,
                  };

                  let plain_and_insecure =
                      validate_transport_options(&options, &destination).unwrap_err();
                  assert!(plain_and_insecure.to_string().contains("--plain-http cannot"));

                  options.insecure_tls = false;
                  options.ca_file = Some(&ca_file);
                  let plain_and_ca =
                      validate_transport_options(&options, &destination).unwrap_err();
                  assert!(plain_and_ca.to_string().contains("--plain-http cannot"));

                  options.plain_http = false;
                  options.insecure_tls = true;
                  let insecure_and_ca =
                      validate_transport_options(&options, &destination).unwrap_err();
                  assert!(insecure_and_ca.to_string().contains("--insecure-tls cannot"));
              }

          '''
          text = text.replace(marker, insertion + marker)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check

      - name: Run focused and integration hardening gates
        run: |
          set -euo pipefail
          cargo test --locked --all-targets oci_push
          cargo test --locked --all-targets cli_oci
          cargo test --locked cli_flags_toml_is_in_sync_with_clap
          cargo test --locked readme_documents_every_command
          cargo clippy --locked --all-targets -- -D warnings

      - name: Remove workflow and publish validated runtime checks
        run: |
          set -euo pipefail
          rm .github/workflows/oci-push-runtime-validation-once.yml

          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          allowed=(
            .github/workflows/oci-push-runtime-validation-once.yml
            src/cli_oci.rs
            src/oci_push.rs
          )
          for changed_path in "${changed[@]}"; do
            permitted=false
            for candidate in "${allowed[@]}"; do
              if [[ "$changed_path" == "$candidate" ]]; then
                permitted=true
                break
              fi
            done
            if [[ "$permitted" != true ]]; then
              echo "runtime validation changed an unexpected path: $changed_path" >&2
              exit 1
            fi
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${allowed[@]}"
          git commit -m "fix: validate OCI push option combinations at runtime"
          git push origin HEAD:${TARGET_BRANCH}