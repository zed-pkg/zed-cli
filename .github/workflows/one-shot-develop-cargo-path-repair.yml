name: One-shot zed develop Cargo path repair

on:
  push:
    branches:
      - fix/develop-cargo-path-root-20260915

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/develop-cargo-path-root-20260915
          fetch-depth: 0

      - name: Patch Cargo adapter path anchoring in Rust
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch.rs" <<'RS'
          use std::{env, fs, process};

          fn exactly_once(haystack: &str, needle: &str, label: &str) {
              let count = haystack.matches(needle).count();
              if count != 1 {
                  eprintln!("expected exactly one {label}, found {count}");
                  process::exit(2);
              }
          }

          fn main() {
              let path = env::args().nth(1).expect("source path");
              let source = fs::read_to_string(&path).expect("read source");
              let old = r###"fn prepare_cargo_adapter(root: &Path) -> Result<()> {
              let source = root.join(".zed/cargo-paths.toml");
              if !source.is_file() {
                  return Ok(());
              }
              let destination = root.join(".zed/dev/cargo/home/config.toml");
              fs::copy(&source, &destination).with_context(|| {
                  format!(
                      "copying Rust adapter {} to {}",
                      source.display(),
                      destination.display()
                  )
              })?;
              Ok(())
          }
          "###;
              let new = r###"fn prepare_cargo_adapter(root: &Path) -> Result<()> {
              let source = root.join(".zed/cargo-paths.toml");
              if !source.is_file() {
                  return Ok(());
              }
              let destination = root.join(".zed/dev/cargo/home/config.toml");
              if let Some(parent) = destination.parent() {
                  fs::create_dir_all(parent).with_context(|| {
                      format!("creating managed Cargo home {}", parent.display())
                  })?;
              }

              let source_text = fs::read_to_string(&source)
                  .with_context(|| format!("reading Rust adapter {}", source.display()))?;
              let mut config: toml::Value = toml::from_str(&source_text)
                  .with_context(|| format!("parsing Rust adapter {}", source.display()))?;
              anchor_cargo_adapter_paths(root, &mut config)?;
              let rendered = toml::to_string_pretty(&config)
                  .context("serializing managed Cargo adapter")?;
              fs::write(&destination, rendered).with_context(|| {
                  format!(
                      "writing Rust adapter {} from {}",
                      destination.display(),
                      source.display()
                  )
              })?;
              Ok(())
          }

          fn anchor_cargo_adapter_paths(root: &Path, config: &mut toml::Value) -> Result<()> {
              let table = config
                  .as_table_mut()
                  .context("generated Cargo adapter must be a TOML table")?;

              if let Some(paths) = table.get_mut("paths") {
                  let paths = paths
                      .as_array_mut()
                      .context("generated Cargo adapter `paths` must be an array")?;
                  for path in paths {
                      let raw = path
                          .as_str()
                          .context("generated Cargo adapter `paths` entries must be strings")?
                          .to_owned();
                      *path = toml::Value::String(anchor_cargo_adapter_path(root, &raw)?);
                  }
              }

              if let Some(patch) = table.get_mut("patch") {
                  let registries = patch
                      .as_table_mut()
                      .context("generated Cargo adapter `patch` must be a table")?;
                  for registry in registries.values_mut() {
                      let packages = registry
                          .as_table_mut()
                          .context("generated Cargo adapter patch registry must be a table")?;
                      for package in packages.values_mut() {
                          let package = package
                              .as_table_mut()
                              .context("generated Cargo adapter patch package must be a table")?;
                          let Some(path) = package.get_mut("path") else {
                              continue;
                          };
                          let raw = path
                              .as_str()
                              .context("generated Cargo adapter patch path must be a string")?
                              .to_owned();
                          *path = toml::Value::String(anchor_cargo_adapter_path(root, &raw)?);
                      }
                  }
              }
              Ok(())
          }

          fn anchor_cargo_adapter_path(root: &Path, raw: &str) -> Result<String> {
              let path = Path::new(raw);
              let anchored = if path.is_absolute() {
                  path.to_path_buf()
              } else {
                  root.join(path)
              };
              anchored
                  .to_str()
                  .map(str::to_owned)
                  .with_context(|| format!("Cargo adapter path is not valid UTF-8: {}", anchored.display()))
          }
          "###;
              exactly_once(&source, old, "prepare_cargo_adapter implementation");
              let mut patched = source.replacen(old, new, 1);

              let marker = r###"    #[test]
              fn nested_invocations_select_the_owning_manifest() {
          "###;
              let regression = r###"    #[test]
              fn cargo_adapter_anchors_generated_paths_to_project_root() {
                  let temp = tempfile::tempdir().unwrap();
                  let root = fs::canonicalize(temp.path()).unwrap();
                  fs::create_dir_all(root.join(".zed")).unwrap();
                  fs::write(
                      root.join(".zed/cargo-paths.toml"),
                      r#"paths = [".vendor/.zed/zed-pkg/zed-interfaces"]

          [patch.crates-io.zed-interfaces]
          path = "zed_modules/zed-pkg/zed-interfaces"
          "#,
                  )
                  .unwrap();

                  prepare_cargo_adapter(&root).unwrap();

                  let generated =
                      fs::read_to_string(root.join(".zed/dev/cargo/home/config.toml")).unwrap();
                  let parsed: toml::Value = toml::from_str(&generated).unwrap();
                  assert_eq!(
                      parsed["paths"][0].as_str(),
                      root.join(".vendor/.zed/zed-pkg/zed-interfaces").to_str()
                  );
                  assert_eq!(
                      parsed["patch"]["crates-io"]["zed-interfaces"]["path"].as_str(),
                      root.join("zed_modules/zed-pkg/zed-interfaces").to_str()
                  );
                  assert!(!generated.contains(".zed/dev/cargo/.vendor"));
              }

          "###;
              exactly_once(&patched, marker, "nested invocation test marker");
              patched = patched.replacen(marker, &(regression.to_owned() + marker), 1);
              fs::write(path, patched).expect("write source");
          }
          RS
          rustc --edition 2024 "$RUNNER_TEMP/patch.rs" -o "$RUNNER_TEMP/patch"
          "$RUNNER_TEMP/patch" src/dev.rs
          cargo fmt --all -- --check
          cargo test --locked --lib cargo_adapter_anchors_generated_paths_to_project_root
          git diff --check

      - name: Commit root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dev.rs
          git diff --cached --check
          git commit -m 'fix: anchor develop Cargo paths to project root'
          git push origin HEAD:fix/develop-cargo-path-root-20260915
