name: one-shot harden hex route test

on:
  push:
    branches:
      - feat/hex-read-parity

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Resolve repository Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print(f"toolchain={tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']}")
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt
      - name: Remove panic from new Hex route contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/external_subcommands.rs')
          text = path.read_text()
          old = '''    #[test]\n    fn routes_hex_pm_without_allowing_arbitrary_dotted_plugin_names() {\n        let route = external_route(&os_args(&["zed", "hex.pm", "info", "plug"]))\n            .expect("hex.pm external route");\n        assert_eq!(route.name, "hex.pm");\n        assert_eq!(route.arguments, os_args(&["info", "plug"]));\n        assert!(valid_external_name("hex.pm"));\n        assert!(!valid_external_name("foo.bar"));\n        assert_eq!(external_executable_stem("hex.pm"), "zed-hex-pm");\n    }\n'''
          new = '''    #[test]\n    fn routes_hex_pm_without_allowing_arbitrary_dotted_plugin_names() -> Result<()> {\n        let route = external_route(&os_args(&["zed", "hex.pm", "info", "plug"]))\n            .ok_or_else(|| anyhow!("hex.pm external route should be recognized"))?;\n        assert_eq!(route.name, "hex.pm");\n        assert_eq!(route.arguments, os_args(&["info", "plug"]));\n        assert!(valid_external_name("hex.pm"));\n        assert!(!valid_external_name("foo.bar"));\n        assert_eq!(external_executable_stem("hex.pm"), "zed-hex-pm");\n        Ok(())\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit('expected Hex route test anchor missing or non-unique')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Run exact Hex route regression test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked routes_hex_pm_without_allowing_arbitrary_dotted_plugin_names
          cargo fmt --all -- --check
      - name: Commit hardened test
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-fix-hex-route-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: avoid panic in hex external route contract'
          git push origin HEAD:feat/hex-read-parity
