name: one-shot hex clippy diagnostics

on:
  push:
    branches:
      - feat/hex-read-parity

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Resolve repository Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print(f"toolchain={tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']}")
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: clippy
      - name: Capture targeted Clippy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo clippy --bin zed-hex-pm --locked --message-format=json -- -D warnings > clippy.jsonl 2> clippy.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > clippy.exit
          python3 - <<'PY'
          import json
          from pathlib import Path

          rendered = []
          for raw in Path('clippy.jsonl').read_text(errors='replace').splitlines():
              try:
                  obj = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if obj.get('reason') != 'compiler-message':
                  continue
              msg = obj.get('message') or {}
              if msg.get('level') not in {'warning', 'error'}:
                  continue
              text = msg.get('rendered') or msg.get('message') or ''
              if text:
                  rendered.append(text.rstrip())
          stderr = Path('clippy.stderr').read_text(errors='replace').strip()
          report = '\n\n'.join(rendered)
          if stderr:
              report += ('\n\n--- stderr ---\n' if report else '--- stderr ---\n') + stderr
          if not report:
              report = 'No compiler warning/error diagnostics were emitted.\n'
          Path('clippy-diagnostics.txt').write_text(report + '\n')
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hex-clippy-diagnostics
          path: |
            clippy-diagnostics.txt
            clippy.stderr
            clippy.exit
          if-no-files-found: error
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-hex-clippy-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-shot-hex-clippy-diagnostics.yml
          git commit -m 'ci: remove one-shot hex clippy diagnostics'
          git push origin HEAD:feat/hex-read-parity
