# Disposable read-only baseline audit; not part of any feature PR.
name: one-shot runtime env schema-test patch

on:
  push:
    branches: [diagnostic/attolang-fp-baseline-20261106]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact unchanged main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 388161f681bac8ae704a22a593280ceed6cc4fa9
          persist-credentials: false
      - name: Verify pinned baseline
        run: test "$(git rev-parse HEAD)" = 388161f681bac8ae704a22a593280ceed6cc4fa9
      - name: Measure RS005 without changing any budget
        run: |
          set -euo pipefail
          python3 tools/fp-conformance/fp_conformance.py . --json /tmp/baseline-fp.json > /tmp/baseline-report.txt
          grep -E 'RS005|findings:|fp-conformance' /tmp/baseline-report.txt || true
          python3 - <<'PY'
          import json
          with open('/tmp/baseline-fp.json', encoding='utf-8') as file:
              report = json.load(file)
          print('JSON_TYPE:', type(report).__name__)
          if isinstance(report, dict):
              print('KEYS:', sorted(report.keys()))
              rows = report.get('findings', report.get('results', []))
          else:
              rows = report
          matches = [row for row in rows if isinstance(row, dict) and row.get('code') == 'RS005']
          print('RS005_BASELINE_COUNT:', len(matches))
          for row in matches[:30]:
              print('RS005_PATH:', row.get('path'), 'LINE:', row.get('line'))
          PY
