# Temporary branch only. Run read-only exact-PR-head focused validation.
name: one-shot runtime env schema-test patch

on:
  push:
    branches:
      - diagnostic/attolang-cargo-lock-20261105

permissions:
  contents: read

concurrency:
  group: attolang-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 22e3c8e7d80a312d8433a4aaa593c9e6201a563f
          persist-credentials: false
      - name: Verify exact tested revision
        env:
          EXPECTED_SHA: 22e3c8e7d80a312d8433a4aaa593c9e6201a563f
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt,clippy
      - name: Check exact-head formatting
        run: cargo fmt --all -- --check
      - name: Run complete Rust library unit suite
        run: cargo test --locked --lib
      - name: Test AttoLang CLI read-only import bridge
        run: cargo test --locked --test attolang_paths_cli
      - name: Prove ZIP symlink security rejection on actual archive metadata
        run: cargo test --locked --lib native_artifact_store::tests::rejects_zip_symlinks
      - name: Prove README command registry includes AttoLang
        run: cargo test --locked --lib cli::tests::readme_documents_every_command
      - name: Verify flags2env command parity
        run: cargo test --locked --test cli_flags_contract_parity
      - name: Check CLI library compilation
        run: cargo check --locked --all-targets
