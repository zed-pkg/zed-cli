name: one-shot rustfmt 409

on:
  push:
    branches:
      - release/v0.3.1-fallback-repack-20260915

permissions:
  contents: write

concurrency:
  group: one-shot-rustfmt-409
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format exact branch
        run: cargo fmt --all
      - name: Commit format-only repair and remove workflow
        run: |
          git rm .github/workflows/one-shot-rustfmt-409.yml
          git add -u
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply rustfmt to release branch"
          git push origin HEAD:release/v0.3.1-fallback-repack-20260915
