name: one-shot scoped flags env parity repair

on:
  push:
    branches:
      - test/toml-contract-audit-20260910
    paths:
      - .github/workflows/one-shot-scoped-flags-env-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Assert exact parent under review
        env:
          EXPECTED_PARENT: f963cd4c3d43782334fcfc088876ae952ad6c478
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Make command scopes the uniqueness boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cli_path = Path("src/cli.rs")
          source = cli_path.read_text(encoding="utf-8")
          old = '''            if let Some(flags) = table.get("flags").and_then(toml::Value::as_table) {
                          for (name, flag) in flags {
                              let env = flag
                                  .get("env")
                                  .and_then(toml::Value::as_str)
                                  .unwrap_or_else(|| panic!("flag `{name}` is missing `env`"));
                              assert!(
                                  is_registered_env(env),
                                  "flag --{} env `{env}` must use a registered Zed or runtime namespace",
                                  name.replace('_', "-")
                              );
                              assert!(
                                  envs.insert(env.to_string()),
                                  "duplicate env `{env}` in .cli-flags.toml"
                              );
                          }
                      }'''
          new = '''            if let Some(flags) = table.get("flags").and_then(toml::Value::as_table) {
                          let mut scope_envs = BTreeSet::new();
                          for (name, flag) in flags {
                              let env = flag
                                  .get("env")
                                  .and_then(toml::Value::as_str)
                                  .unwrap_or_else(|| panic!("flag `{name}` is missing `env`"));
                              assert!(
                                  is_registered_env(env),
                                  "flag --{} env `{env}` must use a registered Zed or runtime namespace",
                                  name.replace('_', "-")
                              );
                              assert!(
                                  scope_envs.insert(env.to_string()),
                                  "duplicate env `{env}` within one .cli-flags.toml command scope"
                              );
                              envs.insert(env.to_string());
                          }
                      }'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one cli parity block, found {source.count(old)}")
          cli_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/cli_flags_global_uniqueness.rs")
          tests = test_path.read_text(encoding="utf-8")
          marker = "fn mirror_and_key_flags_remain_command_scoped()"
          if marker in tests:
              raise SystemExit("scoped flags regression test already exists")
          tests += r'''

          #[test]
          fn mirror_and_key_flags_remain_command_scoped() {
              use clap::Parser;

              let source = fs::read_to_string(".cli-flags.toml").expect("read .cli-flags.toml");
              let contract: toml::Value = toml::from_str(&source).expect("parse .cli-flags.toml");
              let root_flags = contract["flags"]
                  .as_table()
                  .expect(".cli-flags.toml must declare [flags]");

              for stale_root in [
                  "mirror_json",
                  "mirror_package",
                  "mirror_bootstrap_url",
                  "mirror_output",
                  "key_id",
              ] {
                  assert!(
                      !root_flags.contains_key(stale_root),
                      "flags.{stale_root} must not escape its Clap subcommand scope"
                  );
              }

              assert_eq!(
                  contract["commands"]["mirror"]["commands"]["list"]["flags"]["json"]["env"]
                      .as_str(),
                  Some("ZED_PKG_MIRROR_JSON")
              );
              assert_eq!(
                  contract["commands"]["mirror"]["commands"]["check"]["flags"]["json"]["env"]
                      .as_str(),
                  Some("ZED_PKG_MIRROR_JSON")
              );
              assert_eq!(
                  contract["commands"]["mirror"]["commands"]["check"]["flags"]["package"]["env"]
                      .as_str(),
                  Some("ZED_PKG_MIRROR_PACKAGE")
              );
              for command in ["generate", "show", "enroll"] {
                  assert_eq!(
                      contract["commands"]["key"]["commands"][command]["flags"]["key-id"]["env"]
                          .as_str(),
                      Some("ZED_PKG_KEY_ID"),
                      "key {command} must own --key-id in the same scope as Clap"
                  );
              }

              for args in [
                  vec!["zed", "mirror", "list", "--json"],
                  vec!["zed", "mirror", "check", "--package", "acme/http", "--json"],
                  vec!["zed", "mirror", "bootstrap", "--url", "https://mirror.example"],
                  vec!["zed", "mirror", "sync", "--output", "mirror-out"],
                  vec!["zed", "key", "generate", "--org", "acme", "--key-id", "acme-2026"],
                  vec!["zed", "key", "show", "--org", "acme", "--key-id", "acme-2026"],
                  vec!["zed", "key", "enroll", "--org", "acme", "--key-id", "acme-2026"],
              ] {
                  zed_cli::cli::Cli::try_parse_from(args.clone())
                      .unwrap_or_else(|error| panic!("Clap rejected scoped args {args:?}: {error}"));
              }

              for args in [
                  vec!["zed", "mirror", "bootstrap", "--json"],
                  vec!["zed", "mirror", "sync", "--package", "acme/http"],
                  vec!["zed", "key", "list", "--key-id", "acme-2026", "--org", "acme"],
              ] {
                  assert!(
                      zed_cli::cli::Cli::try_parse_from(args.clone()).is_err(),
                      "Clap unexpectedly accepted out-of-scope args {args:?}"
                  );
              }
          }
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

          git diff --check

      - name: Commit repair without rewriting history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli.rs tests/cli_flags_global_uniqueness.rs
          git diff --cached --check
          git commit -m "test: make flags env uniqueness command-scope aware"
          git push origin "HEAD:${GITHUB_REF_NAME}"
