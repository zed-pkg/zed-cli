name: one-shot strict runtime env repair v2

on:
  push:
    branches:
      - test/toml-contract-audit-20260910
    paths:
      - .github/workflows/one-shot-strict-runtime-env-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Assert exact parent under review
        env:
          EXPECTED_PARENT: d5c62e7f747a740b5b80a13db8abe559b8374429
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - name: Apply strict raw-env semantics and current flags2env pin
        run: python3 -c 'import base64;exec(base64.b64decode(""))'
      - name: Refresh resolver-owned flags2env lock entry
        run: cargo update -p flags2env
      - name: Verify focused diff and tests
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' Cargo.lock Cargo.toml src/flags.rs | sort)"
          test "$changed" = "$expected"
          cargo fmt --all -- --check
          cargo test --locked --lib flags::tests::boolean_environment_values_are_canonicalized_and_invalid_values_fail
          cargo test --locked --lib flags::tests::raw_boolean_environment_matches_flags2env_typed_preflight
          cargo test --locked --lib flags::tests::explicit_cli_boolean_shadows_even_an_invalid_environment_value
          cargo test --locked --test startup_environment_contract
          cargo test --locked --test toml_contracts
      - name: Commit source repair without rewriting history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/flags.rs
          git diff --cached --check
          git commit -m "fix: enforce canonical raw boolean environment values"
          git push origin "HEAD:${GITHUB_REF_NAME}"
