name: one-shot strict runtime env repair

on:
  push:
    branches:
      - test/toml-contract-audit-20260910
    paths:
      - .github/workflows/one-shot-strict-runtime-env.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Assert exact parent under review
        env:
          EXPECTED_PARENT: af5a73be9d87d210882ddfe365afacdc2550e312
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Align raw environment semantics with flags2env typed preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_rev = "2946224fb3a1bd84c0e39146b24f5f1ca8d69862"
          new_rev = "fbd927d0a9c91617a04ae8f4ee7647253846dbd6"

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text()
          if cargo_text.count(old_rev) != 1:
              raise SystemExit(f"expected one old flags2env pin, found {cargo_text.count(old_rev)}")
          cargo.write_text(cargo_text.replace(old_rev, new_rev))

          path = Path("src/flags.rs")
          source = path.read_text()
          old_doc = '''/// Clap's boolean environment parser accepts canonical `true`/`false`, while
/// shell and deployment configuration commonly use `1`, `0`, `yes`, `no`,
/// `on`, and `off`. Canonicalize only boolean keys declared in the active
/// flags2env scopes. Invalid values fail closed. This never writes `std::env`.'''
          new_doc = '''/// Raw runtime environment booleans must already use canonical `true`/`false`.
/// Argv aliases are normalized by flags2env before they enter the final map, but
/// inherited environment values are never reinterpreted here. This keeps Zed's
/// boot contract identical to flags2env typed preflight across runtimes. Invalid
/// raw values fail closed. This never writes `std::env`.'''
          if source.count(old_doc) != 1:
              raise SystemExit("expected exactly one boolean normalization doc block")
          source = source.replace(old_doc, new_doc)

          old_error = '''    normalize_boolean_value(raw).map(Some).with_context(|| {
        format!(
            "boolean environment variable `{env}` must be one of true/false, 1/0, yes/no, or on/off"
        )
    })
}

fn normalize_boolean_value(value: &str) -> Option<&'static str> {
    match value.trim().to_ascii_lowercase().as_str() {
        "true" | "1" | "yes" | "on" => Some("true"),
        "false" | "0" | "no" | "off" => Some("false"),
        _ => None,
    }
}'''
          new_error = '''    normalize_boolean_value(raw).map(Some).with_context(|| {
        format!("boolean environment variable `{env}` must be exactly true or false")
    })
}

fn normalize_boolean_value(value: &str) -> Option<&'static str> {
    match value {
        "true" => Some("true"),
        "false" => Some("false"),
        _ => None,
    }
}'''
          if source.count(old_error) != 1:
              raise SystemExit("expected exactly one permissive raw-bool parser")
          source = source.replace(old_error, new_error)

          old_test = '''    #[test]
    fn boolean_environment_values_are_canonicalized_and_invalid_values_fail() {
        for (input, expected) in [
            ("true", "true"),
            (" TRUE ", "true"),
            ("1", "true"),
            ("yes", "true"),
            ("ON", "true"),
            ("false", "false"),
            (" FALSE ", "false"),
            ("0", "false"),
            ("no", "false"),
            ("OFF", "false"),
        ] {
            assert_eq!(normalize_boolean_value(input), Some(expected));
        }
        for invalid in ["", "2", "maybe", "enabled"] {
            assert_eq!(normalize_boolean_value(invalid), None, "{invalid}");
        }
    }'''
          new_test = '''    #[test]
    fn boolean_environment_values_are_canonicalized_and_invalid_values_fail() {
        for (input, expected) in [("true", "true"), ("false", "false")] {
            assert_eq!(normalize_boolean_value(input), Some(expected));
        }
        for invalid in [
            "", " TRUE ", "1", "yes", "ON", " FALSE ", "0", "no", "OFF", " true",
            "false ", "maybe", "enabled",
        ] {
            assert_eq!(normalize_boolean_value(invalid), None, "{invalid:?}");
        }
    }

    #[test]
    fn raw_boolean_environment_matches_flags2env_typed_preflight() {
        use flags2env::env_map::{
            resolve_typed_bindings, EnvBindingSpec, EnvMap as FlagsEnvMap, EnvValueKind,
            ENV_PARSE,
        };

        let specs = [EnvBindingSpec::required("feature", "TEST_BOOL", EnvValueKind::Bool)];
        for value in ["true", "false"] {
            let env = FlagsEnvMap::from([("TEST_BOOL".to_string(), value.to_string())]);
            assert!(resolve_typed_bindings(&env, &specs).is_ok(), "{value:?}");
        }
        for value in ["TRUE", "False", "1", "0", "yes", "on", " true", "false "] {
            let env = FlagsEnvMap::from([("TEST_BOOL".to_string(), value.to_string())]);
            let errors = resolve_typed_bindings(&env, &specs).unwrap_err();
            assert_eq!(errors.len(), 1, "{value:?}");
            assert_eq!(errors[0].code, ENV_PARSE, "{value:?}");
        }
    }'''
          if source.count(old_test) != 1:
              raise SystemExit("expected exactly one raw-bool regression block")
          path.write_text(source.replace(old_test, new_test))
          PY

          cargo update -p flags2env
          git diff --check

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' Cargo.lock Cargo.toml src/flags.rs | sort)"
          test "$changed" = "$expected"

      - name: Focused validation
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --lib flags::tests::boolean_environment_values_are_canonicalized_and_invalid_values_fail
          cargo test --locked --lib flags::tests::raw_boolean_environment_matches_flags2env_typed_preflight
          cargo test --locked --lib flags::tests::explicit_cli_boolean_shadows_even_an_invalid_environment_value
          cargo test --locked --test startup_environment_contract
          cargo test --locked --test toml_contracts

      - name: Commit source repair without rewriting history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/flags.rs
          git diff --cached --check
          git commit -m "fix: enforce canonical raw boolean environment values"
          git push origin "HEAD:${GITHUB_REF_NAME}"
