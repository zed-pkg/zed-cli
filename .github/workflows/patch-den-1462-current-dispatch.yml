name: patch DEN-1462 current-main dispatcher compatibility

on:
  push:
    branches:
      - feat/den-1462-mise-export
    paths:
      - .github/workflows/patch-den-1462-current-dispatch.yml

permissions:
  contents: read

concurrency:
  group: patch-den-1462-current-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out reviewed source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-1462-mise-export
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Make the legacy dispatcher replacement optional
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_den1462_mise_export.py')
          text = path.read_text()
          old = 'text = replace_once(text, verify_arm, export_arm, "main export dispatch")\n'
          new = 'if verify_arm in text:\n    text = replace_once(text, verify_arm, export_arm, "main export dispatch")\n'
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'legacy dispatcher replacement: expected one anchor, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile \
            scripts/apply_den1462_mise_export.py \
            scripts/fix_den1462_bool_conflicts.py
          git diff --check

      - name: Commit ordinary source repair and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/patch-den-1462-current-dispatch.yml
          git add \
            scripts/apply_den1462_mise_export.py \
            .github/workflows/patch-den-1462-current-dispatch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-1462): defer current dispatcher composition'
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feat/den-1462-mise-export
