name: Polyglot consumer project shapes

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/fixtures/polyglot/**'
      - 'tests/polyglot-consumer-project-shapes-e2e.sh'
      - '.github/workflows/polyglot-consumer-project-shapes.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/fixtures/polyglot/**'
      - 'tests/polyglot-consumer-project-shapes-e2e.sh'
      - '.github/workflows/polyglot-consumer-project-shapes.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-shapes-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR candidate without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
      - name: Build Zed CLI
        run: cargo build --release --locked --bin zed
      - name: Check E2E harness syntax
        run: bash -n tests/polyglot-consumer-project-shapes-e2e.sh
      - name: Prove npm, Go, Cargo, Ruby, Python, Gleam, and Dart project shapes
        run: bash tests/polyglot-consumer-project-shapes-e2e.sh "$PWD/target/release/zed"
