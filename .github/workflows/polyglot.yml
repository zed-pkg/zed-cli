# Polyglot publish matrix.
#
# zed-pkg's interop promise (zed-docs doc 17) is that one repo at one version
# can be published to zpkg.tech *and* to every ecosystem's own registry, from
# the same `[targets.*]` declaration. That promise only holds if each language
# slice `zed pack` emits is simultaneously:
#
#   1. a valid zed package        -> publishes to zpkg.tech       (goal 3)
#   2. a valid NATIVE package     -> publishes to npm/PyPI/...    (goal 4)
#   3. isolated                   -> no other language's bytes    (goal 3)
#   4. free of dev/test files     -> the disk-space promise
#
# Nothing in the CLI checks (2) today: the native manifests are just files that
# ride along in the tarball. This workflow is that check — it hands each slice
# to the real native tool (`npm pack`, `python -m build`, `cargo package`,
# `gem build`, `go build`) and fails if the ecosystem rejects it.
name: polyglot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FIXTURE_VERSION: "0.2.0"

jobs:
  fanout:
    name: Fan out one repo into five language packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: 60a8ab55f8a55eb212a72dcb334c1c118047c7ef
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        with:
          make-default: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the zed CLI
        run: cargo build --locked --bin zed
        working-directory: zed-cli

      # The identity map: which native registry each target lands in, and
      # whether its native manifest agrees with `.zpkg.toml` on the version.
      # Two manifests describe one release; this is what stops them drifting.
      - name: Native manifest parity (fixture)
        run: python3 zed-cli/scripts/check-native-parity.py zed-cli/tests/fixtures/polyglot

      - name: Parity check catches version drift
        run: |
          set -euo pipefail
          cp -R zed-cli/tests/fixtures/polyglot "$RUNNER_TEMP/drift"
          sed -i 's/"version": "0.2.0"/"version": "9.9.9"/' "$RUNNER_TEMP/drift/node/package.json"
          if python3 zed-cli/scripts/check-native-parity.py "$RUNNER_TEMP/drift"; then
            echo "::error::parity check passed a repo whose package.json drifted to 9.9.9"
            exit 1
          fi
          echo "drift correctly rejected"

      - name: Pack the polyglot fixture
        run: |
          set -euo pipefail
          cp -R zed-cli/tests/fixtures/polyglot "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          "$GITHUB_WORKSPACE/zed-cli/target/debug/zed" pack

      - name: One repo produced exactly five language packages
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fixture/.zed/pack"
          ls -la
          count=$(ls -1 *.tar.gz | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::expected 5 artifacts, got $count"
            exit 1
          fi
          for target in nodejs python golang rust ruby; do
            artifact="zed-pkg-poly-fixture-${target}-${FIXTURE_VERSION}.tar.gz"
            if [ ! -f "$artifact" ]; then
              echo "::error::missing $artifact"
              exit 1
            fi
          done

      # The decisive property from doc 17: a Java consumer downloads Java bytes.
      # Each slice must contain its own language and nothing from the other four.
      - name: Each slice is isolated to its own language
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fixture/.zed/pack"

          # target | native manifest that must be present | extensions that must NOT appear
          check() {
            target="$1"; native="$2"; forbidden="$3"
            listing=$(tar tzf "zed-pkg-poly-fixture-${target}-${FIXTURE_VERSION}.tar.gz")
            echo "--- $target"
            echo "$listing" | sed 's/^/    /'

            if ! echo "$listing" | grep -qx "pkg/${native}"; then
              echo "::error::${target} slice has no ${native} at its root; the native toolchain will not recognize it"
              exit 1
            fi
            for ext in $forbidden; do
              if echo "$listing" | grep -q "${ext}\$"; then
                echo "::error::${target} slice leaked a ${ext} file from another language"
                exit 1
              fi
            done
            # Fan-out must not recurse: a slice is single-language by construction.
            if tar xzOf "zed-pkg-poly-fixture-${target}-${FIXTURE_VERSION}.tar.gz" pkg/.zpkg.toml | grep -q '^\[targets\.'; then
              echo "::error::${target} slice carries a [targets] block; fan-out recursed"
              exit 1
            fi
          }

          check nodejs package.json    ".py .go .rs .rb .gemspec"
          check python pyproject.toml  ".js .go .rs .rb .gemspec"
          check golang go.mod          ".js .py .rs .rb .gemspec"
          check rust   Cargo.toml      ".js .py .go .rb .gemspec"
          check ruby   zed-poly-fixture.gemspec ".js .py .go .rs"

      - name: Dev and test files are stripped from every slice
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fixture/.zed/pack"
          for artifact in *.tar.gz; do
            listing=$(tar tzf "$artifact")
            for leaked in index.test.js test_poly.py poly_test.go poly_spec.rb conftest.py; do
              if echo "$listing" | grep -q "$leaked"; then
                echo "::error::$artifact shipped the dev/test file $leaked"
                exit 1
              fi
            done
            # LICENSE is hoisted from the repo root into every slice: npm,
            # crates.io and RubyGems all surface it, and it is never stripped.
            if ! echo "$listing" | grep -qx "pkg/LICENSE"; then
              echo "::error::$artifact has no LICENSE"
              exit 1
            fi
          done

      # Goal 3 end to end: five independently installable packages on one
      # registry, from one commit at one version.
      - name: Publish all five to a file:// zed registry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/fixture"
          "$GITHUB_WORKSPACE/zed-cli/target/debug/zed" publish \
            --registry "file://$RUNNER_TEMP/registry" \
            --skip-vcs-checks

          for target in nodejs python golang rust ruby; do
            if [ ! -d "$RUNNER_TEMP/registry/packages/zed-pkg/poly-fixture-${target}" ]; then
              echo "::error::poly-fixture-${target} is not in the registry"
              exit 1
            fi
          done
          echo "five packages, one version, one commit:"
          ls -1 "$RUNNER_TEMP/registry/packages/zed-pkg"

      - name: Republish is idempotent for byte-identical targets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/fixture"
          output=$("$GITHUB_WORKSPACE/zed-cli/target/debug/zed" publish \
            --registry "file://$RUNNER_TEMP/registry" \
            --skip-vcs-checks 2>&1)
          echo "$output"
          skipped=$(echo "$output" | grep -c "already published" || true)
          if [ "$skipped" -ne 5 ]; then
            echo "::error::expected 5 targets to be skipped as byte-identical, got $skipped"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: polyglot-slices
          path: ${{ runner.temp }}/fixture/.zed/pack/*.tar.gz
          if-no-files-found: error

  native:
    name: ${{ matrix.target }} slice is publishable to ${{ matrix.registry }}
    needs: fanout
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: nodejs
            registry: npm
          - target: python
            registry: PyPI
          - target: golang
            registry: the Go module proxy
          - target: rust
            registry: crates.io
          - target: ruby
            registry: RubyGems
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: polyglot-slices
          path: slices

      # Every slice is re-rooted at the ecosystem's package root, so the native
      # tool runs against it exactly as it would against a hand-written repo.
      - name: Extract the ${{ matrix.target }} slice
        run: |
          set -euo pipefail
          mkdir -p slice
          tar xzf "slices/zed-pkg-poly-fixture-${{ matrix.target }}-${FIXTURE_VERSION}.tar.gz" \
            -C slice --strip-components=1
          find slice -type f | sort

      - uses: actions/setup-node@v4
        if: matrix.target == 'nodejs'
        with:
          node-version: 22
      - name: npm would accept this tarball
        if: matrix.target == 'nodejs'
        working-directory: slice
        run: |
          set -euo pipefail
          npm pack --dry-run
          node -e 'const {greet} = require("./index.js"); if (greet("zed") !== "hello, zed") process.exit(1)'

      - uses: actions/setup-python@v5
        if: matrix.target == 'python'
        with:
          python-version: "3.12"
      - name: PyPI would accept this distribution
        if: matrix.target == 'python'
        working-directory: slice
        run: |
          set -euo pipefail
          pip install --quiet build twine
          python -m build
          twine check dist/*
          python -c 'import sys; sys.path.insert(0, "."); from zed_poly import greet; assert greet("zed") == "hello, zed"'

      - uses: actions/setup-go@v5
        if: matrix.target == 'golang'
        with:
          go-version: "1.22"
      - name: The Go module proxy would resolve this module
        if: matrix.target == 'golang'
        working-directory: slice
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...
          # A module in a repo subdirectory is fetched by the tag `<subdir>/vX.Y.Z`.
          # The slice itself is re-rooted, so the module path must still name the
          # subdirectory it was published from or `go get` will not find it.
          grep -q '^module github.com/zed-pkg/poly-fixture/go$' go.mod

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'rust'
      - name: crates.io would accept this crate
        if: matrix.target == 'rust'
        working-directory: slice
        run: |
          set -euo pipefail
          cargo package --allow-dirty
          cargo test

      - uses: ruby/setup-ruby@v1
        if: matrix.target == 'ruby'
        with:
          ruby-version: "3.3"
      - name: RubyGems would accept this gem
        if: matrix.target == 'ruby'
        working-directory: slice
        run: |
          set -euo pipefail
          gem build zed-poly-fixture.gemspec
          gem specification zed-poly-fixture-${FIXTURE_VERSION}.gem name version files
          ruby -Ilib -e 'require "zed_poly"; abort unless ZedPoly.greet("zed") == "hello, zed"'

  # The same checks against the real polyglot repo, so a client-library change
  # that breaks native publishability is caught where it happens.
  real-repo:
    name: zed-clients native parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-clients
          path: zed-clients
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native manifest parity (zed-clients)
        run: python3 zed-cli/scripts/check-native-parity.py zed-clients
