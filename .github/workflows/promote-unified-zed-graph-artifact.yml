name: Promote certified unified Zed graph artifact

on:
  push:
    branches:
      - chore/repin-zed-clients-20260910
    paths:
      - .github/workflows/promote-unified-zed-graph-artifact.yml

permissions:
  actions: read
  contents: write

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARTIFACT_ID: "10275120816"
      CARGO_TOML_SHA256: e6cd71ba9299c143b47013bc5ea586fa070401102d35d55306d55963d16cf25b
      CARGO_LOCK_SHA256: a69722ad3193ce30960580f3cfe0796c2cc3931512c5abe93bf29905f13c1d26
      GRAPH_VALIDATOR_SHA256: 017402a03d9be377a6c8a70dd0b0e1b44d83285bef1ebea3db54e9c125d16665
      GRAPH_WORKFLOW_SHA256: 8c585492a8241c5509172e014b947c1136123d939e085b451e601794151a235b
    steps:
      - name: Check out exact promoter head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Download exact certified materialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/unified-zed-graph"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$RUNNER_TEMP/unified-zed-graph.zip"
          unzip -q "$RUNNER_TEMP/unified-zed-graph.zip" -d "$RUNNER_TEMP/unified-zed-graph"

      - name: Verify artifact hashes and materialize all tested paths
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/unified-zed-graph"
          test "$(sha256sum "$root/Cargo.toml" | awk '{print $1}')" = "$CARGO_TOML_SHA256"
          test "$(sha256sum "$root/Cargo.lock" | awk '{print $1}')" = "$CARGO_LOCK_SHA256"
          test "$(sha256sum "$root/scripts/validate-zed-package-graph.sh" | awk '{print $1}')" = "$GRAPH_VALIDATOR_SHA256"
          test "$(sha256sum "$root/.github/workflows/zed-package-graph.yml" | awk '{print $1}')" = "$GRAPH_WORKFLOW_SHA256"
          test "$(cat "$root/rust-toolchain.txt")" = '1.98.1'
          cp "$root/Cargo.toml" Cargo.toml
          cp "$root/Cargo.lock" Cargo.lock
          cp "$root/scripts/validate-zed-package-graph.sh" scripts/validate-zed-package-graph.sh
          cp "$root/.github/workflows/zed-package-graph.yml" .github/workflows/zed-package-graph.yml

      - name: Re-verify exact materialization under locked graph
        run: |
          set -euo pipefail
          cargo check --locked --all-targets
          python3 scripts/validate-cli-flags-toml.py
          bash scripts/validate-zed-package-graph.sh
          git diff --check
          actual="$(git status --porcelain | sed -E 's/^.. //' | sed '/^$/d' | sort)"
          expected=$'.github/workflows/zed-package-graph.yml\nCargo.lock\nCargo.toml\nscripts/validate-zed-package-graph.sh'
          test "$actual" = "$expected" || {
            printf 'unexpected materialized paths:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Commit only non-workflow graph authorities
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock scripts/validate-zed-package-graph.sh
          git commit -m 'fix: unify CLI Rust dependency authority graph'
          test "$(git diff --name-only)" = '.github/workflows/zed-package-graph.yml'
          git push origin HEAD:chore/repin-zed-clients-20260910
