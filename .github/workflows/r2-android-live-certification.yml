name: R2 Android binary live certification

on:
  pull_request:
    paths:
      - .github/workflows/r2-android-live-certification.yml
      - scripts/ci/r2_load_protected_credentials.sh
      - scripts/ci/r2_load_protected_credentials_test.sh
      - scripts/ci/r2_prepare_android_fixture.sh
      - scripts/ci/r2_mint_temporary_credentials.sh
      - scripts/ci/r2_android_roundtrip.sh
      - src/bin/zed-binary.rs
      - src/binary_archive/**
      - src/host_downloads.rs
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-android-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SERVER_REPOSITORY: zed-pkg/zed-api-server.rs
  SERVER_SHA: a483572594758196adf906119b46e594aa921622
  R2_BUCKET: zed-pkg-artifacts
  AWS_DEFAULT_REGION: auto
  AWS_REGION: auto
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  android-binary-preflight:
    if: github.event_name == 'pull_request'
    name: credential-free-android-binary-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed Android binary change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: android-binary-preflight

      - name: Validate scripts and build the reviewed binary packer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/r2_load_protected_credentials.sh
          bash scripts/ci/r2_load_protected_credentials_test.sh
          bash -n scripts/ci/r2_prepare_android_fixture.sh
          bash -n scripts/ci/r2_mint_temporary_credentials.sh
          bash -n scripts/ci/r2_android_roundtrip.sh
          cargo build --quiet --locked --bin zed-binary

      - name: Build and deterministically pack a real Android ARM64 ELF without credentials
        shell: bash
        run: bash scripts/ci/r2_prepare_android_fixture.sh

      - name: Retain credential-free Android preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-binary-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-android-preflight.json
            ${{ runner.temp }}/r2-android-preflight-second.json
            ${{ runner.temp }}/r2-android-file.txt
            ${{ runner.temp }}/r2-android-elf-header.txt
            ${{ runner.temp }}/r2-android-elf-program.txt
          if-no-files-found: error
          retention-days: 30

  real-r2-android-roundtrip:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: r2-release-publication
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_USER: zed
          POSTGRES_PASSWORD: zed
          POSTGRES_DB: zed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zed -d zed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the reviewed zed CLI change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the reviewed registry server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.SERVER_REPOSITORY }}
          ref: ${{ env.SERVER_SHA }}
          path: registry-server
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: real-r2-android-live
          workspaces: |
            .
            registry-server

      - name: Validate certification scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/r2_load_protected_credentials.sh
          bash -n scripts/ci/r2_prepare_android_fixture.sh
          bash -n scripts/ci/r2_mint_temporary_credentials.sh
          bash -n scripts/ci/r2_android_roundtrip.sh

      - name: Build reviewed code before acquiring any credential
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet --locked --bins
          cargo build --quiet --locked --manifest-path registry-server/Cargo.toml
          target/debug/zed --help >/dev/null
          target/debug/zed-binary --help >/dev/null
          registry-server/target/debug/zed-api-server --help >/dev/null
          registry-server/target/debug/zed-api-server --version \
            | grep -Eq '^zed-api-server [0-9]+\.[0-9]+\.[0-9]+'

      - name: Build and deterministically pack a real Android ARM64 ELF
        shell: bash
        run: bash scripts/ci/r2_prepare_android_fixture.sh

      - name: Load credentials from the protected publication environment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SECRET_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_PARENT_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: bash scripts/ci/r2_load_protected_credentials.sh

      - name: Mint a one-hour exact-object R2 credential
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash scripts/ci/r2_mint_temporary_credentials.sh

      - name: Publish, download, and verify through actual Cloudflare R2
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DATABASE_URL: postgres://zed:zed@127.0.0.1:5432/zed
        run: bash scripts/ci/r2_android_roundtrip.sh

      - name: Clear all delegated material before artifact upload
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/r2-parent-delegation.json" \
            "$RUNNER_TEMP/r2-temp-request.json" \
            "$RUNNER_TEMP/r2-temp-response.json" \
            "$RUNNER_TEMP/r2-token-verify.json" \
            "$RUNNER_TEMP/r2-bucket-list.json" \
            "$RUNNER_TEMP/r2-bucket-create.json"
          printf 'AWS_ACCESS_KEY_ID=\nAWS_SECRET_ACCESS_KEY=\nAWS_SESSION_TOKEN=\nZED_PKG_TOKEN=\n' \
            >>"$GITHUB_ENV"

      - name: Retain credential-free certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-r2-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-android-preflight.json
            ${{ runner.temp }}/r2-android-preflight-second.json
            ${{ runner.temp }}/r2-android-file.txt
            ${{ runner.temp }}/r2-android-elf-header.txt
            ${{ runner.temp }}/r2-android-elf-program.txt
            ${{ runner.temp }}/r2-delegation.json
            ${{ runner.temp }}/r2-android-publish.json
            ${{ runner.temp }}/r2-android-head.json
            ${{ runner.temp }}/r2-android-get.json
            ${{ runner.temp }}/r2-android-download.json
            ${{ runner.temp }}/r2-android-downloaded-file.txt
            ${{ runner.temp }}/r2-android-downloaded-elf-header.txt
            ${{ runner.temp }}/r2-android-downloaded-elf-program.txt
            ${{ runner.temp }}/r2-android-certification.json
            ${{ runner.temp }}/zed-api-r2-android-redacted.log
          if-no-files-found: warn
          retention-days: 30
