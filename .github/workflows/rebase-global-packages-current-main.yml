name: Refresh global packages onto current main

on:
  push:
    branches:
      - agent/global-zed-packages

permissions:
  contents: write

concurrency:
  group: refresh-global-packages-current-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Merge current main and preserve the semantic union
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 && $merge_status -ne 1 ]]; then
            exit "$merge_status"
          fi

          # Current main owns the modern dispatcher, cli_model, environment,
          # Nix, fetch, managed-install, and Git-submodule composition. Start
          # from those exact files, then add the independent global surface.
          git checkout --theirs -- src/lib.rs src/main.rs src/completion.rs

          python3 - <<'PY'
          from pathlib import Path

          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = 'pub mod git_submodules;\n'
          if 'pub mod global;\n' not in text:
              if needle not in text:
                  raise SystemExit('lib.rs insertion point not found')
              text = text.replace(needle, needle + 'pub mod global;\n', 1)
          lib.write_text(text)

          main = Path('src/main.rs')
          text = main.read_text()
          use_needle = 'use zed_cli::git_submodules as submodules;\n'
          if 'use zed_cli::global;\n' not in text:
              if use_needle not in text:
                  raise SystemExit('main.rs import insertion point not found')
              text = text.replace(use_needle, use_needle + 'use zed_cli::global;\n', 1)

          dispatch_needle = '''    if let Err(error) = zed_cli::flags::normalize_global_boolean_environment(&args) {
              eprintln!("error: {error:#}");
              std::process::exit(2);
          }
          '''
          dispatch = '''    if let Err(error) = zed_cli::flags::normalize_global_boolean_environment(&args) {
              eprintln!("error: {error:#}");
              std::process::exit(2);
          }
          if let Some(result) = global::dispatch(args.clone()) {
              match result {
                  Ok(0) => return,
                  Ok(code) => std::process::exit(code),
                  Err(error) => {
                      eprintln!("error: {error:#}");
                      std::process::exit(1);
                  }
              }
          }
          '''
          if 'global::dispatch(args.clone())' not in text:
              if dispatch_needle not in text:
                  raise SystemExit('main.rs dispatch insertion point not found')
              text = text.replace(dispatch_needle, dispatch, 1)
          main.write_text(text)

          completion = Path('src/completion.rs')
          text = completion.read_text()
          old_import = 'use crate::{dev, fetch, git_submodules, nix_export_plan};\n'
          new_import = 'use crate::{dev, fetch, git_submodules, global, nix_export_plan};\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('completion.rs import insertion point not found')

          old_fn = '''fn root_command() -> clap::Command {
              git_submodules::augment_root_command(nix_export_plan::augment_root_command(
                  fetch::augment_root_command(dev::augment_root_command(cli_model::command())),
              ))
          }
          '''
          new_fn = '''pub(crate) fn root_command() -> clap::Command {
              global::augment_root_command(git_submodules::augment_root_command(
                  nix_export_plan::augment_root_command(fetch::augment_root_command(
                      dev::augment_root_command(cli_model::command()),
                  )),
              ))
          }
          '''
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif 'global::augment_root_command' not in text:
              raise SystemExit('completion.rs command composition not found')

          for command in ['"global",', '"bin-dir",']:
              if command not in text:
                  marker = '            "overtake",\n'
                  if marker not in text:
                      raise SystemExit('completion command test insertion point not found')
                  text = text.replace(marker, marker + f'            {command}\n', 1)
          if '"--global-bin-dir",' not in text:
              marker = '            "--install-mode",\n'
              if marker not in text:
                  raise SystemExit('completion option test insertion point not found')
              text = text.replace(marker, marker + '            "--global-bin-dir",\n', 1)
          completion.write_text(text)

          global_rs = Path('src/global.rs')
          text = global_rs.read_text()
          text = text.replace(
              'use clap::{Args, CommandFactory, Parser, Subcommand};',
              'use clap::{Args, Parser, Subcommand};',
          )
          text = text.replace(
              'use crate::{dev, interactive, manifestless};',
              'use crate::{interactive, manifestless};',
          )
          old = '''fn print_root_help() -> Result<()> {
              let mut command = dev::augment_root_command(augment_root_command(crate::cli::Cli::command()));
              command.print_help().context("printing zed help")?;
              println!();
              Ok(())
          }
          '''
          new = '''fn print_root_help() -> Result<()> {
              let mut command = crate::completion::root_command();
              command.print_help().context("printing zed help")?;
              println!();
              Ok(())
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'crate::completion::root_command()' not in text:
              raise SystemExit('global.rs root help integration point not found')
          global_rs.write_text(text)
          PY

          # The workflow is a one-shot semantic merge helper, not product code.
          rm -f .github/workflows/rebase-global-packages-current-main.yml

          cargo fmt --all
          cargo test --locked --test global_cli
          cargo test --locked global::tests
          cargo test --locked completion::tests
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked

          git add -A
          if git diff --cached --quiet; then
            echo 'No refresh commit required.'
            exit 0
          fi
          git commit -m 'Merge current main into global package profiles'
          git push origin HEAD:agent/global-zed-packages
