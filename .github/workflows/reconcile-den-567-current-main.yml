name: Reconcile DEN-567 current main

on:
  push:
    branches:
      - fix/DEN-567-secret-argv-boundary
    paths:
      - .github/workflows/reconcile-den-567-current-main.yml

permissions:
  contents: write

concurrency:
  group: reconcile-den-567-current-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact security branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify reviewed inputs
        shell: bash
        env:
          EXPECTED_MAIN: c2606c87c8b077dde39d2303bc787077ceb2c9fd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Merge main and resolve only the reviewed overlap
        shell: bash
        env:
          EXPECTED_MAIN: c2606c87c8b077dde39d2303bc787077ceb2c9fd
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            actual="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' src/cli_model.rs src/main.rs | sort)"
            printf 'conflicts:\n%s\n' "$actual"
            test "$actual" = "$expected"

            # Keep the newer Shared Auth/startup implementation from main,
            # then reapply only DEN-567's reviewed secret-argv changes.
            git checkout --theirs -- src/cli_model.rs src/main.rs

            python3 - <<'PY'
          from pathlib import Path

          cli_model = Path("src/cli_model.rs")
          text = cli_model.read_text()
          old = '''    #[test]\n    fn a_global_option_value_named_inspect_is_not_early_dispatched() {\n        let args = vec![\n            OsString::from("zed"),\n            OsString::from("--token"),\n            OsString::from("inspect"),\n            OsString::from("--help"),\n        ];\n        assert!(crate::inspect::dispatch(&args).is_none());\n    }\n\n    #[test]\n    fn only_legacy_cli_spellings_trigger_a_deprecation_marker() {\n'''
          new = '''    #[test]\n    fn a_global_option_value_named_inspect_is_not_early_dispatched() {\n        let args = vec![\n            OsString::from("zed"),\n            OsString::from("--registry"),\n            OsString::from("inspect"),\n            OsString::from("--help"),\n        ];\n        assert!(crate::inspect::dispatch(&args).is_none());\n    }\n\n    #[test]\n    fn bearer_token_is_not_a_public_cli_option() {\n        assert!(\n            command()\n                .get_arguments()\n                .all(|arg| arg.get_long() != Some("token")),\n            "ZED_PKG_TOKEN must remain an env/session secret, not an argv option"\n        );\n        assert!(\n            command()\n                .try_get_matches_from(["zed", "--token", "secret", "find", "pkg"])\n                .is_err(),\n            "--token must be rejected by the typed public command model"\n        );\n    }\n\n    #[test]\n    fn only_legacy_cli_spellings_trigger_a_deprecation_marker() {\n'''
          assert text.count(old) == 1, "unexpected cli_model token-test context"
          text = text.replace(old, new, 1)
          assert text.count("mod shared_auth_policy;") == 1
          assert "shared_auth_policy::admit_embedded()" in text
          cli_model.write_text(text)

          main = Path("src/main.rs")
          text = main.read_text()
          old = '        "--home",\n        "--token",\n        "--auth-url",'
          new = '        "--home",\n        "--auth-url",'
          assert text.count(old) == 1, "unexpected root global option context"
          text = text.replace(old, new, 1)
          assert text.count("oci_command::dispatch(args.clone())") == 1
          main.write_text(text)
          PY

            git add src/cli_model.rs src/main.rs
          fi

          # Remove two unrelated stale documentation deltas from the old branch.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/cli.rs")
          text = path.read_text()
          weak_oci = '/// OCI runtime used by `zed r2g`.\n'
          precise_oci = '/// OCI runtime used by `zed r2g --docker` to roundtrip-test the package\n/// inside a throwaway container. Auto-detected when unset.\n'
          if weak_oci in text:
              assert text.count(weak_oci) == 1
              text = text.replace(weak_oci, precise_oci, 1)
          weak_task = '        /// Emit stable machine-readable task output.\n'
          precise_task = '        /// Emit stable machine-readable JSON. Live command execution requires human streaming output.\n'
          if weak_task in text:
              assert text.count(weak_task) == 1
              text = text.replace(weak_task, precise_task, 1)
          assert '#[arg(skip = std::env::var("ZED_PKG_TOKEN").ok())]' in text
          path.write_text(text)
          PY
          git add src/cli.rs

          # Semantic preservation checks across both sides of the merge.
          grep -Fq 'mod shared_auth_policy;' src/cli_model.rs
          grep -Fq 'shared_auth_policy::admit_embedded()' src/cli_model.rs
          test "$(grep -Fc 'oci_command::dispatch(args.clone())' src/main.rs)" = 1
          ! grep -Fq '        "--token",' src/main.rs
          grep -Fq '#[arg(skip = std::env::var("ZED_PKG_TOKEN").ok())]' src/cli.rs
          test -f tests/secret_argv_boundary.rs
          test -f tests/startup_dispatch_boundary.rs
          test -f tests/zpkg_self_validate.rs
          git diff --check

      - name: Run focused semantic regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --test secret_argv_boundary
          cargo test --locked bearer_token_is_not_a_public_cli_option
          cargo test --locked --test startup_dispatch_boundary
          cargo test --locked --test zpkg_self_validate

      - name: Commit normal merge and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -f .git/MERGE_HEAD
          git commit -m 'merge(DEN-567): reconcile secret argv hardening with Shared Auth main'
          git push origin "HEAD:${GITHUB_REF_NAME}"
