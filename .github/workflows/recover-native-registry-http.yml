# Registered recovery trigger; preserve and diagnose the exact replay candidate, then remove after the clean successor branch is published.
name: Recover native registry HTTP feature

on:
  push:
    branches:
      - recovery/native-registry-http-main
    paths:
      - .github/workflows/recover-native-registry-http.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: recover-native-registry-http
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Replay only the eight reviewed feature commits
        shell: bash
        run: |
          set -euo pipefail
          readonly FEATURE_BASE=c17d4ef262006f99f61e86d5fba538bc2294d5a1
          readonly FEATURE_HEAD=075e930a033b9d56af4ab4eb2e58e31ca1dfe640
          git cat-file -e "${FEATURE_BASE}^{commit}"
          git cat-file -e "${FEATURE_HEAD}^{commit}"
          git checkout -B recovery/native-registry-http-clean origin/main
          mapfile -t commits < <(git rev-list --reverse "${FEATURE_BASE}..${FEATURE_HEAD}")
          printf 'reviewed feature commits (%s):\n' "${#commits[@]}"
          printf '  %s\n' "${commits[@]}"
          if [[ "${#commits[@]}" -ne 8 ]]; then
            echo "expected exactly 8 reviewed feature commits" >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            cherry-pick -X ours "${commits[@]}"

      - name: Enforce the product-only path and feature boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-paths
          cat > /tmp/allowed-paths <<'EOF'
          .cli-flags.toml
          Cargo.lock
          Cargo.toml
          README.md
          src/cli.rs
          src/lib.rs
          src/main.rs
          src/native_host_client.rs
          src/preflight.rs
          src/release.rs
          tests/native_registry_adversarial.rs
          EOF
          cat > /tmp/required-paths <<'EOF'
          .cli-flags.toml
          README.md
          src/cli.rs
          src/lib.rs
          src/main.rs
          src/native_host_client.rs
          src/preflight.rs
          src/release.rs
          tests/native_registry_adversarial.rs
          EOF
          sort -o /tmp/allowed-paths /tmp/allowed-paths
          sort -o /tmp/required-paths /tmp/required-paths
          unexpected="$(comm -23 /tmp/actual-paths /tmp/allowed-paths)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected recovery paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          missing="$(comm -23 /tmp/required-paths /tmp/actual-paths)"
          if [[ -n "$missing" ]]; then
            printf 'missing required feature paths:\n%s\n' "$missing" >&2
            exit 1
          fi
          ! git diff --name-only origin/main...HEAD | grep -E '(^|/)(den-564|materialize-manifestless|harden-manifestless|prepare-manifestless)'
          git diff --check origin/main...HEAD
          if git diff --unified=0 origin/main...HEAD | grep -E '^\+(<<<<<<<|=======|>>>>>>>)'; then
            echo 'new conflict marker detected' >&2
            exit 1
          fi
          test -f src/native_host_client.rs
          test -f tests/native_registry_adversarial.rs
          grep -Fq 'pub mod native_host_client;' src/lib.rs
          grep -Fq 'ReleaseCmd::Publish' src/main.rs
          grep -Fq 'ReleaseCmd::Versions' src/main.rs
          grep -Fq 'ZED_PKG_RELEASE_CHANNEL' .cli-flags.toml
          grep -Fq 'pub fn publish(' src/release.rs
          grep -Fq 'pub fn versions(' src/release.rs

      - name: Preserve exact replay candidate before validation
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/recovery/native-registry-http-candidate

      - name: Capture compiler diagnostics
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          cargo fmt --all
          cargo check --all-targets > /tmp/native-registry-cargo-check.log 2>&1
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          tail -n 240 /tmp/native-registry-cargo-check.log
          exit 0

      - name: Post bounded compiler diagnostics to the successor PR
        if: steps.compile.outputs.status != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            printf '### Recovery compiler diagnostics\n\n'
            printf 'Exact replay candidate: `%s`\n\n' "$(git rev-parse HEAD)"
            printf '```text\n'
            tail -n 220 /tmp/native-registry-cargo-check.log
            printf '\n```\n'
          } > /tmp/native-registry-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/261/comments" \
            -F body=@/tmp/native-registry-comment.md
          exit 1

      - name: Run full Rust validation
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo test --doc
          cargo clippy --all-targets -- -D warnings
          git diff --check

      - name: Record formatter output if needed
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'style: format native registry recovery'
          fi

      - name: Push the clean successor branch
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/recovery/native-registry-http-clean
