name: Refresh graph authority fixtures

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'salvage/DEN-390-graph-repin-current-main-20260911'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact triggering head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Derive admitted graph authorities
        id: graph
        shell: bash
        run: |
          set -euo pipefail
          client="$(sed -n 's/^zed-client = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)"
          interfaces="$(sed -n 's/^zed-interfaces = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)"
          test "${#client}" -eq 40
          test "${#interfaces}" -eq 40
          grep -Fq "$client" Cargo.lock
          grep -Fq "$interfaces" Cargo.lock
          printf 'client=%s\ninterfaces=%s\n' "$client" "$interfaces" >> "$GITHUB_OUTPUT"

      - name: Refresh stale evidence constants only
        env:
          ZED_CLIENT_SHA: ${{ steps.graph.outputs.client }}
          ZED_INTERFACES_SHA: ${{ steps.graph.outputs.interfaces }}
        shell: bash
        run: |
          set -euo pipefail
          stale_client='b32e089caea772f166204fb1c7bcaad6f56942fe'
          stale_interfaces='3c54298fc7a8c1b2f9c1d74f588c6118b38f197e'
          for path in tests/shared_client_ownership.rs tests/validate_cli.rs schemas/zed-interfaces/README.md; do
            sed -i "s/${stale_client}/${ZED_CLIENT_SHA}/g; s/${stale_interfaces}/${ZED_INTERFACES_SHA}/g" "$path"
          done
          ! grep -R -F "$stale_client" -- tests/shared_client_ownership.rs tests/validate_cli.rs schemas/zed-interfaces/README.md
          ! grep -R -F "$stale_interfaces" -- tests/shared_client_ownership.rs tests/validate_cli.rs schemas/zed-interfaces/README.md
          grep -Fq "$ZED_CLIENT_SHA" tests/shared_client_ownership.rs
          grep -Fq "$ZED_INTERFACES_SHA" tests/shared_client_ownership.rs
          grep -Fq "$ZED_INTERFACES_SHA" tests/validate_cli.rs
          grep -Fq "$ZED_INTERFACES_SHA" schemas/zed-interfaces/README.md

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Prove refreshed ownership evidence
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --test shared_client_ownership
          cargo test --locked --test validate_cli
          cargo test --locked validation::tests::checked_in_schemas_are_pinned_to_the_dependency_revision

      - name: Admit only the intended evidence paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            case "$path" in
              tests/shared_client_ownership.rs|tests/validate_cli.rs|schemas/zed-interfaces/README.md) ;;
              *) echo "unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit admitted fixture refresh
        env:
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/shared_client_ownership.rs tests/validate_cli.rs schemas/zed-interfaces/README.md
          git commit -m 'test: align graph authority evidence with admitted pins'
          git push origin "HEAD:${BRANCH}"
