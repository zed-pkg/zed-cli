name: Refresh unified Zed graph candidate

on:
  push:
    branches:
      - chore/repin-zed-clients-20260910
    paths:
      - .github/workflows/refresh-unified-zed-graph-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch and rewrite only admitted graph authorities
        shell: python
        run: |
          import pathlib
          import subprocess

          expected_branch = "chore/repin-zed-clients-20260910"
          actual = subprocess.check_output(["git", "branch", "--show-current"], text=True).strip()
          assert actual == expected_branch, (actual, expected_branch)

          replacements = {
              "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c",
              "eac0878750332b031bc12f6040b6a795a17e7417": "4509f19e1d3242226f28f842f550085864582380",
              "e53dca82e6c9d946a650bf453f48df0072221e10": "dd025059d8fb6e134c45cb21a394349ea25e7bb1",
              "b32e089caea772f166204fb1c7bcaad6f56942fe": "dd025059d8fb6e134c45cb21a394349ea25e7bb1",
          }
          paths = [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("scripts/validate-zed-package-graph.sh"),
              pathlib.Path(".github/workflows/zed-package-graph.yml"),
          ]
          for path in paths:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.name == "validate-zed-package-graph.sh" and "multiple Git source identities" not in text:
                  needle = 'errors: list[str] = []\n'
                  guard = '''errors: list[str] = []\n\n# Public Rust model/behavior crates are nominal authorities. A lockfile that\n# resolves more than one Git source identity for either crate can compile deep\n# into the graph and then fail with misleading E0308 mismatched-type errors.\nlock_doc = tomllib.loads(cargo_lock)\nfor public_crate in ("zed-interfaces", "zed-lib"):\n    sources = {\n        package.get("source")\n        for package in lock_doc.get("package", [])\n        if package.get("name") == public_crate and package.get("source")\n    }\n    if len(sources) != 1:\n        errors.append(\n            f"Cargo.lock must resolve exactly one {public_crate} Git source identity; got {sorted(sources)}"\n        )\n'''
                  assert needle in text
                  text = text.replace(needle, guard, 1)
              if path == pathlib.Path("Cargo.toml"):
                  text = text.replace(
                      "# Advance to the current admitted clients main. b32e089.. -> e53dca8.. changes\n# only client dependency manifests/locks and contract-admission workflows; no\n# SDK source files change across that producer range.\n",
                      "# Candidate graph admission: pair the exact client head with the same\n# zed-interfaces and zed-lib authorities used by that client. Final promotion\n# repins this edge to the immutable merged client revision after #70 lands.\n",
                  )
              if text == original:
                  raise SystemExit(f"expected graph rewrite made no change to {path}")
              path.write_text(text)

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0

      - name: Let Cargo resolve and verify the unified graph
        run: |
          set -euo pipefail
          cargo check --all-targets
          python3 scripts/validate-cli-flags-toml.py
          bash scripts/validate-zed-package-graph.sh

      - name: Fail closed on unexpected generated changes
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          allowed=$'.github/workflows/zed-package-graph.yml\nCargo.lock\nCargo.toml\nscripts/validate-zed-package-graph.sh'
          actual="$(printf '%s\n' "${changed[@]}" | sed '/^$/d')"
          test "$actual" = "$allowed"

      - name: Commit generated graph candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock scripts/validate-zed-package-graph.sh .github/workflows/zed-package-graph.yml
          git commit -m "fix: unify CLI Rust dependency authority graph"
          git push origin HEAD:chore/repin-zed-clients-20260910
