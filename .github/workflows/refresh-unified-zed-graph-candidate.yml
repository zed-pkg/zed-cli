name: Materialize unified Zed graph candidate

on:
  push:
    branches:
      - chore/repin-zed-clients-20260910
    paths:
      - .github/workflows/refresh-unified-zed-graph-candidate.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact checkout and materialize admitted graph authorities
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          expected_branch = "chore/repin-zed-clients-20260910"
          expected_sha = os.environ["GITHUB_SHA"]
          actual_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)
          assert os.environ.get("GITHUB_REF_NAME") == expected_branch

          replacements = {
              "3c54298fc7a8c1b2f9c1d74f588c6118b38f197e": "0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c",
              "eac0878750332b031bc12f6040b6a795a17e7417": "4509f19e1d3242226f28f842f550085864582380",
              "e53dca82e6c9d946a650bf453f48df0072221e10": "6a046b0a5e262c0c6a23851b810d7fe7eda251c4",
              "dd025059d8fb6e134c45cb21a394349ea25e7bb1": "6a046b0a5e262c0c6a23851b810d7fe7eda251c4",
              "b32e089caea772f166204fb1c7bcaad6f56942fe": "6a046b0a5e262c0c6a23851b810d7fe7eda251c4",
          }
          paths = [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("scripts/validate-zed-package-graph.sh"),
              pathlib.Path(".github/workflows/zed-package-graph.yml"),
          ]
          for path in paths:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.name == "validate-zed-package-graph.sh" and "multiple Git source identities" not in text:
                  needle = 'errors: list[str] = []\n'
                  guard = '''errors: list[str] = []\n\n# Public Rust model/behavior crates are nominal authorities. A lockfile that\n# resolves more than one Git source identity for either crate can compile deep\n# into the graph and then fail with misleading E0308 mismatched-type errors.\nlock_doc = tomllib.loads(cargo_lock)\nfor public_crate in ("zed-interfaces", "zed-lib"):\n    sources = {\n        package.get("source")\n        for package in lock_doc.get("package", [])\n        if package.get("name") == public_crate and package.get("source")\n    }\n    if len(sources) != 1:\n        errors.append(\n            f"Cargo.lock must resolve exactly one {public_crate} Git source identity; got {sorted(sources)}"\n        )\n'''
                  assert needle in text
                  text = text.replace(needle, guard, 1)
              if path == pathlib.Path("Cargo.toml"):
                  text = text.replace(
                      "# Advance to the current admitted clients main. b32e089.. -> e53dca8.. changes\n# only client dependency manifests/locks and contract-admission workflows; no\n# SDK source files change across that producer range.\n",
                      "# Unified graph admission: the merged client, direct interfaces crate,\n# and direct behavior crate all resolve through one immutable Rust type authority.\n",
                  )
              if text == original:
                  raise SystemExit(f"expected graph rewrite made no change to {path}")
              path.write_text(text)

          toolchain = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          pathlib.Path(os.environ["RUNNER_TEMP"], "expected-rust-toolchain").write_text(toolchain + "\n")

      - name: Install and verify repository-declared Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(cat "$RUNNER_TEMP/expected-rust-toolchain")"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          actual="$(rustc --version | awk '{print $2}')"
          test "$actual" = "$toolchain" || {
            printf 'rustc mismatch: expected %s, got %s\n' "$toolchain" "$actual" >&2
            exit 1
          }

      - name: Resolve and verify unified graph
        run: |
          set -euo pipefail
          cargo check --all-targets
          python3 scripts/validate-cli-flags-toml.py
          bash scripts/validate-zed-package-graph.sh
          git diff --check

      - name: Fail closed on unexpected materialized paths
        run: |
          set -euo pipefail
          actual="$(git status --porcelain | sed -E 's/^.. //' | sed '/^$/d' | sort)"
          expected=$'.github/workflows/zed-package-graph.yml\nCargo.lock\nCargo.toml\nscripts/validate-zed-package-graph.sh'
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Stage tested graph as evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/unified-zed-graph"
          mkdir -p "$evidence/.github/workflows" "$evidence/scripts"
          cp Cargo.toml "$evidence/Cargo.toml"
          cp Cargo.lock "$evidence/Cargo.lock"
          cp scripts/validate-zed-package-graph.sh "$evidence/scripts/validate-zed-package-graph.sh"
          cp .github/workflows/zed-package-graph.yml "$evidence/.github/workflows/zed-package-graph.yml"
          git diff --binary -- Cargo.toml Cargo.lock scripts/validate-zed-package-graph.sh .github/workflows/zed-package-graph.yml > "$evidence/tested.patch"
          sha256sum Cargo.toml Cargo.lock scripts/validate-zed-package-graph.sh .github/workflows/zed-package-graph.yml > "$evidence/SHA256SUMS"
          cp "$RUNNER_TEMP/expected-rust-toolchain" "$evidence/rust-toolchain.txt"

      - name: Upload tested graph materialization
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-zed-graph-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unified-zed-graph
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
