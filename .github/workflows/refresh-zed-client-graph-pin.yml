name: Refresh zed-client graph guard

on:
  push:
    branches:
      - chore/repin-zed-clients-20260910
    paths:
      - Cargo.toml
      - Cargo.lock
      - scripts/validate-zed-package-graph.sh
      - .github/workflows/refresh-zed-client-graph-pin.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: chore/repin-zed-clients-20260910
      - name: Align graph guard with reviewed Cargo pin
        shell: bash
        env:
          OLD_REV: b32e089caea772f166204fb1c7bcaad6f56942fe
          NEW_REV: e53dca82e6c9d946a650bf453f48df0072221e10
        run: |
          set -euo pipefail
          grep -Fq "rev = \"$NEW_REV\"" Cargo.toml
          grep -Fq "$NEW_REV" Cargo.lock
          if grep -Fq "$OLD_REV" scripts/validate-zed-package-graph.sh; then
            sed -i "s/$OLD_REV/$NEW_REV/g" scripts/validate-zed-package-graph.sh
          fi
          grep -Fq "$NEW_REV" scripts/validate-zed-package-graph.sh
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'graph guard already aligned'
            exit 0
          fi
          test "$changed" = 'scripts/validate-zed-package-graph.sh'
      - name: Commit graph guard only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/validate-zed-package-graph.sh; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-zed-package-graph.sh
          git commit -m 'chore: align zed-client graph guard with Cargo pin'
          git push origin HEAD:chore/repin-zed-clients-20260910
