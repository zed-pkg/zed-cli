name: release plan browser report

on:
  pull_request:
    paths:
      - ".github/workflows/release-plan-browser.yml"
      - "scripts/render-release-plan-html.mjs"
      - "scripts/release-plan-integrity.mjs"
      - "tests/release_plan_report_test.mjs"
      - "tests/release_plan_accessibility_test.mjs"
      - "tests/release_plan_integrity_test.mjs"
      - "tests/browser/test_release_plan_report.py"
      - "tests/browser/test_release_plan_cross_browser.py"
      - "tests/browser/test_release_plan_integrity.py"
      - "tests/fixtures/release-report/**"
      - "docs/release-plan-report.md"
      - "src/release.rs"
      - "src/main.rs"
      - "src/cli.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-plan-browser.yml"
      - "scripts/render-release-plan-html.mjs"
      - "scripts/release-plan-integrity.mjs"
      - "tests/release_plan_report_test.mjs"
      - "tests/release_plan_accessibility_test.mjs"
      - "tests/release_plan_integrity_test.mjs"
      - "tests/browser/test_release_plan_report.py"
      - "tests/browser/test_release_plan_cross_browser.py"
      - "tests/browser/test_release_plan_integrity.py"
      - "tests/fixtures/release-report/**"
      - "docs/release-plan-report.md"
      - "src/release.rs"
      - "src/main.rs"
      - "src/cli.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plan-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity-portability:
    name: Integrity writer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Test canonical hashing and atomic publication
        run: node --test tests/release_plan_integrity_test.mjs

  browser:
    name: Generate and review in ${{ matrix.browser }}
    needs: integrity-portability
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: zed-cli
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 15577e17a820c3b2b1a39ee178d4645185309a05
          path: zed-interfaces
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Test renderer accessibility and integrity boundaries
        working-directory: zed-cli
        run: >-
          node --test
          tests/release_plan_report_test.mjs
          tests/release_plan_accessibility_test.mjs
          tests/release_plan_integrity_test.mjs

      - name: Build the locked Rust CLI
        working-directory: zed-cli
        run: cargo build --locked

      - name: Generate the authoritative release plan JSON
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd tests/fixtures/release-report
            ../../../target/debug/zed release plan --json > ../../../build/release-plan.json
          )
          test -s build/release-plan.json

      - name: Render the self-contained HTML report
        working-directory: zed-cli
        run: >-
          node scripts/render-release-plan-html.mjs
          --input build/release-plan.json
          --output build/release-plan.html

      - name: Bind and verify release-report integrity
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-plan-integrity.mjs bind \
            --plan build/release-plan.json \
            --report build/release-plan.html \
            --integrity build/release-plan.integrity.json
          node scripts/release-plan-integrity.mjs verify \
            --plan build/release-plan.json \
            --report build/release-plan.html \
            --integrity build/release-plan.integrity.json

      - name: Install pinned Playwright ${{ matrix.browser }}
        working-directory: zed-cli
        run: |
          set -euo pipefail
          python -m venv .venv-release-browser
          .venv-release-browser/bin/python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.55.0
          .venv-release-browser/bin/python -m playwright install --with-deps "${{ matrix.browser }}"

      - name: Exercise accessibility print and no-JavaScript contracts
        working-directory: zed-cli
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: .venv-release-browser/bin/python tests/browser/test_release_plan_cross_browser.py

      - name: Exercise integrity provenance in the browser
        working-directory: zed-cli
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: .venv-release-browser/bin/python tests/browser/test_release_plan_integrity.py

      - name: Upload the reviewed release-plan artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-release-plan-report-${{ matrix.browser }}
          path: |
            zed-cli/build/release-plan.json
            zed-cli/build/release-plan.html
            zed-cli/build/release-plan.integrity.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload ${{ matrix.browser }} browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-release-plan-${{ matrix.browser }}-diagnostics
          path: zed-cli/build/release-plan-browser-results
          if-no-files-found: ignore
          retention-days: 7
