# Cross-platform release builds (zed-docs issue #9). Pushing a `release/**`
# branch publishes retained release-candidate artifacts for review. Cutting a
# `v*` tag builds the same target set and then uploads the archives and
# checksums to the GitHub Release.
name: release

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/dev.rs
      - src/ops.rs
      - .github/workflows/release.yml
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact clean source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Install reviewed Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'

      - name: Prove Zed replaces an unreachable Cargo Git source offline
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked cargo_adapter_resolves_git_dependency_offline_from_zed_patch
          cargo test --locked rust_cargo_config_patches_matching_git_source_to_zed_path
          cargo test --locked rust_cargo_config_patches_workspace_git_dependency

  build:
    needs: preflight
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: zed-cli
          persist-credentials: false
      - name: Verify exact release candidate revision
        working-directory: zed-cli
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          # Match rust-toolchain.toml so release artifacts use the reviewed compiler.
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - name: Install pinned cross compiler driver
        if: contains(matrix.target, 'linux')
        run: cargo install cross --locked --version 0.2.5
      - name: Build locked release binaries
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cross build --locked --release --bins --target "${{ matrix.target }}"
          else
            cargo build --locked --release --bins --target "${{ matrix.target }}"
          fi
      - name: Package binaries and checksum
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          bins=(zed zed-binary)
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bins=(zed.exe zed-binary.exe)
          fi
          dir="target/${{ matrix.target }}/release"
          name="zed-${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            (cd "$dir" && 7z a "$OLDPWD/dist/$name.zip" "${bins[@]}")
            archive="$name.zip"
          else
            tar -C "$dir" -czf "dist/$name.tar.gz" "${bins[@]}"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi
          test -s "dist/$archive"
          test -s "dist/$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-${{ matrix.target }}
          path: zed-cli/dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Verify every release checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' checksums < <(find dist -type f -name '*.sha256' -print0 | sort -z)
          test "${#checksums[@]}" -eq 7
          for checksum in "${checksums[@]}"; do
            directory="$(dirname "$checksum")"
            filename="$(basename "$checksum")"
            (cd "$directory" && sha256sum --check "$filename")
          done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
