# Cross-platform release builds (zed-docs issue #9). Cutting a `v*` tag
# builds `zed` for macOS (Apple Silicon + Intel), Linux (arm64 + x64, both
# gnu and musl for static/containers), and Windows, then uploads per-target
# archives to the GitHub Release. The Homebrew formula and container images
# consume these artifacts.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: dc0e0a0620b9462817950b552d3d334a184b1cb1
          path: zed-interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cross-compile Linux targets without a local cross toolchain
      - name: Install cross
        if: contains(matrix.target, 'linux')
        run: cargo install cross --locked || true
      - name: Build
        working-directory: zed-cli
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]] && command -v cross >/dev/null; then
            cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }} || true
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        working-directory: zed-cli
        shell: bash
        run: |
          bin=zed
          [[ "${{ matrix.target }}" == *windows* ]] && bin=zed.exe
          dir=target/${{ matrix.target }}/release
          name=zed-${{ matrix.target }}
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            (cd "$dir" && 7z a "$OLDPWD/dist/$name.zip" "$bin")
          else
            tar -C "$dir" -czf "dist/$name.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zed-${{ matrix.target }}
          path: zed-cli/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
