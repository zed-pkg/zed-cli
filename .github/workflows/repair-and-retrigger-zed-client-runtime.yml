# One-shot branch repair. Removed after it retriggers the materializer.
name: repair and retrigger zed-client runtime

on:
  push:
    branches: [den-3214/zed-cli-use-shared-clients]
    paths:
      - ".github/workflows/repair-and-retrigger-zed-client-runtime.yml"

permissions:
  contents: write

concurrency:
  group: repair-and-retrigger-zed-client-runtime
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Advance all validation fixtures to the shared interface revision
        env:
          OLD_SHA: 0c51d732cb01a377b2bc00e8d945b355e41961c1
          NEW_SHA: 3c54298fc7a8c1b2f9c1d74f588c6118b38f197e
        run: |
          set -euo pipefail
          count="$(grep -o "$OLD_SHA" tests/validate_cli.rs | wc -l | tr -d ' ')"
          test "$count" = "1"
          sed -i "s/$OLD_SHA/$NEW_SHA/g" tests/validate_cli.rs
          printf '\n# retrigger after validation-fixture repair\n' >> .github/workflows/materialize-zed-client-runtime.yml
          git diff --check
      - name: Commit the fixture repair and materializer trigger
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/validate_cli.rs .github/workflows/materialize-zed-client-runtime.yml
          git commit -m "test(DEN-3214): advance validation fixtures to shared interfaces"
          git push origin HEAD:den-3214/zed-cli-use-shared-clients
