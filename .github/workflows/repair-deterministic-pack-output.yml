name: Repair deterministic pack output

on:
  push:
    branches:
      - fix/den-2788-deterministic-pack-output
    paths:
      - '.github/workflows/repair-deterministic-pack-output.yml'
      - 'bootstrap/den-2788-deterministic-pack.once'
      - 'scripts/repair_deterministic_pack.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2788-deterministic-pack-output
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/den-2788-deterministic-pack-output
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot authority and exact source ancestry
        shell: bash
        run: |
          set -euo pipefail
          base='8929a58c6591c7a964d7f91412665d7c8a4afdf3'
          git merge-base --is-ancestor "$base" HEAD
          test "$(tr -d '\r\n' < bootstrap/den-2788-deterministic-pack.once)" = \
            'REPAIR_ZED_CLI_DETERMINISTIC_PACK_V1'
          cat >"$RUNNER_TEMP/expected-support-files" <<'EOF'
          .github/workflows/repair-deterministic-pack-output.yml
          bootstrap/den-2788-deterministic-pack.once
          scripts/repair_deterministic_pack.py
          EOF
          git diff --name-only "$base"...HEAD | sort >"$RUNNER_TEMP/actual-support-files"
          diff -u "$RUNNER_TEMP/expected-support-files" "$RUNNER_TEMP/actual-support-files"

      - name: Exclude the active output tree and add a retry regression
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_deterministic_pack.py
          grep -Fq 'let output_relative = out_dir.strip_prefix(project)' src/pack.rs
          grep -Fq 'consecutive_default_packs_are_identical_and_exclude_prior_outputs' src/pack.rs

      - name: Install the locked Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Certify deterministic packing and the complete CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked consecutive_default_packs_are_identical_and_exclude_prior_outputs
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          git diff --check
          test "$(git diff --name-only)" = 'src/pack.rs'

      - name: Commit the certified source and consume one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          git add src/pack.rs
          git rm \
            .github/workflows/repair-deterministic-pack-output.yml \
            bootstrap/den-2788-deterministic-pack.once \
            scripts/repair_deterministic_pack.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pack): exclude active output from deterministic archives'
          git push origin HEAD:fix/den-2788-deterministic-pack-output
