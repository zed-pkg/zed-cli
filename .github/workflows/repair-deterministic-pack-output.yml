name: Repair deterministic pack output

on:
  push:
    branches:
      - fix/den-2788-deterministic-pack-output
    paths:
      - '.github/workflows/repair-deterministic-pack-output.yml'
      - 'bootstrap/den-2788-deterministic-pack.once'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: den-2788-deterministic-pack-output
  cancel-in-progress: false

jobs:
  repair-and-test:
    if: hashFiles('bootstrap/den-2788-deterministic-pack.once') != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/den-2788-deterministic-pack-output
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot authority and exact source ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < bootstrap/den-2788-deterministic-pack.once)" = \
            'REPAIR_ZED_CLI_DETERMINISTIC_PACK_V1'
          test "$(git rev-parse HEAD~2)" = \
            '8929a58c6591c7a964d7f91412665d7c8a4afdf3'

      - name: Exclude the active output tree and add a retry regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pack.rs')
          text = path.read_text()

          old = '''    let mut included: Vec<PathBuf> = Vec::new();
              let mut excluded_count = 0usize;
              for entry in WalkDir::new(project)
                  .min_depth(1)
                  .sort_by_file_name()
                  .into_iter()
                  .filter_map(|e| e.ok())
              {
                  if !entry.file_type().is_file() {
                      continue;
                  }
                  let Ok(rel) = entry.path().strip_prefix(project).map(Path::to_path_buf) else {
                      continue;
                  };
                  if always.is_match(&rel) || !excludes.is_match(&rel) {
                      included.push(rel);
                  } else {
                      excluded_count += 1;
                  }
              }
              included.sort();

              let out_dir = match out_dir {
                  Some(d) => d.to_path_buf(),
                  None => project.join(PACK_OUT_DIR),
              };'''

          new = '''    let out_dir = match out_dir {
                  Some(d) => d.to_path_buf(),
                  None => project.join(PACK_OUT_DIR),
              };
              let output_relative = out_dir.strip_prefix(project).ok().map(Path::to_path_buf);

              let mut included: Vec<PathBuf> = Vec::new();
              let mut excluded_count = 0usize;
              for entry in WalkDir::new(project)
                  .min_depth(1)
                  .sort_by_file_name()
                  .into_iter()
                  .filter_map(|e| e.ok())
              {
                  if !entry.file_type().is_file() {
                      continue;
                  }
                  let Ok(rel) = entry.path().strip_prefix(project).map(Path::to_path_buf) else {
                      continue;
                  };
                  if output_relative
                      .as_ref()
                      .is_some_and(|output| rel.starts_with(output))
                  {
                      excluded_count += 1;
                      continue;
                  }
                  if always.is_match(&rel) || !excludes.is_match(&rel) {
                      included.push(rel);
                  } else {
                      excluded_count += 1;
                  }
              }
              included.sort();'''

          if text.count(old) != 1:
              raise SystemExit(f'pack collection block drifted: found {text.count(old)} matches')
          text = text.replace(old, new, 1)

          test = r'''

              #[test]
              fn consecutive_default_packs_are_identical_and_exclude_prior_outputs() {
                  let project = tempfile::tempdir().unwrap();
                  let source_manifest = r#"
          [package]
          org = "acme"
          name = "deterministic"
          version = "1.0.0"

          [package.repository]
          url = "https://github.com/acme/deterministic"
          "#;
                  fs::write(
                      project.path().join(zed_interfaces::paths::MANIFEST_FILE),
                      source_manifest,
                  )
                  .unwrap();
                  fs::write(project.path().join("payload.txt"), "stable payload\n").unwrap();
                  let manifest = Manifest::parse(source_manifest).unwrap();

                  let first = pack(project.path(), &manifest, None).unwrap();
                  let first_sha = first.sha256.clone();
                  let first_size = first.size;
                  let first_count = first.file_count;
                  let first_files = archive_files(&first.path);
                  assert!(first_files.contains("pkg/.zpkg.toml"));
                  assert!(first_files.contains("pkg/payload.txt"));
                  assert!(
                      !first_files
                          .iter()
                          .any(|entry| entry.starts_with("pkg/.zed/pack/"))
                  );

                  let second = pack(project.path(), &manifest, None).unwrap();
                  let second_files = archive_files(&second.path);
                  assert_eq!(second.sha256, first_sha);
                  assert_eq!(second.size, first_size);
                  assert_eq!(second.file_count, first_count);
                  assert!(
                      !second_files
                          .iter()
                          .any(|entry| entry.starts_with("pkg/.zed/pack/"))
                  );
              }
          '''
          marker = '\n}'
          head, separator, tail = text.rpartition(marker)
          if not separator or tail:
              raise SystemExit('tests module closing brace drifted')
          if 'consecutive_default_packs_are_identical_and_exclude_prior_outputs' in text:
              raise SystemExit('deterministic pack regression unexpectedly exists')
          path.write_text(head + test + marker)
          PY
          grep -Fq 'let output_relative = out_dir.strip_prefix(project)' src/pack.rs
          grep -Fq 'consecutive_default_packs_are_identical_and_exclude_prior_outputs' src/pack.rs

      - name: Install the locked Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Certify deterministic packing and the complete CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked consecutive_default_packs_are_identical_and_exclude_prior_outputs
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          git diff --check
          test "$(git diff --name-only)" = 'src/pack.rs'

      - name: Commit the certified source and consume one-shot authority
        shell: bash
        run: |
          set -euo pipefail
          git add src/pack.rs
          git rm \
            .github/workflows/repair-deterministic-pack-output.yml \
            bootstrap/den-2788-deterministic-pack.once
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pack): exclude active output from deterministic archives'
          git push origin HEAD:fix/den-2788-deterministic-pack-output
