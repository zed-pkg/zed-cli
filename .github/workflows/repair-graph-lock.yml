name: repair-graph-lock

on:
  push:
    branches:
      - fix/graph-lock-test-import
    paths:
      - .github/workflows/repair-graph-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/graph-lock-test-import
      - name: Align immutable zed-lock revision
        run: cargo update -p zed-lock
      - name: Remove duplicate hardening-test import
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/install_graph/hardening_tests.rs")
          text = path.read_text()
          needle = "use crate::registry::registry_for;"
          if text.count(needle) != 2:
              raise SystemExit(f"expected exactly two registry_for imports, found {text.count(needle)}")
          first = text.find(needle)
          second = text.find(needle, first + len(needle))
          text = text[:second] + text[second + len(needle):]
          path.write_text(text.rstrip() + "\n")
      - name: Verify scoped repair
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/validate-zed-package-graph.sh
          git diff --check
          git diff -- Cargo.lock src/install_graph/hardening_tests.rs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Cargo.lock src/install_graph/hardening_tests.rs "
      - name: Commit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/install_graph/hardening_tests.rs
          git commit -m "fix(ci): align zed-lock graph authority"
          git push origin HEAD:fix/graph-lock-test-import
