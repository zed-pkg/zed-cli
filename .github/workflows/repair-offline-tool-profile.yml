name: harden and validate frozen tool profiles

on:
  push:
    branches:
      - feat/den-2923-offline-tool-profile
    paths:
      - .github/workflows/repair-offline-tool-profile.yml

permissions:
  contents: write

concurrency:
  group: repair-offline-tool-profile
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/den-2923-offline-tool-profile
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Apply receipt and idempotence hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/tool_profile.rs')
          text = path.read_text()

          text = text.replace("pub schema: &'static str,", "pub schema: String,")
          text = text.replace(
              'schema: TOOL_PROFILE_SCHEMA_V1,',
              'schema: TOOL_PROFILE_SCHEMA_V1.to_string(),',
          )
          text = text.replace('    logical_name: String,\n', '')
          text = text.replace('            logical_name: logical_name.clone(),\n', '')

          selection = '''    let selected = select_exact_target(&loaded.lock, target)?;
              let store = Store::new(home);
          '''
          selection_hardened = '''    let selected = select_exact_target(&loaded.lock, target)?;
              ensure!(
                  !selected.is_empty(),
                  "environment lock contains no tools for frozen profile installation"
              );
              let store = Store::new(home);
          '''
          if selection not in text:
              raise SystemExit('install selection anchor not found')
          text = text.replace(selection, selection_hardened, 1)

          old = '''    let actual = fs::read_dir(&bin)?
                  .map(|entry| Ok(entry?.file_name().to_string_lossy().into_owned()))
                  .collect::<Result<BTreeSet<_>>>()?;
              Ok(expected == actual)
          }
          '''
          new = '''    let actual = fs::read_dir(&bin)?
                  .map(|entry| Ok(entry?.file_name().to_string_lossy().into_owned()))
                  .collect::<Result<BTreeSet<_>>>()?;
              if expected != actual {
                  return Ok(false);
              }
              for executable in prepared.iter().flat_map(|tool| tool.executables.iter()) {
                  let destination = bin.join(&executable.profile_name);
                  #[cfg(unix)]
                  {
                      let metadata = fs::symlink_metadata(&destination)?;
                      if !metadata.file_type().is_symlink()
                          || fs::read_link(&destination)? != executable.source
                      {
                          return Ok(false);
                      }
                  }
                  #[cfg(windows)]
                  {
                      let metadata = fs::symlink_metadata(&destination)?;
                      if !metadata.is_file() || metadata.file_type().is_symlink() {
                          return Ok(false);
                      }
                      let (source_sha256, source_size) = sha256_file(&executable.source)?;
                      let (destination_sha256, destination_size) = sha256_file(&destination)?;
                      if source_sha256 != destination_sha256 || source_size != destination_size {
                          return Ok(false);
                      }
                  }
              }
              Ok(true)
          }
          '''
          if old not in text:
              raise SystemExit('active profile comparison anchor not found')
          text = text.replace(old, new, 1)

          old = '''fn profile_executable_name(logical_name: &str, source: &Path) -> Result<String> {
              #[cfg(windows)]
          '''
          new = '''fn profile_executable_name(logical_name: &str, source: &Path) -> Result<String> {
              #[cfg(not(windows))]
              let _ = source;
              #[cfg(windows)]
          '''
          if old not in text:
              raise SystemExit('profile executable name anchor not found')
          path.write_text(text.replace(old, new, 1))

          binary = Path('src/bin/zed-tool.rs')
          text = binary.read_text()
          text = text.replace(
              '#[arg(long, env = "ZED_TOOL_LOCK", default_value_os_t = default_lock_path())]',
              '#[arg(long, env = "ZED_TOOL_LOCK", default_value = ".zed/environment.lock.toml")]',
          )
          text = text.replace(
              '#[arg(long, env = "ZED_TOOL_PROFILE", default_value_os_t = default_profile_path())]',
              '#[arg(long, env = "ZED_TOOL_PROFILE", default_value = ".zed/tools")]',
          )
          text = text.replace(
              '    LockMode, default_lock_path, default_profile_path, default_zed_home, install_offline,\n',
              '    LockMode, default_zed_home, install_offline,\n',
          )
          binary.write_text(text)
          PY

      - name: Format, test, and lint the feature
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib tool_profile::tests
          cargo test --locked --test tool_profile_cli
          cargo test --locked --lib store::tests
          cargo test --locked --lib project_lock::tests
          cargo test --locked --test frozen_offline_prefetch
          cargo clippy --locked --bin zed-tool --test tool_profile_cli -- -D warnings

      - name: Commit ordinary hardened source
        run: |
          set -euo pipefail
          rm .github/workflows/repair-offline-tool-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tool_profile.rs src/bin/zed-tool.rs .github/workflows/repair-offline-tool-profile.yml
          git diff --cached --check
          git commit -m 'fix(DEN-2923): harden frozen tool-profile replay'
          git push origin HEAD:feat/den-2923-offline-tool-profile
