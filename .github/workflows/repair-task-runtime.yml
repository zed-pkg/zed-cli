# Second branch commit intentionally triggers the already-present repair workflow.
name: repair native task runtime

on:
  push:
    branches:
      - agent/den-1444-native-task-runtime
    paths:
      - .github/workflows/repair-task-runtime.yml

permissions:
  contents: write

concurrency:
  group: repair-native-task-runtime
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1444-native-task-runtime
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install positive-jobs parsing and repair task state locking
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          binary = Path('src/bin/zed-task.rs')
          text = binary.read_text()
          parser_variants = [
              'value_parser = clap::value_parser!(usize).range(1..)',
              'value_parser = clap::value_parser!(usize)',
          ]
          for old in parser_variants:
              if old in text:
                  text = text.replace(old, 'value_parser = parse_jobs', 1)
                  break
          if 'value_parser = parse_jobs' not in text:
              raise SystemExit('task jobs parser anchor not found')

          if 'fn parse_jobs(' not in text:
              marker = '\nstruct HumanObserver;\n'
              replacement = '''
fn parse_jobs(value: &str) -> std::result::Result<usize, String> {
    let jobs = value
        .parse::<usize>()
        .map_err(|_| format!("`{value}` is not a valid positive integer"))?;
    if jobs == 0 {
        return Err("task concurrency must be at least one".to_string());
    }
    Ok(jobs)
}

struct HumanObserver;
'''
              if marker not in text:
                  raise SystemExit('task observer insertion anchor not found')
              text = text.replace(marker, '\n' + replacement, 1)
          binary.write_text(text)

          runtime = Path('src/task_runtime.rs')
          runtime_text = runtime.read_text()
          old = '''        let (states, ready) = &*self.states;
                  let mut states = states.lock().expect("task state mutex poisoned");
          '''
          new = '''        let (state_mutex, ready) = &*self.states;
                  let mut states = state_mutex.lock().expect("task state mutex poisoned");
          '''
          if old in runtime_text:
              runtime_text = runtime_text.replace(old, new, 1)
          elif 'let (state_mutex, ready) = &*self.states;' not in runtime_text:
              raise SystemExit('task state mutex binding anchor not found')

          old = '''        let result = self.execute_task_inner(&name, invocation_env, args);
                  let mut states = states.lock().expect("task state mutex poisoned");
          '''
          new = '''        let result = self.execute_task_inner(&name, invocation_env, args);
                  let mut states = state_mutex.lock().expect("task state mutex poisoned");
          '''
          if old in runtime_text:
              runtime_text = runtime_text.replace(old, new, 1)
          elif 'let mut states = state_mutex.lock().expect("task state mutex poisoned");' not in runtime_text:
              raise SystemExit('task state finalization lock anchor not found')
          runtime.write_text(runtime_text)

          tests = Path('tests/task_runtime_cli.rs')
          test_text = tests.read_text()
          test_name = 'zero_jobs_is_rejected_before_plan_discovery'
          if test_name not in test_text:
              test_text += r'''

#[test]
fn zero_jobs_is_rejected_before_plan_discovery() {
    let root = tempfile::tempdir().unwrap();
    let output = run(root.path(), &["run", "missing", "--jobs", "0"]);
    assert!(!output.status.success());
    let stderr = String::from_utf8_lossy(&output.stderr);
    assert!(
        stderr.contains("task concurrency must be at least one"),
        "{stderr}"
    );
}
'''
          tests.write_text(test_text)
          PY

      - name: Format, test, and lint the runtime
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib task_runtime::tests
          cargo test --locked --test task_runtime_cli
          cargo clippy --locked --bin zed-task --test task_runtime_cli -- -D warnings

      - name: Commit validated ordinary source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bin/zed-task.rs src/task_runtime.rs tests/task_runtime_cli.rs
          git diff --cached --check
          git commit -m 'fix(DEN-1444): validate and format native task runtime'
          git push origin HEAD:agent/den-1444-native-task-runtime
