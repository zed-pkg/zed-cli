# Trigger the one-shot repair after the workflow exists on the branch.
name: repair native task runtime

on:
  push:
    branches:
      - agent/den-1444-native-task-runtime
    paths:
      - .github/workflows/repair-task-runtime.yml

permissions:
  contents: write

concurrency:
  group: repair-native-task-runtime
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact task-runtime branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1444-native-task-runtime
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Apply compile and cross-platform repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/task_runtime.rs')
          text = path.read_text()

          old = '''        let (states, ready) = &*self.states;
                  let mut states = states.lock().expect("task state mutex poisoned");
                  loop {
                      match states.get(&identity) {
                          None => {
                              states.insert(identity.clone(), ExecutionState::Running);
                              break;
                          }
                          Some(ExecutionState::Running) => {
                              states = ready.wait(states).expect("task state mutex poisoned");
                          }
                          Some(ExecutionState::Completed) | Some(ExecutionState::Skipped) => {
                              return Ok(TaskOutcome::AlreadyCompleted);
                          }
                          Some(ExecutionState::Failed(message)) => bail!("task `{name}` previously failed: {message}"),
                      }
                  }
                  drop(states);

                  let result = self.execute_task_inner(&name, invocation_env, args);
                  let mut states = states.lock().expect("task state mutex poisoned");
                  match &result {
                      Ok(TaskOutcome::Skipped) => {
                          states.insert(identity, ExecutionState::Skipped);
                      }
                      Ok(_) => {
                          states.insert(identity, ExecutionState::Completed);
                      }
                      Err(error) => {
                          states.insert(identity, ExecutionState::Failed(format!("{error:#}")));
                      }
                  }
                  ready.notify_all();
          '''
          new = '''        let (state_mutex, ready) = &*self.states;
                  let mut state_guard = state_mutex.lock().expect("task state mutex poisoned");
                  loop {
                      match state_guard.get(&identity) {
                          None => {
                              state_guard.insert(identity.clone(), ExecutionState::Running);
                              break;
                          }
                          Some(ExecutionState::Running) => {
                              state_guard = ready
                                  .wait(state_guard)
                                  .expect("task state mutex poisoned");
                          }
                          Some(ExecutionState::Completed) | Some(ExecutionState::Skipped) => {
                              return Ok(TaskOutcome::AlreadyCompleted);
                          }
                          Some(ExecutionState::Failed(message)) => {
                              bail!("task `{name}` previously failed: {message}")
                          }
                      }
                  }
                  drop(state_guard);

                  let result = self.execute_task_inner(&name, invocation_env, args);
                  let mut state_guard = state_mutex.lock().expect("task state mutex poisoned");
                  match &result {
                      Ok(TaskOutcome::Skipped) => {
                          state_guard.insert(identity, ExecutionState::Skipped);
                      }
                      Ok(_) => {
                          state_guard.insert(identity, ExecutionState::Completed);
                      }
                      Err(error) => {
                          state_guard.insert(identity, ExecutionState::Failed(format!("{error:#}")));
                      }
                  }
                  ready.notify_all();
          '''
          if old not in text:
              raise SystemExit('task state mutex anchor not found')
          text = text.replace(old, new, 1)

          old = '''fn contains_glob(value: &str) -> bool {
              value.contains(['*', '?', '['])
          }
          '''
          new = '''fn contains_glob(value: &str) -> bool {
              value.contains('*') || value.contains('?') || value.contains('[')
          }
          '''
          if old not in text:
              raise SystemExit('contains_glob anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace('depends-post = ["cleanup"]', 'depends_post = ["cleanup"]', 1)

          old = '''            outputs = ["output.txt"]
                      run = ["cat input.txt > output.txt"]
                      "#,
          '''
          new = '''            outputs = ["output.txt"]
                      run = ["cat input.txt > output.txt"]
                      run_windows = ["type input.txt > output.txt"]
                      "#,
          '''
          if old not in text:
              raise SystemExit('cache cross-platform command anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Format, test, and lint the runtime
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib task_runtime::tests
          cargo test --locked --test task_runtime_cli
          cargo clippy --locked --bin zed-task --test task_runtime_cli -- -D warnings

      - name: Commit ordinary repaired source
        run: |
          set -euo pipefail
          rm .github/workflows/repair-task-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/task_runtime.rs .github/workflows/repair-task-runtime.yml
          git diff --cached --check
          git commit -m 'fix(DEN-1444): repair native task runtime compilation'
          git push origin HEAD:agent/den-1444-native-task-runtime
