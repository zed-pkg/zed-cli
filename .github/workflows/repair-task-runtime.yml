name: repair native task runtime

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/repair-task-runtime.yml
      - src/bin/zed-task.rs
      - src/task_runtime.rs
      - tests/task_runtime_cli.rs

permissions:
  contents: write

concurrency:
  group: repair-native-task-runtime
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/den-1444-native-task-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1444-native-task-runtime
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Use the portable Clap parser and rely on runtime validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bin/zed-task.rs')
          text = path.read_text()
          old = 'value_parser = clap::value_parser!(usize).range(1..)'
          new = 'value_parser = clap::value_parser!(usize)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('task jobs parser anchor not found')
          path.write_text(text)
          PY

      - name: Format, test, and lint the runtime
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo test --locked --lib task_runtime::tests
          cargo test --locked --test task_runtime_cli
          cargo clippy --locked --bin zed-task --test task_runtime_cli -- -D warnings

      - name: Commit ordinary repaired source
        run: |
          set -euo pipefail
          rm .github/workflows/repair-task-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/bin/zed-task.rs \
            src/task_runtime.rs \
            tests/task_runtime_cli.rs \
            .github/workflows/repair-task-runtime.yml
          git diff --cached --check
          git commit -m 'fix(DEN-1444): compile and format native task runtime'
          git push origin HEAD:agent/den-1444-native-task-runtime
