name: Role-based Zed dependency contract

on:
  pull_request:
    paths:
      - ".github/workflows/role-contract.yml"
      - "tools/role-contract/**"
      - "tests/role-contract/**"
      - "docs/role-based-zed-dependency-contract.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/role-contract.yml"
      - "tools/role-contract/**"
      - "tests/role-contract/**"
      - "docs/role-based-zed-dependency-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/role-contract -p 'test_*.py' -v
      - run: python tools/role-contract/zed_role_contract.py audit . --output /tmp/zed-role-audit.json
