name: migrate to shared recovery policy once

on:
  push:
    branches:
      - DEN-3829-github-control-plane-fallback
    paths:
      - '.github/workflows/shared-recovery-policy-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3829-github-control-plane-fallback
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Replace local retry ordering with zed-interfaces authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          old = 'zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "0c2ffa7be791a44c8aa2a69ab4b1ea87aab4729c" }'
          new = 'zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "bb0f3fe10218e7dcb6a857bcb43deffdaa08b4f6" }'
          if old not in text:
              raise SystemExit('expected zed-interfaces pin not found')
          cargo.write_text(text.replace(old, new, 1))

          path = Path('src/source_fallback.rs')
          text = path.read_text()
          helper = '''/// During source fallback, prefer infrastructure owned by GitHub before
/// any Zed-operated R2/Cloudflare mirror. The normal registry path is
/// still attempted before this function is involved.
fn source_fallback_priority(kind: ArtifactSourceKind) -> u8 {
    match kind {
        ArtifactSourceKind::GithubRelease => 0,
        ArtifactSourceKind::GithubPackages => 1,
        ArtifactSourceKind::GithubArchive => 2,
        ArtifactSourceKind::R2 => 3,
        ArtifactSourceKind::Registry => 4,
    }
}

fn github_first_locators(mut locators: Vec<ArtifactLocator>) -> Vec<ArtifactLocator> {
    locators.sort_by_key(|locator| source_fallback_priority(locator.kind));
    locators
}

'''
          if helper not in text:
              raise SystemExit('local recovery helper block not found')
          text = text.replace(helper, '', 1)
          text = text.replace(
              'use zed_interfaces::artifact::ArtifactFormat;\n',
              'use zed_interfaces::artifact::ArtifactFormat;\nuse zed_interfaces::artifact_recovery_locators;\n',
              1,
          )
          text = text.replace('github_first_locators(artifact_locators(&ArtifactQuery {', 'artifact_recovery_locators(&ArtifactQuery {')
          text = text.replace('        }));', '        });')
          # The replacement above intentionally changes exactly the two recovery-query closures;
          # fail closed if the local wrapper survived or the shared helper was not wired twice.
          if 'github_first_locators(' in text or 'source_fallback_priority(' in text:
              raise SystemExit('local recovery ordering survived migration')
          if text.count('artifact_recovery_locators(&ArtifactQuery {') != 2:
              raise SystemExit(f'expected two shared recovery call sites, found {text.count("artifact_recovery_locators(&ArtifactQuery {")}')
          path.write_text(text)
          PY
          cargo update -p zed-interfaces
          cargo fmt --all
          cargo test --locked --lib source_fallback
          cargo check --locked --lib
          cargo clippy --locked --lib -- -A unsafe-code -D warnings
          git diff --check
          grep -F 'rev = "bb0f3fe10218e7dcb6a857bcb43deffdaa08b4f6"' Cargo.toml
          grep -F 'artifact_recovery_locators(&ArtifactQuery {' src/source_fallback.rs | test "$(wc -l)" -eq 2
          ! grep -F 'github_first_locators' src/source_fallback.rs
      - name: Commit shared-authority migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src/source_fallback.rs
          git commit -m 'refactor: consume shared GitHub-first recovery policy'
          git push origin HEAD:DEN-3829-github-control-plane-fallback
