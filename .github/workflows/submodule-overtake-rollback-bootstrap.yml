name: submodule overtake rollback bootstrap

on:
  push:
    branches:
      - agent/harden-submodule-overtake-rollback

permissions:
  contents: write

concurrency:
  group: submodule-overtake-rollback-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: agent/harden-submodule-overtake-rollback

      - name: Apply transactional rollback hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          ops = Path("src/ops_entry.rs")
          text = ops.read_text()
          text = text.replace("use anyhow::Result;", "use anyhow::{Context, Result};", 1)
          marker = "use crate::config::{self, Config};\n\n#[path = \"ops.rs\"]"
          replacement = "use crate::config::{self, Config};\n\npub(crate) const GIT_LOCK_FINALIZE_CONTEXT: &str =\n    \"finalizing adopted Git submodule lock metadata\";\n\n#[path = \"ops.rs\"]"
          if text.count(marker) != 1:
              raise SystemExit("src/ops_entry.rs: insertion marker drifted")
          text = text.replace(marker, replacement, 1)
          finish = "    git_lock.finish(project)?;"
          if text.count(finish) != 2:
              raise SystemExit(f"src/ops_entry.rs: expected two finish calls, found {text.count(finish)}")
          text = text.replace(
              finish,
              "    git_lock\n        .finish(project)\n        .context(GIT_LOCK_FINALIZE_CONTEXT)?;",
          )
          ops.write_text(text)

          module = Path("src/git_submodules/mod.rs")
          text = module.read_text()
          old = '''    let manifest_path = project.join(MANIFEST_FILE);
    let mut root = if manifest_path.is_file() {
        read_manifest(&project)?
    } else {
        generated_consumer_manifest(&project)
    };
'''
          new = '''    let manifest_path = project.join(MANIFEST_FILE);
    let previous_manifest = match fs::read(&manifest_path) {
        Ok(contents) => Some(contents),
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => None,
        Err(error) => {
            return Err(error).with_context(|| format!("reading {}", manifest_path.display()));
        }
    };
    let mut root = if manifest_path.is_file() {
        read_manifest(&project)?
    } else {
        generated_consumer_manifest(&project)
    };
'''
          if text.count(old) != 1:
              raise SystemExit("src/git_submodules/mod.rs: root manifest block drifted")
          text = text.replace(old, new, 1)

          old = '''    root.validate()
        .context("validating overtaken root manifest")?;

    let mut transaction = ProjectTransaction::begin(&project)?;
    transaction.backup(&manifest_path)?;
    fs::write(&manifest_path, root.to_toml_string()?)
        .with_context(|| format!("writing {}", manifest_path.display()))?;
    transaction.commit()?;

    // Run the ordinary installer after adoption. Because the imported packages
    // are workspace members, the complete solver never asks the registry for
    // them. The installer facade adds exact Git provenance to the resulting
    // lockfile after its normal transaction commits.
    crate::managed_install::install(
        &project,
        cfg,
        &[],
        false,
        InstallMode::Symlink,
        Adapter::Auto,
        false,
        None,
        false,
        false,
    )?;
'''
          new = '''    root.validate()
        .context("validating overtaken root manifest")?;
    let manifest_text = root.to_toml_string()?;

    let mut transaction = ProjectTransaction::begin(&project)?;
    transaction.backup(&manifest_path)?;
    fs::write(&manifest_path, manifest_text.as_bytes())
        .with_context(|| format!("writing {}", manifest_path.display()))?;
    transaction.commit()?;

    // Run the ordinary installer after adoption. Because the imported packages
    // are workspace members, the complete solver never asks the registry for
    // them. The installer facade adds exact Git provenance to the resulting
    // lockfile after its normal transaction commits.
    if let Err(error) = crate::managed_install::install(
        &project,
        cfg,
        &[],
        false,
        InstallMode::Symlink,
        Adapter::Auto,
        false,
        None,
        false,
        false,
    ) {
        // The ordinary installer is transactional. Its only post-commit fallible
        // step is the additive Git-lock finalizer; in that case the adopted
        // manifest must remain aligned with the already committed install.
        if install_committed_before_error(&error) {
            return Err(error.context(
                "package installation committed; retained the overtaken manifest for reconciliation",
            ));
        }
        if let Err(rollback) = restore_manifest_if_unchanged(
            &project,
            &manifest_path,
            manifest_text.as_bytes(),
            previous_manifest.as_deref(),
        ) {
            return Err(error.context(format!(
                "overtake installation failed and the root manifest could not be rolled back: {rollback:#}"
            )));
        }
        return Err(error.context("overtake installation failed; restored the prior root manifest"));
    }
'''
          if text.count(old) != 1:
              raise SystemExit("src/git_submodules/mod.rs: install block drifted")
          text = text.replace(old, new, 1)
          text += '''

fn install_committed_before_error(error: &anyhow::Error) -> bool {
    error
        .chain()
        .any(|cause| cause.to_string() == crate::ops::GIT_LOCK_FINALIZE_CONTEXT)
}

fn restore_manifest_if_unchanged(
    project: &Path,
    path: &Path,
    expected: &[u8],
    previous: Option<&[u8]>,
) -> Result<()> {
    let current = fs::read(path).with_context(|| format!("reading {}", path.display()))?;
    if current != expected {
        bail!(
            "{} changed during takeover; refusing to overwrite another writer's content",
            path.display()
        );
    }

    let mut transaction = ProjectTransaction::begin(project)?;
    transaction.backup(path)?;
    if let Some(previous) = previous {
        fs::write(path, previous)
            .with_context(|| format!("restoring {}", path.display()))?;
    }
    transaction.commit()
}
'''
          module.write_text(text)

          tests = Path("src/git_submodules/tests.rs")
          text = tests.read_text()
          text += '''

#[test]
fn failed_overtake_restores_exact_prior_manifest_bytes() {
    let project = tempfile::tempdir().unwrap();
    let path = project.path().join(MANIFEST_FILE);
    let previous = b"# preserve hand formatting\\n[package]\\nname = \\"before\\"\\n";
    let adopted = b"[package]\\nname = \\"after\\"\\n";
    fs::write(&path, adopted).unwrap();

    restore_manifest_if_unchanged(project.path(), &path, adopted, Some(previous)).unwrap();

    assert_eq!(fs::read(&path).unwrap(), previous);
    assert!(!project.path().join(crate::transaction::STAGING_DIR).exists());
}

#[test]
fn failed_overtake_removes_a_new_generated_manifest() {
    let project = tempfile::tempdir().unwrap();
    let path = project.path().join(MANIFEST_FILE);
    let adopted = b"[package]\\nname = \\"generated\\"\\n";
    fs::write(&path, adopted).unwrap();

    restore_manifest_if_unchanged(project.path(), &path, adopted, None).unwrap();

    assert!(!path.exists());
    assert!(!project.path().join(crate::transaction::STAGING_DIR).exists());
}

#[test]
fn failed_overtake_never_overwrites_a_concurrent_manifest_edit() {
    let project = tempfile::tempdir().unwrap();
    let path = project.path().join(MANIFEST_FILE);
    let adopted = b"[package]\\nname = \\"adopted\\"\\n";
    fs::write(&path, b"[package]\\nname = \\"concurrent\\"\\n").unwrap();

    let error = restore_manifest_if_unchanged(
        project.path(),
        &path,
        adopted,
        Some(b"[package]\\nname = \\"before\\"\\n"),
    )
    .unwrap_err();

    assert!(error.to_string().contains("another writer"));
    assert!(fs::read_to_string(&path).unwrap().contains("concurrent"));
}

#[test]
fn git_lock_finalize_context_marks_a_post_commit_install_error() {
    let post_commit = anyhow::Error::msg(crate::ops::GIT_LOCK_FINALIZE_CONTEXT);
    assert!(install_committed_before_error(&post_commit));
    assert!(!install_committed_before_error(&anyhow::anyhow!("resolution failed")));
}
'''
          tests.write_text(text)

          docs = Path("docs/git-submodules.md")
          text = docs.read_text()
          marker = '''8. records immutable Git provenance in `.zpkg.lock`.

For example, a submodule at `vendor/client` declaring `acme/client@1.2.3`
'''
          replacement = '''8. records immutable Git provenance in `.zpkg.lock`.

The authority migration is failure-safe. If resolution or materialization fails
before the ordinary install transaction commits, Zed restores the exact prior
root-manifest bytes, or removes the generated manifest when none existed. If
package installation commits but the additive Git-lock finalizer alone fails,
Zed retains the adopted manifest so it remains aligned with installed state and
reports the reconciliation failure explicitly.

For example, a submodule at `vendor/client` declaring `acme/client@1.2.3`
'''
          if text.count(marker) != 1:
              raise SystemExit("docs/git-submodules.md: takeover step marker drifted")
          docs.write_text(text.replace(marker, replacement, 1))

          Path(".github/workflows/submodule-overtake-rollback-bootstrap.yml").unlink()
          PY

          cargo fmt --all
          git diff --check
          cargo test --locked --lib git_submodules::tests
          cargo clippy --locked --all-targets -- -D warnings

      - name: Commit verified product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zed-pkg automation"
          git config user.email "zed-pkg-automation@users.noreply.github.com"
          git add -A
          git commit -m "fix: roll back failed submodule overtakes"
          git push origin HEAD:agent/harden-submodule-overtake-rollback
