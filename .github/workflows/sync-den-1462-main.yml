name: sync DEN-1462 exporter with current main

on:
  push:
    branches:
      - agent/den-1462-mise-export-current-main

permissions:
  contents: write

concurrency:
  group: den-1462-current-main-sync
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out exporter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1462-mise-export-current-main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Merge current main and compose exporter dispatch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          cp src/main.rs "$RUNNER_TEMP/exporter-main.rs"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]] && [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
            echo 'merge failed without ordinary content conflicts' >&2
            exit "$merge_status"
          fi

          git checkout origin/main -- \
            src/git_submodules/cli.rs \
            src/project_lock.rs \
            src/main.rs

          python - <<'PY'
          import os
          from pathlib import Path

          product = Path(os.environ['RUNNER_TEMP'], 'exporter-main.rs').read_text(encoding='utf-8')
          current_path = Path('src/main.rs')
          current = current_path.read_text(encoding='utf-8')

          import_line = 'use zed_cli::mise_export::{self, MiseExportMode};\n'
          if import_line not in current:
              anchor = 'use zed_cli::managed_install;\n'
              if current.count(anchor) != 1:
                  raise SystemExit(f'expected one managed_install import, found {current.count(anchor)}')
              current = current.replace(anchor, anchor + import_line, 1)

          start_marker = '            EnvCmd::Export {\n'
          end_marker = '            EnvCmd::Verify {\n'
          start = product.find(start_marker)
          if start < 0:
              raise SystemExit('exporter branch has no EnvCmd::Export arm')
          end = product.find(end_marker, start)
          if end < 0:
              raise SystemExit('could not find EnvCmd::Verify after exporter arm')
          export_block = product[start:end]

          if start_marker not in current:
              insert = current.find(end_marker)
              if insert < 0:
                  raise SystemExit('current main has no EnvCmd::Verify insertion anchor')
              current = current[:insert] + export_block + current[insert:]

          current_path.write_text(current, encoding='utf-8')
          PY

          unresolved=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unresolved" ]]; then
            echo 'unresolved files remain after semantic composition:' >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          cargo fmt --all
          git diff --check
          cargo test --locked mise_export
          cargo test --locked --test mise_export_api_boundaries
          cargo test --locked --test mise_export_cli
          cargo test --locked --test mise_export_reserved_paths_cli
          cargo test --locked project_lock
          cargo test --locked cli::tests::environment_export_is_typed_and_rejects_ambiguous_write_modes
          cargo clippy --locked --all-targets -- -D warnings

          git add src/git_submodules/cli.rs src/project_lock.rs src/main.rs
          git commit -m 'Merge current main into DEN-1462 deterministic mise exporter'
          git push origin HEAD:agent/den-1462-mise-export-current-main
