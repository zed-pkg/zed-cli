name: native task runtime

on:
  pull_request:
    paths:
      - .cli-flags.toml
      - .task-cli-flags.toml
      - README.md
      - docs/task-runtime.md
      - src/cli.rs
      - src/main.rs
      - src/task_cli.rs
      - src/task_runtime.rs
      - src/bin/zed-task.rs
      - src/lib.rs
      - tests/task_main_cli.rs
      - tests/task_runtime_cli.rs
      - .github/workflows/task-runtime.yml
  push:
    branches: [main]
    paths:
      - .cli-flags.toml
      - .task-cli-flags.toml
      - README.md
      - docs/task-runtime.md
      - src/cli.rs
      - src/main.rs
      - src/task_cli.rs
      - src/task_runtime.rs
      - src/bin/zed-task.rs
      - src/lib.rs
      - tests/task_main_cli.rs
      - tests/task_runtime_cli.rs
      - .github/workflows/task-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-runtime-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  task-runtime:
    name: task runtime / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Rust quality components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate shared flags-to-environment contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib
          from pathlib import Path

          expected = {
              'ZED_TASK_PLAN',
              'ZED_TASK_JSON',
              'ZED_TASK_ALL',
              'ZED_TASK_DRY_RUN',
              'ZED_TASK_YES',
              'ZED_TASK_JOBS',
              'ZED_TASK_NO_CACHE',
          }

          staged = tomllib.loads(Path('.task-cli-flags.toml').read_text())
          staged_env = set()
          for flag in staged.get('flags', {}).values():
              staged_env.add(flag['env'])
          for command in staged.get('commands', {}).values():
              for flag in command.get('flags', {}).values():
                  staged_env.add(flag['env'])
          assert staged_env == expected, (staged_env, expected)

          main = tomllib.loads(Path('.cli-flags.toml').read_text())
          task = main['commands']['task']
          main_env = {
              task['flags']['plan']['env'],
              task['flags']['json']['env'],
              task['commands']['list']['flags']['all']['env'],
              task['commands']['run']['flags']['dry_run']['env'],
              task['commands']['run']['flags']['yes']['env'],
              task['commands']['run']['flags']['jobs']['env'],
              task['commands']['run']['flags']['no_cache']['env'],
          }
          assert main_env == expected, (main_env, expected)
          PY

      - name: Formatting and focused tests
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib task_runtime::tests
          cargo test --locked --lib task_cli::tests
          cargo test --locked --test task_runtime_cli
          cargo test --locked --test task_main_cli
          cargo test --locked cli::tests::cli_flags_toml_is_in_sync_with_clap
          cargo test --locked cli::tests::readme_documents_every_command

      - name: Current-main compatibility tests
        run: |
          set -euo pipefail
          cargo test --locked --test asdf_main_cli
          cargo test --locked --test nix_environment_export_cli
          cargo test --locked --test frozen_offline_prefetch
          cargo test --locked --test global_cli

      - name: Strict Clippy
        run: |
          set -euo pipefail
          cargo clippy --locked --bin zed --bin zed-task \
            --test task_runtime_cli --test task_main_cli -- -D warnings

      - name: Repeated deterministic parity canary
        run: |
          set -euo pipefail
          cargo build --locked --bin zed --bin zed-task
          zed_bin="$GITHUB_WORKSPACE/target/debug/zed"
          task_bin="$GITHUB_WORKSPACE/target/debug/zed-task"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            zed_bin="${zed_bin}.exe"
            task_bin="${task_bin}.exe"
          fi
          work="$RUNNER_TEMP/zed-task-determinism"
          mkdir -p "$work"
          cat > "$work/zed-env.toml" <<'TOML'
          schema = 2

          [tasks.prepare]
          run = ["echo prepare"]

          [tasks.build]
          depends = ["prepare"]
          run = ["echo build"]
          TOML
          (
            cd "$work"
            "$zed_bin" task --json run build --dry-run > main-first.json 2> main-first.err
            "$zed_bin" task --json run build --dry-run > main-second.json 2> main-second.err
            "$task_bin" --json run build --dry-run > staged.json 2> staged.err
            cmp main-first.json main-second.json
            cmp main-first.err main-second.err
            cmp main-first.json staged.json
            cmp main-first.err staged.err
          )

      - name: Require a clean checkout
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=all | tee /tmp/task-runtime-status.txt
          test ! -s /tmp/task-runtime-status.txt
