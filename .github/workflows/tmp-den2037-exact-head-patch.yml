name: tmp DEN-2037 exact-head checkout patch

on:
  push:
    branches:
      - den-2037-consumer-local-lock-e2e-v1
    paths:
      - .github/workflows/tmp-den2037-exact-head-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: den-2037-consumer-local-lock-e2e-v1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Patch workflow and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ORESoftware
          git config user.email noreply@github.com
          node scripts/tmp-patch-den2037-exact-head.mjs
          rm scripts/tmp-patch-den2037-exact-head.mjs
          rm .github/workflows/tmp-den2037-exact-head-patch.yml
          git add -A
          git diff --cached --check
          git commit -m 'ci: prove DEN-2037 consumer matrix checks exact PR head'
          git push origin HEAD:den-2037-consumer-local-lock-e2e-v1
