name: tmp-v031-lock

on:
  push:
    branches: [release/v0.3.1-fallback-repack-20260915]
    paths:
      - '.github/workflows/tmp-v031-lock.yml'
      - 'Cargo.toml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.3.1-fallback-repack-20260915
          persist-credentials: true
      - name: Assert trusted release branch
        run: test "$(git branch --show-current)" = 'release/v0.3.1-fallback-repack-20260915'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Regenerate lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          test -z "$(git diff --name-only -- . ':!Cargo.lock')"
          grep -A2 '^name = "zed-cli"$' Cargo.lock | grep -F 'version = "0.3.1"'
      - name: Commit only Cargo.lock
        run: |
          set -euo pipefail
          git add Cargo.lock
          test "$(git diff --cached --name-only)" = 'Cargo.lock'
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'release: refresh Cargo.lock for 0.3.1'
          git push origin HEAD:release/v0.3.1-fallback-repack-20260915
