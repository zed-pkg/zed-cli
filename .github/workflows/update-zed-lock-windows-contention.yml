name: update zed-lock Windows contention dependency

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/update-zed-lock-windows-contention.yml

permissions:
  contents: write

concurrency:
  group: update-zed-lock-windows-contention
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/zed-lock-windows-contention'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/zed-lock-windows-contention
          persist-credentials: true
          show-progress: false

      - name: Install Rust quality components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Resolve the exact immutable lock package and validate consumers
        run: |
          set -euo pipefail
          cargo update -p zed-lock
          grep -F '1db0da00d30fcf2e0762f50eedb1f88458020b52' Cargo.toml
          grep -F '#1db0da00d30fcf2e0762f50eedb1f88458020b52' Cargo.lock
          cargo fmt --all --check
          cargo test --locked --lib project_lock::tests
          cargo test --locked --test lock_waiter_process_lock
          cargo test --locked --test recursive_install_concurrency
          cargo test --locked --test store_lock_evented
          cargo test --locked --test global_cli
          cargo clippy --locked --bin zed \
            --test lock_waiter_process_lock \
            --test recursive_install_concurrency \
            --test store_lock_evented \
            --test global_cli -- -D warnings

      - name: Commit resolver-owned lock delta and remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/update-zed-lock-windows-contention.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/update-zed-lock-windows-contention.yml
          git diff --cached --check
          git commit -m 'chore(DEN-3167): lock Windows contention fix'
          git push origin HEAD:chore/zed-lock-windows-contention
