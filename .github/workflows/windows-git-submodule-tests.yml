name: Windows git-submodule tests

on:
  pull_request:
    paths:
      - src/git_submodules/**
      - .github/workflows/windows-git-submodule-tests.yml
  push:
    branches: [main]
    paths:
      - src/git_submodules/**
      - .github/workflows/windows-git-submodule-tests.yml

permissions:
  contents: read

concurrency:
  group: windows-git-submodule-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  certify:
    name: Windows unit and all-target Clippy
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install Rust validation toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify Windows test boundaries
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --lib git_submodules::tests
          cargo clippy --locked --all-targets -- -D warnings
