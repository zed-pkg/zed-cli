name: Zed latest dependency gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZED_PKG_INTERACTIVE: "false"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ZED_CLI_COMMIT: c132535c6ff0ce4a174a5a3801835c3c54c18ce9
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate source
        working-directory: source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact root-fix Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: zed-tool
          persist-credentials: false

      - name: Build exact Zed CLI toolchain pin
        working-directory: zed-tool
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report exact Zed version and source
        shell: bash
        run: |
          zed --version
          git -C zed-tool rev-parse HEAD

      - name: Resolve latest allowed dependencies, replay lock, and compile
        working-directory: source
        shell: bash
        run: bash .githooks/pre-push --ci
