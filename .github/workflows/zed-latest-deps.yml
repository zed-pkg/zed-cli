name: Zed latest dependency gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZED_PKG_INTERACTIVE: "false"
      # The latest graph includes private package authorities. Keep credentials
      # out of argv/config and expose the fleet read token only through Zed's
      # canonical GitHub-token environment boundary.
      ZED_PKG_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Require private-source read credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ZED_PKG_GITHUB_TOKEN:-}" ]; then
            echo "FLEET_GITHUB_READ_TOKEN is required because the latest dependency graph contains private GitHub package sources" >&2
            exit 78
          fi

      - name: Build exact candidate Zed CLI
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report exact Zed version and source
        shell: bash
        run: |
          zed --version
          git -C source rev-parse HEAD

      - name: Resolve latest allowed dependencies, replay lock, and compile
        working-directory: source
        shell: bash
        run: bash .githooks/pre-push --ci
