name: Zed latest dependency gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-latest-deps-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zed-latest-deps:
    name: zed-latest-deps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZED_PKG_INTERACTIVE: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact Zed CLI under test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin zed
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/zed "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report exact Zed version and source
        shell: bash
        run: |
          zed --version
          printf 'zed-source-sha=%s\n' "$GITHUB_SHA"

      - name: Resolve latest allowed dependencies, replay lock, and compile
        shell: bash
        run: bash .githooks/pre-push --ci
