name: Zed package edges

on:
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "Cargo.toml"
      - "scripts/check-zed-package-edges.py"
      - ".github/workflows/zed-package-edges.yml"
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - "Cargo.toml"
      - "scripts/check-zed-package-edges.py"
      - ".github/workflows/zed-package-edges.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-edges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          path: zed-interfaces
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-clients
          path: zed-clients
          persist-credentials: false
      - name: Validate Zed and native package edges
        working-directory: zed-cli
        run: |
          python3 scripts/check-zed-package-edges.py \
            --interfaces-manifest ../zed-interfaces/.zpkg.toml \
            --clients-manifest ../zed-clients/.zpkg.toml
