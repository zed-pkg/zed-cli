name: Zed package graph

on:
  pull_request:
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".cli-flags.toml"
      - ".*-cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/validate-cli-flags-toml.py"
      - "scripts/validate-zed-package-graph.sh"
      - "docs/package-dependency-graph.md"
      - ".github/workflows/zed-package-graph.yml"
  push:
    branches: [main]
    paths:
      - ".zpkg.toml"
      - ".zpkg.lock"
      - ".cli-flags.toml"
      - ".*-cli-flags.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/validate-cli-flags-toml.py"
      - "scripts/validate-zed-package-graph.sh"
      - "docs/package-dependency-graph.md"
      - ".github/workflows/zed-package-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact CLI revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zed-cli
          persist-credentials: false
      - name: Check out canonical interfaces package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-interfaces
          ref: 3c54298fc7a8c1b2f9c1d74f588c6118b38f197e
          path: zed-interfaces
          persist-credentials: false
      - name: Check out canonical clients package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-clients
          ref: b32e089caea772f166204fb1c7bcaad6f56942fe
          path: zed-clients
          persist-credentials: false
      - name: Check out canonical lib-core package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-lib-core
          ref: eac0878750332b031bc12f6040b6a795a17e7417
          path: zed-lib-core
          persist-credentials: false
      - name: Check out current canonical zed-lock package contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-lock
          ref: 03b1ad855a80c31b8be2e743877ec7367bebdb48
          path: zed-lock
          persist-credentials: false
      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Validate native and Zed package edges
        working-directory: zed-cli
        run: |
          python3 scripts/validate-cli-flags-toml.py
          bash scripts/validate-zed-package-graph.sh \
            ../zed-interfaces/.zpkg.toml \
            ../zed-clients/.zpkg.toml \
            ../zed-lock/.zpkg.toml \
            ../zed-lib-core/.zpkg.toml
          cargo check --locked --all-targets
