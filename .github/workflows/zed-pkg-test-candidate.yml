name: zed-pkg-test candidate smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-pkg-test-candidate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-smoke:
    name: Exact CLI against pinned fixture organization
    uses: zed-pkg-test/zed-pkg-e2e/.github/workflows/candidate-smoke.yml@fe34a2a6b910806480aee1b3aee68d617ad0c6fe
    with:
      zed_cli_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      harness_ref: fe34a2a6b910806480aee1b3aee68d617ad0c6fe
      fixtures_json: >-
        [{"repo":"node-lib","ref":"2d41e658a382fdff27ef87a0db24dbaff280a685"},{"repo":"node-app","ref":"ef794674647b3620e711f4f855865f8ad3340498"},{"repo":"rust-lib","ref":"f2534ffafbc4f7e900075dfc8e48b9259aced2fe"},{"repo":"rust-app","ref":"38b0a5425176a53621d1c07be791701dbd30eefe"},{"repo":"go-lib","ref":"e09dec6790a60ba75d5d338eece1068a4b8454b1"},{"repo":"go-app","ref":"8e035feb84cf80a294e631bda4ea7a44b1c4d7cf"},{"repo":"python-lib","ref":"b2db8ce2962fbaae690db7a9dabd14eb1d0362de"},{"repo":"python-app","ref":"a0c58cc6942a8cd30ad5eb318b9ada2fa9b2edb1"},{"repo":"polyglot-lib","ref":"e62ceb6337324a294d4fc861692a267ff0db97d0"},{"repo":"workspace-monorepo","ref":"72c47a51887733b9035bac1a3efdbf92880ef791"},{"repo":"multiversion-lib","ref":"ba9ee7269559a122f2b58fb89f134aaa4b7d0aee"},{"repo":"awkward-lib","ref":"6ccc922f4cb27b4a3de5f0e113c4bbf20d736300"},{"repo":"submodule-consumer","ref":"bc193f9d805e286c95e9b0c49580c5171224e45c"},{"repo":"subtree-consumer","ref":"3da0c249e481104a8c9058e6107dd47f8a80b10f"},{"repo":"shared-schema","ref":"c3fe49a621337be58b16717fb1acb57139a29b45"}]
