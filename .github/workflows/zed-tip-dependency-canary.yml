name: zed tip dependency canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-tip-dependency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve exact dependency tips
    runs-on: ubuntu-24.04
    outputs:
      interfaces_sha: ${{ steps.tips.outputs.interfaces_sha }}
      clients_sha: ${{ steps.tips.outputs.clients_sha }}
      lock_sha: ${{ steps.tips.outputs.lock_sha }}
    steps:
      - name: Checkout zed-interfaces main tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: main
          path: zed-interfaces
          persist-credentials: false
      - name: Checkout zed-clients main tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-clients
          ref: main
          path: zed-clients
          persist-credentials: false
      - name: Checkout zed-lock main tip
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-lock
          ref: main
          path: zed-lock
          persist-credentials: false
      - id: tips
        name: Record immutable tips
        shell: bash
        run: |
          set -euo pipefail
          echo "interfaces_sha=$(git -C zed-interfaces rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "clients_sha=$(git -C zed-clients rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "lock_sha=$(git -C zed-lock rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  interfaces:
    name: zed-interfaces / ${{ matrix.language }}
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, typescript, dart]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ needs.resolve.outputs.interfaces_sha }}
          persist-credentials: false
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - if: matrix.language == 'rust'
        run: cargo test --locked --all-targets
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - if: matrix.language == 'typescript'
        working-directory: src/ts
        run: npm install --no-save typescript@5 @types/node && npx tsc --noEmit && node --test wire-format.test.ts
      - if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c
      - if: matrix.language == 'dart'
        working-directory: src/dart
        run: dart pub get && dart analyze --fatal-infos && dart test

  clients:
    name: zed-clients / ${{ matrix.language }}
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [rust, typescript, dart]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-clients
          ref: ${{ needs.resolve.outputs.clients_sha }}
          path: zed-clients
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ needs.resolve.outputs.interfaces_sha }}
          path: zed-interfaces
          persist-credentials: false
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - if: matrix.language == 'rust'
        working-directory: zed-clients/clients/rust
        run: cargo test
      - if: matrix.language == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - if: matrix.language == 'typescript'
        working-directory: zed-clients/clients/typescript
        run: npm ci && npm run build && npm test
      - if: matrix.language == 'dart'
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
      - if: matrix.language == 'dart'
        working-directory: zed-clients/clients/dart
        run: dart pub get && dart analyze && dart test

  lock:
    name: zed-lock / rust
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-lock
          ref: ${{ needs.resolve.outputs.lock_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      # zed-lock is a library crate and intentionally does not commit Cargo.lock;
      # its own release workflow removes the generated test lock before the clean-tree check.
      - run: cargo test --all-targets

  cli:
    name: zed-cli / rust against dependency tip
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: zed-cli
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ needs.resolve.outputs.interfaces_sha }}
          path: zed-interfaces
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - working-directory: zed-cli
        run: cargo test --locked --all-targets
