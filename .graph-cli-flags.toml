# Dedicated flags-2-env contract for the modular `zed graph` command family.
# Clap remains the typed parser; this contract owns portable option/env
# admission before the graph runtime reaches registry or filesystem work.

[env]
dotenv = false
files = []
ignore = ["ZED_PKG_TOKEN"]

[parse]
command_env = "ZED_PKG_COMMAND"
unknown_options_env = "ZED_PKG_UNKNOWN_OPTIONS"
errors_env = "ZED_PKG_PARSE_ERRORS"
allow_unknown = false

[help]
url = "https://github.com/zed-pkg/zed-cli/blob/main/docs/dependency-graph-cli.md"

[flags.registry]
env = "ZED_PKG_REGISTRY"
aliases = ["registry"]
type = "string"
default = "https://registry.zpkg.net"
help = "Registry base URL."

[flags.home]
env = "ZED_PKG_HOME"
aliases = ["home"]
type = "string"
help = "Zed home directory."

[flags.auth_url]
env = "ZED_PKG_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "shared-auth base URL."

[flags.supabase_url]
env = "ZED_PKG_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Supabase project URL."

[flags.supabase_key]
env = "ZED_PKG_SUPABASE_KEY"
aliases = ["supabase-key"]
type = "string"
help = "Supabase publishable/anon key."

[flags.interactive]
env = "ZED_PKG_INTERACTIVE"
aliases = ["interactive"]
type = "bool"
default = "false"
help = "Global lifecycle confirmation mode; graph commands remain non-interactive."

[flags.git_submodules]
env = "ZED_PKG_GIT_SUBMODULES"
aliases = ["git-submodules"]
type = "bool"
default = "false"
help = "Global Git submodule compatibility mode; graph commands never mutate submodules."

[flags.no_mirrors]
env = "ZED_PKG_NO_MIRRORS"
aliases = ["no-mirrors"]
type = "bool"
default = "false"
help = "Disable mirror fallback."

[flags.trust_mirror_metadata]
env = "ZED_PKG_TRUST_MIRROR_METADATA"
aliases = ["trust-mirror-metadata"]
type = "bool"
default = "false"
help = "Allow signed mirror metadata to answer resolution requests."

[flags.r2_public_base]
env = "ZED_PKG_R2_PUBLIC_BASE"
aliases = ["r2-public-base"]
type = "string"
help = "Public HTTPS origin for R2/CDN objects."

[flags.r2_public_key]
env = "ZED_PKG_R2_PUBLIC_KEY"
aliases = ["r2-public-key"]
type = "string"
help = "Public R2 hostname, URL, or account subdomain."

[flags.source_fallback]
env = "ZED_PKG_SOURCE_FALLBACK"
aliases = ["source-fallback"]
type = "bool"
default = "true"
help = "Retry approved public fallback sources when the registry is unreachable."

[commands.graph]
help = "Inspect and export dependency graphs."

[commands.graph.commands.package]
help = "Download one immutable package-version dependency graph."

[commands.graph.commands.package.flags.format]
env = "ZED_PKG_GRAPH_FORMAT"
aliases = ["format"]
type = "string"
default = "json"
help = "Dependency graph representation."

[commands.graph.commands.package.flags.output]
env = "ZED_PKG_GRAPH_OUTPUT"
aliases = ["output"]
type = "string"
help = "Output path; use - only when binary stdout is explicitly intended."

[commands.graph.commands.package.flags.etag]
env = "ZED_PKG_GRAPH_ETAG"
aliases = ["etag"]
type = "string"
help = "Strong ETag sent with If-None-Match."

[commands.graph.commands.package.flags.max_bytes]
env = "ZED_PKG_GRAPH_MAX_BYTES"
aliases = ["max-bytes"]
type = "integer"
default = "33554432"
help = "Maximum decoded response bytes accepted by the process."

[commands.graph.commands.package.flags.metadata_json]
env = "ZED_PKG_GRAPH_METADATA_JSON"
aliases = ["metadata-json"]
type = "bool"
default = "false"
help = "Emit deterministic response metadata as JSON on stderr."

[commands.graph.commands.local]
help = "Resolve the complete prospective dependency graph for a local .zpkg.toml."

[commands.graph.commands.local.flags.manifest]
env = "ZED_PKG_GRAPH_MANIFEST"
aliases = ["manifest"]
type = "string"
default = ".zpkg.toml"
help = "Path to .zpkg.toml, or a directory containing it."

[commands.graph.commands.local.flags.output]
env = "ZED_PKG_GRAPH_OUTPUT"
aliases = ["output"]
type = "string"
help = "Output JSON path; omit or use - for stdout."

[commands.graph.commands.local.flags.pretty]
env = "ZED_PKG_GRAPH_PRETTY"
aliases = ["pretty"]
type = "bool"
default = "false"
help = "Pretty-print JSON instead of compact machine output."

[commands.graph.commands.local.flags.runtime_only]
env = "ZED_PKG_GRAPH_RUNTIME_ONLY"
aliases = ["runtime-only"]
type = "bool"
default = "false"
help = "Resolve runtime dependencies only; omit build dependencies."

[commands.graph.commands.local.flags.allow_artifact_fallback]
env = "ZED_PKG_GRAPH_ALLOW_ARTIFACT_FALLBACK"
aliases = ["allow-artifact-fallback"]
type = "bool"
default = "false"
help = "Permit verified package artifact downloads when declared graph metadata is unavailable."

[commands.graph.commands.local.flags.max_metadata_bytes]
env = "ZED_PKG_GRAPH_MAX_METADATA_BYTES"
aliases = ["max-metadata-bytes"]
type = "integer"
default = "33554432"
help = "Maximum bytes accepted from one immutable declared graph response."
