# Dedicated flags-2-env contract for the modular `zed link`, `zed unlink`,
# and `zed links` local-development commands.

[env]
dotenv = false
files = []
ignore = ["ZED_PKG_TOKEN"]

[parse]
command_env = "ZED_PKG_COMMAND"
unknown_options_env = "ZED_PKG_UNKNOWN_OPTIONS"
errors_env = "ZED_PKG_PARSE_ERRORS"
allow_unknown = false

[help]
url = "https://github.com/zed-pkg/zed-cli/blob/main/docs/local-links.md"

[flags.registry]
env = "ZED_PKG_REGISTRY"
aliases = ["registry"]
type = "string"
default = "https://registry.zpkg.net"
help = "Registry base URL."

[flags.home]
env = "ZED_PKG_HOME"
aliases = ["home"]
type = "string"
help = "Zed home directory; defaults to ~/.zpkg."

[flags.auth_url]
env = "ZED_PKG_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "shared-auth base URL."

[flags.supabase_url]
env = "ZED_PKG_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Supabase project URL."

[flags.supabase_key]
env = "ZED_PKG_SUPABASE_KEY"
aliases = ["supabase-key"]
type = "string"
help = "Supabase publishable/anon key."

[flags.interactive]
env = "ZED_PKG_INTERACTIVE"
aliases = ["interactive"]
type = "bool"
default = "false"
help = "Confirm mutating lifecycle steps in a real terminal."

[flags.git_submodules]
env = "ZED_PKG_GIT_SUBMODULES"
aliases = ["git-submodules"]
type = "bool"
default = "false"
help = "Global Git submodule compatibility mode."

[flags.no_mirrors]
env = "ZED_PKG_NO_MIRRORS"
aliases = ["no-mirrors"]
type = "bool"
default = "false"
help = "Disable mirror fallback."

[flags.trust_mirror_metadata]
env = "ZED_PKG_TRUST_MIRROR_METADATA"
aliases = ["trust-mirror-metadata"]
type = "bool"
default = "false"
help = "Allow signed mirror metadata to answer resolution requests."

[flags.r2_public_base]
env = "ZED_PKG_R2_PUBLIC_BASE"
aliases = ["r2-public-base"]
type = "string"
help = "Public HTTPS origin for R2/CDN objects."

[flags.r2_public_key]
env = "ZED_PKG_R2_PUBLIC_KEY"
aliases = ["r2-public-key"]
type = "string"
help = "Public R2 hostname, URL, or account subdomain."

[flags.source_fallback]
env = "ZED_PKG_SOURCE_FALLBACK"
aliases = ["source-fallback"]
type = "bool"
default = "true"
help = "Retry public R2 and GitHub when an HTTP registry is unreachable."

[commands.link]
aliases = ["ln"]
help = "Register or consume a live local package working tree."

[commands.link.flags.adapter]
env = "ZED_PKG_LINK_ADAPTER"
aliases = ["adapter"]
type = "string"
default = "auto"
help = "Consumer projection: auto, none, or node."

[commands.unlink]
help = "Remove a consumer link or unregister a package working tree."

[commands.unlink.flags.global]
env = "ZED_PKG_LINK_GLOBAL"
aliases = ["global"]
type = "bool"
default = "false"
help = "Remove a machine-wide registration instead of a project-local link."

[commands.links]
help = "List machine-wide local package registrations."

[commands.links.flags.json]
env = "ZED_PKG_LINK_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit deterministic JSON."
