# flags-2-env contract for the modular `zed interop nix plan export` command.

[parse]
command_env = "ZED_PKG_COMMAND"
unknown_options_env = "ZED_PKG_UNKNOWN_OPTIONS"
errors_env = "ZED_PKG_PARSE_ERRORS"
allow_unknown = false

[help]
url = "https://github.com/zed-pkg/zed-cli/blob/main/docs/nix-export-plan.md"

[flags.registry]
env = "ZED_PKG_REGISTRY"
aliases = ["registry"]
type = "string"
default = "https://registry.zpkg.tech"
help = "Global registry setting; export planning never reads or emits it."

[flags.home]
env = "ZED_PKG_HOME"
aliases = ["home"]
type = "string"
help = "Global Zed home setting; export planning never reads or creates it."

[flags.token]
env = "ZED_PKG_TOKEN"
aliases = ["token"]
type = "string"
help = "Global bearer token; export planning never reads or emits it."

[flags.auth_url]
env = "ZED_PKG_AUTH_URL"
aliases = ["auth-url"]
type = "string"
help = "Global authentication URL; export planning never reads or emits it."

[flags.supabase_url]
env = "ZED_PKG_SUPABASE_URL"
aliases = ["supabase-url"]
type = "string"
help = "Global Supabase URL; export planning never reads or emits it."

[flags.supabase_key]
env = "ZED_PKG_SUPABASE_KEY"
aliases = ["supabase-key"]
type = "string"
help = "Global Supabase key; export planning never reads or emits it."

[flags.interactive]
env = "ZED_PKG_INTERACTIVE"
aliases = ["interactive"]
type = "bool"
default = "false"
help = "Global lifecycle confirmation mode; planning is always read-only."

[commands.interop]
help = "Typed interoperability commands."

[commands.interop.flags.frozen]
env = "ZED_PKG_FROZEN"
aliases = ["frozen"]
type = "bool"
default = "false"
help = "Require the exact existing .zpkg.lock as the only dependency authority."

[commands.interop.flags.json]
env = "ZED_PKG_NIX_PLAN_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Print the canonical compact zed.nix-export-plan/v1 JSON document."

[commands.interop.flags.target]
env = "ZED_PKG_NIX_TARGET"
aliases = ["target"]
type = "string"
help = "Explicit polyglot target to plan."
