# Dedicated flags-2-env contract for the staged native task runtime. The
# eventual `zed task` route must reuse these exact environment variables.

[parse]
command_env = "ZED_TASK_COMMAND"
unknown_options_env = "ZED_TASK_UNKNOWN_OPTIONS"
errors_env = "ZED_TASK_PARSE_ERRORS"
allow_unknown = false

[help]
url = "https://github.com/zed-pkg/zed-cli/blob/main/docs/task-runtime.md"

[flags.plan]
env = "ZED_TASK_PLAN"
aliases = ["plan"]
type = "string"
help = "Project-local schema-v2 environment plan."

[flags.json]
env = "ZED_TASK_JSON"
aliases = ["json"]
type = "bool"
default = "false"
help = "Emit stable machine-readable JSON."

[commands.list]
help = "List project tasks in deterministic name order."

[commands.list.flags.all]
env = "ZED_TASK_ALL"
aliases = ["all"]
type = "bool"
default = "false"
help = "Include hidden tasks."

[commands.info]
help = "Show one task's metadata and dependency classes."

[commands.graph]
help = "Print the validated static task graph."

[commands.run]
help = "Execute one task and its validated dependency graph."

[commands.run.flags.dry_run]
env = "ZED_TASK_DRY_RUN"
aliases = ["dry-run"]
type = "bool"
default = "false"
help = "Plan execution without starting subprocesses or writing cache state."

[commands.run.flags.yes]
env = "ZED_TASK_YES"
aliases = ["yes"]
type = "bool"
default = "false"
help = "Approve explicit task confirmation requirements."

[commands.run.flags.jobs]
env = "ZED_TASK_JOBS"
aliases = ["jobs"]
type = "integer"
default = "1"
help = "Maximum concurrent task command processes."

[commands.run.flags.no_cache]
env = "ZED_TASK_NO_CACHE"
aliases = ["no-cache"]
type = "bool"
default = "false"
help = "Disable content-verified incremental cache reads and writes."
