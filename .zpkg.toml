[package]
org = "zed-pkg"
name = "zed-cli"
version = "0.3.0"
description = "The zed universal package-manager CLI"
license = "MIT"
keywords = ["package-manager", "cli", "polyglot", "vcs", "global-tools"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-cli"

[build]
command = "cargo build --release --locked --bins"
outputs = [
  "target/release/zed",
  "target/release/zed-gitops",
  "target/release/zed-git-install",
]

[bin]
zed = "target/release/zed"
"zed-gitops" = "target/release/zed-gitops"
"zed-git-install" = "target/release/zed-git-install"

[install]
adapter = "none"
dir = ".vendor/.zed"

[dependencies]
"zed-pkg/zed-clients" = "^0.1.0"
"zed-pkg/zed-interfaces" = "^0.1.0"
"zed-pkg/zed-lib-core" = "^0.1.0"
"zed-pkg/zed-lock" = "^0.1.1"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/.auth-shared.toml\" && test ! -e \"$ZED_PKG_TEST_TARGET/.shared-auth.toml\" && test -x \"$ZED_PKG_TEST_TARGET/target/release/zed\" && test -x \"$ZED_PKG_TEST_TARGET/target/release/zed-gitops\" && test -x \"$ZED_PKG_TEST_TARGET/target/release/zed-git-install\" && \"$ZED_PKG_TEST_TARGET/target/release/zed\" --version && \"$ZED_PKG_TEST_TARGET/target/release/zed\" validate --manifest \"$ZED_PKG_TEST_TARGET/.zpkg.toml\" --json >/dev/null && \"$ZED_PKG_TEST_TARGET/target/release/zed\" gitops validate --help && \"$ZED_PKG_TEST_TARGET/target/release/zed-git-install\" --help >/dev/null"
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".zed/**",
  ".zed-pack/**",
  ".vendor/.zed/**",
  "target/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[publish.native]
registry = "crates-io"
package = "zed-cli"

[scripts]
toml-contract = "cargo test --test toml_contract --locked"
test = "cargo test --test toml_contract --locked && bash scripts/validate-zed-package-graph.sh && cargo test --all-targets --locked"
