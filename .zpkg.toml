[package]
org = "zed-pkg"
name = "zed-cli"
version = "0.1.0"
description = "The zed universal package-manager CLI"
license = "MIT"
keywords = ["package-manager", "cli", "polyglot", "vcs", "global-tools"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-cli"

[build]
command = "cargo build --release --locked --bins"
outputs = ["target/release/zed", "target/release/zed-gitops"]

[bin]
zed = "target/release/zed"
"zed-gitops" = "target/release/zed-gitops"

[install]
adapter = "none"
dir = ".vendor/.zed"

# The CLI consumes the shared contract, the Rust client target, and the
# extracted locking crate. There is no zed-lib repository today; add it here if
# that reusable layer is introduced.
#
# Reconciled from two [dependencies] tables that a merge left side by side in
# this file, which made it invalid TOML (duplicate key) and failed
# `zed validate`. The union is taken semantically, not by picking a side:
#   - zed-interfaces: declared identically by both. Kept.
#   - zed-lock ^0.1.1: only the later table had it, and zed-pkg/zed-lock is a
#     real repository with its own .zpkg.toml. Kept.
#   - the clients edge: one table named the whole polyglot repository
#     (zed-clients), the other its Rust slice (zed-clients-rust). zed-docs
#     doc 32 says a CLI declares "the client target for its implementation
#     language", and this CLI links only the Rust slice, so the target
#     coordinate is the accurate edge and the umbrella one is dropped rather
#     than kept alongside it.
[dependencies]
"zed-pkg/zed-interfaces" = "^0.1.0"
"zed-pkg/zed-clients-rust" = "^0.1.0"
"zed-pkg/zed-lock" = "^0.1.1"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/zed\" && test -x \"$ZED_PKG_TEST_TARGET/target/release/zed-gitops\" && \"$ZED_PKG_TEST_TARGET/target/release/zed\" --version && \"$ZED_PKG_TEST_TARGET/target/release/zed\" validate --manifest \"$ZED_PKG_TEST_TARGET/.zpkg.toml\" --lock \"$ZED_PKG_TEST_TARGET/.zpkg.lock\" --json >/dev/null && \"$ZED_PKG_TEST_TARGET/target/release/zed\" gitops validate --help"
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".zed/**",
  ".zed-pack/**",
  ".vendor/.zed/**",
  "target/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

[publish.native]
registry = "crates-io"
package = "zed-cli"

[scripts]
test = "bash scripts/validate-zed-package-graph.sh && cargo test --all-targets --locked"
