[package]
name = "zed-cli"
version = "0.1.0"
edition = "2024"
description = "zed: the universal package manager backed by the VCS hosts you already use"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-cli"

[[bin]]
name = "zed"
path = "src/main.rs"

[lib]
name = "zed_cli"
path = "src/lib.rs"

[dependencies]
zed-interfaces = { path = "../zed-interfaces" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
flate2 = "1"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "1"
walkdir = "2"
fs2 = "0.4.3"
