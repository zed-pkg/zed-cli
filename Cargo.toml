[workspace]
resolver = "3"

[package]
name = "zed-cli"
version = "0.1.0"
edition = "2024"
description = "zed: the universal package manager backed by the VCS hosts you already use"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-cli"

[[bin]]
name = "zed"
path = "src/main.rs"

[lib]
name = "zed_cli"
path = "src/lib.rs"

[dependencies]
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "a23cdd2ac509a39ca6fd6d21a3774fdd3a0f7660" }
zed-lock = { git = "https://github.com/zed-pkg/zed-lock.git", rev = "0fc100afc3cd60b5ce091b4207f910bf08f2cfb7" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "5"
flate2 = "1"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
fs2 = "0.4.3"
flags2env = { git = "https://github.com/ORESoftware/flags-2-env.git", rev = "2f62e40932a0fcb8b9bf1b4c84473e34fa3c51c7" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
