[workspace]
resolver = "3"

[package]
name = "zed-cli"
version = "0.2.3"
edition = "2024"
description = "zed: the universal package manager backed by the VCS hosts you already use"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-cli"

[[bin]]
name = "zed"
path = "src/main.rs"

[[bin]]
name = "zed-gitops"
path = "src/bin/zed-gitops.rs"

[[bin]]
name = "zed-binary"
path = "src/bin/zed-binary.rs"

[lib]
name = "zed_cli"
path = "src/lib.rs"

[dependencies]
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "e4feac2ce5ee15a20fba9847197fd03306f56a94" }
# Includes the Windows ERROR_LOCK_VIOLATION contention normalization certified by DEN-3167.
zed-lock = { git = "https://github.com/zed-pkg/zed-lock.git", rev = "1db0da00d30fcf2e0762f50eedb1f88458020b52" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "5"
flate2 = "1"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
fs2 = "0.4.3"
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "2946224fb3a1bd84c0e39146b24f5f1ca8d69862" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# --- functional programming conformance -------------------------------------
# Warn level only: these never fail a build. They fail `cargo clippy -- -D warnings`
# in the nightly job. See FP-GUIDELINES.md for the principle behind each group.

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# typed errors: panicking is not error handling
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# illegal states excluded by types
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# immutable values and pure transformations
mut_mut = "warn"
needless_pass_by_ref_mut = "warn"
# composition
too_many_lines = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
# explicit inputs and outputs
must_use_candidate = "warn"
return_self_not_must_use = "warn"
