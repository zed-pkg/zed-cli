[workspace]
resolver = "3"

[package]
name = "zed-cli"
version = "0.2.2"
edition = "2024"
description = "zed: the universal package manager backed by the VCS hosts you already use"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-cli"

[[bin]]
name = "zed"
path = "src/main.rs"

[[bin]]
name = "zed-gitops"
path = "src/bin/zed-gitops.rs"

[lib]
name = "zed_cli"
path = "src/lib.rs"

[dependencies]
zed-interfaces = { git = "https://github.com/zed-pkg/zed-interfaces.git", rev = "7d31f80dd8a310f218931165a3ad636a2f32b932" }
# Includes the Windows ERROR_LOCK_VIOLATION contention normalization certified by DEN-3167.
zed-lock = { git = "https://github.com/zed-pkg/zed-lock.git", rev = "1db0da00d30fcf2e0762f50eedb1f88458020b52" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dirs = "5"
flate2 = "1"
globset = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
fs2 = "0.4.3"
flags2env = { git = "https://github.com/flags-2-env/flags-2-env.git", rev = "2946224fb3a1bd84c0e39146b24f5f1ca8d69862" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
