[package]
org = "zed-pkg"
name = "zed-lock"
version = "0.1.0"
description = "Kernel-backed, event-driven file locking for zed-pkg"
license = "MIT"
keywords = ["locking", "flock", "lockfile", "concurrency", "rust"]

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-lock"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -f \"$ZED_PKG_TEST_TARGET/Cargo.toml\" && test -f \"$ZED_PKG_TEST_TARGET/src/lib.rs\" && cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\""
exclude = ["target/**", "tmp/**", "**/*.log", ".DS_Store"]

[targets.rust]
dir = "."
adapter = "rust"

[targets.rust.native]
registry = "crates.io"
package = "zed-lock"

[scripts]
test = "cargo test"
lint = "cargo clippy --all-targets -- -D warnings"
format = "cargo fmt --all --check"
