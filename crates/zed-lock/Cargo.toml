[package]
name = "zed-lock"
version = "0.1.0"
edition = "2024"
description = "Kernel-backed, event-driven file locking for zed-pkg"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-lock"
rust-version = "1.88"
keywords = ["locking", "flock", "lockfile", "concurrency", "zed-pkg"]
categories = ["concurrency", "filesystem"]

[dependencies]
anyhow = "1"
fs2 = "0.4.3"

[dev-dependencies]
tempfile = "3"
