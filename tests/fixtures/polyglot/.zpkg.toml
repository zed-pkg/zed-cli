# Fixture for the polyglot publish matrix (.github/workflows/polyglot.yml).
#
# One repo, one version, five ecosystems. Each `[targets.*]` slice must be
# BOTH a zed package and a valid *native* package for its ecosystem, so that
# the same commit can be published to zpkg.tech and to npm / PyPI / crates.io /
# rubygems / the Go module proxy without a second source of truth.
#
# The native package names deliberately diverge from the zed target names —
# that is the real-world case (`zed-clients-nodejs` vs `@zed-pkg/client`) and
# it is what scripts/check-native-parity.py reports on.

[package]
org = "zed-pkg"
name = "poly-fixture"
version = "0.2.0"
description = "Polyglot publish fixture"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/zed-pkg/zed-cli"

[publish]
tag_format = "v{version}"

[targets.nodejs]
dir = "node"
name = "poly-fixture-nodejs"
adapter = "node"

[targets.python]
dir = "python"

[targets.golang]
dir = "go"
name = "poly-fixture-golang"

[targets.rust]
dir = "rust"

[targets.ruby]
dir = "ruby"
